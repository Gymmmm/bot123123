<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=1600">
<title>侨联封面 · 全 Noto Sans SC 锁定版</title>
<style>
  @font-face {
    font-family: "Noto Sans SC";
    src: url("./fonts/NotoSansSC-Bold.otf");
    font-weight: 700;
    font-display: block;
  }
  @font-face {
    font-family: "Noto Sans SC";
    src: url("./fonts/NotoSansSC-Regular.otf");
    font-weight: 400;
    font-display: block;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { width: 1600px; height: 1200px; overflow: hidden; background: #111; }
  .poster { position: relative; width: 1600px; height: 1200px; overflow: hidden; font-family: "Noto Sans SC", sans-serif; }
  .bg { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; filter: saturate(1.03) contrast(1.02); }
  .leftShade { position: absolute; left: 0; top: 0; bottom: 0; width: 50%; background: linear-gradient(90deg, rgba(12,20,40,.84), rgba(12,20,40,.48) 55%, rgba(12,20,40,.02)); }
  .brand { position: absolute; left: 48px; top: 42px; color: #fff; }
  .brand .cn { font-weight: 700; font-size: 54px; letter-spacing: .05em; }
  .brand .en { font-weight: 700; font-size: 17px; opacity: .9; margin-top: 8px; letter-spacing: .16em; }
  .main { position: absolute; left: 48px; top: 300px; width: 720px; color: #fff; }
  .title { font-weight: 700; font-size: 100px; line-height: 1.05; text-shadow: 0 2px 16px rgba(0,0,0,.35); }
  .sub { display: inline-block; margin-top: 20px; background: rgba(255,255,255,.96); color: #1d4ed8; border: 2px solid #2563eb; font-weight: 700; font-size: 44px; border-radius: 999px; padding: 10px 28px; }
  .info { margin-top: 32px; font-weight: 400; font-size: 34px; line-height: 1.95; }
  .info b { font-weight: 700; }
  .pricebox { position: absolute; right: 48px; bottom: 100px; background: #FFF6EC; border-radius: 34px; padding: 28px 44px 32px; min-width: 430px; text-align: center; box-shadow: 0 18px 48px rgba(0,0,0,.30); font-weight: 700; }
  .pricebox .label { font-size: 34px; font-weight: 700; color: #1E4FD6; letter-spacing: .08em; }
  .pricebox .price { font-size: 84px; font-weight: 700; line-height: 1.08; margin-top: 6px; color: #1E4FD6; }
</style>
</head>
<body>
  <div class="poster" id="poster">
    <img class="bg" id="bg" src="{{BG_SRC}}" alt="">
    <div class="leftShade"></div>
    <div class="brand"><div class="cn">侨联地产</div><div class="en">QIAO LIAN PROPERTY</div></div>
    <div class="main">
      <div class="title" id="project">{{PROJECT}}</div>
      <div class="sub" id="layout">{{LAYOUT}}</div>
      <div class="info">
        <div>📍 <b id="area">{{AREA}}</b></div>
        <div>📐 <b id="size">{{SIZE}}</b> ｜ 🏢 <b id="floor">{{FLOOR}}</b></div>
        <div>✨ {{HIGHLIGHTS}}</div>
      </div>
    </div>
    <div class="pricebox"><div class="label">租金</div><div class="price" id="price">{{PRICE_LINE}}</div></div>
  </div>
</body>
</html>
