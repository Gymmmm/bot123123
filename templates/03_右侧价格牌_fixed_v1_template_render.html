<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>模板3-右侧价格牌</title>
    <style>
      html, body {
        margin: 0;
        padding: 0;
        width: 1600px;
        height: 1200px;
        overflow: hidden;
        background: #0b2048;
      }
      body {
        font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", sans-serif;
        color: #fff;
      }
      .poster {
        position: relative;
        width: 1600px;
        height: 1200px;
        overflow: hidden;
        border-radius: 24px;
        background: #0b2048;
      }
      .bg {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
        object-fit: cover;
      }
      .sourceMask {
        position: absolute;
        left: 0;
        top: 0;
        width: 330px;
        height: 112px;
        background: linear-gradient(90deg, rgba(5,12,26,0.92) 0%, rgba(5,12,26,0.76) 62%, rgba(5,12,26,0) 100%);
      }
      .leftShade {
        position: absolute;
        left: 0;
        top: 0;
        bottom: 0;
        width: 68%;
        background: linear-gradient(
          90deg,
          rgba(5, 12, 26, 0.88) 0%,
          rgba(7, 16, 32, 0.74) 28%,
          rgba(9, 20, 40, 0.44) 55%,
          rgba(10, 22, 42, 0.12) 82%,
          rgba(10, 22, 42, 0) 100%
        );
      }
      .brand {
        position: absolute;
        left: auto;
        right: 56px;
        top: 48px;
        padding: 0;
        text-shadow: 0 3px 10px rgba(0, 0, 0, 0.35);
      }
      .brand-inner {
        display: flex;
        align-items: center;
        gap: 14px;
      }
      .brand .logo {
        width: 68px;
        height: 68px;
        flex: none;
      }
      .brand .cn {
        font-size: 48px;
        font-weight: 820;
        color: #ffffff;
      }
      .brand .en {
        font-size: 17px;
        letter-spacing: 0.12em;
        color: rgba(255,255,255,0.88);
        opacity: 0.92;
      }
      .main {
        position: absolute;
        left: 56px;
        top: 220px;
        bottom: auto;
        width: 920px;
      }
      .ref {
        display: none;
        font-size: 34px;
        font-weight: 800;
        color: rgba(230, 241, 255, 0.95);
        background: rgba(8, 18, 36, 0.44);
        border: 1px solid rgba(185, 205, 236, 0.35);
        border-radius: 12px;
        padding: 6px 12px;
        margin-bottom: 12px;
      }
      .title {
        font-size: 72px;
        font-weight: 900;
        line-height: 1.06;
        text-shadow: 0 4px 14px rgba(0, 0, 0, 0.34);
        max-height: 174px;
        overflow: hidden;
      }
      .sub {
        display: inline-block;
        background: rgba(255, 255, 255, 0.95);
        color: #1147b2;
        font-size: 42px;
        font-weight: 900;
        border-radius: 999px;
        padding: 10px 24px 12px;
        margin-top: 14px;
      }
      .info {
        position: static;
        display: block;
        margin-top: 22px;
        font-size: 27px;
        font-weight: 700;
        line-height: 1.35;
      }
      .info .row {
        display: block;
        min-height: 0;
        padding: 0;
        background: none;
        border: 0;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
      }
      #row-area, #row-meta {
        color: rgba(255,255,255,0.92);
      }
      #row-hi {
        display: inline-block;
        margin-top: 14px;
        padding: 9px 15px;
        border: 1px solid rgba(255,255,255,0.28);
        border-radius: 12px;
        background: rgba(7,16,32,0.52);
        color: rgba(255,255,255,0.9);
      }
      .pricebox {
        position: absolute;
        right: 48px;
        top: auto;
        bottom: 66px;
        background: rgba(10,67,190,0.94);
        color: #fff;
        border-radius: 22px;
        padding: 18px 28px 22px;
        min-width: 320px;
        text-align: center;
        box-shadow: 0 4px 24px rgba(0,0,0,0.18);
      }
      .pricebox .label {
        font-size: 26px;
        font-weight: 600;
        letter-spacing: 0.06em;
        opacity: 0.75;
        margin-bottom: 4px;
      }
      .pricebox .price {
        font-size: 72px;
        font-weight: 900;
        line-height: 1;
        letter-spacing: -0.02em;
      }
    </style>
  </head>
  <body>
    <div class="poster">
      <img id="bg" class="bg" src="{{BG_SRC}}" alt="" />
      <div class="sourceMask"></div>
      <div class="leftShade"></div>
      <div class="brand">
        <div class="brand-inner">
          <svg class="logo" viewBox="0 0 120 120" fill="none" xmlns="http://www.w3.org/2000/svg">
            <path d="M14 62L60 30L106 62" stroke="#ffffff" stroke-width="8" stroke-linecap="round" stroke-linejoin="round" />
            <path d="M24 58V88H44V68H76V88H96V58" stroke="#ffffff" stroke-width="8" stroke-linecap="round" stroke-linejoin="round" />
            <path d="M16 92C33 84 49 81 60 81C71 81 87 84 104 92" stroke="#ffffff" stroke-width="8" stroke-linecap="round" />
          </svg>
          <div>
            <div class="cn">侨联地产</div>
            <div class="en">QIAO LIAN PROPERTY</div>
          </div>
        </div>
      </div>
      <div class="main">
        <div class="ref" id="ref-line">{{REF}} 编号</div>
        <div class="title"><span id="t1">{{PROJECT}}</span></div>
        <div class="sub" id="t2">{{LAYOUT}}</div>
        <div class="info">
          <div class="row" id="row-area">📍 <span id="t3">{{AREA}}</span></div>
          <div class="row" id="row-meta">📐 <span id="t4">{{SIZE}}</span> ｜ 🏢 <span id="t5">{{FLOOR}}</span></div>
          <div class="row" id="row-hi">✨ <span id="t7">{{H1}}</span> / <span id="t8">{{H2}}</span> / <span id="t9">{{H3}}</span></div>
        </div>
      </div>
      <div class="pricebox">
        <div class="label">租金</div>
        <div class="price" id="t6">{{PRICE_LINE}}</div>
      </div>
    </div>
    <script>
      function txt(id){const el=document.getElementById(id);return (el?String(el.textContent||''):'').trim();}
      function bad(v){const s=String(v||'').trim();const low=s.toLowerCase();return !s||s==='-'||s==='—'||s==='--'||low==='n/a'||low==='na'||s.includes('可咨询')||s==='金边';}
      function hide(id){const el=document.getElementById(id);if(el)el.style.display='none';}

      const area=txt('t3');
      const project=txt('t1');
      const size=txt('t4');
      const floor=txt('t5');
      if (bad(area) || (project && project.includes(area))) hide('row-area');

      if (bad(size) && bad(floor)) {
        hide('row-meta');
      } else if (bad(size)) {
        const el=document.getElementById('row-meta');
        if(el) el.textContent='🏢 '+floor;
      } else if (bad(floor)) {
        const el=document.getElementById('row-meta');
        if(el) el.textContent='📐 '+size;
      }

      const hs=[txt('t7'),txt('t8'),txt('t9')].filter(v=>!bad(v));
      if(!hs.length){
        hide('row-hi');
      }else{
        const el=document.getElementById('row-hi');
        if(el) el.textContent='✨ '+hs.join(' / ');
      }

      const refText = txt('ref-line');
      if (!refText || refText.includes('QC0000')) hide('ref-line');
    </script>
  </body>
</html>
