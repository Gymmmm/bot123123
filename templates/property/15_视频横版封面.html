<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>侨联地产 · 视频横版封面</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
html,body{
  background:#0b1220;
  font-family:"Noto Sans SC","Noto Sans CJK SC","PingFang SC","Microsoft YaHei",sans-serif;
}
@font-face{
  font-family:"Noto Sans SC";
  src:local("Noto Sans SC"),local("Noto Sans CJK SC");
  font-weight:400 900;
  font-display:block;
}

/* 16:9 横版视频封面标准 */
.poster{
  position:relative;
  width:1600px;
  height:900px;
  overflow:hidden;
  background:#0b2048;
  color:#fff;
}
.bg{
  position:absolute;inset:0;
  width:100%;height:100%;
  object-fit:cover;object-position:center;
}
.shade{
  position:absolute;inset:0;pointer-events:none;
  background:
    linear-gradient(90deg,rgba(7,14,28,.78) 0%,rgba(7,14,28,.35) 42%,rgba(7,14,28,.15) 70%,rgba(7,14,28,.55) 100%),
    linear-gradient(180deg,rgba(7,14,28,.25) 0%,transparent 40%,rgba(7,14,28,.78) 100%);
}

.brand{
  position:absolute;left:42px;top:36px;z-index:3;
  display:flex;align-items:center;gap:16px;
}
.brand-logo{
  height:80px;width:auto;max-width:280px;object-fit:contain;
  filter:drop-shadow(0 2px 10px rgba(0,0,0,.55));
}
.brand-logo[src=""],
.brand-logo:not([src]){display:none}
.brand:has(.brand-logo[src^="data:"]) .brand-text{display:none}
.brand-text .cn{
  font-size:48px;font-weight:800;letter-spacing:.05em;line-height:1;
  text-shadow:0 2px 10px rgba(0,0,0,.55);
}
.brand-text .en{
  margin-top:8px;font-size:15px;font-weight:700;letter-spacing:.16em;opacity:.92;
}

.play-wrap{
  position:absolute;left:50%;top:46%;transform:translate(-50%,-50%);
  text-align:center;z-index:2;
}
.play-ring{
  width:148px;height:148px;border-radius:50%;
  border:3px solid rgba(255,255,255,.78);
  display:grid;place-items:center;
  background:rgba(15,23,42,.34);
  box-shadow:0 12px 32px rgba(0,0,0,.28);
}
.play{
  width:108px;height:108px;border-radius:50%;
  display:grid;place-items:center;
  background:rgba(255,255,255,.92);color:#1147b2;
  font-size:48px;font-weight:900;padding-left:8px;
}
.play-label{
  margin-top:12px;font-size:22px;font-weight:700;
  color:rgba(255,255,255,.94);letter-spacing:.6px;
  text-shadow:0 2px 8px rgba(0,0,0,.55);
}

.bottom{
  position:absolute;left:36px;right:36px;bottom:32px;z-index:3;
  display:flex;justify-content:space-between;align-items:flex-end;gap:28px;
  padding:24px 30px;
  border-radius:24px;
  border:1px solid rgba(255,255,255,.18);
  background:linear-gradient(140deg,rgba(17,71,178,.9),rgba(22,95,216,.76));
  backdrop-filter:blur(8px);
}
.primary{min-width:0;flex:1}
.title{
  font-size:54px;font-weight:900;line-height:1.1;
  white-space:nowrap;overflow:hidden;
}
.meta{
  margin-top:8px;font-size:28px;font-weight:700;opacity:.95;
  white-space:nowrap;overflow:hidden;
}
.price{
  flex:0 0 auto;font-size:64px;font-weight:900;color:#f8cc59;line-height:1;
  text-shadow:0 4px 16px rgba(0,0,0,.28);white-space:nowrap;
}
</style>
</head>
<body>
<div class="poster" id="poster" data-style="video_landscape">
  <img id="bg" class="bg" src="{{BG_SRC}}" alt="">
  <div class="shade"></div>

  <div class="brand">
    <img id="brandLogo" class="brand-logo" src="{{LOGO_SRC}}" alt="侨联地产">
    <div class="brand-text">
      <div class="cn">侨联地产</div>
      <div class="en">QIAO LIAN</div>
    </div>
  </div>

  <div class="play-wrap">
    <div class="play-ring"><div class="play">▶</div></div>
    <div class="play-label">实拍视频看房</div>
  </div>

  <div class="bottom">
    <div class="primary">
      <div class="title" data-autofit="36">
        <span id="project">{{PROJECT}}</span><span data-field="layout"> · <span id="layout">{{LAYOUT}}</span></span>
      </div>
      <div class="meta" data-fields="area,size,floor">
        <span data-field="area" id="area">{{AREA}}</span>
        <span data-field="size"> · <span id="size">{{SIZE}}</span></span>
        <span data-field="floor"> · <span id="floor">{{FLOOR}}</span></span>
      </div>
    </div>
    <div class="price" id="price_line" data-autofit="42">{{PRICE_LINE}}</div>
  </div>
</div>
</body>
</html>
