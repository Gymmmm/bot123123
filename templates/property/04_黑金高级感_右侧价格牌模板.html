<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=1600,initial-scale=1"><title>侨联地产 · 黑金高级感</title><style>
*{box-sizing:border-box}html,body{margin:0;width:1600px;height:1200px;background:#080808;font-family:"Noto Sans CJK SC","Noto Sans SC",sans-serif}.poster{position:relative;width:1600px;height:1200px;overflow:hidden;background:#0b0b0b;color:#f4efe2}.bg{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;filter:saturate(1.05) contrast(1.03)}.shade{position:absolute;left:0;top:0;bottom:0;width:50%;background:linear-gradient(90deg,rgba(5,5,5,.88),rgba(5,5,5,.16))}.grain{position:absolute;inset:0;pointer-events:none;opacity:.16;background-image:radial-gradient(circle at 1px 1px,rgba(255,255,255,.12) 1px,transparent 0);background-size:3px 3px}.brand{position:absolute;left:36px;top:34px}.brand-cn{font-size:66px;font-weight:900;line-height:1;color:#f2cf79;letter-spacing:1px}.brand-en{margin-top:7px;font-size:22px;color:#dbc28e;letter-spacing:1.2px}.main{position:absolute;left:36px;top:308px;width:660px}.title{font-size:96px;font-weight:900;line-height:1.06;color:#fff8e8;text-shadow:0 2px 14px rgba(0,0,0,.45)}.layout{display:inline-block;margin-top:18px;padding:12px 30px;border:2px solid rgba(242,207,121,.75);border-radius:999px;background:rgba(24,24,24,.9);color:#f2cf79;font-size:52px;font-weight:900}.info{margin-top:30px;font-size:36px;font-weight:700;line-height:1.8;color:#f5e9cc}.info>div{white-space:nowrap}.high{max-width:650px;overflow:hidden;text-overflow:ellipsis}.pricebox{position:absolute;right:36px;bottom:36px;min-width:390px;padding:28px 34px;border:2px solid rgba(242,207,121,.78);border-radius:28px;background:rgba(14,14,14,.88);text-align:center;box-shadow:0 16px 36px rgba(0,0,0,.45),inset 0 0 24px rgba(242,207,121,.09)}.pricebox .label{font-size:32px;font-weight:700;color:#dbc28e}.pricebox .price{font-size:92px;font-weight:900;line-height:1;color:#f2cf79;white-space:nowrap}
</style></head><body><div class="poster"><img id="bg" class="bg" src="{{BG_SRC}}" alt=""><div class="shade"></div><div class="grain"></div><div class="brand"><div class="brand-cn">侨联地产</div><div class="brand-en">QIAO LIAN PROPERTY</div></div><div class="main"><div class="title" id="project" data-autofit="54">{{PROJECT}}</div><div class="layout" id="layout" data-field="layout" data-autofit="34">{{LAYOUT}}</div><div class="info"><div data-field="area">区域 · <span id="area">{{AREA}}</span></div><div data-fields="size,floor"><span data-field="size">面积 · <span id="size">{{SIZE}}</span></span><span data-field="floor"> ｜ 楼层 · <span id="floor">{{FLOOR}}</span></span></div><div class="high" data-fields="h1,h2,h3">亮点 · <span data-field="h1" id="h1">{{H1}}</span><span data-field="h2"> / <span id="h2">{{H2}}</span></span><span data-field="h3"> / <span id="h3">{{H3}}</span></span></div></div></div><div class="pricebox"><div class="label">租金</div><div class="price" id="price_line" data-autofit="58">{{PRICE_LINE}}</div></div></div></body></html>
