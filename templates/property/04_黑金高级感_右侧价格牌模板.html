<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=1600">
<title>侨联封面 · 黑金高级感 · 全 Noto Sans SC 锁定版</title>
<style>
  /* 字体：全 Noto Sans SC（与日常封面同一锁定） */
  @font-face {
    font-family: "Noto Sans SC";
    src: local("Noto Sans SC"), local("Noto Sans CJK SC");
    font-weight: 700;
    font-display: block;
  }
  @font-face {
    font-family: "Noto Sans SC";
    src: local("Noto Sans SC"), local("Noto Sans CJK SC");
    font-weight: 400;
    font-display: block;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body {
    width: 1600px;
    height: 1200px;
    overflow: hidden;
    background: #080808;
  }

  .poster {
    position: relative;
    width: 1600px;
    height: 1200px;
    overflow: hidden;
    background: #0b0b0b;
    color: #f4efe2;
    font-family: "Noto Sans SC", "Noto Sans CJK SC", sans-serif;
  }

  .bg {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    object-fit: cover;
    filter: saturate(1.05) contrast(1.03);
  }

  .shade {
    position: absolute;
    left: 0; top: 0; bottom: 0;
    width: 50%;
    background: linear-gradient(90deg, rgba(5,5,5,.78), rgba(5,5,5,.16));
  }

  .grain {
    position: absolute;
    inset: 0;
    pointer-events: none;
    opacity: .16;
    background-image: radial-gradient(circle at 1px 1px, rgba(255,255,255,.12) 1px, transparent 0);
    background-size: 3px 3px;
  }

  /* 品牌区 — champagne gold */
  .brand {
    position: absolute;
    left: 48px;
    top: 42px;
  }
  .brand .cn {
    font-weight: 700;
    font-size: 54px;
    line-height: 1;
    color: #f2cf79;
    letter-spacing: 0.05em;
    text-shadow: 0 1px 2px rgba(0,0,0,.55), 0 2px 10px rgba(0,0,0,.35);
  }
  .brand .en {
    font-weight: 700;
    font-size: 17px;
    color: #dbc28e;
    opacity: 0.95;
    margin-top: 8px;
    letter-spacing: 0.16em;
    text-shadow: 0 1px 2px rgba(0,0,0,.55), 0 2px 10px rgba(0,0,0,.35);
  }

  /* 左侧主信息：锁定 top≈300，不上移 */
  .main {
    position: absolute;
    left: 48px;
    top: 300px;
    width: 720px;
  }
  .title {
    font-weight: 700;
    font-size: 96px;
    line-height: 1.06;
    color: #fff8e8;
    text-shadow: 0 2px 14px rgba(0,0,0,.45);
  }
  .layout {
    display: inline-block;
    margin-top: 18px;
    padding: 12px 30px;
    border: 2px solid rgba(242,207,121,.75);
    border-radius: 999px;
    background: rgba(24,24,24,.9);
    color: #f2cf79;
    font-size: 44px;
    font-weight: 700;
  }
  .info {
    margin-top: 30px;
    font-size: 34px;
    font-weight: 400;
    line-height: 1.85;
    color: #f5e9cc;
  }
  .info b { font-weight: 700; }
  .info > div { white-space: nowrap; }
  .high {
    max-width: 680px;
    overflow: hidden;
    text-overflow: ellipsis;
  }

  /* 右下价签：锁定 bottom≈100 */
  .pricebox {
    position: absolute;
    right: 48px;
    bottom: 100px;
    min-width: 430px;
    padding: 28px 44px 32px;
    border: 2px solid rgba(242,207,121,.78);
    border-radius: 34px;
    background: rgba(14,14,14,.88);
    text-align: center;
    box-shadow: 0 18px 48px rgba(0,0,0,.30), inset 0 0 24px rgba(242,207,121,.09);
    font-weight: 700;
  }
  .pricebox .label {
    font-size: 34px;
    font-weight: 700;
    color: #dbc28e;
    letter-spacing: 0.08em;
  }
  .pricebox .price {
    font-size: 84px;
    font-weight: 700;
    line-height: 1.08;
    margin-top: 6px;
    color: #f2cf79;
    white-space: nowrap;
  }
</style>
</head>
<body>
  <div class="poster" id="poster">
    <img class="bg" id="bg" src="{{BG_SRC}}" alt="">
    <div class="shade"></div>
    <div class="grain"></div>

    <div class="brand">
      <div class="cn">侨联地产</div>
      <div class="en">QIAO LIAN</div>
    </div>

    <div class="main">
      <div class="title" id="project" data-autofit="54">{{PROJECT}}</div>
      <div class="layout" id="layout" data-field="layout" data-autofit="34">{{LAYOUT}}</div>
      <div class="info">
        <div data-field="area">区域 · <b id="area">{{AREA}}</b></div>
        <div data-fields="size,floor"><span data-field="size">面积 · <b id="size">{{SIZE}}</b></span><span data-field="floor"> ｜ 楼层 · <b id="floor">{{FLOOR}}</b></span></div>
        <div class="high" data-fields="h1,h2,h3">亮点 · <span data-field="h1" id="h1">{{H1}}</span><span data-field="h2"> / <span id="h2">{{H2}}</span></span><span data-field="h3"> / <span id="h3">{{H3}}</span></span></div>
      </div>
    </div>

    <div class="pricebox">
      <div class="label">租金</div>
      <div class="price" id="price_line" data-autofit="58">{{PRICE_LINE}}</div>
    </div>
  </div>
</body>
</html>
