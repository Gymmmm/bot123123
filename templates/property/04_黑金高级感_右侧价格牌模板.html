<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>侨联黑金高级感</title><style>
*{box-sizing:border-box}html,body{margin:0;background:#080808;font-family:"Noto Sans CJK SC","Noto Sans SC",sans-serif}.poster{position:relative;width:1600px;height:1200px;overflow:hidden;background:#0b0b0b;color:#fff8e8}.bg{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;filter:saturate(1.04) contrast(1.04)}.shade{position:absolute;inset:0;background:linear-gradient(90deg,rgba(3,3,3,.9) 0,rgba(3,3,3,.48) 48%,rgba(3,3,3,.05) 75%),linear-gradient(0deg,rgba(0,0,0,.24),transparent 55%)}.brand{position:absolute;left:48px;top:82px}.brand .cn{font-size:56px;font-weight:950;color:#f2cf79;letter-spacing:1px}.brand .en{font-size:19px;color:#dbc28e;letter-spacing:1.7px;margin-top:3px}.main{position:absolute;left:48px;top:325px;width:700px}.title{font-size:88px;font-weight:950;line-height:1.08;text-shadow:0 3px 16px #000;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.sub{display:inline-block;max-width:650px;margin-top:18px;padding:10px 25px;background:rgba(14,14,14,.9);color:#f2cf79;border:2px solid rgba(242,207,121,.8);border-radius:999px;font-size:46px;font-weight:900;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.pricebox{position:absolute;right:48px;bottom:105px;min-width:440px;max-width:700px;padding:25px 34px;background:rgba(10,10,10,.9);border:2px solid rgba(242,207,121,.82);border-top-width:8px;text-align:center;box-shadow:0 16px 36px rgba(0,0,0,.5)}.label{font-size:27px;font-weight:750;color:#dbc28e}.price{font-size:82px;font-weight:950;line-height:1.1;color:#f2cf79;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
