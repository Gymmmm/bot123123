<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=1280,initial-scale=1">
<title>侨联地产 · 黑金高级感模板</title>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
html, body {
  width: 1280px;
  height: 720px;
  overflow: hidden;
  background: #0d0d0e;
  font-family: "Noto Sans CJK SC", "Noto Sans SC", -apple-system, sans-serif;
  -webkit-font-smoothing: antialiased;
}
.poster {
  position: relative;
  width: 1280px;
  height: 720px;
  overflow: hidden;
  background: #0d0d0e;
  color: #fff;
}
.bg { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }
.left-mask {
  position: absolute; top: 0; left: 0; width: 650px; height: 720px;
  background: linear-gradient(90deg, rgba(13,13,14,.94) 0%, rgba(13,13,14,.75) 50%, rgba(13,13,14,0) 100%);
  pointer-events: none;
}
.top-mask {
  position: absolute; top: 0; left: 0; width: 1280px; height: 140px;
  background: linear-gradient(180deg, rgba(0,0,0,.45) 0%, rgba(0,0,0,0) 100%);
  pointer-events: none;
}
.brand-group {
  position: absolute; left: 48px; top: 48px; z-index: 10;
  display: flex; align-items: center; gap: 16px;
}
.gold-bar { width: 3px; height: 40px; background: #d4af37; border-radius: 2px; }
.brand-text { display: flex; flex-direction: column; }
.brand-cn { font-size: 20px; font-weight: 700; line-height: 1.2; color: #fff; letter-spacing: 1px; }
.brand-en { margin-top: 2px; font-size: 11px; font-weight: 600; color: #d4af37; letter-spacing: 1.5px; }
.info-section {
  position: absolute; left: 48px; bottom: 48px; z-index: 10;
  display: flex; flex-direction: column;
}
.location-tag { font-size: 18px; font-weight: 700; color: #d4af37; letter-spacing: 1px; margin-bottom: 8px; }
.project-name { font-size: 56px; font-weight: 800; line-height: 1.1; color: #fff; letter-spacing: -.5px; margin-bottom: 12px; }
.layout-info { font-size: 24px; font-weight: 400; color: #e2e8f0; margin-bottom: 24px; }
.price-container { display: flex; align-items: baseline; gap: 6px; }
.price-amount {
  font-size: 48px; font-weight: 800; color: #fef08a; line-height: 1;
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
}
</style>
</head>
<body>
<div class="poster">
  <img id="bg" class="bg" src="{{BG_SRC}}" alt="房源实景图">
  <div class="top-mask"></div>
  <div class="left-mask"></div>
  <div class="brand-group">
    <div class="gold-bar"></div>
    <div class="brand-text">
      <div class="brand-cn">侨联地产</div>
      <div class="brand-en">QIAOLIAN REALTY</div>
    </div>
  </div>
  <section class="info-section">
    <div class="location-tag" id="location">{{AREA}}</div>
    <div class="project-name" id="project">{{PROJECT}}</div>
    <div class="layout-info" id="layout">{{LAYOUT}}</div>
    <div class="price-container">
      <span class="price-amount" id="price">{{PRICE_LINE}}</span>
    </div>
  </section>
</div>
</body>
</html>
