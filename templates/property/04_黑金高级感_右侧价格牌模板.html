<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=1600,initial-scale=1"><title>模板4-黑金高级感（右侧价格牌）</title><style>
*{box-sizing:border-box}html,body{margin:0;width:1600px;height:1200px;background:#080808;font-family:"Noto Sans CJK SC","Noto Sans SC",sans-serif}.poster{position:relative;width:1600px;height:1200px;overflow:hidden;background:#0b0b0b;color:#f4efe2}.bg{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;filter:saturate(1.05) contrast(1.03)}.leftShade{position:absolute;left:0;top:0;bottom:0;width:48%;background:linear-gradient(90deg,rgba(5,5,5,.86),rgba(5,5,5,.26))}.grain{position:absolute;inset:0;pointer-events:none;opacity:.16;background-image:radial-gradient(circle at 1px 1px,rgba(255,255,255,.12) 1px,transparent 0);background-size:3px 3px}.brand{position:absolute;left:36px;top:34px}.brand .cn{font-size:66px;font-weight:900;color:#f2cf79;letter-spacing:1px}.brand .en{font-size:22px;color:#dbc28e;opacity:.96;letter-spacing:1.2px}.main{position:absolute;left:36px;top:308px;width:650px}.title{font-size:96px;font-weight:900;line-height:1.06;color:#fff8e8;text-shadow:0 2px 14px rgba(0,0,0,.45);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.sub{display:inline-block;max-width:650px;background:rgba(24,24,24,.9);color:#f2cf79;font-size:52px;font-weight:900;border:2px solid rgba(242,207,121,.75);border-radius:999px;padding:12px 30px;margin-top:18px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.info{margin-top:30px;font-size:36px;font-weight:700;line-height:1.8;color:#f5e9cc}.info>div{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.pricebox{position:absolute;right:36px;bottom:36px;border-radius:28px;padding:28px 34px;min-width:390px;max-width:650px;text-align:center;background:rgba(14,14,14,.88);border:2px solid rgba(242,207,121,.78);box-shadow:0 16px 36px rgba(0,0,0,.45),inset 0 0 24px rgba(242,207,121,.09)}.pricebox .label{font-size:32px;font-weight:700;color:#dbc28e}.pricebox .price{font-size:92px;font-weight:900;line-height:1;color:#f2cf79;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
</style></head><body><div class="poster"><img id="bg" class="bg" src="{{BG_SRC}}" alt=""><div class="leftShade"></div><div class="grain"></div><div class="brand"><div class="cn">侨联地产</div><div class="en">QIAO LIAN PROPERTY</div></div><div class="main"><div class="title" data-autofit="48" id="t1">{{PROJECT}}</div><div class="sub" data-field="t2" data-autofit="30" id="t2">{{LAYOUT}}</div><div class="info"><div data-field="t3">区域 · <span id="t3">{{AREA}}</span></div><div data-fields="t4,t5"><span data-field="t4">面积 · <span id="t4">{{SIZE}}</span></span><span data-field="t5"> ｜ 楼层 · <span id="t5">{{FLOOR}}</span></span></div><div data-fields="t7,t8,t9">亮点 · <span data-field="t7" id="t7">{{H1}}</span><span data-field="t8"> / <span id="t8">{{H2}}</span></span><span data-field="t9"> / <span id="t9">{{H3}}</span></span></div></div></div><div class="pricebox"><div class="label" id="price_label">租金</div><div class="price" data-autofit="48" id="price_text">{{PRICE_LINE}}</div></div></div></body></html>
