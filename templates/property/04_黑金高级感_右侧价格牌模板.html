<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=1600,initial-scale=1">
<title>侨联黑金价格牌</title>
<style>
*{box-sizing:border-box}
html,body{margin:0;width:1600px;height:1200px;background:#080808;font-family:"Noto Sans CJK SC","Noto Sans SC",sans-serif}
.poster{position:relative;width:1600px;height:1200px;overflow:hidden;background:#0b0b0b;color:#fff8e8}
.bg{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;filter:saturate(1.04) contrast(1.04)}
.shade{position:absolute;inset:0;background:linear-gradient(90deg,rgba(3,3,3,.91) 0,rgba(3,3,3,.52) 43%,rgba(3,3,3,.07) 76%),linear-gradient(0deg,rgba(0,0,0,.26),transparent 58%)}
.grain{position:absolute;inset:0;opacity:.1;background-image:radial-gradient(circle at 1px 1px,rgba(255,255,255,.18) 1px,transparent 0);background-size:4px 4px}
.brand{position:absolute;left:52px;top:55px}
.brand .cn{font-size:59px;font-weight:950;color:#f2cf79;letter-spacing:1px}
.brand .en{margin-top:5px;font-size:20px;font-weight:650;color:#dbc28e;letter-spacing:2px}
.main{position:absolute;left:52px;top:310px;width:760px;text-shadow:0 3px 16px rgba(0,0,0,.5)}
.title{font-size:92px;font-weight:950;line-height:1.08;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sub{display:inline-block;max-width:690px;margin-top:20px;padding:11px 28px;border:2px solid rgba(242,207,121,.76);border-radius:999px;background:rgba(14,14,14,.83);color:#f2cf79;font-size:46px;font-weight:900;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.info{margin-top:30px;color:#f5e9cc;font-size:34px;font-weight:720;line-height:1.75}
.info>div{max-width:730px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pricebox{position:absolute;right:52px;bottom:58px;min-width:450px;max-width:690px;padding:26px 38px 30px;border:2px solid rgba(242,207,121,.8);border-top-width:8px;border-radius:27px;background:rgba(10,10,10,.9);text-align:center;box-shadow:0 17px 38px rgba(0,0,0,.5),inset 0 0 24px rgba(242,207,121,.08)}
.label{font-size:27px;font-weight:750;color:#dbc28e}
.price{margin-top:5px;font-size:82px;font-weight:950;line-height:1.08;color:#f2cf79;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
</style>
</head>
<body>
<div class="poster">
  <img id="bg" class="bg" src="{{BG_SRC}}" alt="">
  <div class="shade"></div><div class="grain"></div>
  <div class="brand"><div class="cn">侨联地产</div><div class="en">QIAO LIAN PROPERTY</div></div>
  <div class="main">
    <div class="title" id="t1">{{PROJECT}}</div>
    <div class="sub" data-field="t2" id="t2">{{LAYOUT}}</div>
    <div class="info">
      <div data-field="t3">位置 · <span id="t3">{{AREA}}</span></div>
      <div data-fields="t4,t5"><span data-field="t4">面积 · <span id="t4">{{SIZE}}</span></span><span data-field="t5">　｜　楼层 · <span id="t5">{{FLOOR}}</span></span></div>
      <div data-fields="t7,t8,t9">亮点 · <span data-field="t7" id="t7">{{H1}}</span><span data-field="t8"> / <span id="t8">{{H2}}</span></span><span data-field="t9"> / <span id="t9">{{H3}}</span></span></div>
    </div>
  </div>
  <div class="pricebox" data-field="t6"><div class="label" id="price_label">租金</div><div class="price" id="price_text">{{PRICE_LINE}}</div></div>
</div>
</body>
</html>
