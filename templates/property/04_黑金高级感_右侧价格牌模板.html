<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=1600">
<title>侨联封面 · 黑金高级感 · 全 Noto Sans SC 锁定版</title>
<style>
  /* 字体：全 Noto Sans SC（与日常封面同一锁定） */
  @font-face {
    font-family: "Noto Sans SC";
    src: local("Noto Sans SC"), local("Noto Sans CJK SC");
    font-weight: 700;
    font-display: block;
  }
  @font-face {
    font-family: "Noto Sans SC";
    src: local("Noto Sans SC"), local("Noto Sans CJK SC");
    font-weight: 400;
    font-display: block;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body {
    width: 1080px;
    height: 864px;
    overflow: hidden;
    background: #080808;
  }

  .poster {
    position: relative;
    width: 1080px;
    height: 864px;
    overflow: hidden;
    background: #0b0b0b;
    color: #f4efe2;
    font-family: "Noto Sans SC", "Noto Sans CJK SC", sans-serif;
  }

  .bg {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    object-fit: cover;
    filter: saturate(1.05) contrast(1.03);
  }

  .shade {
    position: absolute;
    left: 0; top: 0; bottom: 0;
    width: 46%;
    background: linear-gradient(90deg, rgba(5,5,5,.72), rgba(5,5,5,.18) 72%, rgba(5,5,5,0));
  }

  .grain {
    position: absolute;
    inset: 0;
    pointer-events: none;
    opacity: .16;
    background-image: radial-gradient(circle at 0.68px 0.68px, rgba(255,255,255,.12) 0.68px, transparent 0);
    background-size: 2.03px 2.03px;
  }

  /* 品牌区 — champagne gold PNG + text fallback */
  .brand {
    position: absolute;
    left: 32.4px;
    top: 28.35px;
    display: flex;
    align-items: center;
    gap: 12.15px;
  }
  .brand-logo{
    height: 80px;
    width: auto;
    max-width: 280px;
    object-fit: contain;
    filter: drop-shadow(0 2px 8px rgba(0,0,0,.5));
  }
  .brand-logo[src=""],
  .brand-logo:not([src]) { display: none; }
  .brand:has(.brand-logo[src^="data:"]) .brand-text { display: none; }
  .brand .cn {
    font-weight: 700;
    font-size: 41.85px;
    line-height: 1;
    color: #f2cf79;
    letter-spacing: 0.05em;
    text-shadow: 0 0.68px 1.35px rgba(0,0,0,.55), 0 1.35px 6.75px rgba(0,0,0,.35);
  }
  .brand .en {
    font-weight: 700;
    font-size: 11.48px;
    color: #dbc28e;
    opacity: 0.95;
    margin-top: 5.4px;
    letter-spacing: 0.16em;
    text-shadow: 0 0.68px 1.35px rgba(0,0,0,.55), 0 1.35px 6.75px rgba(0,0,0,.35);
  }

  /* 左侧信息避开建筑主体，分层展示 */
  .main {
    position: absolute;
    left: 35.1px;
    top: 155.25px;
    width: 452.25px;
  }
  .title {
    font-weight: 700;
    font-size: 62.1px;
    line-height: 1.06;
    color: #fff8e8;
    text-shadow: 0 1.35px 9.45px rgba(0,0,0,.45);
  }
  .layout {
    display: inline-block;
    margin-top: 16.2px;
    padding: 8.1px 17.55px;
    border: 1.35px solid rgba(242,207,121,.75);
    border-radius: 674.33px;
    background: rgba(24,24,24,.9);
    color: #f2cf79;
    font-size: 29.7px;
    font-weight: 700;
  }
  .info {
    margin-top: 27px;
    font-size: 21.6px;
    font-weight: 400;
    line-height: 1.85;
    color: #f5e9cc;
  }
  .info b { font-weight: 700; }
  .info > div { white-space: nowrap; }
  .info .area-row span {
    display: block;
    font-size: 20.25px;
    line-height: 1.2;
    color: #e2c98e;
  }
  .info .area-row b { display: block; margin-top: 4.73px; font-size: 32.4px; line-height: 1.3; }
  .high {
    max-width: 459px;
    overflow: hidden;
    text-overflow: ellipsis;
  }

  /* 右下价签 */
  .pricebox {
    position: absolute;
    right: 32.4px;
    bottom: 45.9px;
    min-width: 256.5px;
    padding: 15.53px 24.3px 18.23px;
    border: 1.35px solid rgba(242,207,121,.78);
    border-radius: 22.95px;
    background: rgba(14,14,14,.88);
    text-align: center;
    box-shadow: 0 12.15px 32.4px rgba(0,0,0,.30), inset 0 0 16.2px rgba(242,207,121,.09);
    font-weight: 700;
  }
  .pricebox .label {
    font-size: 18.9px;
    font-weight: 700;
    color: #dbc28e;
    letter-spacing: 0.08em;
  }
  .pricebox .price {
    font-size: 51.3px;
    font-weight: 700;
    line-height: 1.08;
    margin-top: 4.05px;
    color: #f2cf79;
    white-space: nowrap;
  }
</style>
</head>
<body>
  <div class="poster" id="poster">
    <img class="bg" id="bg" src="{{BG_SRC}}" alt="">
    <div class="shade"></div>
    <div class="grain"></div>

    <div class="brand">
      <img id="brandLogo" class="brand-logo" src="{{LOGO_SRC}}" alt="侨联地产">
      <div class="brand-text">
        <div class="cn">侨联地产</div>
        <div class="en">QIAO LIAN</div>
      </div>
    </div>

    <div class="main">
      <div class="title" id="project" data-autofit="54">{{PROJECT}}</div>
      <div class="layout" id="layout" data-field="layout" data-autofit="34">{{LAYOUT}}</div>
      <div class="info">
        <div class="area-row" data-field="area"><span>位置</span><b id="area">{{AREA}}</b></div>
        <div data-fields="size,floor"><span data-field="size">面积 · <b id="size">{{SIZE}}</b></span><span data-field="floor"> ｜ 楼层 · <b id="floor">{{FLOOR}}</b></span></div>
        <div class="high" data-fields="h1,h2,h3">亮点 · <span data-field="h1" id="h1">{{H1}}</span><span data-field="h2"> / <span id="h2">{{H2}}</span></span><span data-field="h3"> / <span id="h3">{{H3}}</span></span></div>
      </div>
    </div>

    <div class="pricebox">
      <div class="label">租金</div>
      <div class="price" id="price_line" data-autofit="58">{{PRICE_LINE}}</div>
    </div>
  </div>
</body>
</html>
