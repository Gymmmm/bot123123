<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=1600,initial-scale=1">
<title>模板4-黑金V4</title>
<style>
*{box-sizing:border-box}html,body{margin:0;width:1600px;height:1200px;background:#080808;font-family:"Noto Sans CJK SC","Noto Sans SC","PingFang SC","Microsoft YaHei",sans-serif}.poster{position:relative;width:1600px;height:1200px;overflow:hidden;background:#111;color:#fff}.bg{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;filter:saturate(1.03) contrast(1.03)}.topShade{position:absolute;left:0;top:0;width:100%;height:600px;background:linear-gradient(180deg,rgba(0,0,0,.32),rgba(0,0,0,.08) 52%,rgba(0,0,0,0))}.leftShade{position:absolute;left:0;top:0;width:900px;height:880px;background:linear-gradient(90deg,rgba(0,0,0,.25),rgba(0,0,0,0))}.brand{position:absolute;left:48px;top:42px;color:#e5c56d}.brand-row{display:flex;align-items:center;gap:16px}.logo{position:relative;width:52px;height:48px}.logo:before{content:"";position:absolute;left:6px;top:7px;width:38px;height:28px;border-left:5px solid #e5c56d;border-right:5px solid #e5c56d;border-bottom:5px solid #e5c56d}.logo:after{content:"";position:absolute;left:4px;top:0;width:34px;height:34px;border-left:5px solid #e5c56d;border-top:5px solid #e5c56d;transform:rotate(45deg);transform-origin:center}.brand .cn{font-size:42px;font-weight:900;letter-spacing:.5px;line-height:1}.brand .en{margin-left:68px;margin-top:6px;font-size:13px;font-weight:500;letter-spacing:2px;color:rgba(238,211,137,.84)}.main{position:absolute;left:48px;top:290px;max-width:1030px}.title{font-size:80px;font-weight:900;line-height:1.08;color:#fff;text-shadow:0 4px 14px rgba(0,0,0,.72);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.layout-tag{display:inline-block;margin-top:24px;padding:10px 20px 11px;border-radius:4px;background:rgba(14,14,14,.84);font-size:38px;font-weight:900;color:#fff;white-space:nowrap;max-width:520px;overflow:hidden;text-overflow:ellipsis}.pricebox{position:absolute;right:65px;top:96px;width:370px;min-height:170px;padding:28px 24px;border-radius:12px;text-align:center;background:linear-gradient(180deg,rgba(21,21,21,.92),rgba(9,9,9,.92));box-shadow:0 14px 28px rgba(0,0,0,.42)}.pricebox .label{font-size:23px;font-weight:600;color:rgba(255,255,255,.82)}.pricebox .price{margin-top:10px;font-size:64px;font-weight:900;line-height:1.05;color:#e5c56d;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.bottom{position:absolute;left:0;right:0;bottom:0;height:190px;padding:32px 75px;background:linear-gradient(180deg,rgba(4,4,4,.70),rgba(3,3,3,.90));border-top:2px solid rgba(229,197,109,.28);display:grid;grid-template-columns:1.15fr .95fr .9fr;column-gap:70px}.cell{position:relative;min-width:0}.cell+.cell:before{content:"";position:absolute;left:-35px;top:0;bottom:0;width:1px;background:rgba(255,255,255,.13)}.kicker{font-size:17px;font-weight:600;color:rgba(255,255,255,.68)}.value{margin-top:10px;font-size:40px;font-weight:900;color:#fff;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.highlights{margin-top:14px;font-size:18px;font-weight:600;color:rgba(233,213,162,.86);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
</style>
</head>
<body>
<div class="poster">
  <img id="bg" class="bg" src="{{BG_SRC}}" alt="">
  <div class="topShade"></div>
  <div class="leftShade"></div>

  <div class="brand">
    <div class="brand-row"><div class="logo"></div><div class="cn">侨联地产</div></div>
    <div class="en">QIAO LIAN PROPERTY</div>
  </div>

  <div class="main">
    <div class="title" data-autofit="48"><span id="t1">{{PROJECT}}</span>｜<span id="t2">{{LAYOUT}}</span></div>
    <div class="layout-tag" data-field="t2" data-autofit="28">{{LAYOUT}}</div>
  </div>

  <div class="pricebox">
    <div class="label" id="price_label">月租</div>
    <div class="price" data-autofit="42" id="price_text">{{PRICE_LINE}}</div>
  </div>

  <div class="bottom">
    <div class="cell">
      <div class="kicker">项目 / 区域</div>
      <div class="value" data-field="t3" data-autofit="28" id="t3">{{AREA}}</div>
      <div class="highlights" data-fields="t7,t8,t9" data-autofit="14"><span data-field="t7" id="t7">{{H1}}</span><span data-field="t8"> · <span id="t8">{{H2}}</span></span><span data-field="t9"> · <span id="t9">{{H3}}</span></span></div>
    </div>
    <div class="cell">
      <div class="kicker">面积</div>
      <div class="value" data-field="t4" data-autofit="28" id="t4">{{SIZE}}</div>
    </div>
    <div class="cell">
      <div class="kicker">楼层</div>
      <div class="value" data-field="t5" data-autofit="28" id="t5">{{FLOOR}}</div>
    </div>
  </div>
</div>
</body>
</html>
