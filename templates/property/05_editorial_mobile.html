<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=1600, initial-scale=1">
<title>Qiaolian Editorial Mobile Cover</title>
<style>
:root{--accent:#e9a35b;--ink:#111316;--muted:#aeb5bc;--panel:rgba(15,18,21,.90)}
*{box-sizing:border-box}html,body{margin:0;width:1600px;height:1200px;background:#0d0f11;font-family:"Noto Sans CJK SC","Microsoft YaHei",Arial,sans-serif;color:#fff}.poster{position:relative;width:1600px;height:1200px;overflow:hidden;background:#101214}.bg{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;object-position:center}.veil{position:absolute;inset:0;background:linear-gradient(180deg,rgba(7,9,11,.42) 0%,rgba(7,9,11,.03) 37%,rgba(7,9,11,.12) 51%,rgba(7,9,11,.96) 100%)}.top{position:absolute;top:58px;left:64px;right:64px;display:flex;justify-content:space-between;align-items:center}.brand{display:flex;align-items:center;gap:18px}.brand-mark{width:48px;height:48px;border:2px solid rgba(255,255,255,.8);border-radius:14px;display:grid;place-items:center;font-size:20px;font-weight:900;letter-spacing:-2px}.brand-cn{font-size:30px;font-weight:800;letter-spacing:2px}.brand-en{font-size:13px;color:rgba(255,255,255,.72);letter-spacing:3px;margin-top:3px}.qc{border:1px solid rgba(255,255,255,.62);border-radius:999px;padding:12px 22px;font-size:20px;font-weight:800;letter-spacing:1px;background:rgba(10,12,14,.28);backdrop-filter:blur(8px)}.content{position:absolute;left:64px;right:64px;bottom:62px}.eyebrow{display:inline-flex;align-items:center;gap:12px;color:var(--accent);font-size:20px;font-weight:800;letter-spacing:1px;text-transform:uppercase;margin-bottom:18px}.eyebrow:before{content:"";width:46px;height:3px;background:var(--accent);border-radius:3px}.title-row{display:flex;align-items:flex-end;justify-content:space-between;gap:32px}.title{font-size:64px;line-height:1.05;font-weight:900;letter-spacing:-1px;text-shadow:0 3px 22px rgba(0,0,0,.35);max-width:980px}.type{font-size:23px;color:#d7dce0;font-weight:600;margin-top:14px}.price{text-align:right;min-width:340px}.price-label{font-size:19px;color:#c7cdd2;letter-spacing:3px;margin-bottom:6px}.price-value{font-size:62px;line-height:1;font-weight:900;color:var(--accent);letter-spacing:-2px}.facts{display:flex;flex-wrap:wrap;gap:12px;margin-top:30px}.fact{display:flex;padding:13px 20px;border-radius:12px;background:rgba(255,255,255,.12);border:1px solid rgba(255,255,255,.25);font-size:22px;font-weight:700;color:#f5f7f8;backdrop-filter:blur(8px)}.fact strong{color:var(--accent);font-size:16px;margin-right:9px;letter-spacing:1px}.footer{margin-top:27px;color:rgba(255,255,255,.72);font-size:17px;letter-spacing:.6px}.footer span{color:#fff;font-weight:700}.hide{display:none!important}
</style>
</head>
<body>
<div class="poster" id="poster">
  <img class="bg" id="bg" src="" alt="">
  <div class="veil"></div>
  <div class="top">
    <div class="brand"><div class="brand-mark">侨联</div><div><div class="brand-cn">侨联地产</div><div class="brand-en">QIAO LIAN PROPERTY</div></div></div>
    <div class="qc" id="t1">{{REF}}</div>
  </div>
  <div class="content">
    <div class="eyebrow">侨联实拍 · 中文顾问</div>
    <div class="title-row">
      <div><div class="title" id="t2">{{PROJECT}}</div><div class="type" id="t3">{{PROPERTY_TYPE}}</div></div>
      <div class="price"><div class="price-label">月租</div><div class="price-value" id="price_text">{{PRICE_LINE}}</div></div>
    </div>
    <div class="facts">
      <div class="fact" data-fields="t4" id="fact_area"><strong>区域</strong><span id="t4">{{AREA}}</span></div>
      <div class="fact" data-fields="t5" id="fact_layout"><strong>户型</strong><span id="t5">{{LAYOUT}}</span></div>
      <div class="fact" data-fields="t6" id="fact_size"><strong>面积</strong><span id="t6">{{SIZE}}</span></div>
      <div class="fact" data-fields="t7" id="fact_floor"><strong>楼层</strong><span id="t7">{{FLOOR}}</span></div>
    </div>
    <div class="footer">实拍发布 · 预约看房请点击帖子下方按钮 · <span id="t8">{{REF}}</span></div>
  </div>
</div>
</body>
</html>
