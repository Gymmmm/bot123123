<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>侨联经典蓝卡</title><style>
*{box-sizing:border-box}html,body{margin:0;background:#0b2048;font-family:"Noto Sans CJK SC","Noto Sans SC",sans-serif}.poster{position:relative;width:1600px;height:1200px;overflow:hidden;background:#0b2048;color:#fff}.bg{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}.shade{position:absolute;inset:0;background:linear-gradient(90deg,rgba(3,20,55,.5),transparent 60%),linear-gradient(0deg,rgba(3,20,55,.38),transparent 55%)}.brand{position:absolute;left:0;top:0;width:520px;padding:34px 42px 30px;background:linear-gradient(135deg,rgba(10,47,122,.98),rgba(17,71,178,.82))}.brand .cn{font-size:68px;font-weight:900;line-height:1}.brand .en{margin-top:10px;font-size:22px;letter-spacing:1.5px;color:rgba(255,255,255,.9)}.card{position:absolute;left:36px;right:36px;bottom:34px;display:grid;grid-template-columns:minmax(0,1fr) auto;gap:18px 34px;align-items:center;padding:28px 34px;background:linear-gradient(135deg,rgba(12,61,158,.96),rgba(18,63,147,.9));border:1px solid rgba(255,255,255,.2)}.title{min-width:0;font-size:64px;font-weight:900;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.layout-part{margin-left:18px;padding-left:18px;border-left:3px solid currentColor}.price{font-size:72px;font-weight:900;color:#ffd65a;white-space:nowrap}.price small{font-size:34px;color:#fff}.meta{display:flex;gap:22px;font-size:30px;font-weight:750;white-space:nowrap;overflow:hidden}.meta>span+span{padding-left:22px;border-left:2px solid rgba(255,255,255,.4)}.highlights{display:flex;justify-content:flex-end;gap:12px;max-width:720px}.chip{max-width:220px;padding:9px 16px;border:1px solid rgba(255,255,255,.25);background:rgba(2,20,55,.24);font-size:24px;font-weight:750;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
</style></head><body><div class="poster"><img id="bg" class="bg" src="{{BG_SRC}}" alt=""><div class="shade"></div><div class="brand"><div class="cn">侨联地产</div><div class="en">QIAO LIAN PROPERTY</div></div><div class="card"><div class="title"><span id="t1">{{PROJECT}}</span><span class="layout-part" data-field="t2"><span id="t2">{{LAYOUT}}</span></span></div><div class="price"><span id="t5">{{PRICE}}</span><small>{{PRICE_SUFFIX}}</small></div><div class="meta"><span data-field="t3" id="t3">{{SIZE}}</span><span data-field="t4" id="t4">{{FLOOR}}</span></div><div class="highlights"><span class="chip" data-field="t6" id="t6">{{H1}}</span><span class="chip" data-field="t7" id="t7">{{H2}}</span><span class="chip" data-field="t8" id="t8">{{H3}}</span></div></div></div></body></html>
