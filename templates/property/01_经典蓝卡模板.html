<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=1600">
<title>侨联封面 · 经典蓝卡 · 全 Noto Sans SC 锁定版</title>
<style>
  /* 字体：全 Noto Sans SC（与日常/黑金同一锁定；不要 Manrope） */
  @font-face {
    font-family: "Noto Sans SC";
    src: local("Noto Sans SC"), local("Noto Sans CJK SC");
    font-weight: 700;
    font-display: block;
  }
  @font-face {
    font-family: "Noto Sans SC";
    src: local("Noto Sans SC"), local("Noto Sans CJK SC");
    font-weight: 400;
    font-display: block;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body {
    width: 1600px;
    height: 1200px;
    overflow: hidden;
    background: #0a1a38;
  }

  .poster {
    position: relative;
    width: 1600px;
    height: 1200px;
    overflow: hidden;
    background: #0a1a38;
    color: #fff;
    font-family: "Noto Sans SC", "Noto Sans CJK SC", sans-serif;
  }

  .bg {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    object-fit: cover;
    object-position: center;
    filter: saturate(1.02) contrast(1.02);
  }

  /* Soft wide shade — readable brand without hard left mask seam */
  .shade {
    position: absolute;
    inset: 0;
    pointer-events: none;
    background:
      linear-gradient(
        180deg,
        rgba(4, 14, 36, 0.52) 0%,
        rgba(4, 14, 36, 0.06) 26%,
        rgba(4, 14, 36, 0.14) 52%,
        rgba(4, 14, 36, 0.78) 100%
      ),
      linear-gradient(
        90deg,
        rgba(4, 14, 36, 0.38) 0%,
        rgba(4, 14, 36, 0.12) 28%,
        transparent 58%
      );
  }

  /* Brand: text mark only (no big blue plate) — matches gallery corner */
  .brand {
    position: absolute;
    left: 48px;
    top: 42px;
    z-index: 2;
    color: #fff;
  }
  .brand .cn {
    font-weight: 700;
    font-size: 54px;
    letter-spacing: 0.05em;
    line-height: 1;
    text-shadow: 0 1px 2px rgba(0,0,0,.55), 0 2px 10px rgba(0,0,0,.35);
  }
  .brand .en {
    font-weight: 700;
    font-size: 17px;
    opacity: 0.92;
    margin-top: 8px;
    letter-spacing: 0.16em;
    text-shadow: 0 1px 2px rgba(0,0,0,.55), 0 2px 10px rgba(0,0,0,.35);
  }

  /* Bottom blue card — classic_blue identity (not right_price layout) */
  .card {
    position: absolute;
    left: 36px;
    right: 36px;
    bottom: 34px;
    z-index: 2;
    padding: 30px 40px 28px;
    border-radius: 28px;
    background: linear-gradient(135deg, rgba(10, 42, 110, 0.94), rgba(14, 56, 140, 0.90));
    border: 1px solid rgba(255, 255, 255, 0.18);
    box-shadow: 0 18px 48px rgba(0, 0, 0, 0.35);
    overflow: hidden;
  }

  .row {
    display: flex;
    justify-content: space-between;
    align-items: flex-end;
    gap: 36px;
  }
  .primary {
    min-width: 0;
    flex: 1;
    font-size: 64px;
    font-weight: 700;
    line-height: 1.08;
    white-space: nowrap;
    overflow: hidden;
  }
  .primary .layout-part {
    margin-left: 18px;
    padding-left: 18px;
    border-left: 3px solid rgba(255, 255, 255, 0.55);
    font-weight: 700;
  }
  .price {
    flex: 0 0 auto;
    font-size: 78px;
    font-weight: 700;
    color: #ffd45e;
    line-height: 1;
    white-space: nowrap;
    text-shadow: 0 2px 10px rgba(0, 0, 0, 0.25);
  }
  .price small {
    font-size: 32px;
    font-weight: 700;
    color: #fff;
    margin-left: 4px;
  }

  .meta {
    display: flex;
    align-items: center;
    margin-top: 14px;
    font-size: 28px;
    font-weight: 700;
    color: rgba(255, 255, 255, 0.94);
    white-space: nowrap;
    overflow: hidden;
  }
  .meta > span {
    padding: 0 18px;
    border-right: 2px solid rgba(255, 255, 255, 0.28);
  }
  .meta > span:first-child { padding-left: 0; }
  .meta > span:last-child { border-right: 0; padding-right: 0; }

  .highlights {
    display: flex;
    gap: 12px;
    margin-top: 16px;
    flex-wrap: nowrap;
    overflow: hidden;
  }
  .highlights > span {
    max-width: 320px;
    padding: 10px 20px;
    border-radius: 999px;
    border: 1px solid rgba(255, 255, 255, 0.28);
    background: rgba(255, 255, 255, 0.12);
    font-size: 26px;
    font-weight: 700;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
</style>
</head>
<body>
  <div class="poster" id="poster">
    <img id="bg" class="bg" src="{{BG_SRC}}" alt="">
    <div class="shade"></div>

    <div class="brand">
      <div class="cn">侨联地产</div>
      <div class="en">QIAO LIAN</div>
    </div>

    <section class="card">
      <div class="row">
        <div class="primary" data-autofit="40">
          <span id="project">{{PROJECT}}</span><span class="layout-part" data-field="layout"> <span id="layout">{{LAYOUT}}</span></span>
        </div>
        <div class="price" data-autofit="46">
          <span id="price">{{PRICE}}</span><small id="price_suffix">{{PRICE_SUFFIX}}</small>
        </div>
      </div>
      <div class="meta" data-fields="size,floor">
        <span data-field="size" id="size">{{SIZE}}</span>
        <span data-field="floor" id="floor">{{FLOOR}}</span>
      </div>
      <div class="highlights" data-fields="h1,h2,h3">
        <span data-field="h1" id="h1">{{H1}}</span>
        <span data-field="h2" id="h2">{{H2}}</span>
        <span data-field="h3" id="h3">{{H3}}</span>
      </div>
    </section>
  </div>
</body>
</html>
