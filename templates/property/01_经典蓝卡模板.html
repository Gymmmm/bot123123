<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=1600,initial-scale=1"><title>模板1-经典蓝卡</title><style>
*{box-sizing:border-box}html,body{margin:0;width:1600px;height:1200px;background:#0b2048;font-family:"Noto Sans CJK SC","Noto Sans SC",sans-serif}.poster{position:relative;width:1600px;height:1200px;overflow:hidden;background:#0b2048;color:#fff}.bg{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}.brand{position:absolute;left:0;top:0;width:540px;height:185px;background:linear-gradient(135deg,rgba(10,47,122,.95),rgba(17,71,178,.78));padding:34px}.brand .cn{font-size:72px;font-weight:800;line-height:1}.brand .en{font-size:24px;margin-top:8px;color:rgba(255,255,255,.9);letter-spacing:1.2px}.card{position:absolute;left:36px;bottom:34px;width:860px;background:linear-gradient(135deg,rgba(17,71,178,.92),rgba(21,61,145,.86));border-radius:28px;overflow:hidden;box-shadow:0 18px 36px rgba(0,0,0,.22)}.p1{padding:24px 30px 10px;font-size:66px;font-weight:900;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.p2{display:flex;justify-content:space-between;align-items:center;padding:10px 30px 18px;font-size:38px;font-weight:800;gap:20px}.meta{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.price{font-size:70px;color:#f6c948;font-weight:900;white-space:nowrap}.price small{font-size:38px;color:#fff}.p3{padding:18px 30px 24px;border-top:1px solid rgba(255,255,255,.08);font-size:28px;font-weight:700;display:flex;gap:24px;white-space:nowrap;overflow:hidden}.p3 span{overflow:hidden;text-overflow:ellipsis}
</style></head><body><div class="poster"><img id="bg" class="bg" src="{{BG_SRC}}" alt=""><div class="brand"><div class="cn">侨联地产</div><div class="en">QIAO LIAN PROPERTY</div></div><div class="card"><div class="p1"><span id="t1">{{PROJECT}}</span><span data-field="t2"> · <span id="t2">{{LAYOUT}}</span></span></div><div class="p2"><div class="meta"><span data-field="t3">🏠 <span id="t3">{{SIZE}}</span></span><span data-field="t4"> ｜ <span id="t4">{{FLOOR}}</span></span></div><div class="price"><span id="price_text">{{PRICE}}</span><small id="price_suffix">{{PRICE_SUFFIX}}</small></div></div><div class="p3" data-fields="t6,t7,t8"><span data-field="t6">🛋️ <span id="t6">{{H1}}</span></span><span data-field="t7">🏊 <span id="t7">{{H2}}</span></span><span data-field="t8">🏋️ <span id="t8">{{H3}}</span></span></div></div></div></body></html>
