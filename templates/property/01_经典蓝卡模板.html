<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=1600,initial-scale=1"><title>模板1-Same Style蓝卡</title><style>
*{box-sizing:border-box}html,body{margin:0;width:1600px;height:1200px;background:#0b2048;font-family:"Noto Sans CJK SC","Noto Sans SC",sans-serif}.poster{position:relative;width:1600px;height:1200px;overflow:hidden;background:#0b2048;color:#fff}.bg{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}.top-brand{position:absolute;left:0;top:0;width:540px;height:190px;background:linear-gradient(135deg,rgba(10,47,122,.95),rgba(17,71,178,.78));padding:34px 34px 24px}.brand-inner{display:flex;align-items:center;gap:18px}.logo{width:96px;height:96px;flex:0 0 96px}.brand-cn{font-size:72px;font-weight:800;line-height:1;margin-bottom:8px}.brand-en{font-size:24px;color:rgba(255,255,255,.92);letter-spacing:1.2px;font-family:Arial,"Noto Sans",sans-serif}.bottom-card{position:absolute;left:36px;bottom:34px;width:920px;background:linear-gradient(135deg,rgba(17,71,178,.92),rgba(21,61,145,.86));border-radius:28px;overflow:hidden;backdrop-filter:blur(8px);box-shadow:0 18px 36px rgba(0,0,0,.22)}.project-row{padding:26px 30px 12px;font-size:68px;line-height:1.08;font-weight:900;display:flex;align-items:center;gap:16px;white-space:nowrap;overflow:hidden}.project-row .home-icon{width:44px;height:44px;flex:0 0 44px}.project-row span{white-space:nowrap}.meta-row{display:flex;align-items:center;gap:28px;padding:10px 30px 18px;font-weight:800}.meta-left{display:flex;align-items:center;gap:24px;font-size:38px;color:#fff;flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.meta-left .sep{opacity:.55}.price{font-size:70px;color:#f6c948;font-weight:900;white-space:nowrap;font-family:Arial,"Noto Sans",sans-serif}.price small{font-size:38px;color:#fff;margin-left:4px;font-weight:800}.highlights{padding:18px 30px 24px;display:flex;align-items:center;gap:26px;border-top:1px solid rgba(255,255,255,.08);font-size:28px;font-weight:700;color:#fff;white-space:nowrap;overflow:hidden}.highlights .item{display:flex;align-items:center;gap:10px;overflow:hidden;text-overflow:ellipsis}.highlights .icon{font-size:28px;opacity:.95}
</style></head><body><div class="poster"><img id="bg" class="bg" src="{{BG_SRC}}" alt=""><div class="top-brand"><div class="brand-inner"><svg class="logo" viewBox="0 0 120 120" fill="none" xmlns="http://www.w3.org/2000/svg"><path d="M14 62L60 30L106 62" stroke="white" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/><path d="M24 58V88H44V68H76V88H96V58" stroke="white" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/><path d="M16 92C33 84 49 81 60 81C71 81 87 84 104 92" stroke="white" stroke-width="8" stroke-linecap="round"/></svg><div><div class="brand-cn">侨联地产</div><div class="brand-en">QIAO LIAN PROPERTY</div></div></div></div><div class="bottom-card"><div class="project-row" data-autofit="42"><svg class="home-icon" viewBox="0 0 24 24" fill="white" xmlns="http://www.w3.org/2000/svg"><path d="M12 3L3 10V21H9V14H15V21H21V10L12 3Z"/></svg><span id="t1">{{PROJECT}}</span><span data-field="t2">· <span id="t2">{{LAYOUT}}</span></span></div><div class="meta-row"><div class="meta-left" data-autofit="28"><span data-field="t3">🏠 <span id="t3">{{SIZE}}</span></span><span class="sep" data-field="t4">|</span><span data-field="t4" id="t4">{{FLOOR}}</span></div><div class="price" data-autofit="44"><span id="price_text">{{PRICE}}</span><small id="price_suffix">{{PRICE_SUFFIX}}</small></div></div><div class="highlights" data-fields="t6,t7,t8" data-autofit="20"><div class="item" data-field="t6"><span class="icon">🛋️</span><span id="t6">{{H1}}</span></div><div class="item" data-field="t7"><span class="icon">🏊</span><span id="t7">{{H2}}</span></div><div class="item" data-field="t8"><span class="icon">🏋️</span><span id="t8">{{H3}}</span></div></div></div></div></body></html>
