<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=1600,initial-scale=1"><title>侨联地产 · 经典蓝卡</title><style>
*{box-sizing:border-box}html,body{margin:0;width:1600px;height:1200px;background:#0b2048;font-family:"Noto Sans CJK SC","Noto Sans SC",sans-serif}.poster{position:relative;width:1600px;height:1200px;overflow:hidden;background:#0b2048;color:#fff}.bg{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}.brand{position:absolute;left:0;top:0;width:540px;height:185px;padding:34px;background:linear-gradient(135deg,rgba(10,47,122,.95),rgba(17,71,178,.78))}.brand-cn{font-size:72px;font-weight:800;line-height:1}.brand-en{margin-top:8px;font-size:24px;color:rgba(255,255,255,.9)}.card{position:absolute;left:36px;bottom:34px;width:860px;overflow:hidden;border-radius:28px;background:linear-gradient(135deg,rgba(17,71,178,.92),rgba(21,61,145,.86));box-shadow:0 14px 34px rgba(0,0,0,.18)}.primary{padding:24px 30px 10px;font-size:66px;font-weight:900;white-space:nowrap;overflow:hidden}.meta{display:flex;justify-content:space-between;align-items:center;padding:10px 30px 18px;font-size:38px;font-weight:800}.facts{display:flex;align-items:center;min-width:0}.facts>span+span:before{content:"｜";margin:0 18px;color:rgba(255,255,255,.65)}.price{font-size:70px;color:#f6c948;white-space:nowrap}.price small{font-size:38px;color:#fff}.highlights{display:flex;gap:24px;padding:18px 30px 24px;border-top:1px solid rgba(255,255,255,.14);font-size:28px;white-space:nowrap;overflow:hidden}.highlights>span+span:before{content:"·";margin-right:24px;color:rgba(255,255,255,.62)}
</style></head><body><div class="poster"><img id="bg" class="bg" src="{{BG_SRC}}" alt=""><div class="brand"><div class="brand-cn">侨联地产</div><div class="brand-en">QIAO LIAN PROPERTY</div></div><section class="card"><div class="primary" data-autofit="40"><span id="project">{{PROJECT}}</span><span data-field="layout"> · <span id="layout">{{LAYOUT}}</span></span></div><div class="meta"><div class="facts" data-fields="size,floor"><span data-field="size" id="size">{{SIZE}}</span><span data-field="floor" id="floor">{{FLOOR}}</span></div><div class="price" data-autofit="46"><span id="price">{{PRICE}}</span><small id="price_suffix">{{PRICE_SUFFIX}}</small></div></div><div class="highlights" data-fields="h1,h2,h3"><span data-field="h1" id="h1">{{H1}}</span><span data-field="h2" id="h2">{{H2}}</span><span data-field="h3" id="h3">{{H3}}</span></div></section></div></body></html>
