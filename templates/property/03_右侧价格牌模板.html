<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>侨联右侧价格牌</title><style>
*{box-sizing:border-box}html,body{margin:0;background:#111827;font-family:"PingFang SC","Noto Sans CJK SC","Microsoft YaHei",sans-serif}.poster{position:relative;width:1600px;height:1200px;overflow:hidden;background:#111827;color:#fff}.bg{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}.shade{position:absolute;inset:0;background:linear-gradient(90deg,rgba(7,18,39,.88) 0,rgba(7,18,39,.45) 46%,transparent 72%)}.brand{position:absolute;left:42px;top:36px}.brand .cn{font-size:60px;font-weight:900}.brand .en{font-size:20px;letter-spacing:1.6px;opacity:.9}.main{position:absolute;left:42px;top:300px;width:700px}.title{font-size:88px;font-weight:950;line-height:1.08;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.sub{display:inline-block;max-width:650px;margin-top:18px;padding:10px 25px;background:#fff;color:#1147b2;border-radius:999px;font-size:46px;font-weight:900;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.info{margin-top:28px;font-size:32px;font-weight:750;line-height:1.75}.info>div{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.pricebox{position:absolute;right:38px;bottom:38px;min-width:430px;max-width:690px;padding:27px 36px;background:rgba(255,255,255,.96);color:#1147b2;border-top:8px solid #efc968;text-align:center}.label{font-size:28px;font-weight:750;color:#475569}.price{font-size:84px;font-weight:950;line-height:1.1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
</style></head><body><div class="poster"><img id="bg" class="bg" src="{{BG_SRC}}" alt=""><div class="shade"></div><div class="brand"><div class="cn">侨联地产</div><div class="en">QIAO LIAN PROPERTY</div></div><div class="main"><div class="title" id="t1">{{PROJECT}}</div><div class="sub" data-field="t2" id="t2">{{LAYOUT}}</div><div class="info"><div data-field="t3">区域：<span id="t3">{{AREA}}</span></div><div data-fields="t4,t5"><span data-field="t4">面积：<span id="t4">{{SIZE}}</span></span><span data-field="t5">　楼层：<span id="t5">{{FLOOR}}</span></span></div><div data-fields="t7,t8,t9">亮点：<span id="t7">{{H1}}</span><span data-field="t8">　<span id="t8">{{H2}}</span></span><span data-field="t9">　<span id="t9">{{H3}}</span></span></div></div></div><div class="pricebox"><div class="label" id="price_label">租金</div><div class="price" id="price_text">{{PRICE_LINE}}</div></div></div></body></html>
