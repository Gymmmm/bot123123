<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=1600,initial-scale=1"><title>侨联地产 · 右侧价格牌</title><style>
*{box-sizing:border-box}html,body{margin:0;width:1600px;height:1200px;background:#0f172a;font-family:"Noto Sans CJK SC","Noto Sans SC",sans-serif}.poster{position:relative;width:1600px;height:1200px;overflow:hidden;background:#0b2048;color:#fff}.bg{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}.shade{position:absolute;left:0;top:0;bottom:0;width:48%;background:linear-gradient(90deg,rgba(15,23,42,.82),rgba(15,23,42,.08))}.brand{position:absolute;left:34px;top:34px}.brand-cn{font-size:66px;font-weight:800;line-height:1}.brand-en{margin-top:7px;font-size:22px;opacity:.9}.main{position:absolute;left:34px;top:310px;width:650px}.title{font-size:96px;font-weight:900;line-height:1.06;text-shadow:0 3px 16px rgba(0,0,0,.38)}.layout{display:inline-block;margin-top:18px;padding:14px 28px;border-radius:999px;background:rgba(255,255,255,.95);color:#1147b2;font-size:52px;font-weight:900}.info{margin-top:28px;font-size:36px;font-weight:700;line-height:1.8}.info>div{white-space:nowrap}.high{max-width:620px;overflow:hidden;text-overflow:ellipsis}.pricebox{position:absolute;right:36px;bottom:36px;min-width:380px;padding:28px 34px;border-radius:28px;background:rgba(255,248,240,.97);color:#1147b2;text-align:center;box-shadow:0 16px 34px rgba(0,0,0,.24)}.pricebox .label{font-size:32px;font-weight:700}.pricebox .price{font-size:92px;font-weight:900;line-height:1;white-space:nowrap}
