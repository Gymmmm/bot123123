<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=1600,initial-scale=1"><title>模板3-右侧价格牌</title><style>
*{box-sizing:border-box}html,body{margin:0;width:1600px;height:1200px;background:#0f172a;font-family:"Noto Sans CJK SC","Noto Sans SC",sans-serif}.poster{position:relative;width:1600px;height:1200px;overflow:hidden;background:#0b2048;color:#fff}.bg{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}.leftShade{position:absolute;left:0;top:0;bottom:0;width:46%;background:linear-gradient(90deg,rgba(15,23,42,.78),rgba(15,23,42,.1))}.brand{position:absolute;left:34px;top:34px}.brand .cn{font-size:66px;font-weight:800}.brand .en{font-size:22px;opacity:.9}.main{position:absolute;left:34px;top:310px;width:620px}.title{font-size:96px;font-weight:900;line-height:1.06}.sub{display:inline-block;background:rgba(255,255,255,.95);color:#1147b2;font-size:52px;font-weight:900;border-radius:999px;padding:14px 28px;margin-top:18px}.info{margin-top:28px;font-size:36px;font-weight:700;line-height:1.8}.pricebox{position:absolute;right:36px;bottom:36px;background:rgba(255,248,240,.97);color:#1147b2;border-radius:28px;padding:28px 34px;min-width:380px;text-align:center}.pricebox .label{font-size:32px;font-weight:700}.pricebox .price{font-size:92px;font-weight:900;line-height:1}
</style></head><body><div class="poster"><img id="bg" class="bg" src="{{BG_SRC}}" alt=""><div class="leftShade"></div><div class="brand"><div class="cn">侨联地产</div><div class="en">QIAO LIAN PROPERTY</div></div><div class="main"><div class="title"><span id="t1">{{PROJECT}}</span></div><div class="sub" data-field="t2" id="t2">{{LAYOUT}}</div><div class="info"><div data-field="t3">📍 <span id="t3">{{AREA}}</span></div><div data-fields="t4,t5"><span data-field="t4">📐 <span id="t4">{{SIZE}}</span></span><span data-field="t5"> ｜ 🏢 <span id="t5">{{FLOOR}}</span></span></div><div data-fields="t7,t8,t9">✨ <span data-field="t7" id="t7">{{H1}}</span><span data-field="t8"> / <span id="t8">{{H2}}</span></span><span data-field="t9"> / <span id="t9">{{H3}}</span></span></div></div></div><div class="pricebox"><div class="label" id="price_label">租金</div><div class="price" id="price_text">{{PRICE_LINE}}</div></div></div></body></html>
