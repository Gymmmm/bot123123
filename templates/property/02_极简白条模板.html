<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>侨联极简白条</title><style>
*{box-sizing:border-box}html,body{margin:0;background:#e8edf3;font-family:"Noto Sans CJK SC","Noto Sans SC",sans-serif}.poster{position:relative;width:1600px;height:1200px;overflow:hidden;background:#dce3eb;color:#0f172a}.bg{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}.top{position:absolute;left:36px;top:36px;padding:18px 25px;background:rgba(9,25,52,.62);color:#fff;border-left:8px solid #efc968}.top .cn{font-size:58px;font-weight:900;line-height:1}.top .en{margin-top:9px;font-size:20px;letter-spacing:1.5px}.bottom{position:absolute;left:0;right:0;bottom:0;padding:28px 40px 30px;background:rgba(255,255,255,.96);border-top:8px solid #1147b2}.primary{display:grid;grid-template-columns:minmax(0,1fr) auto;align-items:end;gap:30px}.title{min-width:0;font-size:66px;font-weight:900;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.layout-part{margin-left:18px;padding-left:18px;border-left:3px solid currentColor}.price{font-size:74px;font-weight:950;color:#1147b2;white-space:nowrap}.meta{display:flex;gap:20px;margin-top:10px;font-size:30px;font-weight:750;color:#334155;white-space:nowrap;overflow:hidden}.meta>span+span{padding-left:20px;border-left:2px solid #94a3b8}.tags{display:flex;gap:12px;margin-top:16px}.tag{max-width:280px;padding:9px 18px;background:#eaf1ff;color:#1147b2;border-radius:999px;font-size:23px;font-weight:850;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
</style></head><body><div class="poster"><img id="bg" class="bg" src="{{BG_SRC}}" alt=""><div class="top"><div class="cn">侨联地产</div><div class="en">QIAO LIAN PROPERTY</div></div><div class="bottom"><div class="primary"><div class="title"><span id="t1">{{PROJECT}}</span><span class="layout-part" data-field="t2"><span id="t2">{{LAYOUT}}</span></span></div><div class="price" id="t6">{{PRICE_LINE}}</div></div><div class="meta"><span data-field="t3" id="t3">{{AREA}}</span><span data-field="t4" id="t4">{{SIZE}}</span><span data-field="t5" id="t5">{{FLOOR}}</span></div><div class="tags"><span class="tag" data-field="t7" id="t7">{{H1}}</span><span class="tag" data-field="t8" id="t8">{{H2}}</span><span class="tag" data-field="t9" id="t9">{{H3}}</span></div></div></div></body></html>
