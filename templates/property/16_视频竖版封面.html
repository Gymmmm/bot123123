<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>侨联地产 · 视频竖版封面</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
html,body{
  background:#0b1220;
  font-family:"Noto Sans SC","Noto Sans CJK SC","PingFang SC","Microsoft YaHei",sans-serif;
}
@font-face{
  font-family:"Noto Sans SC";
  src:local("Noto Sans SC"),local("Noto Sans CJK SC");
  font-weight:400 900;
  font-display:block;
}

/* 9:16 竖版视频封面标准 */
.poster{
  position:relative;
  width:1080px;
  height:1920px;
  overflow:hidden;
  background:#0b2048;
  color:#fff;
}
.bg{
  position:absolute;inset:0;
  width:100%;height:100%;
  object-fit:cover;object-position:center;
}
.shade-top{
  position:absolute;inset:0;pointer-events:none;
  background:linear-gradient(180deg,rgba(10,20,38,.22) 0%,rgba(10,20,38,.4) 48%,rgba(10,20,38,.78) 100%);
}
.shade-bottom{
  position:absolute;left:0;right:0;bottom:0;height:54%;pointer-events:none;
  background:linear-gradient(180deg,transparent 0%,rgba(7,14,28,.85) 72%,rgba(7,14,28,.97) 100%);
}

.brand{
  position:absolute;left:34px;top:34px;z-index:3;
  display:flex;align-items:center;gap:14px;
  padding:12px 16px;border-radius:16px;
  background:rgba(20,56,146,.9);
  border:1px solid rgba(255,255,255,.18);
}
.brand-logo{
  height:100px;width:auto;max-width:320px;object-fit:contain;
  filter:drop-shadow(0 2px 10px rgba(0,0,0,.55));
}
.brand-logo[src=""],
.brand-logo:not([src]){display:none}
.brand:has(.brand-logo[src^="data:"]) .brand-text{display:none}
.brand-text .cn{font-size:30px;font-weight:900;letter-spacing:1px;line-height:1}
.brand-text .en{margin-top:4px;font-size:11px;letter-spacing:1.3px;opacity:.95}

.chips{
  position:absolute;top:132px;left:34px;display:flex;gap:10px;z-index:3;
}
.chip{
  border-radius:999px;padding:8px 14px;font-size:20px;font-weight:700;
  color:#e0f2fe;border:1px solid rgba(255,255,255,.22);
  background:rgba(15,23,42,.34);backdrop-filter:blur(5px);
}

.play-wrap{
  position:absolute;left:50%;top:43%;transform:translate(-50%,-50%);
  text-align:center;z-index:2;
}
.play-ring{
  width:190px;height:190px;border-radius:50%;
  border:3px solid rgba(255,255,255,.76);
  display:grid;place-items:center;
  background:rgba(15,23,42,.32);
  box-shadow:0 12px 32px rgba(0,0,0,.28);
}
.play{
  width:142px;height:142px;border-radius:50%;
  display:grid;place-items:center;
  background:rgba(255,255,255,.9);color:#1147b2;
  font-size:66px;font-weight:900;padding-left:10px;
}
.play-label{
  margin-top:14px;font-size:25px;font-weight:700;
  color:rgba(255,255,255,.94);letter-spacing:.8px;
}

.bottom{
  position:absolute;left:28px;right:28px;bottom:28px;z-index:3;
  border-radius:24px;
  border:1px solid rgba(255,255,255,.18);
  background:linear-gradient(140deg,rgba(17,71,178,.9),rgba(22,95,216,.76));
  backdrop-filter:blur(10px);
  padding:26px 28px 24px;
}
.eyebrow{
  display:inline-flex;align-items:center;gap:8px;
  font-size:22px;font-weight:700;opacity:.95;margin-bottom:10px;
}
.title{
  font-size:52px;line-height:1.12;font-weight:900;
  white-space:nowrap;overflow:hidden;
}
.meta{
  margin-top:10px;font-size:28px;font-weight:700;opacity:.95;
  white-space:nowrap;overflow:hidden;
}
.price{
  margin-top:14px;font-size:68px;line-height:1;font-weight:900;color:#f8cc59;
  text-shadow:0 6px 22px rgba(0,0,0,.28);white-space:nowrap;
}
.signature{
  margin-top:16px;padding-top:14px;
  border-top:1px solid rgba(255,255,255,.18);
  font-size:20px;opacity:.94;letter-spacing:.4px;
}
</style>
</head>
<body>
<div class="poster" id="poster" data-style="video_portrait">
  <img id="bg" class="bg" src="{{BG_SRC}}" alt="">
  <div class="shade-top"></div>
  <div class="shade-bottom"></div>

  <div class="brand">
    <img id="brandLogo" class="brand-logo" src="{{LOGO_SRC}}" alt="侨联地产">
    <div class="brand-text">
      <div class="cn">侨联地产</div>
      <div class="en">QIAO LIAN PROPERTY</div>
    </div>
  </div>

  <div class="chips">
    <span class="chip" id="layout" data-field="layout">{{LAYOUT}}</span>
    <span class="chip" id="area" data-field="area">{{AREA}}</span>
  </div>

  <div class="play-wrap">
    <div class="play-ring"><div class="play">▶</div></div>
    <div class="play-label">实拍视频看房</div>
  </div>

  <div class="bottom">
    <div class="eyebrow">🏠 热门房源</div>
    <div class="title" id="project" data-autofit="36">{{PROJECT}}</div>
    <div class="meta" data-fields="size,floor">
      <span data-field="size" id="size">{{SIZE}}</span>
      <span data-field="floor"> · <span id="floor">{{FLOOR}}</span></span>
    </div>
    <div class="price" id="price_line" data-autofit="48">{{PRICE_LINE}}</div>
    <div class="signature">💎 侨联地产｜您在金边的自己人</div>
  </div>
</div>
</body>
</html>
