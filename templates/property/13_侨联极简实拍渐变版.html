<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>侨联地产 · 极简实拍渐变版</title>

<style>
*{
  box-sizing:border-box;
  margin:0;
  padding:0;
}

html,
body{
  background:#111;
  font-family:
    "Noto Sans SC",
    "Noto Sans CJK SC",
    "PingFang SC",
    "Microsoft YaHei",
    sans-serif;
}

@font-face {
  font-family: "Noto Sans SC";
  src: local("Noto Sans SC"), local("Noto Sans CJK SC");
  font-weight: 400 900;
  font-display: block;
}

/* =========================================================
   PRODUCTION POSTER
   4:3，适合手机频道里查看室内空间
   html_cover_renderer.py 会直接截图 .poster
   ========================================================= */

.poster{
  position:relative;
  width:1600px;
  height:1200px;
  overflow:hidden;
  background:#111;
}

/* 房源原图 */
.bg{
  position:absolute;
  inset:0;
  width:100%;
  height:100%;
  object-fit:cover;
  object-position:center;
}

/* 全图轻微压暗，避免极亮图片把品牌吃掉 */
.photo-tone{
  position:absolute;
  inset:0;
  background:
    linear-gradient(
      90deg,
      rgba(0,0,0,.15) 0%,
      rgba(0,0,0,.03) 35%,
      rgba(0,0,0,0) 65%
    );
  pointer-events:none;
}

/* =========================================================
   顶部品牌区
   ========================================================= */

.brand{
  position:absolute;
  left:42px;
  top:38px;

  display:flex;
  align-items:stretch;
  gap:20px;

  color:#f4ddb0;
  text-shadow:0 2px 14px rgba(0,0,0,.68);
}

.brand-logo{
  height:92px;
  width:auto;
  max-width:280px;
  object-fit:contain;
  filter: drop-shadow(0 2px 10px rgba(0,0,0,.55));
}

.brand-logo[src=""],
.brand-logo:not([src]){
  display:none;
}

/* 有完整品牌图时只展示一次品牌名 */
.brand:has(.brand-logo[src^="data:"]) .brand-line,
.brand:has(.brand-logo[src^="data:"]) .brand-text{
  display:none;
}

.brand-line{
  width:4px;
  min-height:92px;
  border-radius:99px;

  background:linear-gradient(
    180deg,
    #f1d89a,
    #c69a43
  );

  box-shadow:0 0 14px rgba(205,164,78,.18);
}

.brand-text{
  display:flex;
  flex-direction:column;
  justify-content:center;
}

.brand-cn{
  font-size:50px;
  line-height:1;
  font-weight:900;
  letter-spacing:5px;
}

.brand-en{
  margin-top:12px;

  font-size:19px;
  line-height:1;
  font-weight:600;
  letter-spacing:2px;

  color:rgba(244,221,176,.92);
}

/* =========================================================
   底部自然渐变
   不做实体黑卡
   ========================================================= */

.bottom-gradient{
  position:absolute;
  left:0;
  right:0;
  bottom:0;
  height:40%;

  background:linear-gradient(
    to bottom,
    rgba(0,0,0,0) 0%,
    rgba(0,0,0,.04) 12%,
    rgba(0,0,0,.16) 30%,
    rgba(0,0,0,.42) 55%,
    rgba(0,0,0,.73) 78%,
    rgba(0,0,0,.90) 100%
  );

  pointer-events:none;
}

/* =========================================================
   房源信息
   ========================================================= */

.content{
  position:absolute;
  left:54px;
  bottom:56px;

  width:calc(100% - 108px);

  display:flex;
  flex-direction:column;
  align-items:flex-start;

  text-align:left;
}

/* 区域 · 项目 · 户型 */
.title{
  max-width:100%;

  font-size:54px;
  line-height:1.2;
  font-weight:800;
  letter-spacing:.3px;

  color:#f3e1bd;

  text-shadow:
    0 3px 10px rgba(0,0,0,.75),
    0 1px 2px rgba(0,0,0,.9);

  white-space:nowrap;
  overflow:hidden;
  text-overflow:ellipsis;
}

/* 价格 */
.price{
  margin-top:12px;

  font-size:96px;
  line-height:.96;
  font-weight:900;
  letter-spacing:1px;

  color:#fff;

  text-shadow:
    0 4px 16px rgba(0,0,0,.68),
    0 2px 4px rgba(0,0,0,.8);

  white-space:nowrap;
}

/* 详情行 */
.meta{
  margin-top:18px;

  display:flex;
  justify-content:flex-start;
  align-items:center;
  flex-wrap:wrap;
  gap:0;

  font-size:28px;
  line-height:1.3;
  font-weight:600;

  color:rgba(255,255,255,.83);

  text-shadow:0 2px 6px rgba(0,0,0,.8);
}

.meta-item{
  display:flex;
  align-items:center;
  white-space:nowrap;
}

.meta-item + .meta-item::before{
  content:"·";
  margin:0 13px;
  color:rgba(238,211,158,.8);
}

/* =========================================================
   可选亮点
   极简版最多留 3 个
   ========================================================= */

.highlights{
  margin-top:15px;

  display:flex;
  justify-content:flex-start;
  flex-wrap:wrap;
  gap:9px;
}

.highlight{
  padding:7px 14px;

  border:1px solid rgba(238,211,158,.28);
  border-radius:999px;

  background:rgba(0,0,0,.20);

  font-size:21px;
  line-height:1;
  font-weight:600;

  color:rgba(255,255,255,.83);

  backdrop-filter:blur(4px);
}

/* 没值时由 renderer 的 data-field 自动隐藏 */
[data-field][style*="display: none"]{
  display:none !important;
}
</style>
</head>

<body>

<div class="poster">

  <!-- renderer 会强制替换这个 src -->
  <img
    id="bg"
    class="bg"
    src="{{BG_SRC}}"
    alt=""
  >

  <div class="photo-tone"></div>

  <!-- 品牌：优先 PNG logo，缺失时保留金标文字 -->
  <div class="brand">
    <img id="brandLogo" class="brand-logo" src="{{LOGO_SRC}}" alt="侨联地产">
    <div class="brand-line"></div>

    <div class="brand-text">
      <div class="brand-cn">侨联地产</div>
      <div class="brand-en">QIAO LIAN</div>
    </div>
  </div>

  <div class="bottom-gradient"></div>

  <!-- 房源信息 -->
  <div class="content">

    <div class="title" id="coverTitle" data-autofit="36">
      <span id="t3" data-field="t3">{{AREA}}</span>
      <span id="areaSep"> · </span>
      <span id="t1">{{PROJECT}}</span>
      <span id="projectSep"> · </span>
      <span id="t2">{{LAYOUT}}</span>
    </div>

    <div class="price" id="t6" data-autofit="72">
      {{PRICE_LINE}}
    </div>

    <div class="meta">

      <div
        class="meta-item"
        data-field="t4"
      >
        <span id="t4">{{SIZE}}</span>
      </div>

      <div
        class="meta-item"
        data-field="t5"
      >
        <span id="t5">{{FLOOR}}</span>
      </div>

    </div>

    <div class="highlights" data-fields="t7,t8,t9">

      <div class="highlight" data-field="t7">
        <span id="t7">{{H1}}</span>
      </div>

      <div class="highlight" data-field="t8">
        <span id="t8">{{H2}}</span>
      </div>

      <div class="highlight" data-field="t9">
        <span id="t9">{{H3}}</span>
      </div>

    </div>

  </div>

</div>


<script>
(() => {

  const title = document.getElementById("coverTitle");
  const price = document.getElementById("t6");

  const area = document.getElementById("t3");
  const project = document.getElementById("t1");
  const layout = document.getElementById("t2");

  const areaSep = document.getElementById("areaSep");
  const projectSep = document.getElementById("projectSep");


  function cleanText(v){
    return String(v || "")
      .replace(/\s+/g, " ")
      .trim();
  }


  function isEmpty(el){
    if(!el) return true;

    const text = cleanText(el.textContent);

    return (
      !text ||
      /^(待确认|未知|未提供|暂无|—|-|N\/A|None|null)$/i.test(text)
    );
  }


  function cleanSeparators(){

    /*
      AREA 为空：
      PROJECT · LAYOUT

      PROJECT 为空：
      AREA · LAYOUT

      LAYOUT 为空：
      AREA · PROJECT
    */

    const hasArea = !isEmpty(area) && cleanText(area.textContent) !== cleanText(project.textContent);
    const hasProject = !isEmpty(project);
    const hasLayout = !isEmpty(layout);

    area.style.display = hasArea ? "" : "none";

    areaSep.style.display =
      hasArea && (hasProject || hasLayout)
        ? ""
        : "none";

    projectSep.style.display =
      hasProject && hasLayout
        ? ""
        : "none";
  }


  function fitTitle(){

    /*
      先按正常 54px；
      太长再逐步缩小。
    */

    let size = 54;

    title.style.fontSize = size + "px";

    while(
      title.scrollWidth > title.clientWidth &&
      size > 36
    ){
      size -= 1;
      title.style.fontSize = size + "px";
    }
  }


  function fitPrice(){

    /*
      防止类似：
      $12,500/月
      这种极端价格超宽
    */

    let size = 96;

    price.style.fontSize = size + "px";

    while(
      price.scrollWidth > 1400 &&
      size > 72
    ){
      size -= 2;
      price.style.fontSize = size + "px";
    }
  }


  function refresh(){
    cleanSeparators();
    fitTitle();
    fitPrice();
  }


  /*
    html_cover_renderer 会在页面打开后再注入字段。
    MutationObserver 用来确保注入完成后重新排版。
  */

  const observer = new MutationObserver(() => {
    requestAnimationFrame(refresh);
  });

  observer.observe(
    document.querySelector(".poster"),
    {
      subtree:true,
      childList:true,
      characterData:true
    }
  );


  refresh();

})();
</script>

</body>
</html>
