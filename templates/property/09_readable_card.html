<body>
  <div class="poster">
    <div class="hero">
      <img id="bg" src="" alt="">
    </div>

    <div class="top">
      <div class="brand">
        侨联地产 <i>REAL HOME · REAL SERVICE</i>
      </div>

      <div class="qc" id="t1">
        {{REF}}
      </div>
    </div>

    <div class="stamp">
      侨联实拍 · 中文顾问
    </div>

    <div class="info">
      <div class="area">
        侨联精选 · <span id="t3">{{PROPERTY_TYPE}}</span>
      </div>

      <div class="row">
        <div>
          <div class="title" id="t4">
            {{AREA}}
          </div>

          <div class="type" id="t5">
            {{LAYOUT}}
          </div>
        </div>

        <div class="price" id="price_text">
          {{PRICE_LINE}}
        </div>
      </div>

      <div class="facts">
        <div class="fact" data-field="size">
          <span class="label">面积</span><span id="t6">{{SIZE}}</span>
        </div>

        <div class="fact" data-field="floor">
          <span class="label">楼层</span><span id="t7">{{FLOOR}}</span>
        </div>

        <div class="fact" data-field="t8">
          <span class="label">亮点</span><span id="t8">{{H1}}</span>
        </div>
      </div>
    </div>

    <div class="footer">
      可预约实地或视频看房　·　侨联地产
    </div>
  </div>
