name: candidate-a-full-runtime

on:
  push:
    branches: [master]
    paths: [.github/workflows/candidate-a-full-runtime.yml]

permissions:
  contents: read

concurrency:
  group: qiaolian-candidate-runtime
  cancel-in-progress: false

env:
  PROD_HOST: 50.114.74.120
  PROD_PORT: '22'
  PROD_SSH_USER: root
  PROD_SSH_KNOWN_HOSTS: '50.114.74.120 ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAILuFtkSn5SJKY7mZ52Lc/QydPRTvHFpsj87M/HcIkb/L'
  PROD_SSH_HOST_FINGERPRINT: 'SHA256:sgqLYOUAZ482H3y5jREQ6q2BVvNFPXYiOg4ruyFVnsA'
  CANDIDATE_SHA: e41a86bdce839c35bedbc55ef6b054e37ae684d7

jobs:
  run-a:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Verify SSH host key
        run: |
          set -Eeuo pipefail
          ssh-keyscan -T 10 -p "$PROD_PORT" -t ed25519 "$PROD_HOST" 2>/dev/null | grep -v '^#' > "$RUNNER_TEMP/known_hosts_observed"
          ssh-keygen -lf "$RUNNER_TEMP/known_hosts_observed" | grep -F "$PROD_SSH_HOST_FINGERPRINT"

      - name: Configure SSH
        env:
          PROD_SSH_PRIVATE_KEY: '${{ secrets.PROD_SSH_PRIVATE_KEY }}'
        run: |
          set -Eeuo pipefail
          test -n "$PROD_SSH_PRIVATE_KEY"
          install -d -m 700 "$HOME/.ssh"
          printf '%s\n' "$PROD_SSH_PRIVATE_KEY" > "$HOME/.ssh/qiaolian_candidate"
          printf '%s\n' "$PROD_SSH_KNOWN_HOSTS" > "$HOME/.ssh/known_hosts"
          chmod 600 "$HOME/.ssh/qiaolian_candidate" "$HOME/.ssh/known_hosts"

      - name: Prepare and run Candidate A full runtime
        run: |
          set -Eeuo pipefail
          ssh -p "$PROD_PORT" -i "$HOME/.ssh/qiaolian_candidate" -o BatchMode=yes -o IdentitiesOnly=yes -o ConnectTimeout=20 "$PROD_SSH_USER@$PROD_HOST" "bash -s -- '$CANDIDATE_SHA'" <<'REMOTE'
          set -Eeuo pipefail
          SHA=$1
          PROD=/opt/qiaolian_dual_bots
          ROOT=/opt/qiaolian_candidate_test
          APP=$ROOT/A
          DB=$APP/data/candidate_A.db

          echo '=== STOP OLD THREE SERVICES ==='
          systemctl stop qiaolian-user-bot.service qiaolian-publisher-bot.service qiaolian-collector.service || true
          systemctl is-active qiaolian-user-bot.service || true
          systemctl is-active qiaolian-publisher-bot.service || true
          systemctl is-active qiaolian-collector.service || true

          echo '=== PREPARE EXACT A ==='
          rm -rf "$APP"
          install -d -m 0755 "$ROOT"
          git clone -q https://github.com/Gymmmm/bot123123.git "$APP"
          git -C "$APP" checkout -q --detach "$SHA"
          ACTUAL=$(git -C "$APP" rev-parse HEAD)
          echo "EXPECTED_SHA=$SHA"
          echo "ACTUAL_SHA=$ACTUAL"
          test "$ACTUAL" = "$SHA"

          echo '=== COPY RUNTIME CONFIG ==='
          test -f "$PROD/.env"
          cp -a "$PROD/.env" "$APP/.env"
          test -f "$PROD/sources.json" && cp -a "$PROD/sources.json" "$APP/sources.json" || true
          install -d -m 0755 "$APP/data" "$APP/media/collector_downloads" "$APP/telethon_sessions"

          command -v sqlite3 >/dev/null || (apt-get update -qq && DEBIAN_FRONTEND=noninteractive apt-get install -y -qq sqlite3)
          if test -f "$PROD/data/qiaolian_dual_bot.db"; then
            sqlite3 "$PROD/data/qiaolian_dual_bot.db" ".backup '$DB'"
          else
            touch "$DB"
          fi

          SESSION_SRC=$(find "$PROD" -maxdepth 5 -type f -name '*.session' | head -n 1 || true)
          if test -n "$SESSION_SRC"; then
            SESSION_NAME=$(basename "$SESSION_SRC")
            cp -a "$SESSION_SRC" "$APP/telethon_sessions/$SESSION_NAME"
            SESSION_BASE="$APP/telethon_sessions/${SESSION_NAME%.session}"
          else
            SESSION_BASE="$APP/telethon_sessions/qiaolian_collector"
          fi

          echo '=== VENV / DEPENDENCIES ==='
          python3 -m venv "$APP/.venv"
          "$APP/.venv/bin/pip" -q install --upgrade pip
          "$APP/.venv/bin/pip" -q install -r "$APP/qiaolian_production/requirements.txt"
          "$APP/.venv/bin/python" -m compileall -q "$APP/qiaolian_production"

          export QIAOLIAN_RUNTIME_ROOT="$APP"
          export DATA_DIR="$APP/data"
          export DB_PATH="$DB"
          export SQLITE_PATH="$DB"
          export COLLECTOR_SOURCES_JSON="$APP/sources.json"
          export COLLECTOR_DOWNLOAD_DIR="$APP/media/collector_downloads"
          export MEDIA_ROOT="$APP/media"
          export TELETHON_SESSION_PATH="$SESSION_BASE"
          export PYTHONPATH="$APP"

          echo '=== IMPORT CHECK ==='
          "$APP/.venv/bin/python" -c "import qiaolian_production.run_collector; print('COLLECTOR_IMPORT_OK')"
          "$APP/.venv/bin/python" -c "import qiaolian_production.run_publisher; print('PUBLISHER_IMPORT_OK')"
          "$APP/.venv/bin/python" -c "import qiaolian_production.run_user; print('USER_IMPORT_OK')"

          rm -f /tmp/qiaolian_publisher_bot_v2.lock /tmp/qiaolian_user_bot*.lock 2>/dev/null || true

          echo '=== START ALL THREE ==='
          nohup "$APP/.venv/bin/python" "$APP/qiaolian_production/run_collector.py" > "$APP/collector.log" 2>&1 & echo $! > "$APP/collector.pid"
          sleep 2
          nohup "$APP/.venv/bin/python" "$APP/qiaolian_production/run_publisher.py" > "$APP/publisher.log" 2>&1 & echo $! > "$APP/publisher.pid"
          sleep 2
          nohup "$APP/.venv/bin/python" "$APP/qiaolian_production/run_user.py" > "$APP/user.log" 2>&1 & echo $! > "$APP/user.pid"

          sleep 15
          echo '=== PROCESS STATUS AFTER 15s ==='
          for n in collector publisher user; do
            pid=$(cat "$APP/$n.pid")
            if kill -0 "$pid" 2>/dev/null; then echo "$n: RUNNING pid=$pid"; else echo "$n: EXITED pid=$pid"; fi
          done

          echo '=== LOGS ==='
          for n in collector publisher user; do
            echo "--- $n ---"
            sed -E 's/[0-9]{5,}:[A-Za-z0-9_-]{20,}/[REDACTED_TOKEN]/g' "$APP/$n.log" | tail -n 120 || true
          done

          echo '=== DB COUNTS ==='
          for t in source_posts drafts listings appointments publication_packages; do
            sqlite3 "$DB" "SELECT '$t',count(*) FROM $t;" 2>/dev/null || true
          done

          echo '=== KEEP A RUNNING FOR MANUAL TELEGRAM TEST ==='
          echo "APP=$APP"
          echo "SHA=$ACTUAL"
          REMOTE

      - name: Remove temporary SSH key
        if: always()
        run: rm -f "$HOME/.ssh/qiaolian_candidate"
