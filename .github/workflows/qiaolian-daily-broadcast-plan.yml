name: qiaolian-daily-broadcast-plan

on:
  push:
    branches:
      - codex/qiaolian-ui-cleanup-20260829
    paths:
      - .github/workflows/qiaolian-daily-broadcast-plan.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/qiaolian-ui-cleanup-20260829
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Fix patch escaping
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('scripts/patch_daily_broadcast.py')
          s = p.read_text(encoding='utf-8')
          s = s.replace("    templates + '\\n\\n_WEATHER_LABELS = {',\n    text,", "    lambda _m: templates + '\\n\\n_WEATHER_LABELS = {',\n    text,")
          s = s.replace("    helpers + '\\n\\nasync def cmd_daily(',\n    text,", "    lambda _m: helpers + '\\n\\nasync def cmd_daily(',\n    text,")
          p.write_text(s, encoding='utf-8')
          PY
      - name: Apply plan
        run: python scripts/patch_daily_broadcast.py
      - name: Install test dependencies
        run: python -m pip install -r requirements.txt pytest
      - name: Syntax check
        run: python -m compileall -q autopilot_publish_bot.py v2/qiaolian_publisher_v2 tests/test_daily_broadcast_rotation.py
      - name: Focused tests
        env:
          PYTHONPATH: '${{ github.workspace }}'
          USER_BOT_TOKEN: '123456:TESTTOKEN'
          PUBLISHER_BOT_TOKEN: '123456:TESTTOKEN'
          DB_PATH: '${{ runner.temp }}/qiaolian-daily.db'
        run: python -m pytest -q tests/test_daily_broadcast_rotation.py tests/test_user_ui_cleanup.py tests/test_customer_path_regression.py
      - name: Commit plan
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add autopilot_publish_bot.py v2/qiaolian_publisher_v2/keyboards.py v2/qiaolian_publisher_v2/bot.py tests/test_daily_broadcast_rotation.py
          git diff --cached --quiet && exit 0
          git commit -m 'add calm seven-day channel broadcast rotation'
          git push origin HEAD:codex/qiaolian-ui-cleanup-20260829
