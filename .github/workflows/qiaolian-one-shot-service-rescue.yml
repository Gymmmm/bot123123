name: qiaolian-one-shot-service-rescue

on:
  push:
    branches:
      - codex/qiaolian-ui-cleanup-20260829
    paths:
      - .github/workflows/qiaolian-one-shot-service-rescue.yml

permissions:
  contents: write

jobs:
  rescue:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/qiaolian-ui-cleanup-20260829
          fetch-depth: 2
      - name: Remove rescue workflow from branch
        run: |
          set -Eeuo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/qiaolian-one-shot-service-rescue.yml
          git commit -m "chore: remove one-shot service rescue"
          git push origin HEAD:refs/heads/codex/qiaolian-ui-cleanup-20260829
      - name: Verify host and start production services
        env:
          PROD_SSH_PRIVATE_KEY: ${{ secrets.PROD_SSH_PRIVATE_KEY }}
          PROD_HOST: 50.114.74.120
          PROD_PORT: '22'
          PROD_SSH_USER: root
          PROD_SSH_KNOWN_HOSTS: '50.114.74.120 ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAILuFtkSn5SJKY7mZ52Lc/QydPRTvHFpsj87M/HcIkb/L'
        run: |
          set -Eeuo pipefail
          install -d -m 700 "$HOME/.ssh"
          printf '%s\n' "$PROD_SSH_PRIVATE_KEY" > "$HOME/.ssh/qiaolian_production"
          printf '%s\n' "$PROD_SSH_KNOWN_HOSTS" > "$HOME/.ssh/known_hosts"
          chmod 600 "$HOME/.ssh/qiaolian_production" "$HOME/.ssh/known_hosts"
          ssh -p "$PROD_PORT" -i "$HOME/.ssh/qiaolian_production" -o BatchMode=yes -o IdentitiesOnly=yes -o ConnectTimeout=20 "$PROD_SSH_USER@$PROD_HOST" 'systemctl start qiaolian-user-bot.service qiaolian-publisher-bot.service qiaolian-collector.service; systemctl is-active qiaolian-user-bot.service; systemctl is-active qiaolian-publisher-bot.service; systemctl is-active qiaolian-collector.service'
