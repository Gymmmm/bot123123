name: run-listing-display-v3-once

on:
  push:
    branches:
      - codex/qiaolian-ui-cleanup-20260829
    paths:
      - .github/workflows/run-listing-display-v3-once.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/qiaolian-ui-cleanup-20260829
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install test dependencies
        run: python -m pip install -q pytest
      - name: Apply V3
        run: |
          echo RETRY_LISTING_DISPLAY_V3_WITH_TEST_DEPS
          python tools/apply_listing_display_v3.py
          python -m compileall -q qiaolian_dual meihua_publisher.py tests
          python -m pytest -q tests/test_talk_engine_factual_copy.py tests/test_channel_three_entry_contract.py
          git diff --check
      - name: Commit V3
        run: |
          git config user.name qiaolian-actions
          git config user.email actions@users.noreply.github.com
          git add qiaolian_dual/listing.py qiaolian_dual/talk_engine.py meihua_publisher.py tests/test_talk_engine_factual_copy.py
          if git diff --cached --quiet; then
            echo NO_CHANGES
            exit 0
          fi
          git commit -m 'Optimize compact listing posts and detail copy'
          git push origin HEAD:codex/qiaolian-ui-cleanup-20260829
