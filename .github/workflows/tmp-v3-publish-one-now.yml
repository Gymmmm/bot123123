name: tmp-v3-publish-one-now
on:
  push:
    branches: [master]
    paths:
      - '.github/workflows/tmp-v3-publish-one-now.yml'
permissions:
  contents: read
jobs:
  publish-one:
    runs-on: ubuntu-latest
    env:
      PROD_HOST: 50.114.74.120
      PROD_PORT: '22'
      PROD_SSH_USER: root
      EXPECTED_PROD_SHA: b718d6b5b227d5fd0b2c59c3d3c069344335f540
    steps:
      - uses: actions/checkout@v4
      - name: Verify production host fingerprint
        shell: bash
        run: |
          set -Eeuo pipefail
          expected=$(tr -d '\r\n' < deploy/v3/production_host_fingerprint.txt)
          ssh-keyscan -T 15 -p "$PROD_PORT" -t ed25519 "$PROD_HOST" 2>/dev/null | grep -v '^#' > "$RUNNER_TEMP/known_hosts"
          ssh-keygen -lf "$RUNNER_TEMP/known_hosts" | grep -F "$expected"
      - name: Configure production SSH
        shell: bash
        env:
          PROD_SSH_PRIVATE_KEY: ${{ secrets.PROD_SSH_PRIVATE_KEY }}
        run: |
          set -Eeuo pipefail
          install -d -m 700 "$HOME/.ssh"
          printf '%s\n' "$PROD_SSH_PRIVATE_KEY" > "$HOME/.ssh/qiaolian_production"
          cp "$RUNNER_TEMP/known_hosts" "$HOME/.ssh/known_hosts"
          chmod 600 "$HOME/.ssh/qiaolian_production" "$HOME/.ssh/known_hosts"
      - name: Publish exactly one valid V3 rental
        shell: bash
        run: |
          set -Eeuo pipefail
          ssh -p "$PROD_PORT" -i "$HOME/.ssh/qiaolian_production" -o BatchMode=yes -o IdentitiesOnly=yes "$PROD_SSH_USER@$PROD_HOST" "EXPECTED_PROD_SHA='$EXPECTED_PROD_SHA' bash -s" <<'REMOTE'
          set -Eeuo pipefail
          ROOT=/opt/qiaolian_v3
          test "$(cat "$ROOT/.deployed_sha")" = "$EXPECTED_PROD_SHA"
          cd "$ROOT/current"
          set -a
          source "$ROOT/runtime.env"
          set +a
          BACKUP_DIR="/opt/qiaolian_backups/manual-normal-publish-$(date -u +%Y%m%d-%H%M%S)"
          install -d -m 0700 "$BACKUP_DIR"
          sqlite3 "$DB_PATH" ".backup '$BACKUP_DIR/qiaolian_dual_bot.db'"
          sqlite3 "$BACKUP_DIR/qiaolian_dual_bot.db" 'PRAGMA quick_check;' | grep -Fx ok
          echo "PUBLISH_BACKUP_OK path=$BACKUP_DIR"
          "$ROOT/.venv/bin/python" - <<'PY'
          import asyncio, json, os, sqlite3
          from telegram import Bot
          from v3_core.inventory.canonical_facts import canonicalize_source
          from v3_core.inventory.service import InventoryMaterializationService
          from v3_core.publishing.admin_bot import load_settings
          from v3_core.publishing.publisher_app import V3PublisherApplication
          from v3_core.storage.inventory_repository import InventoryRepository

          async def main():
              settings = load_settings()
              inventory = InventoryRepository(settings.db_path)
              conn = sqlite3.connect(settings.db_path)
              conn.row_factory = sqlite3.Row
              target = conn.execute('''
                  SELECT l.listing_id,l.public_listing_id,l.canonical_record_id,
                         o.offer_id,o.monthly_rent_usd,c.source_post_id,c.facts_json,s.raw_text
                  FROM listings_v3 l
                  JOIN listing_offers o ON o.listing_id=l.listing_id AND o.offer_type='rent' AND o.offer_status='active'
                  JOIN canonical_records c ON c.canonical_record_id=l.canonical_record_id
                  JOIN source_posts s ON CAST(s.id AS TEXT)=CAST(c.source_post_id AS TEXT)
                  WHERE l.public_listing_id='QL-PP-W2H7'
                  LIMIT 1
              ''').fetchone()
              if target is None:
                  raise SystemExit('TARGET_NOT_FOUND')
              if int(target['monthly_rent_usd'] or 0) != 420 or '桥牌' not in str(target['raw_text'] or ''):
                  raise SystemExit('TARGET_EVIDENCE_MISMATCH')
              already = conn.execute('''
                  SELECT channel_message_id FROM publication_instances
                  WHERE offer_id=? AND platform='telegram' AND channel_chat_id=?
              ''', (target['offer_id'], settings.channel_chat_id)).fetchone()
              conn.close()
              if already is not None:
                  raise SystemExit(f"TARGET_ALREADY_PUBLISHED message_id={already['channel_message_id']}")

              old_facts = json.loads(str(target['facts_json']))
              overrides = {
                  'project_name': 'The Bridge',
                  'project_alias': '桥牌',
                  'canonical_area_key': '百色河',
                  'canonical_area_display': '百色河',
              }
              facts = canonicalize_source(
                  str(target['raw_text'] or ''),
                  source_identity=dict(old_facts.get('source_identity') or {}),
                  media_summary=dict(old_facts.get('media_summary') or {}),
                  manual_overrides=overrides,
              )
              if facts.get('project_name') != 'The Bridge' or facts.get('public_location_display') != '百色河':
                  raise SystemExit('TARGET_OVERRIDE_PROJECTION_FAILED')
              if (facts.get('quality') or {}).get('blocking_flags'):
                  raise SystemExit(f"TARGET_STILL_BLOCKED {facts['quality']['blocking_flags']}")
              canonical = inventory.store_canonical(
                  source_post_id=target['source_post_id'],
                  facts=facts,
                  supersedes_id=str(target['canonical_record_id']),
              )
              materialized = InventoryMaterializationService(inventory).materialize(
                  canonical_record_id=str(canonical['canonical_record_id']),
                  listing_id=str(target['listing_id']),
                  public_listing_id=str(target['public_listing_id']),
                  create_review=True,
              )
              for field_name, new_value in overrides.items():
                  inventory.add_override(
                      canonical_record_id=str(canonical['canonical_record_id']),
                      field_name=field_name,
                      old_value=old_facts.get(field_name),
                      new_value=new_value,
                      reason='verified_source_bridge_tonle_bassac',
                      operator_id='codex:normal_publish',
                  )
              offer_id = materialized.offer_ids[0]
              print('CANONICAL_OVERRIDE_OK', target['public_listing_id'], canonical['canonical_record_id'], offer_id)

              app = V3PublisherApplication(settings)
              app.autopilot.repository.sync_candidates()
              bot = Bot(token=settings.token)
              await bot.initialize()
              try:
                  print('PUBLISH_ONE_TRY', offer_id, target['listing_id'], target['public_listing_id'])
                  result = await app.autopilot.process_one(
                      bot=bot,
                      force_offer_id=offer_id,
                      origin='manual_oneoff',
                  )
                  print('PUBLISH_ONE_RESULT', result)
                  status = str(getattr(result, 'status', '') or '')
                  if status != 'published':
                      raise SystemExit('PUBLISH_ONE_SELECTED_CANDIDATE_NOT_PUBLISHED')
                  print('PUBLISH_ONE_DONE', getattr(result,'listing_id',''), getattr(result,'offer_id',''), getattr(result,'channel_message_id',''))
              finally:
                  await bot.shutdown()

          asyncio.run(main())
          PY
          REMOTE
