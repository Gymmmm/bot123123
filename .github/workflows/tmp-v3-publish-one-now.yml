name: tmp-v3-publish-one-now
on:
  push:
    branches: [master]
    paths:
      - '.github/workflows/tmp-v3-publish-one-now.yml'
permissions:
  contents: read
jobs:
  publish-one:
    runs-on: ubuntu-latest
    env:
      PROD_HOST: 50.114.74.120
      PROD_PORT: '22'
      PROD_SSH_USER: root
      EXPECTED_PROD_SHA: b718d6b5b227d5fd0b2c59c3d3c069344335f540
    steps:
      - uses: actions/checkout@v4
      - name: Verify production host fingerprint
        shell: bash
        run: |
          set -Eeuo pipefail
          expected=$(tr -d '\r\n' < deploy/v3/production_host_fingerprint.txt)
          ssh-keyscan -T 15 -p "$PROD_PORT" -t ed25519 "$PROD_HOST" 2>/dev/null | grep -v '^#' > "$RUNNER_TEMP/known_hosts"
          ssh-keygen -lf "$RUNNER_TEMP/known_hosts" | grep -F "$expected"
      - name: Configure production SSH
        shell: bash
        env:
          PROD_SSH_PRIVATE_KEY: ${{ secrets.PROD_SSH_PRIVATE_KEY }}
        run: |
          set -Eeuo pipefail
          install -d -m 700 "$HOME/.ssh"
          printf '%s\n' "$PROD_SSH_PRIVATE_KEY" > "$HOME/.ssh/qiaolian_production"
          cp "$RUNNER_TEMP/known_hosts" "$HOME/.ssh/known_hosts"
          chmod 600 "$HOME/.ssh/qiaolian_production" "$HOME/.ssh/known_hosts"
      - name: Publish exactly one valid V3 rental
        shell: bash
        run: |
          set -Eeuo pipefail
          ssh -p "$PROD_PORT" -i "$HOME/.ssh/qiaolian_production" -o BatchMode=yes -o IdentitiesOnly=yes "$PROD_SSH_USER@$PROD_HOST" "EXPECTED_PROD_SHA='$EXPECTED_PROD_SHA' bash -s" <<'REMOTE'
          set -Eeuo pipefail
          ROOT=/opt/qiaolian_v3
          test "$(cat "$ROOT/.deployed_sha")" = "$EXPECTED_PROD_SHA"
          cd "$ROOT/current"
          set -a
          source "$ROOT/runtime.env"
          set +a
          "$ROOT/.venv/bin/python" - <<'PY'
          import asyncio, os, sqlite3
          from telegram import Bot
          from v3_core.publishing.admin_bot import load_settings
          from v3_core.publishing.publisher_app import V3PublisherApplication

          async def main():
              settings = load_settings()
              app = V3PublisherApplication(settings)
              app.autopilot.repository.sync_candidates()
              conn = sqlite3.connect(settings.db_path)
              conn.row_factory = sqlite3.Row
              rows = conn.execute('''
                  SELECT a.offer_id,a.listing_id,a.state,l.public_listing_id
                  FROM publisher_auto_items_v3 a
                  JOIN listing_offers o ON o.offer_id=a.offer_id
                  JOIN listings_v3 l ON l.listing_id=a.listing_id
                  LEFT JOIN publication_instances p
                    ON p.offer_id=a.offer_id AND p.platform='telegram' AND p.channel_chat_id=?
                  WHERE o.offer_type='rent'
                    AND o.offer_status='active'
                    AND COALESCE(o.publication_policy,'')='telegram_rent'
                    AND p.instance_id IS NULL
                  ORDER BY CASE a.state WHEN 'queued' THEN 0 ELSE 1 END,
                           a.updated_at DESC,a.offer_id ASC
                  LIMIT 1
              ''',(settings.channel_chat_id,)).fetchall()
              conn.close()
              print('PUBLISH_ONE_CANDIDATES', len(rows))
              if not rows:
                  raise SystemExit('PUBLISH_ONE_NO_CANDIDATE')

              row = rows[0]
              bot = Bot(token=settings.token)
              await bot.initialize()
              try:
                  offer_id = str(row['offer_id'])
                  print('PUBLISH_ONE_TRY', offer_id, row['listing_id'], row['public_listing_id'], row['state'])
                  result = await app.autopilot.process_one(
                      bot=bot,
                      force_offer_id=offer_id,
                      origin='manual_oneoff',
                  )
                  print('PUBLISH_ONE_RESULT', result)
                  status = str(getattr(result, 'status', '') or '')
                  if status != 'published':
                      raise SystemExit('PUBLISH_ONE_SELECTED_CANDIDATE_NOT_PUBLISHED')
                  print('PUBLISH_ONE_DONE', getattr(result,'listing_id',''), getattr(result,'offer_id',''), getattr(result,'channel_message_id',''))
              finally:
                  await bot.shutdown()

          asyncio.run(main())
          PY
          REMOTE
