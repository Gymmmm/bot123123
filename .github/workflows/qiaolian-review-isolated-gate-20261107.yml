name: qiaolian-review-isolated-gate
on:
  push:
    branches:
      - feature/prod-final-gate-20261107
jobs:
  isolated-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      DB_PATH: /tmp/qiaolian-pr114-test.db
      USER_BOT_TOKEN: TEST_OFFLINE
      PUBLISHER_BOT_TOKEN: TEST_OFFLINE
      PYTHONPATH: .
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y tesseract-ocr tesseract-ocr-eng tesseract-ocr-chi-sim
          python -m pip install -r requirements.txt pytest pytest-asyncio pytest-socket
      - name: OCR executable and languages
        run: |
          command -v tesseract
          tesseract --version
          tesseract --list-langs
          tesseract --list-langs 2>&1 | grep -Fx eng
          tesseract --list-langs 2>&1 | grep -Fx chi_sim
      - name: Syntax
        run: python -m compileall -q v3_core qiaolian_dual tests
      - name: Targeted regression
        run: python -m pytest -q --disable-socket --allow-unix-socket tests/v3_core/test_pending_batch_admin.py tests/v3_core/test_publisher_status_confirmation_gate.py tests/v3_core/test_user_bot_channel_status_sync.py tests/v3_core/test_appointment_channel_alert_gate.py tests/v3_core/test_status_sync_recovery.py tests/v3_core/test_release_confirmation_and_sync_races.py
      - name: Full regression
        run: python -m pytest -q --disable-socket --allow-unix-socket --allow-hosts=127.0.0.1,localhost --continue-on-collection-errors tests

      - name: Baseline and PR same-environment comparison
        if: always()
        shell: bash
        run: |
          set +e
          git fetch --no-tags --depth=1 origin 1a7c4c44cb47478aaf9d30aa89aa5ee012eafacf
          git worktree add --detach /tmp/qiaolian-pr114-baseline 1a7c4c44cb47478aaf9d30aa89aa5ee012eafacf
          mkdir -p /tmp/qiaolian-pr114-comparison
          for version in baseline candidate; do
            if [ "$version" = baseline ]; then cd /tmp/qiaolian-pr114-baseline; else cd "$GITHUB_WORKSPACE"; fi
            python -m pytest -q --disable-socket --allow-unix-socket --allow-hosts=127.0.0.1,localhost --continue-on-collection-errors tests > "/tmp/qiaolian-pr114-comparison/$version.log" 2>&1
            echo "$version exit=$?" | tee -a /tmp/qiaolian-pr114-comparison/summary.txt
            tail -n 24 "/tmp/qiaolian-pr114-comparison/$version.log" | tee -a /tmp/qiaolian-pr114-comparison/summary.txt
          done
      - name: Upload baseline comparison
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pr114-baseline-candidate-comparison
          path: /tmp/qiaolian-pr114-comparison/
