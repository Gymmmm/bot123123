name: qiaolian-review-isolated-gate
on:
  push:
    branches:
      - feature/prod-final-gate-20261107
permissions:
  contents: read
jobs:
  isolated-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      DB_PATH: ${{ runner.temp }}/qiaolian-test.sqlite3
      USER_BOT_TOKEN: '123456:OFFLINE_TEST_TOKEN'
      PUBLISHER_BOT_TOKEN: '123456:OFFLINE_TEST_TOKEN'
      PYTHONPATH: ${{ github.workspace }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies and OCR
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y tesseract-ocr tesseract-ocr-eng tesseract-ocr-chi-sim
          python -m pip install -r requirements.txt pytest pytest-asyncio pytest-socket
      - name: Check OCR executable and languages
        run: |
          command -v tesseract
          tesseract --version
          tesseract --list-langs
          tesseract --list-langs 2>&1 | grep -Fx eng
          tesseract --list-langs 2>&1 | grep -Fx chi_sim
      - name: Check Python syntax
        run: python -m compileall -q v3_core qiaolian_dual tests
      - name: Run targeted tests without network
        run: python -m pytest -q -p pytest_socket --disable-socket tests/v3_core/test_pending_batch_admin.py
      - name: Run entire isolated tests directory without network
        if: always()
        run: python -m pytest -q -p pytest_socket --disable-socket tests
