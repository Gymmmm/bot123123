name: qiaolian-review-isolated-gate
on:
  push:
    branches:
      - feature/prod-final-gate-20261107
jobs:
  isolated-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate
        run: python -m compileall -q v3_core qiaolian_dual tests
