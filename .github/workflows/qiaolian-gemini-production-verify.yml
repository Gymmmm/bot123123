name: qiaolian-publisher-inspect-and-preview
on:
  push:
    branches: [ops/gemini-verify-20261011]
    paths: [.github/workflows/qiaolian-gemini-production-verify.yml]
permissions:
  contents: read
concurrency:
  group: qiaolian-channel-cover-preview
  cancel-in-progress: false
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Configure pinned production SSH
        env:
          PROD_SSH_PRIVATE_KEY: ${{ secrets.PROD_SSH_PRIVATE_KEY }}
        run: |
          set -Eeuo pipefail
          test -n "$PROD_SSH_PRIVATE_KEY"
          install -d -m 700 "$HOME/.ssh"
          printf '%s\n' "$PROD_SSH_PRIVATE_KEY" > "$HOME/.ssh/qiaolian_production"
          printf '%s\n' '50.114.74.120 ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIMvdBaAbAt9/4NCEC4RmiAukQ5KK5S6OF4YEml2iLw+6' > "$HOME/.ssh/known_hosts"
          chmod 600 "$HOME/.ssh/qiaolian_production" "$HOME/.ssh/known_hosts"
      - name: Confirm fix markers and source text location
        run: |
          set -Eeuo pipefail
          ssh -i "$HOME/.ssh/qiaolian_production" -o BatchMode=yes -o IdentitiesOnly=yes -o ConnectTimeout=20 root@50.114.74.120 'bash -s' <<'REMOTE'
          set -Eeuo pipefail
          echo "FIX_MARKERS"
          grep -c "Bare currency after the number" /opt/qiaolian_v3/current/qiaolian_dual/canonical_facts.py || echo 0
          grep -c "longest non-empty caption" /opt/qiaolian_v3/current/v3_core/ingest/telegram_collector.py || echo 0
          DB=/opt/qiaolian_v3/data/qiaolian_dual_bot.db
          sqlite3 -header -column "$DB" <<'SQL'
          SELECT 'source_posts' AS t, COUNT(*) AS n FROM source_posts;
          SELECT 'source_posts_empty' AS t, COUNT(*) AS n FROM source_posts WHERE length(trim(COALESCE(raw_text,'')))=0;
          SELECT 'canonical_with_source_text' AS t, COUNT(*) AS n
            FROM publisher_review_exceptions_v3 e
            JOIN review_items r ON r.review_id=e.review_id
            JOIN canonical_records c ON c.canonical_record_id=r.canonical_record_id
            JOIN source_posts s ON s.id=c.source_post_id OR s.source_post_id=c.source_post_id
            WHERE e.resolved=0 AND e.ignored=0 AND e.reason_code='missing_rent'
              AND length(trim(COALESCE(s.raw_text,'')))>0;
          SQL
          echo "SAMPLE_IDS"
          sqlite3 "$DB" "SELECT e.review_id, c.source_post_id, length(COALESCE(s.raw_text,'')) FROM publisher_review_exceptions_v3 e JOIN review_items r ON r.review_id=e.review_id JOIN canonical_records c ON c.canonical_record_id=r.canonical_record_id LEFT JOIN source_posts s ON s.source_post_id=c.source_post_id WHERE e.resolved=0 AND e.reason_code='missing_rent' LIMIT 5;"
          REMOTE
      - name: Remove temporary SSH material
        if: always()
        run: rm -f "$HOME/.ssh/qiaolian_production"
