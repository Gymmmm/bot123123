name: qiaolian-publisher-inspect-and-preview
on:
  push:
    branches: [ops/gemini-verify-20261011]
    paths: [.github/workflows/qiaolian-gemini-production-verify.yml]
permissions:
  contents: read
concurrency:
  group: qiaolian-channel-cover-preview
  cancel-in-progress: false
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Configure pinned production SSH
        env:
          PROD_SSH_PRIVATE_KEY: ${{ secrets.PROD_SSH_PRIVATE_KEY }}
        run: |
          set -Eeuo pipefail
          test -n "$PROD_SSH_PRIVATE_KEY"
          install -d -m 700 "$HOME/.ssh"
          printf '%s\n' "$PROD_SSH_PRIVATE_KEY" > "$HOME/.ssh/qiaolian_production"
          printf '%s\n' '50.114.74.120 ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIMvdBaAbAt9/4NCEC4RmiAukQ5KK5S6OF4YEml2iLw+6' > "$HOME/.ssh/known_hosts"
          chmod 600 "$HOME/.ssh/qiaolian_production" "$HOME/.ssh/known_hosts"
      - name: Inspect new empty sources and queue movement
        run: |
          set -Eeuo pipefail
          ssh -i "$HOME/.ssh/qiaolian_production" -o BatchMode=yes -o IdentitiesOnly=yes -o ConnectTimeout=20 root@50.114.74.120 'bash -s' <<'REMOTE'
          set -Eeuo pipefail
          DB=/opt/qiaolian_v3/data/qiaolian_dual_bot.db
          echo "=== NEW EMPTY SOURCES ==="
          sqlite3 -header -column "$DB" <<'SQL'
          SELECT id, source_post_id, parse_status, length(COALESCE(raw_text,'')) text_len,
                 json_extract(raw_meta_json,'$.ingest_kind') kind,
                 json_extract(raw_meta_json,'$.message_count') msgs,
                 created_at
          FROM source_posts
          WHERE id >= 888
          ORDER BY id;
          SQL
          echo "=== QUEUED ==="
          sqlite3 -header -column "$DB" "SELECT state, reason_code, COUNT(*) n FROM publisher_auto_items_v3 WHERE ignored=0 AND state IN ('queued','exception','sending') GROUP BY state, reason_code;"
          echo "=== REVIEW NEW ==="
          sqlite3 -header -column "$DB" <<'SQL'
          SELECT e.review_id, e.updated_at, length(trim(COALESCE(s.raw_text,''))) text_len,
                 json_extract(s.raw_meta_json,'$.ingest_kind') kind
          FROM publisher_review_exceptions_v3 e
          JOIN review_items r ON r.review_id=e.review_id
          JOIN canonical_records c ON c.canonical_record_id=r.canonical_record_id
          JOIN source_posts s ON CAST(s.id AS TEXT)=CAST(c.source_post_id AS TEXT)
          WHERE e.resolved=0 AND e.ignored=0 AND e.reason_code='missing_rent'
          ORDER BY e.updated_at DESC LIMIT 6;
          SQL
          REMOTE
      - name: Remove temporary SSH material
        if: always()
        run: rm -f "$HOME/.ssh/qiaolian_production"
