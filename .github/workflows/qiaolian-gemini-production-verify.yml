name: qiaolian-publisher-inspect-and-preview
on:
  push:
    branches: [ops/gemini-verify-20261011]
    paths: [.github/workflows/qiaolian-gemini-production-verify.yml]
permissions:
  contents: read
concurrency:
  group: qiaolian-channel-cover-preview
  cancel-in-progress: false
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - name: Configure pinned production SSH
        env:
          PROD_SSH_PRIVATE_KEY: ${{ secrets.PROD_SSH_PRIVATE_KEY }}
        run: |
          set -Eeuo pipefail
          test -n "$PROD_SSH_PRIVATE_KEY"
          install -d -m 700 "$HOME/.ssh"
          printf '%s\n' "$PROD_SSH_PRIVATE_KEY" > "$HOME/.ssh/qiaolian_production"
          printf '%s\n' '50.114.74.120 ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIMvdBaAbAt9/4NCEC4RmiAukQ5KK5S6OF4YEml2iLw+6' > "$HOME/.ssh/known_hosts"
          chmod 600 "$HOME/.ssh/qiaolian_production" "$HOME/.ssh/known_hosts"
      - name: Verify deployed SHA, live service environment and actual Gemini photo response
        run: |
          set -Eeuo pipefail
          ssh -i "$HOME/.ssh/qiaolian_production" -o BatchMode=yes -o IdentitiesOnly=yes -o ConnectTimeout=20 root@50.114.74.120 'bash -s' <<'REMOTE'
          set -Eeuo pipefail
          test "$(cat /opt/qiaolian_v3/.deployed_sha)" = c4307f7e9ee33f14af9a1cb0fd2e7f5ff4d7bab6
          readlink -f /opt/qiaolian_v3/current
          for component in collector canonical publisher user; do
            unit="qiaolian-v3@$component.service"
            systemctl is-active --quiet "$unit"
            systemctl show "$unit" --property=ActiveState,NRestarts,ExecMainStatus --no-pager
          done
          CHECK=$(mktemp /var/tmp/qiaolian-live-vision.XXXXXX.py)
          trap 'rm -f "$CHECK"' EXIT
          cat > "$CHECK" <<'PY'
          import asyncio, json, sqlite3, traceback
          from pathlib import Path
          from telegram import Bot
          from v3_core.publishing.admin_bot import load_settings
          from v3_core.publishing.publisher_app import V3PublisherApplication
          from v3_core.publishing.telegram_adapter import TelegramChannelAdapter
          from v3_core.publishing.delivery_coordinator import TelegramSendCommand
          async def main():
              settings=load_settings()
              app=V3PublisherApplication(settings)
              db=sqlite3.connect(settings.db_path); db.row_factory=sqlite3.Row
              async with Bot(settings.token) as bot:
                  chat=await bot.get_chat(settings.channel_chat_id)
                  for kind in ("别墅","公寓"):
                      candidates=db.execute("SELECT a.*,l.public_listing_id FROM publisher_auto_items_v3 a JOIN listings_v3 l ON l.listing_id=a.listing_id JOIN listing_offers o ON o.offer_id=a.offer_id WHERE a.state='published' AND l.property_type=? AND l.inventory_status='active' AND o.offer_status='active' ORDER BY a.rowid DESC LIMIT 4",(kind,)).fetchall()
                      done=False
                      for row in candidates:
                          try:
                              package=await asyncio.to_thread(app.workflow.build_package_for_review,review_id=row["review_id"])
                              package=app.workflow.approve_package(package_id=package.package_id,approved_by="operator:Gym:preview-20261011")
                              listing=app.workflow.reader.listing(row["listing_id"])
                              previous=app.workflow.delivery.publications.get_published_for_listing(row["listing_id"],platform="telegram",channel_chat_id=str(settings.channel_chat_id))
                              if not previous: raise RuntimeError("published_instance_missing")
                              command=TelegramSendCommand(attempt_id="",package_id=package.package_id,channel_chat_id=str(settings.channel_chat_id),cover_path=package.cover_path,caption=package.post_text,actions=dict(package.actions),inventory_status=listing["inventory_status"],area_key=str(listing.get("public_location_key") or ""))
                              receipt=await TelegramChannelAdapter(bot).edit(command,message_id=previous.channel_message_id)
                              if receipt.get("edit_mode")=="text": raise RuntimeError("cover_edit_fell_back_to_text")
                              instance=app.workflow.delivery.publications.record_telegram_publication(package_id=package.package_id,listing_id=package.listing_id,offer_id=package.offer_id,channel_chat_id=str(settings.channel_chat_id),telegram_result=receipt)
                              app.workflow.packages.mark_published(package.package_id)
                              app.workflow.delivery.publications.mark_status(previous.instance_id,"superseded")
                              app.auto_repository.set_item(row["offer_id"],state="published",package_id=package.package_id,channel_message_id=str(instance.channel_message_id))
                              link=("https://t.me/"+chat.username+"/" if chat.username else "https://t.me/c/"+str(chat.id).removeprefix("-100")+"/")+str(instance.channel_message_id)
                              print("POST_UPDATED",json.dumps({"kind":kind,"listing":row["listing_id"],"public_id":row["public_listing_id"],"link":link,"cover":package.cover_path,"package":package.package_id,"caption":package.post_text},ensure_ascii=False))
                              done=True; break
                          except Exception as e:
                              print("POST_FAILURE",json.dumps({"listing":row["listing_id"],"error":str(e),"trace":traceback.format_exc(limit=3)},ensure_ascii=False))
                      assert done,"no_usable_"+kind
          asyncio.run(main())
          
          PY
          chmod 0644 "$CHECK"
          cd /opt/qiaolian_v3/current
          export PYTHONPATH=/opt/qiaolian_v3/current
          runuser -u qiaolianbot -- bash -lc "set -a; source /opt/qiaolian_v3/runtime.env; set +a; export PYTHONPATH=/opt/qiaolian_v3/current; cd /opt/qiaolian_v3/current; exec /opt/qiaolian_v3/.venv/bin/python '$CHECK'"
          REMOTE
      - name: Remove temporary SSH material
        if: always()
        run: rm -f "$HOME/.ssh/qiaolian_production"
