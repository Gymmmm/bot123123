name: qiaolian-publisher-inspect-and-preview
on:
  push:
    branches: [ops/gemini-verify-20261011]
    paths: [.github/workflows/qiaolian-gemini-production-verify.yml]
permissions:
  contents: read
concurrency:
  group: qiaolian-v3-production
  cancel-in-progress: false
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Configure pinned production SSH
        env:
          PROD_SSH_PRIVATE_KEY: ${{ secrets.PROD_SSH_PRIVATE_KEY }}
        run: |
          set -Eeuo pipefail
          test -n "$PROD_SSH_PRIVATE_KEY"
          install -d -m 700 "$HOME/.ssh"
          printf '%s\n' "$PROD_SSH_PRIVATE_KEY" > "$HOME/.ssh/qiaolian_production"
          printf '%s\n' '50.114.74.120 ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIMvdBaAbAt9/4NCEC4RmiAukQ5KK5S6OF4YEml2iLw+6' > "$HOME/.ssh/known_hosts"
          chmod 600 "$HOME/.ssh/qiaolian_production" "$HOME/.ssh/known_hosts"
      - name: Verify deployed SHA, live service environment and actual Gemini photo response
        run: |
          set -Eeuo pipefail
          ssh -i "$HOME/.ssh/qiaolian_production" -o BatchMode=yes -o IdentitiesOnly=yes -o ConnectTimeout=20 root@50.114.74.120 'bash -s' <<'REMOTE'
          set -Eeuo pipefail
          test "$(cat /opt/qiaolian_v3/.deployed_sha)" = c4307f7e9ee33f14af9a1cb0fd2e7f5ff4d7bab6
          readlink -f /opt/qiaolian_v3/current
          for component in collector canonical publisher user; do
            unit="qiaolian-v3@$component.service"
            systemctl is-active --quiet "$unit"
            systemctl show "$unit" --property=ActiveState,NRestarts,ExecMainStatus --no-pager
          done
          CHECK=$(mktemp /var/tmp/qiaolian-live-vision.XXXXXX.py)
          trap 'rm -f "$CHECK"' EXIT
          cat > "$CHECK" <<'PY'
          import json, sqlite3
          db=sqlite3.connect("file:/opt/qiaolian_dual_bots/data/qiaolian_dual_bot.db?mode=ro",uri=True)
          db.row_factory=sqlite3.Row
          for table in ("publisher_auto_items_v3","publisher_review_exceptions_v3","listings_v3","offers_v3","canonical_facts_v3","publication_records_v3"):
              cols=[r[1] for r in db.execute(f"PRAGMA table_info({table})")]
              print("SCHEMA",table,json.dumps(cols))
              if table=="publisher_auto_items_v3" and cols:
                  print("AUTO_COUNTS",json.dumps([dict(r) for r in db.execute("SELECT state,reason_code,ignored,COUNT(*) n FROM publisher_auto_items_v3 GROUP BY state,reason_code,ignored")],ensure_ascii=False))
                  print("AUTO_SAMPLES",json.dumps([dict(r) for r in db.execute("SELECT * FROM publisher_auto_items_v3 WHERE state IN ('exception','queued','held') AND ignored=0 ORDER BY updated_at DESC LIMIT 12")],ensure_ascii=False))
              if table=="publisher_review_exceptions_v3" and cols:
                  print("REVIEW_COUNTS",json.dumps([dict(r) for r in db.execute("SELECT reason_code,resolved,ignored,COUNT(*) n FROM publisher_review_exceptions_v3 GROUP BY reason_code,resolved,ignored")],ensure_ascii=False))
              if table=="listings_v3" and cols:
                  wanted=[c for c in ("listing_id","title","property_type","layout","bedrooms","status","location","district") if c in cols]
                  print("LISTING_SAMPLES",json.dumps([dict(r) for r in db.execute(f"SELECT {','.join(wanted)} FROM listings_v3 ORDER BY rowid DESC LIMIT 15")],ensure_ascii=False))
          
          PY
          chmod 0600 "$CHECK"
          cd /opt/qiaolian_v3/current
          export PYTHONPATH=/opt/qiaolian_v3/current
          /opt/qiaolian_v3/.venv/bin/python "$CHECK"
          REMOTE
      - name: Remove temporary SSH material
        if: always()
        run: rm -f "$HOME/.ssh/qiaolian_production"
