name: qiaolian-publisher-inspect-and-preview
on:
  push:
    branches: [ops/gemini-verify-20261011]
    paths: [.github/workflows/qiaolian-gemini-production-verify.yml]
permissions:
  contents: read
concurrency:
  group: qiaolian-channel-cover-preview
  cancel-in-progress: false
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Configure pinned production SSH
        env:
          PROD_SSH_PRIVATE_KEY: ${{ secrets.PROD_SSH_PRIVATE_KEY }}
        run: |
          set -Eeuo pipefail
          test -n "$PROD_SSH_PRIVATE_KEY"
          install -d -m 700 "$HOME/.ssh"
          printf '%s\n' "$PROD_SSH_PRIVATE_KEY" > "$HOME/.ssh/qiaolian_production"
          printf '%s\n' '50.114.74.120 ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIMvdBaAbAt9/4NCEC4RmiAukQ5KK5S6OF4YEml2iLw+6' > "$HOME/.ssh/known_hosts"
          chmod 600 "$HOME/.ssh/qiaolian_production" "$HOME/.ssh/known_hosts"
      - name: Read-only exception and service check
        run: |
          set -Eeuo pipefail
          ssh -i "$HOME/.ssh/qiaolian_production" -o BatchMode=yes -o IdentitiesOnly=yes -o ConnectTimeout=20 root@50.114.74.120 'bash -s' <<'REMOTE'
          set -Eeuo pipefail
          echo "=== DEPLOYED ==="
          cat /opt/qiaolian_v3/.deployed_sha || true
          readlink -f /opt/qiaolian_v3/current || true
          echo "=== SERVICES ==="
          for component in collector canonical publisher user; do
            unit="qiaolian-v3@$component.service"
            printf '%s: ' "$unit"
            systemctl is-active "$unit" || true
          done
          echo "=== EXCEPTION COUNTS ==="
          DB=$(ls /opt/qiaolian_v3/data/*.db 2>/dev/null | head -1)
          if [ -z "$DB" ]; then DB=/opt/qiaolian_dual_bots/data/qiaolian_dual_bot.db; fi
          echo "DB=$DB"
          sqlite3 "$DB" <<'SQL'
          .mode line
          SELECT 'auto_items_exception' AS k, COUNT(*) AS n FROM publisher_auto_items_v3 WHERE state='exception' AND ignored=0;
          SELECT 'review_exceptions' AS k, COUNT(*) AS n FROM publisher_review_exceptions_v3 WHERE resolved=0 AND ignored=0;
          SELECT reason_code, COUNT(*) AS n FROM publisher_auto_items_v3 WHERE state='exception' AND ignored=0 GROUP BY reason_code;
          SELECT reason_code, COUNT(*) AS n FROM publisher_review_exceptions_v3 WHERE resolved=0 AND ignored=0 GROUP BY reason_code;
          SQL
          REMOTE
      - name: Remove temporary SSH material
        if: always()
        run: rm -f "$HOME/.ssh/qiaolian_production"
