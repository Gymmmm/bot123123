name: qiaolian-v3-production-deploy

on:
  push:
    branches:
      - master
    paths:
      - '.github/workflows/qiaolian-v3-production-deploy.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: qiaolian-production
  cancel-in-progress: false

env:
  CANDIDATE_REF: release/v3-media-userbot-ready-20260914
  CANDIDATE_SHA: 57a2239716f67ceeb6fe58613857552f2758c3df
  PREVIOUS_V3_SHA: c378e00eff300a4b1c62c3b7ec1a661a360b346a
  PROD_HOST: 50.114.74.120
  PROD_PORT: '22'
  PROD_SSH_USER: root
  PROD_SSH_KNOWN_HOSTS: '50.114.74.120 ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIMvdBaAbAt9/4NCEC4RmiAukQ5KK5S6OF4YEml2iLw+6'
  PROD_SSH_HOST_FINGERPRINT: 'SHA256:fuufBlFaqRpQhlkio0vuLsuv8w8x3zUb3VFQsnUny/o'

jobs:
  verify-and-deploy-v3:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Checkout exact frozen candidate
        uses: actions/checkout@v4
        with:
          ref: ${{ env.CANDIDATE_SHA }}
          fetch-depth: 0

      - name: Verify frozen ref and SHA
        run: |
          set -Eeuo pipefail
          test "$(git rev-parse HEAD)" = "$CANDIDATE_SHA"
          git fetch origin "$CANDIDATE_REF"
          test "$(git rev-parse FETCH_HEAD)" != "$CANDIDATE_SHA"
          git merge-base --is-ancestor "$CANDIDATE_SHA" FETCH_HEAD
          echo "APPROVED_CANDIDATE_OK=$CANDIDATE_SHA release_head=$(git rev-parse FETCH_HEAD)"

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install V3 test dependencies
        run: |
          set -Eeuo pipefail
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt pytest pytest-asyncio

      - name: V3 full release gate
        run: |
          set -Eeuo pipefail
          python -m compileall -q \
            v3_core \
            run_v3_collector.py \
            run_v3_canonical_worker.py \
            run_v3_publisher_bot.py \
            run_v3_user_bot.py \
            run_v3_preflight.py
          bash -n deploy/v3/run_component.sh
          grep -F -- '--loop' deploy/v3/run_component.sh >/dev/null
          python -m pytest -q tests/v3_core

      - name: Build authenticated candidate bundle
        env:
          RELEASE_BUNDLE: '${{ runner.temp }}/qiaolian-v3-release.bundle'
        run: |
          set -Eeuo pipefail
          git update-ref refs/heads/actions-v3-production "$CANDIDATE_SHA"
          git bundle create "$RELEASE_BUNDLE" refs/heads/actions-v3-production
          git bundle verify "$RELEASE_BUNDLE"

      - name: Verify production SSH host key
        run: |
          set -Eeuo pipefail
          ssh-keyscan -T 10 -p "$PROD_PORT" -t ed25519 "$PROD_HOST" 2>/dev/null | grep -v '^#' > "$RUNNER_TEMP/qiaolian_observed_known_hosts"
          ssh-keygen -lf "$RUNNER_TEMP/qiaolian_observed_known_hosts" | grep -F "$PROD_SSH_HOST_FINGERPRINT"

      - name: Configure production SSH
        env:
          PROD_SSH_PRIVATE_KEY: '${{ secrets.PROD_SSH_PRIVATE_KEY }}'
        run: |
          set -Eeuo pipefail
          test -n "$PROD_SSH_PRIVATE_KEY"
          install -d -m 700 "$HOME/.ssh"
          printf '%s\n' "$PROD_SSH_PRIVATE_KEY" > "$HOME/.ssh/qiaolian_production"
          printf '%s\n' "$PROD_SSH_KNOWN_HOSTS" > "$HOME/.ssh/known_hosts"
          chmod 600 "$HOME/.ssh/qiaolian_production" "$HOME/.ssh/known_hosts"

      - name: Upload verified V3 release bundle
        env:
          RELEASE_BUNDLE: '${{ runner.temp }}/qiaolian-v3-release.bundle'
          REMOTE_BUNDLE: '/tmp/qiaolian-v3-${{ github.run_id }}-${{ env.CANDIDATE_SHA }}.bundle'
        run: |
          set -Eeuo pipefail
          scp -P "$PROD_PORT" -i "$HOME/.ssh/qiaolian_production" \
            -o BatchMode=yes -o IdentitiesOnly=yes -o ConnectTimeout=20 \
            "$RELEASE_BUNDLE" "$PROD_SSH_USER@$PROD_HOST:$REMOTE_BUNDLE"

      - name: Deploy latest V3 runtime, preflight, activate and verify
        env:
          REMOTE_BUNDLE: '/tmp/qiaolian-v3-${{ github.run_id }}-${{ env.CANDIDATE_SHA }}.bundle'
        run: |
          set -Eeuo pipefail
          ssh -p "$PROD_PORT" -i "$HOME/.ssh/qiaolian_production" \
            -o BatchMode=yes -o IdentitiesOnly=yes -o ConnectTimeout=20 \
            "$PROD_SSH_USER@$PROD_HOST" \
            "bash -s -- '$REMOTE_BUNDLE' '$CANDIDATE_SHA' '$PREVIOUS_V3_SHA'" <<'REMOTE'
          set -Eeuo pipefail
          export PATH="/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin${PATH:+:$PATH}"
          hash -r

          BUNDLE_PATH=$1
          EXPECTED_SHA=$2
          PREVIOUS_SHA=$3
          APP=/opt/qiaolian_v3
          RELEASE="$APP/releases/$EXPECTED_SHA"
          CURRENT="$APP/current"
          RUNTIME_ENV="$APP/runtime.env"
          OLD=/opt/qiaolian_dual_bots
          DB="$OLD/data/qiaolian_dual_bot.db"
          if [ -f "$OLD/.env" ]; then
            ENV_SOURCE="$OLD/.env"
          else
            ENV_SOURCE="$RUNTIME_ENV"
          fi
          SOURCES_SOURCE=''
          for source_candidate in "$CURRENT/sources.json" "$OLD/sources.json" "$APP/sources.json"; do
            if [ -s "$source_candidate" ]; then
              SOURCES_SOURCE="$source_candidate"
              break
            fi
          done
          BACKUP_ROOT=/opt/qiaolian_backups
          STAMP=$(date -u +%Y%m%d-%H%M%S)
          BACKUP="$BACKUP_ROOT/actions-v3-$STAMP"

          NEW_SERVICES=(
            qiaolian-v3@canonical.service
            qiaolian-v3@publisher.service
            qiaolian-v3@user.service
            qiaolian-v3@collector.service
          )
          OLD_V3_SERVICES=(
            qiaolian-v3-user-bot.service
            qiaolian-v3-publisher.service
            qiaolian-v3-collector.service
          )
          LEGACY_SERVICES=(
            qiaolian-user-bot.service
            qiaolian-publisher-bot.service
            qiaolian-collector.service
          )

          OLD_V3_WAS_ACTIVE=0
          if systemctl is-active --quiet qiaolian-v3-user-bot.service 2>/dev/null || \
             systemctl is-active --quiet qiaolian-v3-publisher.service 2>/dev/null || \
             systemctl is-active --quiet qiaolian-v3-collector.service 2>/dev/null || \
             systemctl is-active --quiet qiaolian-v3@user.service 2>/dev/null || \
             systemctl is-active --quiet qiaolian-v3@publisher.service 2>/dev/null || \
             systemctl is-active --quiet qiaolian-v3@collector.service 2>/dev/null; then
            OLD_V3_WAS_ACTIVE=1
          fi

          rollback_on_error() {
            rc=$?
            if [ "$rc" -ne 0 ]; then
              echo "DEPLOY_FAILED rc=$rc - stopping new V3 template units" >&2
              journalctl -u qiaolian-v3@canonical.service -u qiaolian-v3@publisher.service -u qiaolian-v3@user.service -u qiaolian-v3@collector.service --since "5 minutes ago" -n 250 --no-pager >&2 || true
              systemctl disable --now "${NEW_SERVICES[@]}" 2>/dev/null || true
              if [ "$OLD_V3_WAS_ACTIVE" = 1 ]; then
                echo 'ROLLBACK: restoring previous V3 services' >&2
                rm -f "$CURRENT"
                ln -s "$APP/releases/$PREVIOUS_SHA" "$CURRENT"
                chown -h qiaolianbot:qiaolianbot "$CURRENT"
                systemctl daemon-reload
                systemctl enable --now "${NEW_SERVICES[@]}" 2>/dev/null || true
              fi
            fi
            exit "$rc"
          }
          echo 'CHECK: prerequisites'
          test -f "$BUNDLE_PATH"; echo 'PREREQ bundle=ok'
          test -f "$ENV_SOURCE"; echo 'PREREQ env=ok'
          test -s "$DB"; echo 'PREREQ db=ok'
          test -f "$APP/.deployed_sha"; echo 'PREREQ deployed_marker=ok'
          test "$(tr -cd '0-9a-fA-F' < "$APP/.deployed_sha")" = "$PREVIOUS_SHA"; echo 'PREREQ deployed_sha=ok'
          test -d "$APP/releases/$PREVIOUS_SHA"; echo 'PREREQ rollback_release=ok'
          test -n "$SOURCES_SOURCE"; test -s "$SOURCES_SOURCE"; echo 'PREREQ collector_sources=ok'
          id qiaolianbot >/dev/null; echo 'PREREQ service_user=ok'
          command -v git >/dev/null || DEBIAN_FRONTEND=noninteractive apt-get install -y git
          command -v sqlite3 >/dev/null || DEBIAN_FRONTEND=noninteractive apt-get install -y sqlite3
          command -v python3 >/dev/null
          trap rollback_on_error EXIT

          echo 'FREEZE: stop all old writers before backup and cutover'
          systemctl stop "${LEGACY_SERVICES[@]}" 2>/dev/null || true
          systemctl stop "${OLD_V3_SERVICES[@]}" qiaolian-v3-canonical-worker.timer 2>/dev/null || true
          systemctl stop "${NEW_SERVICES[@]}" 2>/dev/null || true

          echo 'BACKUP: DB, env and service definitions'
          install -d -m 0700 "$BACKUP/systemd"
          cp -a "$ENV_SOURCE" "$BACKUP/legacy.env"
          [ -f "$APP/.env" ] && cp -a "$APP/.env" "$BACKUP/v3.env" || true
          [ -f "$RUNTIME_ENV" ] && cp -a "$RUNTIME_ENV" "$BACKUP/runtime.env" || true
          for f in \
            /etc/systemd/system/qiaolian-v3-user-bot.service \
            /etc/systemd/system/qiaolian-v3-publisher.service \
            /etc/systemd/system/qiaolian-v3-collector.service \
            /etc/systemd/system/qiaolian-v3-canonical-worker.service \
            /etc/systemd/system/qiaolian-v3-canonical-worker.timer \
            /etc/systemd/system/qiaolian-v3@.service; do
            [ -f "$f" ] && cp -a "$f" "$BACKUP/systemd/"
          done
          sqlite3 "$DB" ".backup '$BACKUP/qiaolian_dual_bot.db'"
          sqlite3 "$BACKUP/qiaolian_dual_bot.db" 'PRAGMA quick_check;' | grep -Fx ok
          printf '%s\n' "$EXPECTED_SHA" > "$BACKUP/candidate_sha.txt"
          printf '%s\n' "$PREVIOUS_SHA" > "$BACKUP/previous_v3_sha.txt"

          echo 'DEPLOY: exact candidate into root-owned isolated release repository'
          rm -rf "$RELEASE"
          install -d -m 0755 "$APP/releases" "$RELEASE"
          git -C "$RELEASE" init
          git -C "$RELEASE" fetch "$BUNDLE_PATH" refs/heads/actions-v3-production
          test "$(git -C "$RELEASE" rev-parse FETCH_HEAD)" = "$EXPECTED_SHA"
          git -C "$RELEASE" checkout -f --detach "$EXPECTED_SHA"
          test "$(git -C "$RELEASE" rev-parse HEAD)" = "$EXPECTED_SHA"
          install -m 0640 -o qiaolianbot -g qiaolianbot "$SOURCES_SOURCE" "$RELEASE/sources.json"
          test -f "$RELEASE/deploy/v3/run_component.sh"
          test -f "$RELEASE/deploy/v3/qiaolian-v3@.service"
          chmod 0755 "$RELEASE/deploy/v3/run_component.sh"

          echo 'PYTHON: shared isolated V3 venv'
          if [ ! -x "$APP/.venv/bin/python" ]; then
            python3 -m venv "$APP/.venv"
          fi
          "$APP/.venv/bin/python" -m pip install --disable-pip-version-check --upgrade pip
          "$APP/.venv/bin/python" -m pip install --disable-pip-version-check -r "$RELEASE/requirements.txt"
          chown -R qiaolianbot:qiaolianbot "$APP/.venv" "$RELEASE"

          echo 'RUNTIME ENV: preserve existing secrets and pin V3 runtime paths'
          if [ "$ENV_SOURCE" != "$RUNTIME_ENV" ]; then
            cp -a "$ENV_SOURCE" "$RUNTIME_ENV"
          fi
          cat >>"$RUNTIME_ENV" <<EOF
          QIAOLIAN_CODE_ROOT=$CURRENT
          QIAOLIAN_VENV=$APP/.venv
          QIAOLIAN_RUNTIME_ROOT=$APP/runtime
          DB_PATH=$DB
          SQLITE_PATH=$DB
          MEDIA_ROOT=$OLD/media
          COLLECTOR_DOWNLOAD_DIR=$OLD/media/collector_downloads
          COLLECTOR_SOURCES_JSON=$CURRENT/sources.json
          V3_COVER_OUTPUT_DIR=$OLD/media/covers_v3
          CHANNEL_DISCUSSION_ENABLED=false
          V3_CANONICAL_WORKER_INTERVAL_SECONDS=5
          PLAYWRIGHT_BROWSERS_PATH=$OLD/.playwright-browsers
          EOF
          chown root:qiaolianbot "$RUNTIME_ENV"
          chmod 0640 "$RUNTIME_ENV"

          echo 'COMPILE: exact release entries'
          "$APP/.venv/bin/python" -m compileall -q \
            "$RELEASE/v3_core" \
            "$RELEASE/run_v3_collector.py" \
            "$RELEASE/run_v3_canonical_worker.py" \
            "$RELEASE/run_v3_publisher_bot.py" \
            "$RELEASE/run_v3_user_bot.py" \
            "$RELEASE/run_v3_preflight.py"
          bash -n "$RELEASE/deploy/v3/run_component.sh"

          echo 'PREFLIGHT: release against production DB before activation'
          set -a
          source "$RUNTIME_ENV"
          set +a
          export QIAOLIAN_CODE_ROOT="$RELEASE"
          export COLLECTOR_SOURCES_JSON="$RELEASE/sources.json"
          export DB_PATH="$DB"
          export SQLITE_PATH="$DB"
          export CHANNEL_DISCUSSION_ENABLED=false
          cd "$RELEASE"
          runuser -u qiaolianbot --preserve-environment -- "$APP/.venv/bin/python" run_v3_preflight.py --initialize --component all --db "$DB"
          runuser -u qiaolianbot --preserve-environment -- "$APP/.venv/bin/python" run_v3_preflight.py --component all --db "$DB"

          echo 'DB SAFETY: sale stays store_only and non-publishable'
          test "$(sqlite3 "$DB" "SELECT COUNT(*) FROM listing_offers WHERE offer_type='sale' AND publication_policy<>'store_only';")" = 0
          test "$(sqlite3 "$DB" "SELECT COUNT(*) FROM listing_offers WHERE offer_type='sale' AND publishable<>0;")" = 0

          echo 'ACTIVATE RELEASE POINTER'
          rm -f "$CURRENT"
          ln -s "$RELEASE" "$CURRENT"
          chown -h qiaolianbot:qiaolianbot "$CURRENT"

          echo 'SYSTEMD: install repository-owned V3 template'
          install -m 0644 "$CURRENT/deploy/v3/qiaolian-v3@.service" /etc/systemd/system/qiaolian-v3@.service
          install -d -m 0755 /etc/systemd/system/qiaolian-v3@.service.d
          cat >/etc/systemd/system/qiaolian-v3@.service.d/10-runtime.conf <<'EOF'
          [Service]
          User=qiaolianbot
          Group=qiaolianbot
          UMask=0027
          NoNewPrivileges=true
          PrivateTmp=true
          MemoryHigh=600M
          MemoryMax=800M
          EOF

          systemctl daemon-reload
          systemctl disable qiaolian-v3-user-bot.service qiaolian-v3-publisher.service qiaolian-v3-collector.service qiaolian-v3-canonical-worker.timer 2>/dev/null || true
          systemctl enable "${NEW_SERVICES[@]}"

          echo 'START: canonical -> publisher -> user -> collector'
          ACTIVATED_AT=$(date -u '+%Y-%m-%d %H:%M:%S UTC')
          systemctl start qiaolian-v3@canonical.service
          systemctl start qiaolian-v3@publisher.service
          systemctl start qiaolian-v3@user.service
          systemctl start qiaolian-v3@collector.service

          sleep 10
          for svc in "${NEW_SERVICES[@]}"; do
            active=$(systemctl is-active "$svc" 2>/dev/null || true)
            enabled=$(systemctl is-enabled "$svc" 2>/dev/null || true)
            pid=$(systemctl show "$svc" -p MainPID --value)
            restarts=$(systemctl show "$svc" -p NRestarts --value)
            echo "SERVICE_GATE unit=$svc active=$active enabled=$enabled pid=${pid:-0} restarts=${restarts:-0}"
            test "$active" = active
            test "$enabled" = enabled
            test "${pid:-0}" -gt 0
            test "${restarts:-0}" -le 1
          done

          echo 'RUNTIME LOG GATE'
          if journalctl \
              -u qiaolian-v3@canonical.service \
              -u qiaolian-v3@publisher.service \
              -u qiaolian-v3@user.service \
              -u qiaolian-v3@collector.service \
              --since "$ACTIVATED_AT" --no-pager \
              | grep -Eq 'Traceback|ModuleNotFoundError|ImportError|database is locked|no such table|Conflict: terminated by other getUpdates request|Main process exited|Failed with result'; then
            journalctl \
              -u qiaolian-v3@canonical.service \
              -u qiaolian-v3@publisher.service \
              -u qiaolian-v3@user.service \
              -u qiaolian-v3@collector.service \
              --since "$ACTIVATED_AT" -n 250 --no-pager
            exit 1
          fi

          printf '%s\n' "$EXPECTED_SHA" > "$APP/.deployed_sha"
          chown qiaolianbot:qiaolianbot "$APP/.deployed_sha"
          rm -f "$BUNDLE_PATH"
          trap - EXIT
          echo "V3_DEPLOYMENT_OK sha=$EXPECTED_SHA backup=$BACKUP"
          systemctl --no-pager --full status "${NEW_SERVICES[@]}" || true
          REMOTE
