name: qiaolian-appointment-copy-patch

on:
  push:
    branches:
      - codex/qiaolian-ui-cleanup-20260829
    paths:
      - scripts/appointment_copy_patch.py
      - .github/workflows/qiaolian-appointment-copy-patch.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/qiaolian-ui-cleanup-20260829
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Apply patch
        run: python scripts/appointment_copy_patch.py
      - name: Install dependencies
        run: python -m pip install -r requirements.txt pytest
      - name: Syntax and import checks
        env:
          USER_BOT_TOKEN: '123456:TESTTOKEN'
          PUBLISHER_BOT_TOKEN: '123456:TESTTOKEN'
          DB_PATH: '${{ runner.temp }}/appointment-copy.db'
        run: |
          python -m compileall -q qiaolian_dual tests/test_appointment_mobile_copy.py tests/test_user_ui_cleanup.py tests/test_customer_path_regression.py
          python -c "import qiaolian_dual.user_bot"
      - name: Non-outbound regression
        env:
          PYTHONPATH: '${{ github.workspace }}'
          USER_BOT_TOKEN: '123456:TESTTOKEN'
          PUBLISHER_BOT_TOKEN: '123456:TESTTOKEN'
          DB_PATH: '${{ runner.temp }}/appointment-copy.db'
        run: |
          python -m pytest -q tests/test_appointment_mobile_copy.py tests/test_user_ui_cleanup.py tests/test_customer_path_regression.py tests/test_daily_broadcast_rotation.py tests/test_tg_album_45.py tests/test_cover_theme_regression.py
      - name: Commit and push code only
        run: |
          git config user.name "Gymmmm"
          git config user.email "73370798+Gymmmm@users.noreply.github.com"
          git checkout -- .github/workflows/qiaolian-ui-check.yml
          git add qiaolian_dual/appointment_flow.py qiaolian_dual/messages.py qiaolian_dual/results_admin.py qiaolian_dual/callback_admin.py tests/test_appointment_mobile_copy.py
          git diff --cached --quiet && exit 0
          git commit -m "polish appointment mobile copy and advisor handoff"
          git pull --rebase origin codex/qiaolian-ui-cleanup-20260829
          git push origin HEAD:codex/qiaolian-ui-cleanup-20260829
