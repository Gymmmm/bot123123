name: apply-fixed-panel-navigation-once

on:
  push:
    branches:
      - codex/qiaolian-ui-cleanup-20260829
    paths:
      - '.github/workflows/apply-fixed-panel-navigation-once.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/qiaolian-ui-cleanup-20260829
          fetch-depth: 0
      - name: Apply fixed panel navigation
        run: |
          python - <<'PY'
          from pathlib import Path

          p = Path('qiaolian_dual/start_routes.py')
          s = p.read_text()
          s = s.replace(
              "from .texts import about_text, brand_story_text, want_home_prompt_text",
              "from .texts import about_text, brand_story_text, want_home_prompt_text, render_panel",
              1,
          )

          replacements = {
              "await message.reply_text(listing_unavailable_text(reason, listing_id), parse_mode=ParseMode.HTML, reply_markup=listing_unavailable_keyboard(listing_id))":
              "await render_panel(update, text=listing_unavailable_text(reason, listing_id), parse_mode=ParseMode.HTML, reply_markup=listing_unavailable_keyboard(listing_id), context=context)",
              "await message.reply_text(listing_cost_text(listing_id), parse_mode=ParseMode.HTML, reply_markup=listing_cost_keyboard(listing_id))":
              "await render_panel(update, text=listing_cost_text(listing_id), parse_mode=ParseMode.HTML, reply_markup=listing_cost_keyboard(listing_id), context=context)",
              "await message.reply_text('📍 <b>想住在哪个区域？</b>', parse_mode=ParseMode.HTML, reply_markup=find_area_keyboard())":
              "await render_panel(update, text='📍 <b>想住在哪个区域？</b>', parse_mode=ParseMode.HTML, reply_markup=find_area_keyboard(), context=context)",
              "await message.reply_text('💰 <b>您的月租预算是多少？</b>', parse_mode=ParseMode.HTML, reply_markup=find_budget_keyboard('any'))":
              "await render_panel(update, text='💰 <b>您的月租预算是多少？</b>', parse_mode=ParseMode.HTML, reply_markup=find_budget_keyboard('any'), context=context)",
              "await message.reply_text('🏠 <b>需要几房？</b>', parse_mode=ParseMode.HTML, reply_markup=room_type_keyboard())":
              "await render_panel(update, text='🏠 <b>需要几房？</b>', parse_mode=ParseMode.HTML, reply_markup=room_type_keyboard(), context=context)",
              "await message.reply_text(_latest_listing_text(), parse_mode=ParseMode.HTML, reply_markup=latest_listing_keyboard())":
              "await render_panel(update, text=_latest_listing_text(), parse_mode=ParseMode.HTML, reply_markup=latest_listing_keyboard(), context=context)",
              "await message.reply_text(channel_topic_welcome_text(topic), reply_markup=find_area_keyboard())":
              "await render_panel(update, text=channel_topic_welcome_text(topic), reply_markup=find_area_keyboard(), context=context)",
              "await message.reply_text(channel_topic_welcome_text(topic), reply_markup=main_keyboard())":
              "await render_panel(update, text=channel_topic_welcome_text(topic), reply_markup=main_keyboard(), context=context)",
              "await message.reply_text('这套房源目前无法找到。', reply_markup=no_match_followup_keyboard())":
              "await render_panel(update, text='这套房源目前无法找到。', reply_markup=no_match_followup_keyboard(), context=context)",
              "await message.reply_text(listing_entry_text(listing_id), parse_mode=ParseMode.HTML, reply_markup=listing_entry_keyboard(listing_id))":
              "await render_panel(update, text=listing_entry_text(listing_id), parse_mode=ParseMode.HTML, reply_markup=listing_entry_keyboard(listing_id), context=context)",
              "await message.reply_text('当前同区域暂时没有可预约房源。\\n可以调整条件，或联系我们继续留意。', reply_markup=no_match_followup_keyboard())":
              "await render_panel(update, text='当前同区域暂时没有可预约房源。\\n可以调整条件，或联系我们继续留意。', reply_markup=no_match_followup_keyboard(), context=context)",
              "await message.reply_text(brand_story_text(), parse_mode=ParseMode.HTML, reply_markup=main_keyboard())":
              "await render_panel(update, text=brand_story_text(), parse_mode=ParseMode.HTML, reply_markup=main_keyboard(), context=context)",
              "await message.reply_text(about_text(), parse_mode=ParseMode.HTML, reply_markup=main_keyboard())":
              "await render_panel(update, text=about_text(), parse_mode=ParseMode.HTML, reply_markup=main_keyboard(), context=context)",
              "await message.reply_text(want_home_prompt_text(), parse_mode=ParseMode.HTML, reply_markup=precise_filter_keyboard(set()))":
              "await render_panel(update, text=want_home_prompt_text(), parse_mode=ParseMode.HTML, reply_markup=precise_filter_keyboard(set()), context=context)",
          }
          for old, new in replacements.items():
              if old not in s:
                  raise SystemExit(f'missing expected pattern: {old[:80]}')
              s = s.replace(old, new)

          old_import = "from .texts import channel_welcome_text"
          if old_import not in s:
              raise SystemExit('missing start import')
          s = s.replace(old_import, "from .texts import channel_welcome_text, render_panel", 1)

          old_start = """await update.effective_message.reply_text(\n        channel_welcome_text(first_name=getattr(user, 'first_name', '') or getattr(user, 'full_name', '') or ''),\n        reply_markup=main_keyboard(),\n        parse_mode=ParseMode.HTML,\n    )"""
          new_start = """await render_panel(\n        update,\n        text=channel_welcome_text(first_name=getattr(user, 'first_name', '') or getattr(user, 'full_name', '') or ''),\n        reply_markup=main_keyboard(),\n        parse_mode=ParseMode.HTML,\n        context=context,\n    )"""
          if old_start not in s:
              raise SystemExit('missing normal start panel')
          s = s.replace(old_start, new_start, 1)
          p.write_text(s)

          p = Path('qiaolian_dual/search_text_handlers.py')
          s = p.read_text()
          old = "await update.effective_message.reply_text('预算没有识别出来。请试试：<code>800以内</code>、<code>600-900</code> 或 <code>1500以上</code>。', parse_mode=ParseMode.HTML)"
          new = "await render_panel(update, text='预算没有识别出来。请试试：<code>800以内</code>、<code>600-900</code> 或 <code>1500以上</code>。', parse_mode=ParseMode.HTML, context=context, prefer_edit_anchor=True)"
          if old not in s:
              raise SystemExit('missing custom-budget fallback')
          p.write_text(s.replace(old, new, 1))

          test = Path('tests/test_fixed_panel_navigation.py')
          test.write_text('''from pathlib import Path\n\n\ndef test_start_and_channel_indexes_use_panel_renderer():\n    src = Path("qiaolian_dual/start_routes.py").read_text()\n    assert "text='📍 <b>想住在哪个区域？</b>'" in src\n    assert "text='💰 <b>您的月租预算是多少？</b>'" in src\n    assert "text='🏠 <b>需要几房？</b>'" in src\n    assert "text=channel_welcome_text(" in src\n    assert "context=context" in src\n\n\ndef test_custom_budget_error_reuses_anchor():\n    src = Path("qiaolian_dual/search_text_handlers.py").read_text()\n    marker = "预算没有识别出来"
    pos = src.index(marker)\n    chunk = src[max(0, pos-180):pos+360]\n    assert "render_panel" in chunk\n    assert "prefer_edit_anchor=True" in chunk\n''')
          PY

      - name: Validate
        run: |
          python -m compileall -q qiaolian_dual
          python -m pytest -q tests/test_fixed_panel_navigation.py tests/test_user_bot_runtime_guards.py tests/test_callback_route_static_guards.py

      - name: Commit changes
        run: |
          git config user.name qiaolian-actions
          git config user.email actions@users.noreply.github.com
          git add qiaolian_dual/start_routes.py qiaolian_dual/search_text_handlers.py tests/test_fixed_panel_navigation.py
          git diff --cached --quiet && exit 0
          git commit -m "Keep Bot navigation in a fixed panel"
          git push origin HEAD:codex/qiaolian-ui-cleanup-20260829
