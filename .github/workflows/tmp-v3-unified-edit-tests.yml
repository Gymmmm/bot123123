name: tmp-v3-unified-edit-tests
on:
  push:
    branches: ['fix/v3-unified-publication-edit']
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
          pip install pytest
      - name: Run focused V3 publication tests
        run: |
          pytest -q \
            tests/test_telegram_publication_edit.py \
            tests/test_v3_delivery.py \
            tests/test_v3_package_service.py
