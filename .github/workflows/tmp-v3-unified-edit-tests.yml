name: tmp-v3-unified-edit-tests
on:
  push:
    branches: ['fix/v3-unified-publication-edit']
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    env:
      PYTHONPATH: ${{ github.workspace }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
          pip install pytest pytest-asyncio
      - name: Compile V3 publication modules
        run: |
          python -m compileall -q v3_core tests/v3_core tests/test_telegram_publication_edit.py
      - name: Run focused V3 publication tests
        run: |
          pytest -q \
            tests/test_telegram_publication_edit.py \
            tests/v3_core/test_telegram_adapter.py \
            tests/v3_core/test_delivery_coordinator.py \
            tests/v3_core/test_delivery_state_and_instances.py \
            tests/v3_core/test_frozen_package_service.py
