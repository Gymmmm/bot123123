name: issue25-integration-check

on:
  push:
    branches:
      - chief/issue25-cta-appt-10commits
  workflow_dispatch:

jobs:
  issue25-integration:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt pytest pytest-asyncio
      - name: Compile V3 core and entrypoints
        run: |
          python -m compileall -q \
            v3_core \
            tests/v3_core \
            run_v3_collector.py \
            run_v3_canonical_worker.py \
            run_v3_publisher_bot.py \
            run_v3_user_bot.py \
            run_v3_preflight.py
      - name: A channel CTA regression
        env:
          PYTHONPATH: '${{ github.workspace }}'
        run: |
          python -m pytest -q \
            tests/v3_core/test_telegram_adapter.py \
            tests/v3_core/test_channel_pure_contracts.py \
            tests/v3_core/test_user_bot_channel_status_sync.py
      - name: B listing and adviser regression
        env:
          PYTHONPATH: '${{ github.workspace }}'
        run: |
          python -m pytest -q \
            tests/v3_core/test_user_bot_home_views.py \
            tests/v3_core/test_user_bot_listing_responses.py \
            tests/v3_core/test_user_bot_listing_presenter.py
      - name: C deep-link and failure-path regression
        env:
          PYTHONPATH: '${{ github.workspace }}'
        run: |
          python -m pytest -q \
            tests/v3_core/test_user_bot_public_flow.py \
            tests/v3_core/test_user_bot_deeplink_contract.py \
            tests/v3_core/test_user_bot_broadcast_shortcuts.py
      - name: D appointment regression
        env:
          PYTHONPATH: '${{ github.workspace }}'
        run: |
          python -m pytest -q \
            tests/v3_core/test_user_bot_telegram_transition_ui.py \
            tests/v3_core/test_user_bot_transition_actions.py \
            tests/v3_core/test_user_bot_telegram_transition_action_handler.py \
            tests/v3_core/test_user_bot_appointment_submit.py
      - name: Issue 25 contract
        env:
          PYTHONPATH: '${{ github.workspace }}'
        run: |
          if [ -f tests/v3_core/test_issue25_cta_appointment_contract.py ]; then
            python -m pytest -q tests/v3_core/test_issue25_cta_appointment_contract.py
          else
            echo 'Issue 25 aggregate contract not added yet; staged integration run.'
          fi
      - name: Full V3 regression
        env:
          PYTHONPATH: '${{ github.workspace }}'
        run: |
          python -m pytest -q tests/v3_core
