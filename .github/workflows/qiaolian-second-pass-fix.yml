name: qiaolian-second-pass-fix

on:
  push:
    branches:
      - codex/qiaolian-ui-cleanup-20260829
    paths:
      - .github/workflows/qiaolian-second-pass-fix.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/qiaolian-ui-cleanup-20260829
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Apply second-pass fixes
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          # 1) Clean duplicate import introduced while normalizing display floor.
          p = Path('publication_package.py')
          text = p.read_text(encoding='utf-8')
          text = text.replace(
              'from qiaolian_dual.utils_formatting import _display_layout, _display_floor, _display_floor',
              'from qiaolian_dual.utils_formatting import _display_layout, _display_floor',
          )
          p.write_text(text, encoding='utf-8')

          # 2) Remove obsolete rent-day reminder implementation entirely. The product contract
          # now only schedules the lease-expiry reminder 7 days before end date.
          p = Path('qiaolian_dual/jobs.py')
          text = p.read_text(encoding='utf-8')
          marker = '\nasync def rent_day_reminder_job('
          if marker in text:
              text = text.split(marker, 1)[0].rstrip() + '\n'
          p.write_text(text, encoding='utf-8')

          # 3) Customer wording and unavailable reason fidelity for deep links.
          p = Path('qiaolian_dual/start_routes.py')
          text = p.read_text(encoding='utf-8')
          text = text.replace('这些在架房源', '这些可预约房源')
          text = text.replace('暂无更多在架房源', '暂无更多可预约房源')
          text = text.replace('请联系我们重新获取绑定码，或直接发消息给我们 ↓', '请联系中文顾问重新获取绑定码，或直接发消息给我们 ↓')
          # In branches that already computed availability_reason, preserve the actual reason
          # so rented/pending/offline links do not degrade to the generic message.
          text = text.replace(
              'await message.reply_text(listing_unavailable_text(), reply_markup=listing_unavailable_keyboard(listing_id))',
              'await message.reply_text(listing_unavailable_text(availability_reason), reply_markup=listing_unavailable_keyboard(listing_id))',
          )
          p.write_text(text, encoding='utf-8')

          # 4) Search result cards must not turn a listing green again after it became rented/offline.
          p = Path('qiaolian_dual/results_admin.py')
          text = p.read_text(encoding='utf-8')
          old = """    item = listing_context(ids[index])\n    if not item or not item.get('listing_id'):\n        context.user_data['find_card_listing_ids'] = [lid for lid in ids if lid != ids[index]]\n        await update.effective_message.reply_text('这套推荐已经失效。我可以继续为你筛选其他房源。', reply_markup=InlineKeyboardMarkup([[InlineKeyboardButton('🔍 重新找房', callback_data='home_smart_search')], [InlineKeyboardButton('💬 联系中文顾问', callback_data='keyword:handoff')], [InlineKeyboardButton('🏠 返回首页', callback_data='home')]]))\n        return\n"""
          new = """    item = listing_context(ids[index])\n    status = str((item or {}).get('status') or '').strip().lower()\n    if not item or not item.get('listing_id') or status not in {'active', 'reserved'}:\n        context.user_data['find_card_listing_ids'] = [lid for lid in ids if lid != ids[index]]\n        await update.effective_message.reply_text('这套推荐的房态已经变化，暂时不能继续预约。我可以继续为你筛选其他房源。', reply_markup=InlineKeyboardMarkup([[InlineKeyboardButton('🔍 重新找房', callback_data='home_smart_search')], [InlineKeyboardButton('💬 联系中文顾问', callback_data='keyword:handoff')], [InlineKeyboardButton('🏠 返回首页', callback_data='home')]]))\n        return\n"""
          if old not in text:
              raise SystemExit('send_find_result_card stale-card block not found')
          text = text.replace(old, new, 1)
          p.write_text(text, encoding='utf-8')

          # 5) Regression tests for the second-pass findings.
          p = Path('tests/test_user_ui_cleanup.py')
          text = p.read_text(encoding='utf-8')
          if 'test_obsolete_rent_day_reminder_is_removed' not in text:
              text += """\n\ndef test_obsolete_rent_day_reminder_is_removed():\n    import qiaolian_dual.jobs as jobs\n    assert not hasattr(jobs, 'rent_day_reminder_job')\n\n\ndef test_publication_package_has_no_duplicate_floor_import():\n    source = Path('publication_package.py').read_text(encoding='utf-8')\n    assert '_display_floor, _display_floor' not in source\n\n\ndef test_customer_routes_do_not_leak_internal_listing_wording():\n    source = Path('qiaolian_dual/start_routes.py').read_text(encoding='utf-8')\n    assert '在架房源' not in source\n    assert '请联系我们重新获取绑定码' not in source\n\n\ndef test_find_card_rechecks_listing_status_before_rendering():\n    source = Path('qiaolian_dual/results_admin.py').read_text(encoding='utf-8')\n    assert "status not in {'active', 'reserved'}" in source\n    assert '房态已经变化' in source\n"""
          # Ensure pathlib is available to the test module.
          if 'from pathlib import Path' not in text.split('\n', 12)[:12]:
              text = 'from pathlib import Path\n' + text
          p.write_text(text, encoding='utf-8')
          PY
      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt pytest
      - name: Syntax check
        run: python -m compileall -q qiaolian_dual publication_package.py discussion_map_store.py
      - name: Regression tests
        env:
          PYTHONPATH: '${{ github.workspace }}'
          USER_BOT_TOKEN: '123456:TESTTOKEN'
          PUBLISHER_BOT_TOKEN: '123456:TESTTOKEN'
          DB_PATH: '${{ runner.temp }}/qiaolian-second-pass.db'
        run: python -m pytest -q tests/test_user_ui_cleanup.py
      - name: Commit fixes
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add publication_package.py qiaolian_dual/jobs.py qiaolian_dual/start_routes.py qiaolian_dual/results_admin.py tests/test_user_ui_cleanup.py
          git diff --cached --quiet && exit 0
          git commit -m 'second-pass harden listing status and customer wording [skip second-pass]'
          git push origin HEAD:codex/qiaolian-ui-cleanup-20260829
