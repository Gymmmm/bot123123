name: qiaolian-album45-patch

on:
  push:
    branches:
      - codex/qiaolian-ui-cleanup-20260829
    paths:
      - scripts/patch_tg_album_45.py
      - .github/workflows/qiaolian-album45-patch.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/qiaolian-ui-cleanup-20260829
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Apply 4:5 album patch
        run: python scripts/patch_tg_album_45.py
      - name: Install dependencies
        run: python -m pip install -r requirements.txt pytest
      - name: Syntax check
        run: python -m compileall -q meihua_publisher.py tests/test_tg_album_45.py
      - name: Focused regression
        env:
          PYTHONPATH: '${{ github.workspace }}'
          USER_BOT_TOKEN: '123456:TESTTOKEN'
          PUBLISHER_BOT_TOKEN: '123456:TESTTOKEN'
          DB_PATH: '${{ runner.temp }}/album45.db'
        run: python -m pytest -q tests/test_tg_album_45.py tests/test_customer_path_regression.py
      - name: Commit generated changes
        run: |
          git config user.name "Gymmmm"
          git config user.email "73370798+Gymmmm@users.noreply.github.com"
          git add meihua_publisher.py tests/test_tg_album_45.py .github/workflows/qiaolian-ui-check.yml
          git diff --cached --quiet && exit 0
          git commit -m "standardize Telegram albums to 4:5"
          git push origin HEAD:codex/qiaolian-ui-cleanup-20260829
