name: qiaolian-one-shot-deploy-dispatch

on:
  push:
    branches:
      - codex/qiaolian-ui-cleanup-20260829
    paths:
      - .github/workflows/qiaolian-one-shot-deploy-dispatch.yml

permissions:
  contents: write
  actions: write

jobs:
  dispatch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/qiaolian-ui-cleanup-20260829
          fetch-depth: 2
      - name: Remove dispatcher from branch
        run: |
          set -Eeuo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/qiaolian-one-shot-deploy-dispatch.yml
          git commit -m "chore: remove one-shot deploy dispatcher"
          git push origin HEAD:refs/heads/codex/qiaolian-ui-cleanup-20260829
          echo "CLEAN_SHA=$(git rev-parse HEAD)" >> "$GITHUB_ENV"
      - name: Dispatch canonical production workflow
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -Eeuo pipefail
          curl -fsSL -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${{ github.repository }}/actions/workflows/qiaolian-production-deploy.yml/dispatches" \
            -d '{"ref":"codex/qiaolian-ui-cleanup-20260829","inputs":{"confirm":"DEPLOY"}}'
          echo "DISPATCHED clean_sha=$CLEAN_SHA"
