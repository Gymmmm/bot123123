name: production-extraction-check

on:
  push:
    branches:
      - refactor/production-extraction
  workflow_dispatch:

permissions:
  contents: write

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install runtime dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r qiaolian_production/requirements.txt
      - name: Compile extracted runtime
        run: python -m compileall -q qiaolian_production
      - name: Verify committed autopilot runtime slice
        run: |
          python qiaolian_production/tools/slim_autopilot.py
          python qiaolian_production/tools/slim_autopilot.py --write
          python -m py_compile qiaolian_production/shared/autopilot_publish_bot.py
          git diff --exit-code -- qiaolian_production/shared/autopilot_publish_bot.py
      - name: Slice and compile meihua runtime candidate
        run: |
          python qiaolian_production/tools/audit_meihua_symbols.py
          python qiaolian_production/tools/audit_meihua_symbols.py --write
          python -m py_compile qiaolian_production/shared/meihua_publisher.py
          python - <<'PY'
          import sys
          from pathlib import Path
          repo = Path.cwd().resolve()
          prod = (repo / 'qiaolian_production').resolve()
          for path in (prod / 'shared', prod / 'user', prod / 'publisher'):
              sys.path.insert(0, str(path))
          sys.path[:] = [p for p in sys.path if Path(p or '.').resolve() != repo]
          import meihua_publisher as mp
          required = {
              'MeihuaPublisher', '_album_paths_for_draft', '_parsed_normalized',
              '_public_clean_text', 'add_detail_logo_watermark',
              'assert_public_output_safe', 'build_caption', 'build_channel_caption',
              'build_chinese_listing_post', 'build_discussion_detail_text',
              'default_caption_variant_for_property', 'evaluate_publish_gate',
              'send_discussion_three_segments', 'system_listing_id_from_draft',
          }
          missing = sorted(name for name in required if not hasattr(mp, name))
          if missing:
              raise SystemExit('missing meihua production symbols: ' + repr(missing))
          assert mp.default_caption_variant_for_property('公寓') == 'a'
          assert mp.default_caption_variant_for_property('别墅') == 'b'
          assert mp.default_caption_variant_for_property('办公室') == 'c'
          print('MEIHUA_SLICE_IMPORT_OK')
          PY
      - name: Import collector from extracted tree only
        env:
          DB_PATH: '${{ runner.temp }}/qiaolian-extraction.db'
          USER_BOT_TOKEN: '123456:TESTTOKEN'
          PUBLISHER_BOT_TOKEN: '123456:TESTTOKEN'
          ADMIN_IDS: '1'
        run: |
          python - <<'PY'
          import sys
          from pathlib import Path

          repo = Path.cwd().resolve()
          prod = (repo / 'qiaolian_production').resolve()
          import qiaolian_production.run_collector as entry
          entry._activate_paths()
          entry.configure_environment()
          sys.path[:] = [p for p in sys.path if Path(p or '.').resolve() != repo]

          import collector_bot
          import ai_parser
          import publication_package
          assert collector_bot and ai_parser and publication_package

          leaks = []
          for name, module in tuple(sys.modules.items()):
              raw = getattr(module, '__file__', None)
              if not raw or name == '__main__' or str(raw).startswith('<'):
                  continue
              path = Path(raw).resolve()
              if (path == repo or repo in path.parents) and not (path == prod or prod in path.parents):
                  leaks.append((name, str(path.relative_to(repo))))
          if leaks:
              raise SystemExit('collector local-source leaks: ' + repr(sorted(leaks)))
          print('COLLECTOR_IMPORT_OK')
          PY
      - name: Import publisher from sliced extracted tree only
        env:
          DB_PATH: '${{ runner.temp }}/qiaolian-extraction.db'
          SQLITE_PATH: '${{ runner.temp }}/qiaolian-extraction.db'
          USER_BOT_TOKEN: '123456:TESTTOKEN'
          PUBLISHER_BOT_TOKEN: '123456:TESTTOKEN'
          ADMIN_IDS: '1'
          USER_BOT_USERNAME: 'test_user_bot'
          PUBLISHER_BOT_USERNAME: 'test_publisher_bot'
          CHANNEL_ID: '-1001234567890'
        run: |
          python - <<'PY'
          import sys
          from pathlib import Path

          repo = Path.cwd().resolve()
          prod = (repo / 'qiaolian_production').resolve()
          import qiaolian_production.run_publisher as entry
          entry._activate_paths()
          entry.configure_environment()
          sys.path[:] = [p for p in sys.path if Path(p or '.').resolve() != repo]

          loaded = entry._load_runtime()
          assert loaded and loaded[0]
          main, install_cover_picker, install_daily_broadcast_patch, install_media_selection_patch, install_review_queue_patch, install_release_contract_patch = loaded
          install_cover_picker()
          install_media_selection_patch()
          install_review_queue_patch()
          install_release_contract_patch()
          install_daily_broadcast_patch()
          assert main

          leaks = []
          for name, module in tuple(sys.modules.items()):
              raw = getattr(module, '__file__', None)
              if not raw or name == '__main__' or str(raw).startswith('<'):
                  continue
              path = Path(raw).resolve()
              if (path == repo or repo in path.parents) and not (path == prod or prod in path.parents):
                  leaks.append((name, str(path.relative_to(repo))))
          if leaks:
              raise SystemExit('publisher local-source leaks: ' + repr(sorted(leaks)))
          print('PUBLISHER_IMPORT_OK')
          PY
      - name: Build user bot from sliced extracted tree only
        env:
          DB_PATH: '${{ runner.temp }}/qiaolian-extraction-user.db'
          SQLITE_PATH: '${{ runner.temp }}/qiaolian-extraction-user.db'
          USER_BOT_TOKEN: '123456:TESTTOKEN'
          PUBLISHER_BOT_TOKEN: '123456:TESTTOKEN'
          ADMIN_IDS: '1'
        run: |
          python - <<'PY'
          import sys
          from pathlib import Path

          repo = Path.cwd().resolve()
          prod = (repo / 'qiaolian_production').resolve()
          import qiaolian_production.run_user as entry
          entry._activate_paths()
          entry.configure_environment()
          sys.path[:] = [p for p in sys.path if Path(p or '.').resolve() != repo]

          loaded = entry._load_runtime()
          assert loaded and loaded[0]
          import qiaolian_dual.user_bot as user_bot
          app = user_bot.build_application()
          assert app is not None

          leaks = []
          for name, module in tuple(sys.modules.items()):
              raw = getattr(module, '__file__', None)
              if not raw or name == '__main__' or str(raw).startswith('<'):
                  continue
              path = Path(raw).resolve()
              if (path == repo or repo in path.parents) and not (path == prod or prod in path.parents):
                  leaks.append((name, str(path.relative_to(repo))))
          if leaks:
              raise SystemExit('user local-source leaks: ' + repr(sorted(leaks)))
          print('USER_BUILD_OK')
          PY
      - name: Commit validated meihua slice
        if: github.event_name == 'push'
        run: |
          if git diff --quiet -- qiaolian_production/shared/meihua_publisher.py; then
            echo 'MEIHUA_SLICE_ALREADY_COMMITTED=1'
            exit 0
          fi
          git diff --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add qiaolian_production/shared/meihua_publisher.py
          git commit -m 'refactor: slim meihua production runtime'
          git push origin HEAD:refactor/production-extraction
