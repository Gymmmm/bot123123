name: production-extraction-check

on:
  push:
    branches:
      - refactor/production-extraction
  workflow_dispatch:

permissions:
  contents: write

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install runtime dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r qiaolian_production/requirements.txt
      - name: Compile extracted runtime
        run: python -m compileall -q qiaolian_production
      - name: Verify committed autopilot runtime slice
        run: |
          python qiaolian_production/tools/slim_autopilot.py
          python qiaolian_production/tools/slim_autopilot.py --write
          python -m py_compile qiaolian_production/shared/autopilot_publish_bot.py
          git diff --exit-code -- qiaolian_production/shared/autopilot_publish_bot.py
      - name: Verify committed meihua runtime slice
        run: |
          python qiaolian_production/tools/audit_meihua_symbols.py
          python qiaolian_production/tools/audit_meihua_symbols.py --write
          python -m py_compile qiaolian_production/shared/meihua_publisher.py
          git diff --exit-code -- qiaolian_production/shared/meihua_publisher.py
      - name: Verify committed publication package slice
        run: |
          python qiaolian_production/tools/audit_publication_package_symbols.py
          python qiaolian_production/tools/audit_publication_package_symbols.py --write
          python -m py_compile qiaolian_production/collector/publication_package.py
          git diff --exit-code -- qiaolian_production/collector/publication_package.py
      - name: Verify committed PublisherBot slice
        run: |
          python qiaolian_production/tools/audit_publisher_bot_methods.py
          python qiaolian_production/tools/audit_publisher_bot_methods.py --write
          python -m py_compile qiaolian_production/publisher/qiaolian_publisher_v2/bot.py
          git diff --exit-code -- qiaolian_production/publisher/qiaolian_publisher_v2/bot.py
      - name: Audit publisher package module reachability
        run: python qiaolian_production/tools/audit_publisher_modules.py
      - name: Verify committed formatter slice
        run: |
          python qiaolian_production/tools/audit_publisher_formatters.py
          python qiaolian_production/tools/audit_publisher_formatters.py --write
          python -m py_compile qiaolian_production/publisher/qiaolian_publisher_v2/formatters.py
          git diff --exit-code -- qiaolian_production/publisher/qiaolian_publisher_v2/formatters.py
      - name: Verify committed keyboard slice
        run: |
          python qiaolian_production/tools/audit_publisher_keyboards.py
          python qiaolian_production/tools/audit_publisher_keyboards.py --write
          python -m py_compile qiaolian_production/publisher/qiaolian_publisher_v2/keyboards.py
          git diff --exit-code -- qiaolian_production/publisher/qiaolian_publisher_v2/keyboards.py
      - name: Audit publisher message constants
        run: python qiaolian_production/tools/audit_publisher_messages.py
      - name: Audit user bot module reachability
        run: python qiaolian_production/tools/audit_user_modules.py
      - name: Import collector from extracted tree only
        env:
          DB_PATH: '${{ runner.temp }}/qiaolian-extraction.db'
          USER_BOT_TOKEN: '123456:TESTTOKEN'
          PUBLISHER_BOT_TOKEN: '123456:TESTTOKEN'
          ADMIN_IDS: '1'
        run: |
          python - <<'PY'
          import sys
          from pathlib import Path
          repo = Path.cwd().resolve()
          prod = (repo / 'qiaolian_production').resolve()
          import qiaolian_production.run_collector as entry
          entry._activate_paths(); entry.configure_environment()
          sys.path[:] = [p for p in sys.path if Path(p or '.').resolve() != repo]
          import collector_bot, ai_parser, publication_package
          assert collector_bot and ai_parser and publication_package
          leaks=[]
          for name,module in tuple(sys.modules.items()):
              raw=getattr(module,'__file__',None)
              if not raw or name=='__main__' or str(raw).startswith('<'): continue
              path=Path(raw).resolve()
              if (path==repo or repo in path.parents) and not (path==prod or prod in path.parents): leaks.append((name,str(path.relative_to(repo))))
          if leaks: raise SystemExit('collector local-source leaks: '+repr(sorted(leaks)))
          print('COLLECTOR_IMPORT_OK')
          PY
      - name: Import publisher with all production patches
        env:
          DB_PATH: '${{ runner.temp }}/qiaolian-extraction.db'
          SQLITE_PATH: '${{ runner.temp }}/qiaolian-extraction.db'
          USER_BOT_TOKEN: '123456:TESTTOKEN'
          PUBLISHER_BOT_TOKEN: '123456:TESTTOKEN'
          ADMIN_IDS: '1'
          USER_BOT_USERNAME: 'test_user_bot'
          PUBLISHER_BOT_USERNAME: 'test_publisher_bot'
          CHANNEL_ID: '-1001234567890'
        run: |
          python - <<'PY'
          import sys
          from pathlib import Path
          repo=Path.cwd().resolve(); prod=(repo/'qiaolian_production').resolve()
          import qiaolian_production.run_publisher as entry
          entry._activate_paths(); entry.configure_environment()
          sys.path[:]=[p for p in sys.path if Path(p or '.').resolve()!=repo]
          main,cover,daily,media,review,release=entry._load_runtime()
          cover(); media(); review(); release(); daily()
          from qiaolian_publisher_v2.bot import PublisherBot
          from qiaolian_publisher_v2 import formatters, keyboards
          required_f={'AREA_OPTIONS','TYPE_LABELS','CHANNEL_BUTTON_PROMPT','build_post_text','build_preview_text','normalize_tags'}
          missing=sorted(name for name in required_f if not hasattr(formatters,name))
          if missing: raise SystemExit('missing formatter production symbols: '+repr(missing))
          assert PublisherBot and keyboards and main
          leaks=[]
          for name,module in tuple(sys.modules.items()):
              raw=getattr(module,'__file__',None)
              if not raw or name=='__main__' or str(raw).startswith('<'): continue
              path=Path(raw).resolve()
              if (path==repo or repo in path.parents) and not (path==prod or prod in path.parents): leaks.append((name,str(path.relative_to(repo))))
          if leaks: raise SystemExit('publisher local-source leaks: '+repr(sorted(leaks)))
          print('PUBLISHER_IMPORT_OK')
          PY
      - name: Build user bot from extracted tree only
        env:
          DB_PATH: '${{ runner.temp }}/qiaolian-extraction-user.db'
          SQLITE_PATH: '${{ runner.temp }}/qiaolian-extraction-user.db'
          USER_BOT_TOKEN: '123456:TESTTOKEN'
          PUBLISHER_BOT_TOKEN: '123456:TESTTOKEN'
          ADMIN_IDS: '1'
        run: |
          python - <<'PY'
          import sys
          from pathlib import Path
          repo=Path.cwd().resolve(); prod=(repo/'qiaolian_production').resolve()
          import qiaolian_production.run_user as entry
          entry._activate_paths(); entry.configure_environment()
          sys.path[:]=[p for p in sys.path if Path(p or '.').resolve()!=repo]
          loaded=entry._load_runtime(); assert loaded and loaded[0]
          import qiaolian_dual.user_bot as user_bot
          assert user_bot.build_application() is not None
          leaks=[]
          for name,module in tuple(sys.modules.items()):
              raw=getattr(module,'__file__',None)
              if not raw or name=='__main__' or str(raw).startswith('<'): continue
              path=Path(raw).resolve()
              if (path==repo or repo in path.parents) and not (path==prod or prod in path.parents): leaks.append((name,str(path.relative_to(repo))))
          if leaks: raise SystemExit('user local-source leaks: '+repr(sorted(leaks)))
          print('USER_BUILD_OK')
          PY
