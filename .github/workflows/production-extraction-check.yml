name: production-extraction-check

on:
  push:
    branches:
      - refactor/production-extraction
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install runtime dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r qiaolian_production/requirements.txt
      - name: Compile extracted runtime
        run: python -m compileall -q qiaolian_production
      - name: Import collector from extracted tree only
        env:
          DB_PATH: '${{ runner.temp }}/qiaolian-extraction.db'
          USER_BOT_TOKEN: '123456:TESTTOKEN'
          PUBLISHER_BOT_TOKEN: '123456:TESTTOKEN'
          ADMIN_IDS: '1'
        run: |
          python - <<'PY'
          import sys
          from pathlib import Path
          import qiaolian_production.run_collector as entry
          entry._activate_paths()
          entry.configure_environment()
          import collector_bot
          repo = Path.cwd().resolve()
          prod = (repo / 'qiaolian_production').resolve()
          leaks = []
          for name, module in tuple(sys.modules.items()):
              raw = getattr(module, '__file__', None)
              if not raw or name == '__main__' or str(raw).startswith('<'):
                  continue
              path = Path(raw).resolve()
              if (path == repo or repo in path.parents) and not (path == prod or prod in path.parents):
                  leaks.append((name, str(path.relative_to(repo))))
          if leaks:
              raise SystemExit('collector local-source leaks: ' + repr(sorted(leaks)))
          print('COLLECTOR_IMPORT_OK')
          PY
      - name: Import publisher from extracted tree only
        env:
          DB_PATH: '${{ runner.temp }}/qiaolian-extraction.db'
          SQLITE_PATH: '${{ runner.temp }}/qiaolian-extraction.db'
          USER_BOT_TOKEN: '123456:TESTTOKEN'
          PUBLISHER_BOT_TOKEN: '123456:TESTTOKEN'
          ADMIN_IDS: '1'
          USER_BOT_USERNAME: 'test_user_bot'
          PUBLISHER_BOT_USERNAME: 'test_publisher_bot'
          CHANNEL_ID: '-1001234567890'
        run: |
          python - <<'PY'
          import sys
          from pathlib import Path
          import qiaolian_production.run_publisher as entry
          loaded = entry._load_runtime()
          assert loaded and loaded[0]
          repo = Path.cwd().resolve()
          prod = (repo / 'qiaolian_production').resolve()
          leaks = []
          for name, module in tuple(sys.modules.items()):
              raw = getattr(module, '__file__', None)
              if not raw or name == '__main__' or str(raw).startswith('<'):
                  continue
              path = Path(raw).resolve()
              if (path == repo or repo in path.parents) and not (path == prod or prod in path.parents):
                  leaks.append((name, str(path.relative_to(repo))))
          if leaks:
              raise SystemExit('publisher local-source leaks: ' + repr(sorted(leaks)))
          print('PUBLISHER_IMPORT_OK')
          PY
      - name: Import user bot from extracted tree only
        env:
          DB_PATH: '${{ runner.temp }}/qiaolian-extraction-user.db'
          SQLITE_PATH: '${{ runner.temp }}/qiaolian-extraction-user.db'
          USER_BOT_TOKEN: '123456:TESTTOKEN'
          PUBLISHER_BOT_TOKEN: '123456:TESTTOKEN'
          ADMIN_IDS: '1'
        run: |
          python - <<'PY'
          import sys
          from pathlib import Path
          import qiaolian_production.run_user as entry
          loaded = entry._load_runtime()
          assert loaded and loaded[0]
          repo = Path.cwd().resolve()
          prod = (repo / 'qiaolian_production').resolve()
          leaks = []
          for name, module in tuple(sys.modules.items()):
              raw = getattr(module, '__file__', None)
              if not raw or name == '__main__' or str(raw).startswith('<'):
                  continue
              path = Path(raw).resolve()
              if (path == repo or repo in path.parents) and not (path == prod or prod in path.parents):
                  leaks.append((name, str(path.relative_to(repo))))
          if leaks:
              raise SystemExit('user local-source leaks: ' + repr(sorted(leaks)))
          print('USER_IMPORT_OK')
          PY
