name: tmp-master-media-regression
on:
  push:
    branches: [master]
    paths:
      - '.github/workflows/tmp-master-media-regression.yml'
permissions:
  contents: read
jobs:
  regression:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install dependencies
        run: |
          set -Eeuo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y fonts-noto-cjk
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt pytest pytest-asyncio pillow numpy opencv-python-headless
      - name: Compile V3 and media pipeline
        env:
          PYTHONPATH: ${{ github.workspace }}
        run: |
          set -Eeuo pipefail
          python -m compileall -q v3_core tests/v3_core media_pipeline run_v3_collector.py run_v3_canonical_worker.py run_v3_publisher_bot.py run_v3_user_bot.py run_v3_preflight.py
      - name: Run complete V3 regression
        env:
          PYTHONPATH: ${{ github.workspace }}
        run: |
          set -Eeuo pipefail
          python -m pytest -q tests/v3_core
      - name: Run media pipeline unit tests if present
        env:
          PYTHONPATH: ${{ github.workspace }}
        run: |
          set -Eeuo pipefail
          if find tests -type f -iname '*media*' -print -quit | grep -q .; then
            python -m pytest -q $(find tests -type f -iname '*media*' -print)
          else
            echo 'NO_MEDIA_TEST_FILES'
          fi
