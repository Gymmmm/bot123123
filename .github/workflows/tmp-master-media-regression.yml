name: tmp-master-media-regression
on:
  push:
    branches: [master]
    paths:
      - '.github/workflows/tmp-master-media-regression.yml'
permissions:
  contents: read
jobs:
  regression:
    runs-on: ubuntu-latest
    env:
      PROD_SHA: aaf7b3d8365641557d866aef798447191308d6dc
    steps:
      - name: Checkout workflow/master
        uses: actions/checkout@v4
        with:
          path: master_tree
      - name: Checkout production V3 snapshot
        uses: actions/checkout@v4
        with:
          ref: ${{ env.PROD_SHA }}
          path: prod
      - name: Install dependencies
        run: |
          set -Eeuo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y fonts-noto-cjk
          python -m pip install --upgrade pip
          python -m pip install -r prod/requirements.txt pytest pytest-asyncio pillow numpy opencv-python-headless
      - name: Compile production V3
        working-directory: prod
        env:
          PYTHONPATH: ${{ github.workspace }}/prod
        run: |
          set -Eeuo pipefail
          python -m compileall -q v3_core tests/v3_core run_v3_collector.py run_v3_canonical_worker.py run_v3_publisher_bot.py run_v3_user_bot.py run_v3_preflight.py
      - name: Run complete production V3 regression
        working-directory: prod
        env:
          PYTHONPATH: ${{ github.workspace }}/prod
        run: |
          set -Eeuo pipefail
          python -m pytest -q tests/v3_core
      - name: Compile merged media pipeline separately
        working-directory: master_tree
        run: |
          set -Eeuo pipefail
          python -m compileall -q media_pipeline
