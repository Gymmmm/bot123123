name: attribution-rebase-full-check

on:
  push:
    branches:
      - codex/attribution-rebase-rehearsal-20260905
  workflow_dispatch:

jobs:
  attribution-check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      USER_BOT_TOKEN: '123456:TESTTOKEN'
      PUBLISHER_BOT_TOKEN: '123456:TESTTOKEN'
      DB_PATH: '${{ runner.temp }}/attribution.db'
      PYTHONPATH: '${{ github.workspace }}'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/attribution-rebase-rehearsal-20260905
          fetch-depth: 2
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt pytest pytest-asyncio
      - name: Syntax check touched modules
        run: python -m compileall -q qiaolian_dual tests/test_attribution_admin_ui.py
      - name: Attribution related tests
        run: python -m pytest tests/test_attribution_admin.py tests/test_lead_workflow.py tests/test_user_start_payload.py tests/test_attribution_admin_ui.py -q
