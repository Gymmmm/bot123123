name: attribution-rebase-full-check

on:
  push:
    branches:
      - codex/attribution-rebase-rehearsal-20260905
  workflow_dispatch:

jobs:
  full-check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/attribution-rebase-rehearsal-20260905
          fetch-depth: 2
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt pytest pytest-asyncio
      - name: Syntax and import check
        env:
          USER_BOT_TOKEN: '123456:TESTTOKEN'
          PUBLISHER_BOT_TOKEN: '123456:TESTTOKEN'
          DB_PATH: '${{ runner.temp }}/syntax.db'
          PYTHONPATH: '${{ github.workspace }}'
        run: |
          python -m compileall -q qiaolian_dual v2/qiaolian_publisher_v2 tests
          python -c "from qiaolian_dual.user_bot import build_application; assert build_application() is not None"
          (cd v2 && env -u PYTHONPATH python -c "import run_publisher_bot_v2; print('PUBLISHER_IMPORT_OK')")
      - name: Full repository pytest
        env:
          USER_BOT_TOKEN: '123456:TESTTOKEN'
          PUBLISHER_BOT_TOKEN: '123456:TESTTOKEN'
          DB_PATH: '${{ runner.temp }}/full.db'
          PYTHONPATH: '${{ github.workspace }}'
        run: python -m pytest -q
