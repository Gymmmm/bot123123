name: qiaolian-second-batch-runtime

on:
  push:
    branches:
      - codex/qiaolian-ui-cleanup-20260829
    paths:
      - scripts/second_batch_runtime_patch.py
      - scripts/second_batch_runtime_fix.py
      - .github/workflows/qiaolian-second-batch-runtime.yml

permissions:
  contents: write

jobs:
  patch-test-push:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/qiaolian-ui-cleanup-20260829
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Apply second batch patch
        run: |
          python scripts/second_batch_runtime_patch.py
          python scripts/second_batch_runtime_fix.py
      - name: Install dependencies
        run: python -m pip install -r requirements.txt pytest pytest-asyncio
      - name: Syntax and import checks
        env:
          USER_BOT_TOKEN: '123456:TESTTOKEN'
          PUBLISHER_BOT_TOKEN: '123456:TESTTOKEN'
          DB_PATH: '${{ runner.temp }}/second-batch.db'
        run: |
          python -m compileall -q qiaolian_dual tests/test_second_batch_runtime_contract.py tests/test_callback_route_repair.py tests/test_callback_route_static_guards.py tests/test_appointment_mobile_copy.py tests/test_user_ui_cleanup.py tests/test_customer_path_regression.py
          python -c "import qiaolian_dual.user_bot"
          python -c "from qiaolian_dual.user_bot import build_application; assert build_application() is not None"
      - name: Non-outbound regression
        env:
          PYTHONPATH: '${{ github.workspace }}'
          USER_BOT_TOKEN: '123456:TESTTOKEN'
          PUBLISHER_BOT_TOKEN: '123456:TESTTOKEN'
          DB_PATH: '${{ runner.temp }}/second-batch.db'
        run: |
          python -m pytest -q \
            tests/test_second_batch_runtime_contract.py \
            tests/test_callback_route_repair.py \
            tests/test_callback_route_static_guards.py \
            tests/test_appointment_mobile_copy.py \
            tests/test_user_ui_cleanup.py \
            tests/test_customer_path_regression.py \
            tests/test_daily_broadcast_rotation.py \
            tests/test_tg_album_45.py \
            tests/test_cover_theme_regression.py \
            tests/test_prelaunch_product_contract.py
      - name: Commit and push code only
        run: |
          git config user.name "Gymmmm"
          git config user.email "73370798+Gymmmm@users.noreply.github.com"
          git add qiaolian_dual tests/test_second_batch_runtime_contract.py tests/test_callback_route_repair.py tests/test_user_ui_cleanup.py
          git diff --cached --quiet && exit 0
          git commit -m "unify listing availability and callback runtime"
          git pull --rebase origin codex/qiaolian-ui-cleanup-20260829
          git push origin HEAD:codex/qiaolian-ui-cleanup-20260829
