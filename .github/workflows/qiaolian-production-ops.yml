name: qiaolian-production-ops

on:
  push:
    branches: [codex/qiaolian-ui-cleanup-20260829]
    paths: [.github/ops-control/request.txt]

permissions:
  contents: read

concurrency:
  group: qiaolian-production-ops
  cancel-in-progress: false

env:
  PROD_HOST: 50.114.74.120
  PROD_PORT: '22'
  PROD_SSH_USER: root
  PROD_SSH_HOST_FINGERPRINT: 'SHA256:fuufBlFaqRpQhlkio0vuLsuv8w8x3zUb3VFQsnUny/o'

jobs:
  production-ops:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out control revision
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false

      - name: Resolve operation
        id: request
        run: |
          set -Eeuo pipefail
          request=$(<.github/ops-control/request.txt)
          test "$(printf '%s\n' "$request" | wc -l | tr -d ' ')" = 2
          action=$(printf '%s\n' "$request" | sed -n '1p')
          request_id=$(printf '%s\n' "$request" | sed -n '2p')
          [[ "$request_id" =~ ^[A-Za-z0-9._:-]{1,80}$ ]]
          case "$action" in health|plan-zufang555-50) ;; *) exit 2 ;; esac
          printf 'action=%s\n' "$action" >> "$GITHUB_OUTPUT"

      - name: Verify production SSH host key
        run: |
          set -Eeuo pipefail
          ssh-keyscan -T 10 -p "$PROD_PORT" -t ed25519 "$PROD_HOST" 2>/dev/null | grep -v '^#' > "$RUNNER_TEMP/known_hosts_observed"
          ssh-keygen -lf "$RUNNER_TEMP/known_hosts_observed" | grep -F "$PROD_SSH_HOST_FINGERPRINT"

      - name: Configure production SSH
        env:
          PROD_SSH_PRIVATE_KEY: '${{ secrets.PROD_SSH_PRIVATE_KEY }}'
        run: |
          set -Eeuo pipefail
          install -d -m 700 "$HOME/.ssh"
          printf '%s\n' "$PROD_SSH_PRIVATE_KEY" > "$HOME/.ssh/qiaolian_production"
          cp "$RUNNER_TEMP/known_hosts_observed" "$HOME/.ssh/known_hosts"
          chmod 600 "$HOME/.ssh/qiaolian_production" "$HOME/.ssh/known_hosts"

      - name: Run production preflight
        env:
          OPS_ACTION: '${{ steps.request.outputs.action }}'
        run: |
          set -Eeuo pipefail
          ssh -p "$PROD_PORT" -i "$HOME/.ssh/qiaolian_production" -o BatchMode=yes -o IdentitiesOnly=yes -o ConnectTimeout=20 "$PROD_SSH_USER@$PROD_HOST" "bash -s -- '$OPS_ACTION'" <<'REMOTE'
          set -Eeuo pipefail
          ACTION=$1
          ROOT=/opt/qiaolian_v3
          V3="$ROOT/current"
          VENV="$ROOT/.venv"
          RUNTIME_ENV="$ROOT/runtime.env"
          DB=/opt/qiaolian_dual_bots/data/qiaolian_dual_bot.db

          health() {
            echo "DEPLOYED_SHA=$(tr -cd '0-9a-fA-F' < "$ROOT/.deployed_sha")"
            for s in collector canonical publisher user; do
              systemctl show "qiaolian-v3@$s.service" -p ActiveState -p SubState -p MainPID -p NRestarts --no-pager | tr '\n' ' '
              echo " service=$s"
            done
          }

          plan_latest50() {
            set -a; source "$RUNTIME_ENV"; set +a
            SESSION_BASE="${TELETHON_SESSION_PATH:-}"
            if [ -z "$SESSION_BASE" ]; then SESSION_BASE="$V3/telethon_sessions/${COLLECTOR_SESSION_NAME:-qiaolian_collector}"; fi
            if [ -f "$SESSION_BASE" ]; then SESSION_FILE="$SESSION_BASE"; elif [ -f "$SESSION_BASE.session" ]; then SESSION_FILE="$SESSION_BASE.session"; else echo SESSION_NOT_FOUND; exit 3; fi
            TMP=$(mktemp -d /var/tmp/qiaolian-live50-plan.XXXXXX)
            trap 'rm -rf "$TMP"' RETURN
            chown qiaolianbot:qiaolianbot "$TMP"; chmod 0750 "$TMP"
            cp "$SESSION_FILE" "$TMP/read.session"; chown qiaolianbot:qiaolianbot "$TMP/read.session"
            runuser -u qiaolianbot -- env \
              PYTHONPATH="$V3" DB_PATH="$DB" COLLECTOR_SOURCES_JSON="$V3/sources.json" \
              TELETHON_SESSION_PATH="$TMP/read" TG_API_ID="$TG_API_ID" TG_API_HASH="$TG_API_HASH" \
              "$VENV/bin/python" - <<'PY'
          import asyncio,json,os,sqlite3
          from collections import defaultdict
          from telethon import TelegramClient
          from v3_core.ingest.telegram_collector import load_sources

          async def main():
              sources=load_sources(os.environ['COLLECTOR_SOURCES_JSON'])
              cfg=next(dict(x) for x in sources if str(x.get('source_name'))=='zufang555')
              client=TelegramClient(os.environ['TELETHON_SESSION_PATH'],int(os.environ['TG_API_ID']),os.environ['TG_API_HASH'])
              await client.start()
              try:
                  entity=await client.get_entity(cfg['entity_id'])
                  msgs=[]
                  async for m in client.iter_messages(entity,limit=1200): msgs.append(m)
              finally:
                  await client.disconnect()
              grouped=defaultdict(list); singles=[]
              for m in msgs:
                  gid=getattr(m,'grouped_id',None)
                  (grouped[int(gid)] if gid is not None else singles).append(m)
              units=[]
              for gid,parts in grouped.items():
                  parts=sorted(parts,key=lambda m:int(m.id)); units.append((max(int(m.id) for m in parts),f'album_{gid}',len(parts)))
              for m in singles: units.append((int(m.id),str(m.id),1))
              units=sorted(units,key=lambda x:x[0],reverse=True)[:50]
              units=list(reversed(units))

              db=sqlite3.connect(f"file:{os.environ['DB_PATH']}?mode=ro",uri=True); db.row_factory=sqlite3.Row; db.execute('PRAGMA query_only=ON')
              out=[]; missing_source=[]; with_identity=0; mapped=0
              for anchor,key,count in units:
                  s=db.execute("SELECT id,parse_status FROM source_posts WHERE source_name='zufang555' AND source_post_id=? ORDER BY id DESC LIMIT 1",(key,)).fetchone()
                  if not s:
                      missing_source.append({'anchor':anchor,'key':key,'messages':count}); continue
                  ident=db.execute("""SELECT r.listing_id,r.public_id,c.canonical_record_id FROM canonical_records c JOIN listing_identity_reservations_v3 r ON r.canonical_record_id=c.canonical_record_id WHERE c.source_post_id=? ORDER BY c.created_at DESC,c.canonical_record_id DESC LIMIT 1""",(str(s['id']),)).fetchone()
                  listing=str(ident['listing_id']) if ident else ''
                  if ident: with_identity+=1
                  pub=db.execute("SELECT instance_id,package_id,offer_id,channel_message_id,publish_status FROM publication_instances WHERE platform='telegram' AND listing_id=? AND CAST(COALESCE(channel_message_id,'0') AS INTEGER)>0 ORDER BY updated_at DESC LIMIT 1",(listing,)).fetchone() if listing else None
                  if pub: mapped+=1
                  out.append({'anchor':anchor,'key':key,'messages':count,'source_pk':int(s['id']),'parse_status':s['parse_status'],'listing_id':listing,'public_id':ident['public_id'] if ident else None,'channel_message_id':int(pub['channel_message_id']) if pub else None,'instance_id':pub['instance_id'] if pub else None})
              print('LIVE50_SUMMARY',json.dumps({'logical_groups':len(units),'source_rows':len(out),'missing_source':len(missing_source),'with_identity':with_identity,'mapped_publications':mapped},ensure_ascii=False))
              print('LIVE50',json.dumps(out,ensure_ascii=False))
              if missing_source: print('LIVE50_MISSING_SOURCE',json.dumps(missing_source,ensure_ascii=False))
              targets=[dict(r) for r in db.execute("SELECT instance_id,package_id,listing_id,offer_id,channel_message_id,publish_status FROM publication_instances WHERE platform='telegram' AND CAST(COALESCE(channel_message_id,'0') AS INTEGER)>0 ORDER BY CAST(channel_message_id AS INTEGER) DESC LIMIT 50").fetchall()]
              targets=list(reversed(targets))
              print('TARGET50',json.dumps(targets,ensure_ascii=False))
              print('TARGET50_COUNT',len(targets))
              db.close()
          asyncio.run(main())
          PY
          }

          case "$ACTION" in health) health ;; plan-zufang555-50) plan_latest50; health ;; *) exit 2 ;; esac
          REMOTE

      - name: Remove SSH material
        if: always()
        run: rm -f "$HOME/.ssh/qiaolian_production"
