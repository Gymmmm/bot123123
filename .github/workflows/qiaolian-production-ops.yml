name: qiaolian-production-ops

on:
  workflow_dispatch:
    inputs:
      action:
        description: 'Safe production operation'
        required: true
        default: inspect
        type: choice
        options:
          - inspect
          - latest-draft
          - health
          - logs
          - restart

permissions:
  contents: read

concurrency:
  group: qiaolian-production-ops
  cancel-in-progress: false

env:
  PROD_HOST: 50.114.74.120
  PROD_PORT: '22'
  PROD_SSH_USER: root
  PROD_SSH_KNOWN_HOSTS: '50.114.74.120 ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAILuFtkSn5SJKY7mZ52Lc/QydPRTvHFpsj87M/HcIkb/L'
  PROD_SSH_HOST_FINGERPRINT: 'SHA256:sgqLYOUAZ482H3y5jREQ6q2BVvNFPXYiOg4ruyFVnsA'

jobs:
  production-ops:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Verify production SSH host key
        run: |
          set -Eeuo pipefail
          ssh-keyscan -T 10 -p "$PROD_PORT" -t ed25519 "$PROD_HOST" 2>/dev/null | grep -v '^#' > "$RUNNER_TEMP/known_hosts_observed"
          ssh-keygen -lf "$RUNNER_TEMP/known_hosts_observed" | grep -F "$PROD_SSH_HOST_FINGERPRINT"

      - name: Configure production SSH
        env:
          PROD_SSH_PRIVATE_KEY: '${{ secrets.PROD_SSH_PRIVATE_KEY }}'
        run: |
          set -Eeuo pipefail
          test -n "$PROD_SSH_PRIVATE_KEY"
          install -d -m 700 "$HOME/.ssh"
          printf '%s\n' "$PROD_SSH_PRIVATE_KEY" > "$HOME/.ssh/qiaolian_production"
          printf '%s\n' "$PROD_SSH_KNOWN_HOSTS" > "$HOME/.ssh/known_hosts"
          chmod 600 "$HOME/.ssh/qiaolian_production" "$HOME/.ssh/known_hosts"

      - name: Run safe production operation
        env:
          OPS_ACTION: '${{ inputs.action }}'
        run: |
          set -Eeuo pipefail
          ssh -p "$PROD_PORT" -i "$HOME/.ssh/qiaolian_production" -o BatchMode=yes -o IdentitiesOnly=yes -o ConnectTimeout=20 "$PROD_SSH_USER@$PROD_HOST" "bash -s -- '$OPS_ACTION'" <<'REMOTE'
          set -Eeuo pipefail
          ACTION=$1
          APP=/opt/qiaolian_dual_bots
          DB="$APP/data/qiaolian_dual_bot.db"
          SERVICES=(qiaolian-user-bot.service qiaolian-publisher-bot.service qiaolian-collector.service)

          test -d "$APP"
          test -f "$DB"

          health() {
            echo '=== DEPLOYED SHA ==='
            cat "$APP/.deployed_sha" 2>/dev/null || git -c safe.directory="$APP" -C "$APP" rev-parse HEAD
            echo '=== SERVICES ==='
            for s in "${SERVICES[@]}"; do
              printf '%s: ' "$s"
              systemctl is-active "$s" || true
              systemctl show "$s" -p MainPID -p NRestarts --no-pager
            done
            echo '=== DISK ==='
            df -h "$APP"
          }

          latest_draft() {
            echo '=== LATEST DRAFT SUMMARY ==='
            sqlite3 -readonly "$DB" <<'SQL'
          .headers on
          .mode line
          SELECT id,draft_id,source_post_id,listing_id,title,project,community,area,property_type,price,layout,size,floor,deposit,available_date,review_status,review_note,cover_asset_id,approved_at,published_at,created_at,updated_at,canonical_facts_schema,public_location_key,public_location_display,publication_location_level,canonical_area_key,property_subtype,project_brand,quality_json
          FROM drafts ORDER BY id DESC LIMIT 1;
          SQL
            echo '=== LATEST CANONICAL FACTS ==='
            sqlite3 -readonly "$DB" "SELECT normalized_data FROM drafts ORDER BY id DESC LIMIT 1;" | python3 -m json.tool 2>/dev/null || true
            echo '=== COUNTS ==='
            sqlite3 -readonly "$DB" <<'SQL'
          .headers on
          .mode column
          SELECT 'drafts' AS item, COUNT(*) AS count FROM drafts
          UNION ALL SELECT 'listings', COUNT(*) FROM listings
          UNION ALL SELECT 'media_assets', COUNT(*) FROM media_assets
          UNION ALL SELECT 'publication_packages', COUNT(*) FROM publication_packages;
          SQL
          }

          logs() {
            echo '=== RECENT ERRORS ==='
            journalctl -u qiaolian-user-bot.service -u qiaolian-publisher-bot.service -u qiaolian-collector.service --since '-30 minutes' --no-pager -n 300 | tail -n 300
          }

          case "$ACTION" in
            health)
              health
              ;;
            latest-draft)
              latest_draft
              ;;
            logs)
              logs
              ;;
            inspect)
              health
              latest_draft
              echo '=== RECENT LOGS ==='
              logs
              ;;
            restart)
              echo '=== RESTART SERVICES ==='
              systemctl restart "${SERVICES[@]}"
              sleep 3
              for s in "${SERVICES[@]}"; do systemctl is-active --quiet "$s"; done
              health
              ;;
            *)
              echo "Unsupported action: $ACTION" >&2
              exit 2
              ;;
          esac
          REMOTE
