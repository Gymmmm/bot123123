name: qiaolian-production-ops

on:
  push:
    branches: [codex/qiaolian-ui-cleanup-20260829]
    paths: [.github/ops-control/request.txt]
  workflow_dispatch:
    inputs:
      action:
        description: Safe production operation
        required: true
        default: health
        type: choice
        options: [health, plan-zufang555-50]

permissions:
  contents: read

concurrency:
  group: qiaolian-production-ops
  cancel-in-progress: false

env:
  PROD_HOST: 50.114.74.120
  PROD_PORT: '22'
  PROD_SSH_USER: root
  PROD_SSH_HOST_FINGERPRINT: 'SHA256:fuufBlFaqRpQhlkio0vuLsuv8w8x3zUb3VFQsnUny/o'

jobs:
  production-ops:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out control revision
        if: github.event_name == 'push'
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false

      - name: Resolve operation
        id: request
        env:
          DISPATCH_ACTION: '${{ inputs.action }}'
          EVENT_NAME: '${{ github.event_name }}'
        run: |
          set -Eeuo pipefail
          if [[ "$EVENT_NAME" == workflow_dispatch ]]; then
            action=$DISPATCH_ACTION
          else
            request=$(<.github/ops-control/request.txt)
            test "$(printf '%s\n' "$request" | wc -l | tr -d ' ')" = 2
            action=$(printf '%s\n' "$request" | sed -n '1p')
            request_id=$(printf '%s\n' "$request" | sed -n '2p')
            [[ "$request_id" =~ ^[A-Za-z0-9._:-]{1,80}$ ]]
          fi
          case "$action" in health|plan-zufang555-50) ;; *) exit 2 ;; esac
          printf 'action=%s\n' "$action" >> "$GITHUB_OUTPUT"

      - name: Verify production SSH host key
        run: |
          set -Eeuo pipefail
          ssh-keyscan -T 10 -p "$PROD_PORT" -t ed25519 "$PROD_HOST" 2>/dev/null | grep -v '^#' > "$RUNNER_TEMP/known_hosts_observed"
          ssh-keygen -lf "$RUNNER_TEMP/known_hosts_observed" | grep -F "$PROD_SSH_HOST_FINGERPRINT"

      - name: Configure production SSH
        env:
          PROD_SSH_PRIVATE_KEY: '${{ secrets.PROD_SSH_PRIVATE_KEY }}'
        run: |
          set -Eeuo pipefail
          install -d -m 700 "$HOME/.ssh"
          printf '%s\n' "$PROD_SSH_PRIVATE_KEY" > "$HOME/.ssh/qiaolian_production"
          cp "$RUNNER_TEMP/known_hosts_observed" "$HOME/.ssh/known_hosts"
          chmod 600 "$HOME/.ssh/qiaolian_production" "$HOME/.ssh/known_hosts"

      - name: Run production preflight
        env:
          OPS_ACTION: '${{ steps.request.outputs.action }}'
        run: |
          set -Eeuo pipefail
          ssh -p "$PROD_PORT" -i "$HOME/.ssh/qiaolian_production" -o BatchMode=yes -o IdentitiesOnly=yes -o ConnectTimeout=20 "$PROD_SSH_USER@$PROD_HOST" "bash -s -- '$OPS_ACTION'" <<'REMOTE'
          set -Eeuo pipefail
          ACTION=$1
          ROOT=/opt/qiaolian_v3
          DB="${DB_PATH:-/opt/qiaolian_dual_bots/data/qiaolian_dual_bot.db}"
          VENV="$ROOT/.venv"
          case "$ACTION" in health|plan-zufang555-50) ;; *) exit 2 ;; esac

          health() {
            echo "DEPLOYED_SHA=$(tr -cd '0-9a-fA-F' < "$ROOT/.deployed_sha")"
            for s in collector canonical publisher user; do
              systemctl show "qiaolian-v3@$s.service" -p ActiveState -p SubState -p MainPID -p NRestarts --no-pager | tr '\n' ' '
              echo " service=$s"
            done
          }

          plan_latest50() {
            "$VENV/bin/python" - "$DB" <<'PY'
          import json, sqlite3, sys
          db_path=sys.argv[1]
          c=sqlite3.connect(f'file:{db_path}?mode=ro', uri=True)
          c.row_factory=sqlite3.Row
          c.execute('PRAGMA query_only=ON')

          rows=c.execute("SELECT id,source_post_id,source_url,raw_meta_json,parse_status FROM source_posts WHERE source_name='zufang555'").fetchall()
          source=[]
          for r in rows:
              try: meta=json.loads(r['raw_meta_json'] or '{}')
              except Exception: meta={}
              anchor=int(meta.get('anchor_message_id') or 0)
              source.append((anchor,dict(r)))
          source=sorted(source,key=lambda x:x[0],reverse=True)[:50]
          source=list(reversed(source))
          source_pks=[int(x[1]['id']) for x in source]

          placeholders=','.join('?' for _ in source_pks)
          identities={}
          if source_pks:
              for r in c.execute(f"""
                  SELECT c.source_post_id,r.listing_id,r.public_id,c.canonical_record_id
                  FROM canonical_records c
                  LEFT JOIN listing_identity_reservations_v3 r ON r.canonical_record_id=c.canonical_record_id
                  WHERE CAST(c.source_post_id AS INTEGER) IN ({placeholders})
                  ORDER BY c.created_at ASC,c.canonical_record_id ASC
              """,source_pks):
                  identities.setdefault(int(r['source_post_id']),dict(r))

          pubs={}
          listing_ids=[str(v.get('listing_id') or '') for v in identities.values() if v.get('listing_id')]
          if listing_ids:
              ph=','.join('?' for _ in listing_ids)
              for r in c.execute(f"""
                  SELECT instance_id,package_id,listing_id,offer_id,channel_message_id,publish_status
                  FROM publication_instances
                  WHERE platform='telegram' AND listing_id IN ({ph})
                    AND CAST(COALESCE(channel_message_id,'0') AS INTEGER)>0
                  ORDER BY CAST(channel_message_id AS INTEGER)
              """,listing_ids):
                  pubs[str(r['listing_id'])]=dict(r)

          mapped=[]; missing=[]
          for anchor,r in source:
              ident=identities.get(int(r['id'])) or {}
              listing=str(ident.get('listing_id') or '')
              pub=pubs.get(listing)
              item={'anchor':anchor,'source_pk':int(r['id']),'source_identity':r['source_post_id'],'parse_status':r['parse_status'],'listing_id':listing,'public_id':ident.get('public_id'),'channel_message_id':int(pub['channel_message_id']) if pub else None,'instance_id':pub.get('instance_id') if pub else None}
              (mapped if pub else missing).append(item)
          print('PLAN_SUMMARY',json.dumps({'latest50':len(source),'with_identity':len(identities),'mapped_publications':len(mapped),'missing_publication':len(missing)},ensure_ascii=False))
          print('PLAN_MAP',json.dumps(mapped,ensure_ascii=False))
          if missing:
              print('PLAN_MISSING',json.dumps(missing,ensure_ascii=False))
          allpub=c.execute("SELECT COUNT(*) FROM publication_instances WHERE platform='telegram' AND CAST(COALESCE(channel_message_id,'0') AS INTEGER)>0").fetchone()[0]
          print('TOTAL_CHANNEL_PUBLICATIONS',allpub)
          c.close()
          PY
          }

          case "$ACTION" in
            health) health ;;
            plan-zufang555-50) plan_latest50; health ;;
          esac
          REMOTE

      - name: Remove SSH material
        if: always()
        run: rm -f "$HOME/.ssh/qiaolian_production"
