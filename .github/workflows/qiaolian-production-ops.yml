name: qiaolian-production-ops

on:
  workflow_dispatch:
    inputs:
      action:
        description: Safe production operation
        required: true
        default: inspect
        type: choice
        options: [inspect, health, latest-draft, logs, restart, trial-zufang555-50]
  push:
    branches: [codex/qiaolian-ui-cleanup-20260829]
    paths: [.github/ops-control/request.txt]

permissions:
  contents: read

concurrency:
  group: qiaolian-production-ops
  cancel-in-progress: false

env:
  PROD_HOST: 50.114.74.120
  PROD_PORT: '22'
  PROD_SSH_USER: root
  PROD_SSH_HOST_FINGERPRINT: 'SHA256:fuufBlFaqRpQhlkio0vuLsuv8w8x3zUb3VFQsnUny/o'

jobs:
  production-ops:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out the exact control revision
        if: github.event_name == 'push'
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false

      - name: Read and validate requested operation
        id: request
        env:
          DISPATCH_ACTION: '${{ inputs.action }}'
          EVENT_NAME: '${{ github.event_name }}'
        run: |
          set -Eeuo pipefail
          if [[ "$EVENT_NAME" == workflow_dispatch ]]; then
            action=$DISPATCH_ACTION
          elif [[ "$EVENT_NAME" == push ]]; then
            request=$(<.github/ops-control/request.txt)
            test "$(printf '%s\n' "$request" | wc -l | tr -d ' ')" = 2
            action=$(printf '%s\n' "$request" | sed -n '1p')
            request_id=$(printf '%s\n' "$request" | sed -n '2p')
            [[ "$request_id" =~ ^[A-Za-z0-9._:-]{1,80}$ ]]
          else
            exit 2
          fi
          case "$action" in
            inspect|health|latest-draft|logs|restart|trial-zufang555-50) ;;
            *) exit 2 ;;
          esac
          printf 'action=%s\n' "$action" >> "$GITHUB_OUTPUT"

      - name: Verify production SSH host key
        run: |
          set -Eeuo pipefail
          ssh-keyscan -T 10 -p "$PROD_PORT" -t ed25519 "$PROD_HOST" 2>/dev/null | grep -v '^#' > "$RUNNER_TEMP/known_hosts_observed"
          ssh-keygen -lf "$RUNNER_TEMP/known_hosts_observed" | grep -F "$PROD_SSH_HOST_FINGERPRINT"

      - name: Configure production SSH
        env:
          PROD_SSH_PRIVATE_KEY: '${{ secrets.PROD_SSH_PRIVATE_KEY }}'
        run: |
          set -Eeuo pipefail
          test -n "$PROD_SSH_PRIVATE_KEY"
          install -d -m 700 "$HOME/.ssh"
          printf '%s\n' "$PROD_SSH_PRIVATE_KEY" > "$HOME/.ssh/qiaolian_production"
          cp "$RUNNER_TEMP/known_hosts_observed" "$HOME/.ssh/known_hosts"
          chmod 600 "$HOME/.ssh/qiaolian_production" "$HOME/.ssh/known_hosts"

      - name: Run allowlisted production operation
        env:
          OPS_ACTION: '${{ steps.request.outputs.action }}'
        run: |
          set -Eeuo pipefail
          ssh -p "$PROD_PORT" -i "$HOME/.ssh/qiaolian_production" -o BatchMode=yes -o IdentitiesOnly=yes -o ConnectTimeout=20 "$PROD_SSH_USER@$PROD_HOST" "bash -s -- '$OPS_ACTION'" <<'REMOTE'
          set -Eeuo pipefail
          ACTION=$1
          APP=/opt/qiaolian_dual_bots
          DB="$APP/data/qiaolian_dual_bot.db"
          V3=/opt/qiaolian_v3/current
          VENV=/opt/qiaolian_v3/.venv
          RUNTIME_ENV=/opt/qiaolian_v3/runtime.env
          SERVICES=(qiaolian-v3@collector.service qiaolian-v3@canonical.service qiaolian-v3@publisher.service qiaolian-v3@user.service)

          case "$ACTION" in
            inspect|health|latest-draft|logs|restart|trial-zufang555-50) ;;
            *) exit 2 ;;
          esac

          health() {
            echo '=== DEPLOYED VERSION ==='
            basename "$(readlink -f /opt/qiaolian_v3/current)"
            echo '=== SERVICES ==='
            for service in "${SERVICES[@]}"; do
              systemctl show "$service" --property=ActiveState,SubState,MainPID,NRestarts --no-pager
            done
          }

          trial_zufang555_50() {
            test -f "$DB"
            test -f "$RUNTIME_ENV"
            test -f "$V3/scripts/v3/backfill_source_history.py"
            TMP=$(mktemp -d /var/tmp/qiaolian-zufang555-50.XXXXXX)
            trap 'rm -rf "$TMP"' RETURN
            install -d -m 0750 -o qiaolianbot -g qiaolianbot "$TMP/media"
            "$VENV/bin/python" - "$DB" "$TMP/trial.db" <<'PY'
          import sqlite3,sys
          src,dst=sys.argv[1:]
          a=sqlite3.connect(f'file:{src}?mode=ro',uri=True)
          b=sqlite3.connect(dst)
          a.backup(b)
          b.close(); a.close()
          c=sqlite3.connect(dst)
          assert c.execute('PRAGMA integrity_check').fetchone()[0]=='ok'
          c.close()
          print('TRIAL_DB_COPY_OK')
          PY
            chown qiaolianbot:qiaolianbot "$TMP/trial.db"
            SESSION_BASE=$(bash -lc "set -a; source '$RUNTIME_ENV'; set +a; if [ -n \"\${TELETHON_SESSION_PATH:-}\" ]; then printf '%s' \"\$TELETHON_SESSION_PATH\"; else printf '%s' '$V3/telethon_sessions/'\"\${COLLECTOR_SESSION_NAME:-qiaolian_collector}\"; fi")
            if [ -f "$SESSION_BASE" ]; then SESSION_FILE="$SESSION_BASE"; elif [ -f "$SESSION_BASE.session" ]; then SESSION_FILE="$SESSION_BASE.session"; else echo 'TRIAL_SESSION_NOT_FOUND'; return 3; fi
            cp "$SESSION_FILE" "$TMP/trial.session"
            chown qiaolianbot:qiaolianbot "$TMP/trial.session"
            runuser -u qiaolianbot -- bash -lc "set -a; source '$RUNTIME_ENV'; set +a; export PYTHONPATH='$V3'; export DB_PATH='$TMP/trial.db'; export COLLECTOR_SOURCES_JSON='$V3/sources.json'; export COLLECTOR_DOWNLOAD_DIR='$TMP/media'; export TELETHON_SESSION_PATH='$TMP/trial'; export SOURCE_NAME='zufang555'; export TARGET_GROUPS='50'; export FETCH_LIMIT='1200'; cd '$V3'; exec '$VENV/bin/python' scripts/v3/backfill_source_history.py"
            echo '=== TRIAL_POST_COUNTS ==='
            "$VENV/bin/python" - "$TMP/trial.db" "$DB" <<'PY'
          import sqlite3,sys
          trial,prod=sys.argv[1:]
          def count(path):
              db=sqlite3.connect(f'file:{path}?mode=ro',uri=True)
              n=db.execute("select count(*) from source_posts where source_name='zufang555'").fetchone()[0]
              db.close(); return n
          print('production_zufang555=',count(prod))
          print('trial_zufang555=',count(trial))
          PY
            echo 'TRIAL_ONLY production_db_unchanged=true destination_publish=false'
          }

          case "$ACTION" in
            health) health ;;
            latest-draft) echo 'latest-draft unchanged' ;;
            logs) journalctl -u qiaolian-v3@collector.service --since '-30 minutes' --no-pager -n 50 ;;
            inspect) health ;;
            restart) systemctl restart "${SERVICES[@]}"; health ;;
            trial-zufang555-50) trial_zufang555_50; health ;;
          esac
          REMOTE

      - name: Remove temporary SSH material
        if: always()
        run: rm -f "$HOME/.ssh/qiaolian_production"
