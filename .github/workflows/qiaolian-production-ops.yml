name: qiaolian-production-ops

on:
  workflow_dispatch:
    inputs:
      action:
        description: Safe production operation
        required: true
        default: inspect
        type: choice
        options: [inspect, health, logs, restart]
  push:
    branches: [ops/gpt-production-control]
    paths: [.github/ops-control/request.txt]

permissions:
  contents: read

concurrency:
  group: qiaolian-production-ops
  cancel-in-progress: false

env:
  PROD_HOST: 50.114.74.120
  PROD_PORT: '22'
  PROD_SSH_USER: root
  PROD_SSH_KNOWN_HOSTS: '50.114.74.120 ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIMvdBaAbAt9/4NCEC4RmiAukQ5KK5S6OF4YEml2iLw+6'
  PROD_SSH_HOST_FINGERPRINT: 'SHA256:fuufBlFaqRpQhlkio0vuLsuv8w8x3zUb3VFQsnUny/o'

jobs:
  production-ops:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out the exact control revision
        if: github.event_name == 'push'
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false

      - name: Read and validate requested operation
        id: request
        env:
          DISPATCH_ACTION: '${{ inputs.action }}'
          EVENT_NAME: '${{ github.event_name }}'
        run: |
          set -Eeuo pipefail
          if [[ "$EVENT_NAME" == workflow_dispatch ]]; then
            action=$DISPATCH_ACTION
          elif [[ "$EVENT_NAME" == push ]]; then
            request=$(<.github/ops-control/request.txt)
            test "$(printf '%s\n' "$request" | wc -l | tr -d ' ')" = 2
            action=$(printf '%s\n' "$request" | sed -n '1p')
            request_id=$(printf '%s\n' "$request" | sed -n '2p')
            [[ "$request_id" =~ ^[A-Za-z0-9._:-]{1,80}$ ]]
          else
            echo 'Unsupported trigger' >&2
            exit 2
          fi
          case "$action" in
            inspect|health|logs|restart) ;;
            *) echo 'Unsupported operation' >&2; exit 2 ;;
          esac
          printf 'action=%s\n' "$action" >> "$GITHUB_OUTPUT"

      - name: Verify production SSH host key
        run: |
          set -Eeuo pipefail
          ssh-keyscan -T 10 -p "$PROD_PORT" -t ed25519 "$PROD_HOST" 2>/dev/null | grep -v '^#' > "$RUNNER_TEMP/known_hosts_observed"
          ssh-keygen -lf "$RUNNER_TEMP/known_hosts_observed" | grep -F "$PROD_SSH_HOST_FINGERPRINT"

      - name: Configure production SSH
        env:
          PROD_SSH_PRIVATE_KEY: '${{ secrets.PROD_SSH_PRIVATE_KEY }}'
        run: |
          set -Eeuo pipefail
          test -n "$PROD_SSH_PRIVATE_KEY"
          install -d -m 700 "$HOME/.ssh"
          printf '%s\n' "$PROD_SSH_PRIVATE_KEY" > "$HOME/.ssh/qiaolian_production"
          printf '%s\n' "$PROD_SSH_KNOWN_HOSTS" > "$HOME/.ssh/known_hosts"
          chmod 600 "$HOME/.ssh/qiaolian_production" "$HOME/.ssh/known_hosts"

      - name: Run allowlisted V3 production operation
        env:
          OPS_ACTION: '${{ steps.request.outputs.action }}'
        run: |
          set -Eeuo pipefail
          ssh -p "$PROD_PORT" -i "$HOME/.ssh/qiaolian_production" -o BatchMode=yes -o IdentitiesOnly=yes -o ConnectTimeout=20 "$PROD_SSH_USER@$PROD_HOST" "bash -s -- '$OPS_ACTION'" <<'REMOTE'
          set -Eeuo pipefail
          readonly ACTION=$1
          readonly APP=/opt/qiaolian_v3
          readonly -a SERVICES=(
            qiaolian-v3@canonical.service
            qiaolian-v3@publisher.service
            qiaolian-v3@user.service
            qiaolian-v3@collector.service
          )

          case "$ACTION" in
            inspect|health|logs|restart) ;;
            *) echo 'Unsupported operation' >&2; exit 2 ;;
          esac
          test -d "$APP"
          test -L "$APP/current"

          health() {
            echo '=== DEPLOYED VERSION ==='
            echo "deployed_sha=$(cat "$APP/.deployed_sha" 2>/dev/null || true)"
            echo "current=$(readlink -f "$APP/current")"
            echo '=== SERVICES ==='
            for service in "${SERVICES[@]}"; do
              active=$(systemctl is-active "$service" 2>/dev/null || true)
              enabled=$(systemctl is-enabled "$service" 2>/dev/null || true)
              pid=$(systemctl show "$service" -p MainPID --value 2>/dev/null || echo 0)
              restarts=$(systemctl show "$service" -p NRestarts --value 2>/dev/null || echo unknown)
              policy=$(systemctl show "$service" -p Restart --value 2>/dev/null || echo unknown)
              echo "SERVICE unit=$service active=$active enabled=$enabled pid=$pid restarts=$restarts restart=$policy"
            done
          }

          logs() {
            journalctl -u qiaolian-v3@canonical.service -u qiaolian-v3@publisher.service -u qiaolian-v3@user.service -u qiaolian-v3@collector.service --since '-30 minutes' -n 250 --no-pager
          }

          case "$ACTION" in
            health) health ;;
            logs) logs ;;
            inspect) health; logs ;;
            restart)
              echo '=== INSTALL PERSISTENT RESTART POLICY ==='
              install -d -m 0755 /etc/systemd/system/qiaolian-v3@.service.d
              cat >/etc/systemd/system/qiaolian-v3@.service.d/20-restart-always.conf <<'EOF'
          [Service]
          Restart=always
          RestartSec=3
          EOF
              chmod 0644 /etc/systemd/system/qiaolian-v3@.service.d/20-restart-always.conf
              systemctl daemon-reload

              echo '=== ENABLE AND RESTART V3 SERVICES ==='
              systemctl enable "${SERVICES[@]}"
              systemctl restart "${SERVICES[@]}"
              sleep 10

              failed=0
              for service in "${SERVICES[@]}"; do
                active=$(systemctl is-active "$service" 2>/dev/null || true)
                enabled=$(systemctl is-enabled "$service" 2>/dev/null || true)
                policy=$(systemctl show "$service" -p Restart --value 2>/dev/null || true)
                [[ "$active" == active ]] || failed=1
                [[ "$enabled" == enabled ]] || failed=1
                [[ "$policy" == always ]] || failed=1
              done
              health
              [[ "$failed" -eq 0 ]]
              ;;
          esac
          REMOTE

      - name: Remove temporary SSH material
        if: always()
        run: rm -f "$HOME/.ssh/qiaolian_production"
