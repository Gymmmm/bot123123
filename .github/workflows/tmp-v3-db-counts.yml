name: tmp-v3-db-counts
# 2026-09-14 post-deploy-guard inspection
on:
  push:
    branches: [master]
    paths:
      - '.github/workflows/tmp-v3-db-counts.yml'
permissions:
  contents: read
jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify production host fingerprint
        shell: bash
        run: |
          set -Eeuo pipefail
          expected=$(tr -d '\r\n' < deploy/v3/production_host_fingerprint.txt)
          ssh-keyscan -T 15 -p 22 -t ed25519 50.114.74.120 2>/dev/null | grep -v '^#' > "$RUNNER_TEMP/known_hosts"
          ssh-keygen -lf "$RUNNER_TEMP/known_hosts" | grep -F "$expected"
      - name: Configure SSH
        shell: bash
        env:
          PROD_SSH_PRIVATE_KEY: ${{ secrets.PROD_SSH_PRIVATE_KEY }}
        run: |
          set -Eeuo pipefail
          install -d -m 700 "$HOME/.ssh"
          printf '%s\n' "$PROD_SSH_PRIVATE_KEY" > "$HOME/.ssh/qiaolian_production"
          cp "$RUNNER_TEMP/known_hosts" "$HOME/.ssh/known_hosts"
          chmod 600 "$HOME/.ssh/qiaolian_production" "$HOME/.ssh/known_hosts"
      - name: Inspect production runtime
        shell: bash
        run: |
          # Verify media-preparation production activation; read-only.
          set -Eeuo pipefail
          ssh -i "$HOME/.ssh/qiaolian_production" -o BatchMode=yes -o IdentitiesOnly=yes root@50.114.74.120 '
            set -Eeuo pipefail
            echo "DEPLOYED_SHA=$(cat /opt/qiaolian_v3/.deployed_sha 2>/dev/null || cat /opt/qiaolian_v3/current/.deployed_sha 2>/dev/null || true)"
            echo "CURRENT=$(readlink -f /opt/qiaolian_v3/current)"
            for svc in collector canonical publisher user; do
              unit="qiaolian-v3@${svc}.service"
              echo "SERVICE ${svc} ACTIVE=$(systemctl is-active "$unit" || true) NRESTARTS=$(systemctl show "$unit" -p NRestarts --value || true) PID=$(systemctl show "$unit" -p MainPID --value || true)"
              pid=$(systemctl show "$unit" -p MainPID --value || true)
              if [ -n "$pid" ] && [ "$pid" != "0" ] && [ -e "/proc/$pid/cwd" ]; then echo "CWD ${svc}=$(readlink -f /proc/$pid/cwd)"; fi
            done
            test -f /opt/qiaolian_v3/current/v3_core/media/source_scrub.py
            python3 -m compileall -q /opt/qiaolian_v3/current/v3_core
          '
      - name: Restore and verify current V3 services
        shell: bash
        run: |
          set -Eeuo pipefail
          ssh -i "$HOME/.ssh/qiaolian_production" -o BatchMode=yes -o IdentitiesOnly=yes root@50.114.74.120 '
            set -Eeuo pipefail
            expected=d3639402e90aea6b507e92982bee7e42efd8a6ad
            test "$(cat /opt/qiaolian_v3/.deployed_sha)" = "$expected"
            test "$(readlink -f /opt/qiaolian_v3/current)" = "/opt/qiaolian_v3/releases/$expected"
            units=(qiaolian-v3@canonical.service qiaolian-v3@publisher.service qiaolian-v3@user.service qiaolian-v3@collector.service)
            systemctl enable --now "${units[@]}"
            sleep 5
            for unit in "${units[@]}"; do
              systemctl is-active --quiet "$unit"
              pid=$(systemctl show "$unit" -p MainPID --value)
              test "${pid:-0}" -gt 0
              echo "RESTORED $unit PID=$pid"
            done
            if journalctl -u qiaolian-v3@canonical.service -u qiaolian-v3@publisher.service -u qiaolian-v3@user.service -u qiaolian-v3@collector.service --since "2 minutes ago" --no-pager | grep -Eq "Traceback|ModuleNotFoundError|ImportError|database is locked|Conflict: terminated by other getUpdates request|Main process exited|Failed with result"; then
              journalctl -u qiaolian-v3@canonical.service -u qiaolian-v3@publisher.service -u qiaolian-v3@user.service -u qiaolian-v3@collector.service --since "2 minutes ago" -n 200 --no-pager
              exit 1
            fi
          '
