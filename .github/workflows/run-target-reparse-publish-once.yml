name: run-target-reparse-publish-once

on:
  push:
    branches:
      - codex/qiaolian-ui-cleanup-20260829
    paths:
      - .github/workflows/run-target-reparse-publish-once.yml

permissions:
  contents: read

concurrency:
  group: qiaolian-production
  cancel-in-progress: false

env:
  PROD_HOST: 50.114.74.120
  PROD_PORT: '22'
  PROD_SSH_USER: root
  PROD_SSH_KNOWN_HOSTS: '50.114.74.120 ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAILuFtkSn5SJKY7mZ52Lc/QydPRTvHFpsj87M/HcIkb/L'
  PROD_SSH_HOST_FINGERPRINT: 'SHA256:sgqLYOUAZ482H3y5jREQ6q2BVvNFPXYiOg4ruyFVnsA'

jobs:
  reparse-publish:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Verify production SSH host key
        run: |
          set -Eeuo pipefail
          ssh-keyscan -T 10 -p "$PROD_PORT" -t ed25519 "$PROD_HOST" 2>/dev/null | grep -v '^#' > "$RUNNER_TEMP/known_hosts_observed"
          ssh-keygen -lf "$RUNNER_TEMP/known_hosts_observed" | grep -F "$PROD_SSH_HOST_FINGERPRINT"
      - name: Configure production SSH
        env:
          PROD_SSH_PRIVATE_KEY: '${{ secrets.PROD_SSH_PRIVATE_KEY }}'
        run: |
          set -Eeuo pipefail
          test -n "$PROD_SSH_PRIVATE_KEY"
          install -d -m 700 "$HOME/.ssh"
          printf '%s\n' "$PROD_SSH_PRIVATE_KEY" > "$HOME/.ssh/qiaolian_production"
          printf '%s\n' "$PROD_SSH_KNOWN_HOSTS" > "$HOME/.ssh/known_hosts"
          chmod 600 "$HOME/.ssh/qiaolian_production" "$HOME/.ssh/known_hosts"
      - name: Reparse, approve, publish, and verify target through application code
        run: |
          set -Eeuo pipefail
          ssh -p "$PROD_PORT" -i "$HOME/.ssh/qiaolian_production" -o BatchMode=yes -o IdentitiesOnly=yes -o ConnectTimeout=20 "$PROD_SSH_USER@$PROD_HOST" \
            "cd /opt/qiaolian_dual_bots && runuser -u qiaolianbot -- env PYTHONPATH=/opt/qiaolian_dual_bots DB_PATH=/opt/qiaolian_dual_bots/data/qiaolian_dual_bot.db /opt/qiaolian_dual_bots/.venv/bin/python /opt/qiaolian_dual_bots/tools/reparse_publish_draft.py --db /opt/qiaolian_dual_bots/data/qiaolian_dual_bot.db --draft-id DRF_0cdfabc0-4136-4da4-819c-a50525da19ae --source-post-id 1"
      - name: Verify services remain active
        run: |
          set -Eeuo pipefail
          ssh -p "$PROD_PORT" -i "$HOME/.ssh/qiaolian_production" -o BatchMode=yes -o IdentitiesOnly=yes -o ConnectTimeout=20 "$PROD_SSH_USER@$PROD_HOST" \
            "systemctl is-active --quiet qiaolian-user-bot.service && systemctl is-active --quiet qiaolian-publisher-bot.service && systemctl is-active --quiet qiaolian-collector.service"
