name: qiaolian-v3-production-auto-dispatch

on:
  push:
    branches:
      - master
    paths:
      - '.github/workflows/qiaolian-production-deploy.yml'
      - '.github/workflows/qiaolian-production-auto-dispatch.yml'

permissions:
  contents: read
  actions: write

concurrency:
  group: qiaolian-v3-production-auto-dispatch
  cancel-in-progress: false

jobs:
  dispatch-approved-production:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout master
        uses: actions/checkout@v4
        with:
          ref: master
          fetch-depth: 1
          persist-credentials: false

      - name: Read approved deploy SHA
        id: approved
        shell: bash
        run: |
          set -Eeuo pipefail
          WORKFLOW='.github/workflows/qiaolian-production-deploy.yml'
          APPROVED_SHA=$(awk '/^[[:space:]]*APPROVED_DEPLOY_SHA:/ {print $2; exit}' "$WORKFLOW")
          [[ "$APPROVED_SHA" =~ ^[0-9a-f]{40}$ ]] || { echo 'AUTO_DISPATCH_BLOCKED invalid_approved_sha'; exit 1; }
          echo "sha=$APPROVED_SHA" >> "$GITHUB_OUTPUT"
          echo "AUTO_DISPATCH_APPROVED_SHA=$APPROVED_SHA"

      - name: Dispatch approved production workflow
        env:
          GH_TOKEN: '${{ github.token }}'
          APPROVED_SHA: '${{ steps.approved.outputs.sha }}'
        shell: bash
        run: |
          set -Eeuo pipefail
          PAYLOAD=$(jq -nc --arg ref 'master' --arg sha "$APPROVED_SHA" '{ref:$ref,inputs:{confirm:"DEPLOY",deploy_sha:$sha}}')
          HTTP_CODE=$(curl -sS -o "$RUNNER_TEMP/dispatch_response.txt" -w '%{http_code}' \
            -X POST \
            -H 'Accept: application/vnd.github+json' \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H 'X-GitHub-Api-Version: 2022-11-28' \
            "https://api.github.com/repos/$GITHUB_REPOSITORY/actions/workflows/qiaolian-production-deploy.yml/dispatches" \
            -d "$PAYLOAD")
          if [ "$HTTP_CODE" != '204' ]; then
            cat "$RUNNER_TEMP/dispatch_response.txt" || true
            echo "AUTO_DISPATCH_FAILED http=$HTTP_CODE"
            exit 1
          fi
          echo "AUTO_DISPATCH_OK sha=$APPROVED_SHA"
