name: v3-sale-catalog-check

on:
  push:
    branches:
      - codex/v3-sale-catalog-web-20260909
  workflow_dispatch:

permissions:
  contents: read

jobs:
  sale-catalog:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt pytest pytest-asyncio
      - name: Compile sale catalog and V3 core
        run: |
          python -m compileall -q \
            v3_core \
            tests/v3_core \
            run_v3_sale_web.py \
            run_v3_sale_audit.py
      - name: Run sale catalog contracts
        env:
          PYTHONPATH: '${{ github.workspace }}'
        run: |
          python -m pytest -q \
            tests/v3_core/test_sale_catalog_web.py \
            tests/v3_core/test_sale_inventory_audit.py
      - name: Run complete V3 regression suite
        env:
          PYTHONPATH: '${{ github.workspace }}'
        run: |
          python -m pytest -q tests/v3_core
