name: tmp-qiaolian-channel-check

on:
  push:
    branches:
      - codex/publisher-operator-flow-20260911
    paths:
      - 'v3_core/**'
      - 'tests/v3_core/**'
      - '.github/workflows/tmp-qiaolian-channel-check.yml'
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt pytest pytest-asyncio
      - name: Compile V3
        run: python -m compileall -q v3_core tests/v3_core
      - name: Targeted qiaolian channel tests
        env:
          PYTHONPATH: ${{ github.workspace }}
        run: |
          python -m pytest -q \
            tests/v3_core/test_channel_qiaolian_say.py \
            tests/v3_core/test_qiaolian_say.py \
            tests/v3_core/test_frozen_package_service.py \
            tests/v3_core/test_publisher_operator_flow.py \
            tests/v3_core/test_user_bot_adviser_notes.py
      - name: Full V3 regression
        env:
          PYTHONPATH: ${{ github.workspace }}
        run: python -m pytest -q tests/v3_core
