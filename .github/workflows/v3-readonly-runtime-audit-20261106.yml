name: v3-readonly-runtime-audit
on:
  workflow_dispatch:
  push:
    branches: [ops/read-only-runtime-audit-20261106]
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      PROD_HOST: 50.114.74.120
      PROD_SSH_KNOWN_HOSTS: '50.114.74.120 ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIMvdBaAbAt9/4NCEC4RmiAukQ5KK5S6OF4YEml2iLw+6'
      PROD_SSH_HOST_FINGERPRINT: 'SHA256:fuufBlFaqRpQhlkio0vuLsuv8w8x3zUb3VFQsnUny/o'
    steps:
      - name: Check production host identity
        run: |
          set -Eeuo pipefail
          ssh-keyscan -T 10 -t ed25519 "$PROD_HOST" 2>/dev/null | grep -v '^#' > "$RUNNER_TEMP/host_seen"
          ssh-keygen -lf "$RUNNER_TEMP/host_seen" | grep -F "$PROD_SSH_HOST_FINGERPRINT"
      - name: Read current release health and redacted vision settings
        env:
          PROD_SSH_PRIVATE_KEY: ${{ secrets.PROD_SSH_PRIVATE_KEY }}
        run: |
          set -Eeuo pipefail
          test -n "$PROD_SSH_PRIVATE_KEY"
          install -d -m 700 "$HOME/.ssh"
          printf '%s\n' "$PROD_SSH_PRIVATE_KEY" > "$HOME/.ssh/prod_ro_key"
          printf '%s\n' "$PROD_SSH_KNOWN_HOSTS" > "$HOME/.ssh/known_hosts"
          chmod 600 "$HOME/.ssh/prod_ro_key" "$HOME/.ssh/known_hosts"
          ssh -i "$HOME/.ssh/prod_ro_key" -o BatchMode=yes -o IdentitiesOnly=yes -o ConnectTimeout=20 root@50.114.74.120 'bash -s' <<'REMOTE'
          set -Eeuo pipefail
          CURRENT=$(sudo -u qiaolianbot readlink -f /opt/qiaolian_v3/current)
          echo "LIVE_RELEASE=$(basename "$CURRENT")"
          sudo -u qiaolianbot git -C "$CURRENT" rev-parse HEAD
          sudo -u qiaolianbot git -C "$CURRENT" status --short
          echo "APPLIED_AT=$(stat -c '%y' /opt/qiaolian_v3/current)"
          python3 - <<'PY'
          from pathlib import Path
          import os, subprocess
          env = {}
          if not os.access('/opt/qiaolian_v3/runtime.env', os.R_OK):
              env_text = subprocess.check_output(['sudo', '-u', 'qiaolianbot', 'cat', '/opt/qiaolian_v3/runtime.env'], text=True)
          else:
              env_text = Path('/opt/qiaolian_v3/runtime.env').read_text()
          for line in env_text.splitlines():
              if '=' in line and not line.lstrip().startswith('#'):
                  k, v = line.split('=', 1)
                  env[k] = v.strip().strip('"').strip("'")
          for key in ('V3_VISION_PROVIDER', 'V3_VISION_MODEL', 'V3_VILLA_COVER_TEMPLATE', 'V3_APARTMENT_COVER_TEMPLATE'):
              print(f'{key}={env.get(key, "<unset>")}')
          print('V3_VISION_API_KEY=present' if env.get('V3_VISION_API_KEY') else 'V3_VISION_API_KEY=absent')
          unit = 'qiaolian-v3@publisher.service'
          pid = subprocess.check_output(['systemctl', 'show', unit, '-p', 'MainPID', '--value'], text=True).strip()
          if pid and pid != '0':
              cmdline = Path(f'/proc/{pid}/cmdline').read_bytes().replace(b'\0', b' ').decode()
              print(f'PUBLISHER_CMD={cmdline}')
              current = subprocess.check_output(['sudo', '-u', 'qiaolianbot', 'tr', '\\0', '\\n'], input=Path(f'/proc/{pid}/environ').read_bytes().decode('latin1'), text=True)
              loaded = dict(line.split('=', 1) for line in current.splitlines() if '=' in line)
              for key in ('V3_VISION_PROVIDER', 'V3_VISION_MODEL'):
                  print(f'PROCESS_{key}={loaded.get(key, "<unset>")}')
          output = subprocess.check_output(['journalctl', '-u', unit, '--since', '-24 hours', '--no-pager'], text=True)
          lines = output.splitlines()
          for i, line in enumerate(lines[-180:]):
              if 'Traceback (most recent call last)' in line:
                  print('PUBLISHER_ERROR_BLOCK_START')
                  print('\n'.join(lines[max(0, len(lines)-180+i):min(len(lines)-180+i+70, len(lines))]))
          for name in ('collector', 'canonical', 'publisher', 'user'):
              unit = f'qiaolian-v3@{name}.service'
              def prop(k):
                  return subprocess.check_output(['systemctl', 'show', unit, '-p', k, '--value'], text=True).strip()
              print(f'SERVICE={name} STATE={os.popen("systemctl is-active " + unit).read().strip()} PID={prop("MainPID")} RESTARTS={prop("NRestarts")} STARTED={prop("ActiveEnterTimestamp")}')
          PY
          
          REMOTE
      - name: Remove temporary SSH material
        if: always()
        run: rm -f "$HOME/.ssh/prod_ro_key"
