name: v3-readonly-runtime-audit
on:
  workflow_dispatch:
  push:
    branches: [ops/read-only-runtime-audit-20261106, feature/prod-final-gate-20261107]
    paths: [.github/workflows/v3-readonly-runtime-audit-20261106.yml]
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      PROD_HOST: 50.114.74.120
      PROD_SSH_KNOWN_HOSTS: '50.114.74.120 ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIMvdBaAbAt9/4NCEC4RmiAukQ5KK5S6OF4YEml2iLw+6'
      PROD_SSH_HOST_FINGERPRINT: 'SHA256:fuufBlFaqRpQhlkio0vuLsuv8w8x3zUb3VFQsnUny/o'
    steps:
      - name: Check production host identity
        run: |
          set -Eeuo pipefail
          ssh-keyscan -T 10 -t ed25519 "$PROD_HOST" 2>/dev/null | grep -v '^#' > "$RUNNER_TEMP/host_seen"
          ssh-keygen -lf "$RUNNER_TEMP/host_seen" | grep -F "$PROD_SSH_HOST_FINGERPRINT"
      - name: Read fixed release, service, DB identity, switch booleans and aggregate counts
        env:
          PROD_SSH_PRIVATE_KEY: ${{ secrets.PROD_SSH_PRIVATE_KEY }}
        run: |
          set -Eeuo pipefail
          test -n "$PROD_SSH_PRIVATE_KEY"
          install -d -m 700 "$HOME/.ssh"
          printf '%s\n' "$PROD_SSH_PRIVATE_KEY" > "$HOME/.ssh/prod_ro_key"
          printf '%s\n' "$PROD_SSH_KNOWN_HOSTS" > "$HOME/.ssh/known_hosts"
          chmod 600 "$HOME/.ssh/prod_ro_key" "$HOME/.ssh/known_hosts"
          ssh -i "$HOME/.ssh/prod_ro_key" -o BatchMode=yes -o IdentitiesOnly=yes -o ConnectTimeout=20 -o StrictHostKeyChecking=yes -o LogLevel=ERROR root@50.114.74.120 'bash -s' <<'REMOTE'
          set -Eeuo pipefail
          /usr/bin/python3 -I - <<'PYRO'
          import json
          import os
          from pathlib import Path
          import re
          import sqlite3
          import subprocess

          # No repository code imports, environment reads, raw logs or arbitrary inputs.
          def command(args):
              return subprocess.run(args, capture_output=True, text=True, check=True, timeout=15).stdout.strip()

          report = {"audit": "v3_fixed_readonly_v1"}
          current = Path("/opt/qiaolian_v3/current").resolve(strict=True)
          if not str(current).startswith("/opt/qiaolian_v3/releases/"):
              raise RuntimeError("unexpected_release_location")
          sha = command(["sudo", "-u", "qiaolianbot", "git", "-C", str(current), "rev-parse", "HEAD"])
          report["current_sha"] = sha if re.fullmatch(r"[0-9a-f]{40}", sha) else None
          report["services"] = {}
          for name in ("collector", "canonical", "publisher", "user"):
              unit = "qiaolian-v3@" + name + ".service"
              state = command(["systemctl", "show", unit, "-p", "ActiveState", "--value"])
              entry = command(["systemctl", "show", unit, "-p", "ExecStart", "--value"])
              # Never print the raw command or unexpected arguments (which could be env).
              expected = "/opt/qiaolian_v3/current/deploy/v3/run_component.sh"
              report["services"][name] = {
                  "active": state == "active",
                  "exec_start": {
                      "executable": "/bin/bash" if "path=/bin/bash" in entry else None,
                      "script": expected if expected in entry else None,
                      "component_matches": bool(re.search(re.escape(expected) + r"\s+" + name + r"(?:\s|;)", entry)),
                  },
              }
          paths = (Path("/opt/qiaolian_v3/data/qiaolian_dual_bot.db"), Path("/opt/qiaolian_dual_bots/data/qiaolian_dual_bot.db"))
          report["database_paths"] = []
          for path in paths:
              facts = {"path": str(path), "exists": path.is_file(), "symlink": path.is_symlink()}
              if facts["exists"]:
                  stat = path.stat()
                  facts.update(device=stat.st_dev, inode=stat.st_ino)
                  resolved = str(path.resolve(strict=True))
                  facts["resolved_path"] = resolved if resolved in tuple(str(p) for p in paths) else None
              report["database_paths"].append(facts)
          report["database_same_inode"] = os.path.samefile(*paths) if all(p.is_file() for p in paths) else None

          # Only a fixed read-only DB URI and SELECT/connection-local query_only.
          if paths[0].is_file():
              try:
                  db = sqlite3.connect("file:" + str(paths[0]) + "?mode=ro", uri=True, timeout=5)
                  db.execute("PRAGMA query_only=ON")
                  db.execute("BEGIN")  # Read-only snapshot; URI forbids DB writes.
                  tables = {row[0] for row in db.execute("SELECT name FROM sqlite_master WHERE type='table'")}
                  def switch(table, key):
                      if table not in tables:
                          return {"present": False, "enabled": None}
                      row = db.execute("SELECT setting_value FROM " + table + " WHERE setting_key=?", (key,)).fetchone()
                      if row is None:
                          return {"present": False, "enabled": None}
                      raw = str(row[0]).strip().lower()
                      return {"present": True, "enabled": True if raw in ("1","true","yes","on","enabled") else False if raw in ("0","false","no","off","disabled") else None}
                  report["switches"] = {
                      "property_autopublish": switch("publisher_autopilot_settings_v3", "enabled"),
                      "daily_broadcast": switch("publisher_settings_v3", "daily_broadcast_enabled"),
                      "marketing_broadcast": switch("publisher_settings_v3", "marketing_broadcast_enabled"),
                  }
                  report["queues"] = {}
                  if "publisher_auto_items_v3" in tables:
                      # Fixed states only; no IDs/text/user/source/channel data.
                      for state in ("queued", "sending", "exception", "preview_ready", "published"):
                          report["queues"][state] = db.execute("SELECT COUNT(*) FROM publisher_auto_items_v3 WHERE state=?", (state,)).fetchone()[0]
                  for table in ("publisher_status_sync_outbox_v3", "channel_status_edits_inflight_v3"):
                      report["queues"][table] = db.execute("SELECT COUNT(*) FROM " + table).fetchone()[0] if table in tables else None
                  if "publication_delivery_attempts_v3" in tables:
                      report["queues"]["unknown_delivery"] = db.execute("SELECT COUNT(*) FROM publication_delivery_attempts_v3 WHERE state='unknown'").fetchone()[0]
                  db.close()
              except sqlite3.Error as exc:
                  report["database_read_error"] = type(exc).__name__
          print(json.dumps(report, sort_keys=True))
          PYRO
          REMOTE
      - name: Remove temporary SSH material
        if: always()
        run: rm -f "$HOME/.ssh/prod_ro_key"
