name: v3-readonly-runtime-audit
on:
  workflow_dispatch:
  push:
    branches: [ops/read-only-runtime-audit-20261106, feature/prod-final-gate-20261107]
    paths: [.github/workflows/v3-readonly-runtime-audit-20261106.yml]
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      PROD_HOST: 50.114.74.120
      PROD_SSH_KNOWN_HOSTS: '50.114.74.120 ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIMvdBaAbAt9/4NCEC4RmiAukQ5KK5S6OF4YEml2iLw+6'
      PROD_SSH_HOST_FINGERPRINT: 'SHA256:fuufBlFaqRpQhlkio0vuLsuv8w8x3zUb3VFQsnUny/o'
    steps:
      - name: Check production host identity
        run: |
          set -Eeuo pipefail
          ssh-keyscan -T 10 -t ed25519 "$PROD_HOST" 2>/dev/null | grep -v '^#' > "$RUNNER_TEMP/host_seen"
          ssh-keygen -lf "$RUNNER_TEMP/host_seen" | grep -F "$PROD_SSH_HOST_FINGERPRINT"
      - name: Read fixed release, service, DB identity, switch booleans and aggregate counts
        env:
          PROD_SSH_PRIVATE_KEY: ${{ secrets.PROD_SSH_PRIVATE_KEY }}
        run: |
          set -Eeuo pipefail
          test -n "$PROD_SSH_PRIVATE_KEY"
          install -d -m 700 "$HOME/.ssh"
          printf '%s\n' "$PROD_SSH_PRIVATE_KEY" > "$HOME/.ssh/prod_ro_key"
          printf '%s\n' "$PROD_SSH_KNOWN_HOSTS" > "$HOME/.ssh/known_hosts"
          chmod 600 "$HOME/.ssh/prod_ro_key" "$HOME/.ssh/known_hosts"
          ssh -i "$HOME/.ssh/prod_ro_key" -o BatchMode=yes -o IdentitiesOnly=yes -o ConnectTimeout=20 -o StrictHostKeyChecking=yes -o LogLevel=ERROR root@50.114.74.120 'bash -s' <<'REMOTE'
          set -Eeuo pipefail
          /usr/bin/python3 -I - <<'PYRO'
          import json
          import os
          from pathlib import Path
          import re
          import sqlite3
          import subprocess
          import hashlib
          import shlex
          import urllib.request
          import urllib.parse

          # Fixed reads only; never import PR application code or print secrets/raw logs.
          def command(args):
              return subprocess.run(args, capture_output=True, text=True, check=True, timeout=15).stdout.strip()

          # Fixed metadata-only production reads. Never serialize settings or exceptions.
          PUBLIC_CONFIG_KEYS = frozenset(("CHANNEL_ID", "CHANNEL_URL", "PUBLISHER_BOT_TOKEN", "USER_BOT_TOKEN", "TG_API_ID", "TG_API_HASH", "ADMIN_IDS", "DEEPLINK_BOT_USERNAME", "USER_BOT_USERNAME", "ADVISOR_TG", "SUPPORT_USERNAME", "COLLECTOR_SOURCES_JSON", "V3_COVER_OUTPUT_DIR", "CHANNEL_DISCUSSION_ENABLED", "PUBLISH_DISCUSSION_ENABLED"))

          def fixed_settings():
              values = {}
              try:
                  with Path("/opt/qiaolian_v3/runtime.env").open(encoding="utf-8") as source:
                      for line in source:
                          match = re.match(r"^(?:export\s+)?([A-Z_]+)=(.*)$", line.strip())
                          if not match or match[1] not in PUBLIC_CONFIG_KEYS:
                              continue
                          parts = shlex.split(match[2], comments=True)
                          if len(parts) == 1 and "$" not in parts[0]:
                              values[match[1]] = parts[0]
              except (OSError, ValueError):
                  pass
              return values

          def private_text(value):
              text = str(value)
              return bool(re.search(r"(?:\+?\d[\d ()_.-]{7,}\d)|[\w.+-]+@[\w.-]+\.[A-Za-z]{2,}|@[A-Za-z]\w{3,}|https?://|tg://|电话|微信|whatsapp|wechat|联系方式|\d{5,}:[A-Za-z0-9_-]{20,}", text, re.I))

          def public_channel(values):
              channel = values.get("CHANNEL_ID", "")
              result = {"configured_id": channel if re.fullmatch(r"-100\d{5,16}|@[A-Za-z][A-Za-z0-9_]{4,31}", channel) else None}
              url = values.get("CHANNEL_URL", "")
              result["configured_public_url"] = url if re.fullmatch(r"https://t\.me/[A-Za-z][A-Za-z0-9_]{4,31}/?", url) else None
              token = values.get("PUBLISHER_BOT_TOKEN", "")
              if not result["configured_id"] or not token:
                  result["lookup"] = "not_configured"
                  return result
              try:
                  endpoint = "https://api.telegram.org/bot" + token + "/getChat?" + urllib.parse.urlencode({"chat_id": channel})
                  with urllib.request.urlopen(endpoint, timeout=10) as response:
                      data = json.loads(response.read(65536)).get("result", {})
                  username = str(data.get("username", ""))
                  title = str(data.get("title", ""))
                  if data.get("type") != "channel" or not re.fullmatch(r"[A-Za-z][A-Za-z0-9_]{4,31}", username):
                      result["lookup"] = "not_a_public_channel"
                      return result
                  result.update(lookup="verified_getChat", id=int(data["id"]), username=username, url="https://t.me/" + username, title=title if len(title)<=128 and not private_text(title) else None)
              except Exception as exc:
                  # HTTP errors can contain the token URL. Never print str(exc)/tracebacks.
                  result["lookup"] = type(exc).__name__
              return result

          def public_package(db, tables, current):
              required = {"publication_packages_v3", "listings_v3", "listing_offers", "canonical_records", "review_items", "publication_instances", "publication_delivery_attempts_v3", "publisher_auto_items_v3"}
              if not required <= tables:
                  return {"candidate": None, "reason": "required_schema_unavailable"}
              scope = """ FROM publication_packages_v3 p
                JOIN listings_v3 l ON l.listing_id=p.listing_id AND l.canonical_record_id=p.canonical_record_id
                JOIN listing_offers o ON o.offer_id=p.offer_id AND o.listing_id=l.listing_id
                JOIN canonical_records c ON c.canonical_record_id=p.canonical_record_id
                WHERE p.status='approved' AND p.approved_at IS NOT NULL AND p.published_at IS NULL
                AND l.data_status='current' AND l.inventory_status='active'
                AND p.canonical_facts_hash=l.canonical_facts_hash AND p.canonical_facts_hash=c.facts_hash
                AND o.offer_type='rent' AND o.offer_status='active' AND o.publication_policy='telegram_rent' AND o.publishable=1
                AND EXISTS(SELECT 1 FROM review_items r WHERE r.offer_id=o.offer_id AND r.listing_id=l.listing_id AND r.canonical_record_id=c.canonical_record_id AND r.review_status='approved' AND r.approved_at IS NOT NULL)
                AND NOT EXISTS(SELECT 1 FROM publication_instances i WHERE (i.listing_id=l.listing_id OR i.offer_id=o.offer_id) AND i.publish_status='published')
                AND NOT EXISTS(SELECT 1 FROM publication_delivery_attempts_v3 d WHERE (d.listing_id=l.listing_id OR d.offer_id=o.offer_id) AND d.state IN ('sending','unknown','sent','committed'))
                AND NOT EXISTS(SELECT 1 FROM publisher_auto_items_v3 a WHERE (a.listing_id=l.listing_id OR a.offer_id=o.offer_id) AND a.state IN ('exception','sending','published'))"""
              total = db.execute("SELECT COUNT(*)" + scope).fetchone()[0]
              result = {"eligible_approved_count": total, "candidate": None, "reason": "none_eligible" if total==0 else "no_safely_exportable_candidate"}
              rows = db.execute("SELECT p.package_id,p.package_version,p.canonical_facts_hash,p.content_hash,p.post_text,p.cover_path,p.gallery_json,p.frozen_file_hashes_json,l.public_listing_id" + scope + " ORDER BY p.id LIMIT 20").fetchall()
              for row in rows:
                  package_id, version, revision, content_hash, caption, cover, gallery_json, hashes_json, public_id = row
                  if not isinstance(caption,str) or not 1<=len(caption)<=4096 or private_text(caption):
                      continue
                  if not re.fullmatch(r"QL-[A-Z0-9-]{4,32}", str(public_id)):
                      continue
                  try:
                      gallery, hashes = json.loads(gallery_json), json.loads(hashes_json)
                      if not isinstance(gallery,list) or not isinstance(hashes,dict) or len(gallery)>9:
                          continue
                      images = []
                      for raw in [cover] + gallery:
                          path = Path(raw)
                          if not path.is_absolute():
                              path = current / path
                          path = path.resolve(strict=True)
                          roots = (("shared_media",Path("/opt/qiaolian_dual_bots/media").resolve()), ("v3_media",Path("/opt/qiaolian_v3/media").resolve()), ("runtime_media",Path("/opt/qiaolian_v3/runtime/media").resolve()))
                          match = next(((label,path.relative_to(root)) for label,root in roots if path.is_relative_to(root)),None)
                          if not match or path.suffix.lower() not in (".jpg",".jpeg",".png",".webp") or not path.is_file() or path.stat().st_size>20*1024*1024:
                              raise ValueError("unsafe_image")
                          label, relative = match
                          if private_text(relative):
                              raise ValueError("private_path")
                          digest=hashlib.sha256()
                          with path.open("rb") as image:
                              for block in iter(lambda:image.read(1048576), b""):
                                  digest.update(block)
                          if hashes.get(raw)!=digest.hexdigest():
                              raise ValueError("image_changed")
                          images.append({"root":label,"relative_path":relative.as_posix(),"sha256":digest.hexdigest()})
                      result.update(reason="verified_public_package",candidate={"package_id":package_id,"package_version":version,"revision":revision,"content_hash":content_hash,"public_listing_id":public_id,"post_text":caption,"image_count":len(images),"images":images})
                      break
                  except (ValueError,TypeError,OSError):
                      continue
              return result

          def live_preflight(values, current):
              # Existing deployed preflight is statically readonly, without --initialize.
              # -B prevents bytecode writes; never pass tokens in command arguments.
              child_env = dict(values)
              child_env.update(PATH="/usr/bin:/bin", PYTHONDONTWRITEBYTECODE="1")
              try:
                  process=subprocess.run(["runuser","-u","qiaolianbot","--","/opt/qiaolian_v3/.venv/bin/python","-B",str(current/"run_v3_preflight.py"),"--component","all","--db","/opt/qiaolian_dual_bots/data/qiaolian_dual_bot.db"],capture_output=True,text=True,check=False,timeout=30,env=child_env)
                  payload=json.loads(process.stdout)
                  return {"source":"current_deployed_sha_not_candidate","exit_code":process.returncode,"ok":payload.get("ok") is True,"checks":[{"name":str(c.get("name","")),"ok":c.get("ok") is True} for c in payload.get("checks",[])]}
              except Exception as exc:
                  return {"ok":False,"error":type(exc).__name__}

          report = {"audit": "v3_fixed_readonly_v2"}
          current = Path("/opt/qiaolian_v3/current").resolve(strict=True)
          if not str(current).startswith("/opt/qiaolian_v3/releases/"):
              raise RuntimeError("unexpected_release_location")
          sha = command(["sudo", "-u", "qiaolianbot", "git", "-C", str(current), "rev-parse", "HEAD"])
          report["current_sha"] = sha if re.fullmatch(r"[0-9a-f]{40}", sha) else None
          values = fixed_settings()
          report["channel"] = public_channel(values)
          report["live_preflight"] = live_preflight(values, current)
          try:
              langs = command(["tesseract", "--list-langs"]).splitlines()
              report["ocr"] = {"eng": "eng" in langs, "chi_sim": "chi_sim" in langs}
          except Exception as exc:
              report["ocr"] = {"eng": False, "chi_sim": False, "error": type(exc).__name__}
          report["services"] = {}
          for name in ("collector", "canonical", "publisher", "user"):
              unit = "qiaolian-v3@" + name + ".service"
              state = command(["systemctl", "show", unit, "-p", "ActiveState", "--value"])
              entry = command(["systemctl", "show", unit, "-p", "ExecStart", "--value"])
              pid = command(["systemctl", "show", unit, "-p", "MainPID", "--value"])
              restarts = command(["systemctl", "show", unit, "-p", "NRestarts", "--value"])
              # Never print the raw command or unexpected arguments (which could be env).
              expected = "/opt/qiaolian_v3/current/deploy/v3/run_component.sh"
              report["services"][name] = {
                  "active": state == "active",
                  "pid_present": pid.isdigit() and int(pid)>0,
                  "restarts": int(restarts) if restarts.isdigit() else None,
                  "exec_start": {
                      "executable": "/bin/bash" if "path=/bin/bash" in entry else None,
                      "script": expected if expected in entry else None,
                      "component_matches": bool(re.search(re.escape(expected) + r"\s+" + name + r"(?:\s|;)", entry)),
                  },
              }
          try:
              recent = command(["journalctl", "-u", "qiaolian-v3@collector.service", "-u", "qiaolian-v3@canonical.service", "-u", "qiaolian-v3@publisher.service", "-u", "qiaolian-v3@user.service", "--since", "10 minutes ago", "--no-pager", "-n", "500", "--output=cat"])
              report["recent_error_lines"] = sum(bool(re.search(r"Traceback|ModuleNotFoundError|database is locked|Failed with result|polling error|409.*conflict|appointment.*(?:error|failed)|publication.*(?:error|failed)", line, re.I)) for line in recent.splitlines())
          except Exception as exc:
              report["recent_error_read_error"] = type(exc).__name__
          paths = (Path("/opt/qiaolian_v3/data/qiaolian_dual_bot.db"), Path("/opt/qiaolian_dual_bots/data/qiaolian_dual_bot.db"))
          report["database_paths"] = []
          for path in paths:
              facts = {"path": str(path), "exists": path.is_file(), "symlink": path.is_symlink()}
              if facts["exists"]:
                  stat = path.stat()
                  facts.update(device=stat.st_dev, inode=stat.st_ino)
                  resolved = str(path.resolve(strict=True))
                  facts["resolved_path"] = resolved if resolved in tuple(str(p) for p in paths) else None
              report["database_paths"].append(facts)
          report["database_same_inode"] = os.path.samefile(*paths) if all(p.is_file() for p in paths) else None

          # Only a fixed read-only DB URI and SELECT/connection-local query_only.
          if paths[0].is_file():
              try:
                  db = sqlite3.connect("file:" + str(paths[0]) + "?mode=ro", uri=True, timeout=5)
                  db.execute("PRAGMA query_only=ON")
                  db.execute("BEGIN")  # Read-only snapshot; URI forbids DB writes.
                  tables = {row[0] for row in db.execute("SELECT name FROM sqlite_master WHERE type='table'")}
                  def switch(table, key):
                      if table not in tables:
                          return {"present": False, "enabled": None}
                      row = db.execute("SELECT setting_value FROM " + table + " WHERE setting_key=?", (key,)).fetchone()
                      if row is None:
                          return {"present": False, "enabled": None}
                      raw = str(row[0]).strip().lower()
                      return {"present": True, "enabled": True if raw in ("1","true","yes","on","enabled") else False if raw in ("0","false","no","off","disabled") else None}
                  report["switches"] = {
                      "property_autopublish": switch("publisher_autopilot_settings_v3", "enabled"),
                      "daily_broadcast": switch("publisher_settings_v3", "daily_broadcast_enabled"),
                      "marketing_broadcast": switch("publisher_settings_v3", "marketing_broadcast_enabled"),
                  }
                  report["queues"] = {}
                  if "publisher_auto_items_v3" in tables:
                      # Fixed states only; no IDs/text/user/source/channel data.
                      for state in ("queued", "sending", "exception", "preview_ready", "published"):
                          report["queues"][state] = db.execute("SELECT COUNT(*) FROM publisher_auto_items_v3 WHERE state=?", (state,)).fetchone()[0]
                  for table in ("publisher_status_sync_outbox_v3", "channel_status_edits_inflight_v3"):
                      report["queues"][table] = db.execute("SELECT COUNT(*) FROM " + table).fetchone()[0] if table in tables else None
                  if "publication_delivery_attempts_v3" in tables:
                      report["queues"]["unknown_delivery"] = db.execute("SELECT COUNT(*) FROM publication_delivery_attempts_v3 WHERE state='unknown'").fetchone()[0]
                  report["database_quick_check_ok"] = db.execute("PRAGMA quick_check").fetchone()[0] == "ok"
                  report["public_package_preview"] = public_package(db, tables, current)
                  db.close()
              except sqlite3.Error as exc:
                  report["database_read_error"] = type(exc).__name__
          print(json.dumps(report, sort_keys=True))
          PYRO
          REMOTE
      - name: Remove temporary SSH material
        if: always()
        run: rm -f "$HOME/.ssh/prod_ro_key"
