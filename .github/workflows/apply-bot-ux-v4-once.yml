name: apply-bot-ux-v4-once

on:
  push:
    branches: [codex/qiaolian-ui-cleanup-20260829]
    paths:
      - .github/workflows/apply-bot-ux-v4-once.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/qiaolian-ui-cleanup-20260829
          fetch-depth: 0
      - name: Patch practical UX
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          # 1) User Bot: practical move-in service, no nested life-service maze.
          p = Path('qiaolian_dual/keyboards_search.py')
          s = p.read_text(encoding='utf-8')
          new = '''def service_hub_keyboard(user_id: int | None=None) -> InlineKeyboardMarkup:
              return InlineKeyboardMarkup([
                  [InlineKeyboardButton('📋 入住交接留档', callback_data='hub:rental:handover'), InlineKeyboardButton('🔐 押金说明', callback_data='hub:rental:deposit')],
                  [InlineKeyboardButton('🔧 设备报修', callback_data='service:repair_hub'), InlineKeyboardButton('💬 联系我们', callback_data='service:contact')],
                  [InlineKeyboardButton('⬅️ 返回首页', callback_data='home')],
              ])
          
          
          def service_repair_keyboard() -> InlineKeyboardMarkup:
          '''
          s2, n = re.subn(r'def service_hub_keyboard\(user_id: int \| None=None\) -> InlineKeyboardMarkup:.*?\ndef service_repair_keyboard\(\) -> InlineKeyboardMarkup:\n', new, s, flags=re.S)
          assert n == 1, f'service_hub patch count={n}'
          p.write_text(s2, encoding='utf-8')

          p = Path('qiaolian_dual/texts.py')
          s = p.read_text(encoding='utf-8')
          old = "def service_hub_text() -> str:\n    return ('🛠 <b>入住服务</b>\\n\\n住下以后，有事也可以找侨联。\\n住房或生活上的问题，都可以先问问我们。')"
          new = "def service_hub_text() -> str:\n    return ('🛠 <b>入住服务</b>\\n\\n入住后的常用事项放在这里。\\n留档、押金、设备问题，直接点就行。')"
          assert old in s
          p.write_text(s.replace(old, new), encoding='utf-8')

          # 2) Publisher Bot: keep six practical admin actions, remove settings/help clutter from home.
          p = Path('v2/qiaolian_publisher_v2/keyboards.py')
          s = p.read_text(encoding='utf-8')
          new_admin = '''def admin_menu() -> InlineKeyboardMarkup:
              """Publisher home: six high-frequency actions only."""
              return InlineKeyboardMarkup(
                  [
                      [
                          InlineKeyboardButton("🏠 待发布", callback_data="cmd:queue"),
                          InlineKeyboardButton("➕ 添加房源", callback_data="cmd:intake"),
                      ],
                      [
                          InlineKeyboardButton("🟢 房态管理", callback_data="cmd:listing_states"),
                          InlineKeyboardButton("📢 每日广播", callback_data="cmd:daily"),
                      ],
                      [
                          InlineKeyboardButton("📡 采集源", callback_data="cmd:sources"),
                          InlineKeyboardButton("📚 发布记录", callback_data="cmd:logs"),
                      ],
                  ]
              )
          
          
          def type_keyboard() -> InlineKeyboardMarkup:
          '''
          s2, n = re.subn(r'def admin_menu\(\) -> InlineKeyboardMarkup:.*?\ndef type_keyboard\(\) -> InlineKeyboardMarkup:\n', new_admin, s, flags=re.S)
          assert n == 1, f'admin_menu patch count={n}'
          s2 = s2.replace('"📋 租赁详情",', '"🏠 房源详情",')
          p.write_text(s2, encoding='utf-8')

          # 3) Daily broadcast: short, useful, live Phnom Penh weather + USD/CNY and USD/KHR.
          p = Path('autopilot_publish_bot.py')
          s = p.read_text(encoding='utf-8')
          new_daily = '''def _fetch_phnom_penh_daily_info() -> str:
              """Build a concise live Phnom Penh daily card; never publish fabricated fallback numbers."""
              now = datetime.now(TZ)
              weekday = "一二三四五六日"[now.weekday()]
              weather_line = "🌤 天气：暂时无法获取"
              fx_line = "💵 汇率：暂时无法获取"
              weather_url = (
                  "https://api.open-meteo.com/v1/forecast?latitude=11.5564&longitude=104.9282"
                  "&daily=weather_code,temperature_2m_max,temperature_2m_min,precipitation_probability_max"
                  "&timezone=Asia%2FPhnom_Penh&forecast_days=1"
              )
              try:
                  request = Request(weather_url, headers={"User-Agent": "QiaolianRentalBot/1.0"})
                  with urlopen(request, timeout=6) as response:
                      weather = json.loads(response.read().decode("utf-8"))
                  daily = weather.get("daily") or {}
                  code = int((daily.get("weather_code") or [None])[0])
                  high = float((daily.get("temperature_2m_max") or [0])[0])
                  low = float((daily.get("temperature_2m_min") or [0])[0])
                  rain = int(round(float((daily.get("precipitation_probability_max") or [0])[0])))
                  weather_line = f"🌤 天气：{_WEATHER_LABELS.get(code, '天气多变')} {low:.0f}–{high:.0f}℃｜降雨 {rain}%"
              except Exception:
                  logger.info("每日广播天气数据暂不可用", exc_info=True)
              try:
                  request = Request("https://open.er-api.com/v6/latest/USD", headers={"User-Agent": "QiaolianRentalBot/1.0"})
                  with urlopen(request, timeout=6) as response:
                      exchange = json.loads(response.read().decode("utf-8"))
                  rates = exchange.get("rates") or {}
                  cny = float(rates.get("CNY"))
                  khr = float(rates.get("KHR"))
                  fx_line = f"💵 汇率：1 USD ≈ {cny:.2f} CNY｜{khr:,.0f} KHR"
              except Exception:
                  logger.info("每日广播汇率数据暂不可用", exc_info=True)
              return (
                  "<b>☀️ 侨联地产｜早安金边</b>\\n"
                  f"📅 {now:%Y.%m.%d}｜星期{weekday}\\n\\n"
                  f"{weather_line}\\n"
                  f"{fx_line}\\n\\n"
                  "🏠 今天要看房：直接发区域 + 预算，我帮你筛。\\n"
                  "<i>天气与汇率仅供参考，以实时信息/实际牌价为准。</i>"
              )
          
          
          def _conn() -> sqlite3.Connection:
          '''
          s2, n = re.subn(r'def _fetch_phnom_penh_daily_info\(\) -> str:.*?\ndef _conn\(\) -> sqlite3.Connection:\n', new_daily, s, flags=re.S)
          assert n == 1, f'daily patch count={n}'
          p.write_text(s2, encoding='utf-8')
          PY

      - name: Syntax and focused tests
        run: |
          python -m py_compile qiaolian_dual/keyboards_search.py qiaolian_dual/texts.py v2/qiaolian_publisher_v2/keyboards.py autopilot_publish_bot.py
          python -m pytest -q tests/test_user_bot_return_paths.py tests/test_talk_engine_factual_copy.py || exit 1

      - name: Commit changes
        run: |
          git config user.name qiaolian-actions
          git config user.email actions@users.noreply.github.com
          git add qiaolian_dual/keyboards_search.py qiaolian_dual/texts.py v2/qiaolian_publisher_v2/keyboards.py autopilot_publish_bot.py
          git commit -m "Simplify publisher and move-in service UX"
          git push origin HEAD:codex/qiaolian-ui-cleanup-20260829
