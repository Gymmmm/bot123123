name: user-module-audit

on:
  push:
    branches:
      - refactor/production-extraction
  workflow_dispatch:

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Audit user bot modules
        run: python qiaolian_production/tools/audit_user_modules.py
      - name: Audit pure user helper symbols
        run: |
          set -e
          for module in \
            public_listing_id \
            area_normalization \
            publishability_contract \
            status_labels \
            location_mapping \
            text_utils \
            utils_formatting \
            v2_safe_adapter \
            channel_links \
            channel_post \
            channel_status_sync \
            session_deeplink \
            runtime_guard \
            cover_styles \
            attribution \
            attribution_resolver \
            attribution_service \
            utils
          do
            echo "=== ${module} ==="
            python qiaolian_production/tools/audit_user_symbol_module.py "${module}"
          done
