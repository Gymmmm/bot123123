name: user-module-audit

on:
  push:
    branches:
      - refactor/production-extraction
  workflow_dispatch:

permissions:
  contents: write

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Audit user bot modules
        run: python qiaolian_production/tools/audit_user_modules.py
      - name: Audit user helper symbols
        run: |
          set -e
          for module in \
            public_listing_id \
            area_normalization \
            publishability_contract \
            status_labels \
            location_mapping \
            text_utils \
            utils_formatting \
            v2_safe_adapter \
            channel_links \
            channel_post \
            channel_status_sync \
            session_deeplink \
            runtime_guard \
            cover_styles \
            attribution \
            attribution_hooks \
            attribution_runtime \
            attribution_store \
            utils \
            talk_engine \
            jobs \
            flows \
            messages \
            messages_more \
            texts \
            appointment_flow \
            appointment_ui \
            appointments_view \
            callback_appointment \
            callback_search \
            callback_service \
            callback_admin \
            callback_contract \
            callback_listing \
            callback_navigation \
            callback_preference \
            callbacks \
            search \
            search_text_handlers \
            message_handlers \
            start_routes \
            listing
          do
            echo "=== ${module} ==="
            python qiaolian_production/tools/audit_user_symbol_module.py "${module}"
          done
      - name: Audit user database methods
        run: python qiaolian_production/tools/audit_user_db_methods.py
      - name: Verify committed helper slices
        run: |
          set -e
          for module in channel_post attribution message_handlers listing; do
            python qiaolian_production/tools/audit_user_symbol_module.py "${module}" --write
          done
          python qiaolian_production/tools/audit_user_db_methods.py --write
          python -m compileall -q qiaolian_production/user/qiaolian_dual
          git diff --exit-code -- \
            qiaolian_production/user/qiaolian_dual/channel_post.py \
            qiaolian_production/user/qiaolian_dual/attribution.py \
            qiaolian_production/user/qiaolian_dual/message_handlers.py \
            qiaolian_production/user/qiaolian_dual/listing.py \
            qiaolian_production/user/qiaolian_dual/db.py
