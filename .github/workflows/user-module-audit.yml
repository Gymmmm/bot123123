name: user-module-audit

on:
  push:
    branches:
      - refactor/production-extraction
  workflow_dispatch:

permissions:
  contents: write

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Audit user bot modules
        run: python qiaolian_production/tools/audit_user_modules.py
      - name: Audit pure user helper symbols
        run: |
          set -e
          for module in \
            public_listing_id \
            area_normalization \
            publishability_contract \
            status_labels \
            location_mapping \
            text_utils \
            utils_formatting \
            v2_safe_adapter \
            channel_links \
            channel_post \
            channel_status_sync \
            session_deeplink \
            runtime_guard \
            cover_styles \
            attribution \
            attribution_hooks \
            attribution_runtime \
            attribution_store \
            utils \
            talk_engine \
            jobs \
            flows \
            messages \
            messages_more \
            texts
          do
            echo "=== ${module} ==="
            python qiaolian_production/tools/audit_user_symbol_module.py "${module}"
          done
      - name: Slice confirmed dead user helpers
        run: |
          set -e
          python qiaolian_production/tools/audit_user_symbol_module.py channel_post --write
          python qiaolian_production/tools/audit_user_symbol_module.py attribution --write
          python -m compileall -q qiaolian_production/user/qiaolian_dual
      - name: Commit confirmed user helper slices
        run: |
          set -e
          if git diff --quiet; then
            echo "No user helper slice changes"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add qiaolian_production/user/qiaolian_dual/channel_post.py qiaolian_production/user/qiaolian_dual/attribution.py
          git commit -m "refactor: slim user channel and attribution helpers"
          git push
