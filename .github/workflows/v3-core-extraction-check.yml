name: v3-core-extraction-check

on:
  push:
    branches:
      - codex/v3-core-extraction-20260908
      - integration/v3-core-aftercare-runtime-hardening-20260909
  workflow_dispatch:

jobs:
  v3-core:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt pytest pytest-asyncio
      - name: Compile extracted core and entrypoints
        run: |
          python -m compileall -q \
            v3_core \
            candidate_runtime \
            tests/v3_core \
            tests/candidate_runtime \
            run_v3_collector.py \
            run_v3_canonical_worker.py \
            run_v3_publisher_bot.py \
            run_v3_user_bot.py \
            run_v3_preflight.py \
            run_candidate_runtime.py \
            run_candidate_preflight.py
      - name: Run V3 extraction contracts
        env:
          PYTHONPATH: '${{ github.workspace }}'
        run: |
          python -m pytest -q tests/v3_core
      - name: Run candidate runtime contracts
        env:
          PYTHONPATH: '${{ github.workspace }}'
        run: |
          python -m pytest -q tests/candidate_runtime
