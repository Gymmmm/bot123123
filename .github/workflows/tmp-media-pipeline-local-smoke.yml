name: tmp-media-pipeline-local-smoke
on:
  push:
    branches: [feat/listing-media-pipeline-v1]
    paths:
      - '.github/workflows/tmp-media-pipeline-local-smoke.yml'
permissions:
  contents: read
jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y fonts-noto-cjk
          python -m pip install --upgrade pip
          pip install pillow numpy opencv-python-headless
      - name: Create sample listing photos
        run: |
          python - <<'PY'
          from pathlib import Path
          from PIL import Image, ImageDraw
          out=Path('/tmp/media_input/7028'); out.mkdir(parents=True, exist_ok=True)
          for i in range(1,5):
              im=Image.new('RGB',(1400,1000),(185+i*8,178+i*6,165+i*4))
              d=ImageDraw.Draw(im)
              d.rectangle((70,80,1330,920),outline=(70,65,60),width=8)
              d.rectangle((150,180,650,700),fill=(220,215,205),outline=(90,85,80),width=5)
              d.rectangle((760,180,1230,700),fill=(205,215,220),outline=(90,85,80),width=5)
              d.rectangle((320,730,1080,860),fill=(120,95,70))
              d.text((90,90),f'Room sample {i}',fill=(25,25,25))
              im.save(out/f'{i:02d}.jpg',quality=92)
          PY
      - name: Run listing media pipeline branch
        working-directory: media_pipeline
        run: |
          python run_listing_media_pipeline.py \
            --input-dir /tmp/media_input \
            --output-dir "$GITHUB_WORKSPACE/smoke_output" \
            --only 7028 \
            --cover-limit 1
          find "$GITHUB_WORKSPACE/smoke_output" -maxdepth 3 -type f -printf '%p %s bytes\n' | sort
      - uses: actions/upload-artifact@v4
        with:
          name: media-pipeline-branch-smoke
          path: smoke_output/
          if-no-files-found: error
