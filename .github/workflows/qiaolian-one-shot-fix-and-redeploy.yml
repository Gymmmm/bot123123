name: qiaolian-one-shot-fix-and-redeploy

on:
  push:
    branches:
      - codex/qiaolian-ui-cleanup-20260829
    paths:
      - .github/workflows/qiaolian-one-shot-fix-and-redeploy.yml

permissions:
  contents: write
  actions: write

jobs:
  patch-and-dispatch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/qiaolian-ui-cleanup-20260829
          fetch-depth: 2
      - name: Patch canonical deploy workflow
        run: |
          set -Eeuo pipefail
          python - <<'PY'
          from pathlib import Path
          p = Path('.github/workflows/qiaolian-production-deploy.yml')
          s = p.read_text()
          old = 'runuser -u qiaolianbot -- env PYTHONPATH="$APP" "$APP/.venv/bin/python" -c "from qiaolian_dual.user_bot import build_application; assert build_application() is not None"'
          new = 'runuser -u qiaolianbot -- env PYTHONPATH="$APP" DB_PATH="$DB" "$APP/.venv/bin/python" -c "from qiaolian_dual.user_bot import build_application; assert build_application() is not None"'
          if old not in s:
              raise SystemExit('runtime smoke target not found')
          s = s.replace(old, new, 1)
          old_tests = 'tests/test_issue25_contract.py tests/test_noto_font_contract.py'
          new_tests = 'tests/test_issue25_contract.py tests/test_channel_standard_contract.py tests/test_noto_font_contract.py'
          if old_tests not in s:
              raise SystemExit('production test list target not found')
          s = s.replace(old_tests, new_tests, 1)
          p.write_text(s)
          PY
          git diff --check
      - name: Commit fix and remove one-shot workflow
        run: |
          set -Eeuo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/qiaolian-one-shot-fix-and-redeploy.yml
          git add .github/workflows/qiaolian-production-deploy.yml
          git commit -m "fix(deploy): use production DB path in runtime smoke"
          git push origin HEAD:refs/heads/codex/qiaolian-ui-cleanup-20260829
          echo "FIXED_SHA=$(git rev-parse HEAD)" >> "$GITHUB_ENV"
      - name: Dispatch canonical production workflow
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -Eeuo pipefail
          curl -fsSL -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${{ github.repository }}/actions/workflows/qiaolian-production-deploy.yml/dispatches" \
            -d '{"ref":"codex/qiaolian-ui-cleanup-20260829","inputs":{"confirm":"DEPLOY"}}'
          echo "REDEPLOY_DISPATCHED sha=$FIXED_SHA"
