name: qiaolian-source-fix

on:
  push:
    branches:
      - codex/qiaolian-ui-cleanup-20260829
    paths:
      - .github/workflows/qiaolian-source-fix.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/qiaolian-ui-cleanup-20260829
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Patch source-of-truth display/query code
        run: |
          python - <<'PY'
          from pathlib import Path

          db_path = Path('qiaolian_dual/db.py')
          db_text = db_path.read_text(encoding='utf-8')
          old = 'clauses = ["status=\'active\'",'
          new = 'clauses = ["status IN (\'active\',\'reserved\')",'
          count = db_text.count(old)
          if count != 1:
              raise SystemExit(f'expected one public search status clause, found {count}')
          db_path.write_text(db_text.replace(old, new, 1), encoding='utf-8')

          package_path = Path('publication_package.py')
          package_text = package_path.read_text(encoding='utf-8')
          import_old = 'from qiaolian_dual.utils_formatting import _display_layout'
          import_new = 'from qiaolian_dual.utils_formatting import _display_layout, _display_floor'
          if import_old not in package_text:
              raise SystemExit('publication_package display formatter import not found')
          package_text = package_text.replace(import_old, import_new, 1)

          display_old = 'display_floor = str(d.get("floor") or "").strip() or ""'
          display_new = 'display_floor = _display_floor(d.get("floor"))'
          display_count = package_text.count(display_old)
          if display_count < 1:
              raise SystemExit('publication_package display_floor assignment not found')
          package_text = package_text.replace(display_old, display_new)

          floor_old = 'floor = clean(d.get("floor"), 12)'
          floor_new = 'floor = _display_floor(clean(d.get("floor"), 12))'
          floor_count = package_text.count(floor_old)
          if floor_count < 1:
              raise SystemExit('publication_package caption floor assignment not found')
          package_text = package_text.replace(floor_old, floor_new)
          package_path.write_text(package_text, encoding='utf-8')

          print(f'patched db status clause: {count}')
          print(f'patched publication display_floor: {display_count}')
          print(f'patched publication caption floor: {floor_count}')
          PY
      - name: Syntax check
        run: python -m compileall -q qiaolian_dual publication_package.py
      - name: Commit source fixes
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add qiaolian_dual/db.py publication_package.py
          git diff --cached --quiet && exit 0
          git commit -m 'fix reserved search visibility and floor display [skip source-fix]'
          git push origin HEAD:codex/qiaolian-ui-cleanup-20260829
