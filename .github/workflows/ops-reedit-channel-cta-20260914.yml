name: ops-reedit-channel-cta-20260914

on:
  push:
    branches:
      - ops/reedit-channel-cta-20260914
    paths:
      - .github/workflows/ops-reedit-channel-cta-20260914.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: qiaolian-v3-production
  cancel-in-progress: false

env:
  PROD_HOST: 50.114.74.120
  PROD_PORT: '22'
  PROD_SSH_USER: root
  PROD_SSH_KNOWN_HOSTS: '50.114.74.120 ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIMvdBaAbAt9/4NCEC4RmiAukQ5KK5S6OF4YEml2iLw+6'
  PROD_SSH_HOST_FINGERPRINT: 'SHA256:fuufBlFaqRpQhlkio0vuLsuv8w8x3zUb3VFQsnUny/o'
  EXPECTED_PROD_SHA: '5ddaaa357d79967fa76d19cd0e2195202b6d3b89'
  CANDIDATE_SHA: 'REPLACE_AFTER_PUSH'
  INTERVAL_SECONDS: '8'
  LIMIT_COUNT: '0'

jobs:
  reedit-all:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Verify production SSH host key
        shell: bash
        run: |
          set -Eeuo pipefail
          ssh-keyscan -T 10 -p "$PROD_PORT" -t ed25519 "$PROD_HOST" 2>/dev/null | grep -v '^#' > "$RUNNER_TEMP/known_hosts_observed"
          ssh-keygen -lf "$RUNNER_TEMP/known_hosts_observed" | grep -F "$PROD_SSH_HOST_FINGERPRINT"

      - name: Configure production SSH
        shell: bash
        env:
          PROD_SSH_PRIVATE_KEY: '${{ secrets.PROD_SSH_PRIVATE_KEY }}'
        run: |
          set -Eeuo pipefail
          test -n "$PROD_SSH_PRIVATE_KEY"
          install -d -m 700 "$HOME/.ssh"
          printf '%s\n' "$PROD_SSH_PRIVATE_KEY" > "$HOME/.ssh/qiaolian_production"
          printf '%s\n' "$PROD_SSH_KNOWN_HOSTS" > "$HOME/.ssh/known_hosts"
          chmod 600 "$HOME/.ssh/qiaolian_production" "$HOME/.ssh/known_hosts"

      - name: Rebuild and re-edit durable channel posts to clipboard CTA + consult
        shell: bash
        run: |
          set -Eeuo pipefail
          ssh -p "$PROD_PORT" -i "$HOME/.ssh/qiaolian_production" -o BatchMode=yes -o IdentitiesOnly=yes -o ConnectTimeout=20 \
            "$PROD_SSH_USER@$PROD_HOST" \
            "EXPECTED_PROD_SHA='$EXPECTED_PROD_SHA' CANDIDATE_SHA='$CANDIDATE_SHA' INTERVAL_SECONDS='$INTERVAL_SECONDS' LIMIT_COUNT='$LIMIT_COUNT' bash -s" <<'REMOTE'
          set -Eeuo pipefail
          ROOT=/opt/qiaolian_v3
          test "$(cat "$ROOT/.deployed_sha")" = "$EXPECTED_PROD_SHA"
          test "$(basename "$(readlink -f "$ROOT/current")")" = "$EXPECTED_PROD_SHA"
          for unit in qiaolian-v3@canonical.service qiaolian-v3@publisher.service qiaolian-v3@user.service qiaolian-v3@collector.service; do
            test "$(systemctl is-active "$unit")" = active
          done

          set -a
          source "$ROOT/runtime.env"
          set +a
          test -n "${PUBLISHER_BOT_TOKEN:-}"
          test -n "${CHANNEL_ID:-}"
          test -n "${USER_BOT_USERNAME:-}${DEEPLINK_BOT_USERNAME:-}"
          test -n "${ADVISOR_TG:-}${SUPPORT_USERNAME:-}"

          CAND=/tmp/qiaolian-reedit-cta-$CANDIDATE_SHA
          rm -rf "$CAND"
          git clone --quiet https://github.com/Gymmmm/bot123123.git "$CAND"
          git -C "$CAND" checkout --quiet "$CANDIDATE_SHA"

          DB="${DB_PATH:-/opt/qiaolian_dual_bots/data/qiaolian_dual_bot.db}"
          BACKUP="/opt/qiaolian_backups/reedit-cta-$(date -u +%Y%m%d-%H%M%S)"
          install -d -m 0700 "$BACKUP"
          sqlite3 "$DB" ".backup '$BACKUP/qiaolian_dual_bot.db'"
          sqlite3 "$BACKUP/qiaolian_dual_bot.db" 'PRAGMA quick_check;' | grep -Fx ok
          echo "REEDIT_BACKUP_OK path=$BACKUP"

          cd "$CAND"
          export PYTHONPATH="$CAND${PYTHONPATH:+:$PYTHONPATH}"
          "$ROOT/.venv/bin/python" - <<'PY'
          import asyncio, json, os, sqlite3, time
          from pathlib import Path
          from telegram import Bot
          from v3_core.publishing.admin_bot import load_settings
          from v3_core.publishing.delivery_coordinator import PublicationDeliveryCoordinator, TelegramSendCommand
          from v3_core.publishing.delivery_state import PublicationDeliveryStateRepository
          from v3_core.publishing.package_service import PackageBuildService
          from v3_core.publishing.package_store import FrozenPackageStore
          from v3_core.publishing.publication_instances import PublicationInstanceRepository
          from v3_core.publishing.telegram_adapter import TelegramChannelAdapter
          from v3_core.storage.inventory_reader import InventoryReader

          settings = load_settings()
          db = Path(settings.db_path)
          reader = InventoryReader(db)
          packages = FrozenPackageStore(db)
          publications = PublicationInstanceRepository(db)
          deliveries = PublicationDeliveryStateRepository(db)
          coordinator = PublicationDeliveryCoordinator(
              reader=reader,
              packages=packages,
              deliveries=deliveries,
              publications=publications,
          )
          builder = PackageBuildService(
              reader=reader,
              store=packages,
              user_bot_username=settings.user_bot_username,
              advisor_url=settings.advisor_url,
          )
          interval = float(os.environ.get("INTERVAL_SECONDS") or "8")
          limit = int(os.environ.get("LIMIT_COUNT") or "0")

          def set_package_status(package_id, old_status, new_status):
              with sqlite3.connect(str(db), timeout=30) as c:
                  c.execute("BEGIN IMMEDIATE")
                  cur = c.execute(
                      "UPDATE publication_packages_v3 SET status=?, updated_at=CURRENT_TIMESTAMP WHERE package_id=? AND status=?",
                      (new_status, package_id, old_status),
                  )
                  if cur.rowcount != 1:
                      raise RuntimeError(f"package_status_transition_failed:{package_id}:{old_status}->{new_status}")
                  c.commit()

          def build_replacement(pub):
              old = packages.verify_frozen(pub["package_id"])
              old_status = old.status
              held = False
              if old_status in {"approved", "published"}:
                  set_package_status(old.package_id, old_status, "rebuild_hold")
                  held = True
              try:
                  new = builder.build(
                      listing_id=old.listing_id,
                      offer_id=old.offer_id,
                      cover_style=old.cover_style,
                      cover_path=old.cover_path,
                      gallery=list(old.gallery),
                      source_identity=old.source_identity,
                  )
              finally:
                  if held:
                      set_package_status(old.package_id, "rebuild_hold", old_status)
              return old, new

          def command_for(package_id, channel_chat_id, attempt_id, inventory_status):
              package = packages.verify_frozen(package_id)
              return TelegramSendCommand(
                  attempt_id=str(attempt_id),
                  package_id=package.package_id,
                  channel_chat_id=str(channel_chat_id),
                  cover_path=package.cover_path,
                  caption=package.post_text,
                  actions=dict(package.actions),
                  inventory_status=str(inventory_status or "pending").strip().lower(),
              )

          def finalize(pub, old, new, caption):
              with sqlite3.connect(str(db), timeout=30) as c:
                  c.execute("BEGIN IMMEDIATE")
                  c.execute(
                      "UPDATE publication_packages_v3 SET status='superseded', updated_at=CURRENT_TIMESTAMP WHERE package_id=?",
                      (old.package_id,),
                  )
                  cur = c.execute(
                      "UPDATE publication_packages_v3 SET status='published', published_at=COALESCE(published_at, CURRENT_TIMESTAMP), updated_at=CURRENT_TIMESTAMP WHERE package_id=? AND status='package_ready'",
                      (new.package_id,),
                  )
                  if cur.rowcount != 1:
                      raise RuntimeError("new_package_publish_transition_failed")
                  cur = c.execute(
                      "UPDATE publication_instances SET package_id=?, listing_id=?, offer_id=?, post_text=?, publish_status='published', updated_at=CURRENT_TIMESTAMP WHERE instance_id=?",
                      (new.package_id, new.listing_id, new.offer_id, caption, pub["instance_id"]),
                  )
                  if cur.rowcount != 1:
                      raise RuntimeError("publication_rebind_failed")
                  c.commit()

          async def main():
              bot = Bot(token=settings.token)
              adapter = TelegramChannelAdapter(bot)
              try:
                  resolved = await bot.get_chat(settings.channel_chat_id)
                  aliases = (str(settings.channel_chat_id), str(resolved.id))
                  with sqlite3.connect(str(db), timeout=30) as c:
                      c.row_factory = sqlite3.Row
                      sql = """
                          SELECT * FROM publication_instances
                          WHERE platform='telegram'
                            AND channel_chat_id IN (?,?)
                            AND CAST(coalesce(channel_message_id,'0') AS INTEGER) > 0
                          ORDER BY CAST(channel_message_id AS INTEGER) ASC
                      """
                      rows = c.execute(sql, aliases).fetchall()
                  if limit > 0:
                      rows = rows[:limit]
                  print("REEDIT_BEGIN", "aliases=", aliases, "count=", len(rows), flush=True)
                  ok = 0
                  failed = 0
                  last = 0.0
                  for row in rows:
                      pub = dict(row)
                      if last:
                          wait = max(0.0, interval - (time.monotonic() - last))
                          if wait:
                              await asyncio.sleep(wait)
                      try:
                          listing = reader.listing(pub["listing_id"])
                          inventory_status = str(listing.get("inventory_status") or "pending")
                          old, new = build_replacement(pub)
                          command = command_for(
                              new.package_id,
                              pub["channel_chat_id"],
                              "reedit:" + pub["instance_id"],
                              inventory_status,
                          )
                          labels = []
                          from v3_core.publishing.telegram_adapter import build_channel_keyboard
                          kb = build_channel_keyboard(command.actions, inventory_status=inventory_status)
                          labels = [[b.text for b in r] for r in kb.inline_keyboard]
                          if not any("📋 租赁详情" in cell for row_labels in labels for cell in row_labels):
                              raise RuntimeError(f"cta_missing_clipboard_details:{labels}")
                          if "consult" in command.actions and not any("联系中文顾问" in cell for row_labels in labels for cell in row_labels):
                              raise RuntimeError(f"cta_missing_consult:{labels}")
                          result = await adapter.edit(command, message_id=pub["channel_message_id"])
                          finalize(pub, old, new, str(result.get("caption") or command.caption))
                          ok += 1
                          last = time.monotonic()
                          print(
                              "REEDIT_OK",
                              pub["channel_message_id"],
                              new.package_id,
                              result.get("edit_mode"),
                              inventory_status,
                              labels,
                              flush=True,
                          )
                      except Exception as exc:
                          failed += 1
                          last = time.monotonic()
                          print(
                              "REEDIT_FAIL",
                              pub.get("channel_message_id"),
                              type(exc).__name__,
                              str(exc)[:240],
                              flush=True,
                          )
                  print(f"REEDIT_RESULT selected={len(rows)} ok={ok} failed={failed} backup={os.environ.get('BACKUP','')}", flush=True)
                  if failed:
                      raise SystemExit(2)
                  if ok < 1:
                      raise SystemExit("REEDIT_NO_POSTS")
              finally:
                  await bot.shutdown()

          asyncio.run(main())
          PY

          for unit in qiaolian-v3@canonical.service qiaolian-v3@publisher.service qiaolian-v3@user.service qiaolian-v3@collector.service; do
            echo "SERVICE_POST unit=$unit active=$(systemctl is-active "$unit") restarts=$(systemctl show "$unit" -p NRestarts --value)"
            test "$(systemctl is-active "$unit")" = active
          done
          echo "REEDIT_CHANNEL_CTA_OK sha=$EXPECTED_PROD_SHA candidate=$CANDIDATE_SHA"
          REMOTE
