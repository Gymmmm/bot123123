name: qiaolian-cover-theme-patch

on:
  push:
    branches:
      - codex/qiaolian-ui-cleanup-20260829
    paths:
      - scripts/patch_cover_theme_v1.py
      - .github/workflows/qiaolian-cover-theme-patch.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/qiaolian-ui-cleanup-20260829
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Apply cover theme patch
        run: python scripts/patch_cover_theme_v1.py
      - name: Install dependencies
        run: python -m pip install -r requirements.txt pytest
      - name: Syntax check
        run: python -m compileall -q cover_generator.py tests/test_cover_theme_regression.py
      - name: Focused regression
        env:
          PYTHONPATH: '${{ github.workspace }}'
          DB_PATH: '${{ runner.temp }}/cover-theme.db'
        run: python -m pytest -q tests/test_cover_theme_regression.py tests/test_tg_album_45.py
      - name: Commit generated changes
        run: |
          git config user.name "Gymmmm"
          git config user.email "73370798+Gymmmm@users.noreply.github.com"
          git add cover_generator.py tests/test_cover_theme_regression.py
          git diff --cached --quiet && exit 0
          git commit -m "refine adaptive real estate cover theme"
          git pull --rebase origin codex/qiaolian-ui-cleanup-20260829
          git push origin HEAD:codex/qiaolian-ui-cleanup-20260829
