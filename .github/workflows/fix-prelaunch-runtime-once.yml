name: fix-prelaunch-runtime-once

on:
  push:
    branches:
      - codex/qiaolian-ui-cleanup-20260829
    paths:
      - .github/workflows/fix-prelaunch-runtime-once.yml

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/qiaolian-ui-cleanup-20260829
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Fix runtime mappings and listing context
        run: |
          python - <<'PY'
          from pathlib import Path

          p = Path('qiaolian_dual/common.py')
          s = p.read_text(encoding='utf-8')
          old = "SERVICE_REQUEST_LABELS = {'repair_ac': '空调 / 家电', 'repair_water': '漏水 / 排水', 'repair_power': '灯具 / 电路', 'repair_door': '门锁 / 门窗', 'repair_furniture': '家具损坏', 'repair_other': '其他问题', 'property': '物业沟通'}"
          new = "SERVICE_REQUEST_LABELS = {'repair_ac': '空调', 'repair_water': '热水器 / 漏水排水', 'repair_power': '灯具 / 电路', 'repair_door': '门锁 / 门禁', 'repair_washer': '洗衣机', 'repair_fridge': '冰箱', 'repair_network': '网络', 'repair_furniture': '家具损坏', 'repair_other': '其他设备', 'property': '物业协调'}"
          if old not in s:
              raise SystemExit('SERVICE_REQUEST_LABELS source not found')
          p.write_text(s.replace(old, new, 1), encoding='utf-8')

          p = Path('qiaolian_dual/listing.py')
          s = p.read_text(encoding='utf-8')
          old = "    area = _known_value(item.get('area'), item.get('community'))\n    layout = _known_value(_display_layout(item.get('layout') or item.get('property_type'), item.get('property_type')))"
          new = "    project = _known_value(item.get('project'), item.get('community'))\n    area = _known_value(item.get('area'))\n    layout = _known_value(_display_layout(item.get('layout') or item.get('property_type'), item.get('property_type')))"
          if old not in s:
              raise SystemExit('listing facts source not found')
          s = s.replace(old, new, 1)
          old2 = "    lines = ['🏠 <b>房源详情</b>', '']\n    if area: lines.append(f'🏠 区域：{he(area)}')\n    if layout: lines.append(f'🛏 户型：{he(layout)}')\n    if price: lines.append(f'💰 租金：{he(price)}')"
          new2 = "    lines = ['🏠 <b>房源详情</b>', '']\n    subject = '｜'.join(v for v in (project, layout) if v)\n    if subject: lines.append(f'🏠 <b>{he(subject)}</b>')\n    elif area: lines.append(f'🏠 <b>{he(area)}</b>')\n    if area and area != project: lines.append(f'<b>区域：</b> {he(area)}')\n    if price: lines.append(f'<b>租金：</b> <b>{he(price)}</b>')"
          if old2 not in s:
              raise SystemExit('listing lines source not found')
          p.write_text(s.replace(old2, new2, 1), encoding='utf-8')
          PY
          python -m compileall -q qiaolian_dual
          git config user.name qiaolian-actions
          git config user.email actions@users.noreply.github.com
          git add qiaolian_dual/common.py qiaolian_dual/listing.py
          git commit -m 'Fix repair categories and listing detail context'
          git push origin HEAD:codex/qiaolian-ui-cleanup-20260829
