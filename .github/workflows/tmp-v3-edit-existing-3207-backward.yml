name: tmp-v3-edit-existing-3207-backward
on:
  push:
    branches: [master]
    paths:
      - '.github/workflows/tmp-v3-edit-existing-3207-backward.yml'
permissions:
  contents: read
jobs:
  smoke-edit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      PROD_HOST: 50.114.74.120
      PROD_PORT: '22'
      PROD_SSH_USER: root
      EXPECTED_PROD_SHA: aaf7b3d8365641557d866aef798447191308d6dc
      CANDIDATE_SHA: 0b25789e53df37e6fc14f995335cb8e2e1e6cd51
      TARGET_MESSAGE_ID: '3208'
    steps:
      - uses: actions/checkout@v4
      - name: Verify production host fingerprint
        shell: bash
        run: |
          set -Eeuo pipefail
          expected=$(tr -d '\r\n' < deploy/v3/production_host_fingerprint.txt)
          ssh-keyscan -T 15 -p "$PROD_PORT" -t ed25519 "$PROD_HOST" 2>/dev/null | grep -v '^#' > "$RUNNER_TEMP/known_hosts"
          ssh-keygen -lf "$RUNNER_TEMP/known_hosts" | grep -F "$expected"
      - name: Configure production SSH
        shell: bash
        env:
          PROD_SSH_PRIVATE_KEY: ${{ secrets.PROD_SSH_PRIVATE_KEY }}
        run: |
          set -Eeuo pipefail
          install -d -m 700 "$HOME/.ssh"
          printf '%s\n' "$PROD_SSH_PRIVATE_KEY" > "$HOME/.ssh/qiaolian_production"
          cp "$RUNNER_TEMP/known_hosts" "$HOME/.ssh/known_hosts"
          chmod 600 "$HOME/.ssh/qiaolian_production" "$HOME/.ssh/known_hosts"
      - name: Re-edit one durable publication through candidate adapter
        shell: bash
        run: |
          set -Eeuo pipefail
          cat <<'PY' | ssh -p "$PROD_PORT" -i "$HOME/.ssh/qiaolian_production" -o BatchMode=yes -o IdentitiesOnly=yes "$PROD_SSH_USER@$PROD_HOST" "EXPECTED_PROD_SHA='$EXPECTED_PROD_SHA' CANDIDATE_SHA='$CANDIDATE_SHA' TARGET_MESSAGE_ID='$TARGET_MESSAGE_ID' bash -lc 'set -a; source /opt/qiaolian_v3/runtime.env; set +a; /opt/qiaolian_v3/.venv/bin/python -'"
          import asyncio, json, os, shutil, sqlite3, subprocess, sys
          from pathlib import Path

          deployed=Path('/opt/qiaolian_v3/.deployed_sha').read_text().strip()
          if deployed!=os.environ['EXPECTED_PROD_SHA']:
              raise SystemExit('SMOKE_FATAL deployed_sha_mismatch:'+deployed)

          root=Path('/tmp/qiaolian_unified_edit_candidate')
          if root.exists(): shutil.rmtree(root)
          subprocess.run(['git','clone','--quiet','https://github.com/Gymmmm/bot123123.git',str(root)],check=True)
          subprocess.run(['git','-C',str(root),'checkout','--quiet',os.environ['CANDIDATE_SHA']],check=True)
          sys.path.insert(0,str(root)); os.chdir(root)

          db=Path(os.environ.get('DB_PATH','/opt/qiaolian_dual_bots/data/qiaolian_dual_bot.db')).resolve()
          conn=sqlite3.connect(str(db)); conn.row_factory=sqlite3.Row
          cols={r['name'] for r in conn.execute('PRAGMA table_info(publication_instances)')}
          required={'instance_id','package_id','listing_id','offer_id','platform','channel_chat_id','channel_message_id','publish_status'}
          if not required.issubset(cols):
              raise SystemExit('SMOKE_FATAL incompatible_publication_instances_schema:'+','.join(sorted(cols)))

          target=os.environ['TARGET_MESSAGE_ID']
          row=conn.execute("SELECT * FROM publication_instances WHERE platform='telegram' AND channel_message_id=? ORDER BY updated_at DESC LIMIT 1",(target,)).fetchone()
          if row is None:
              raise SystemExit('SMOKE_FATAL publication_instance_not_found:'+target)
          pub=dict(row)
          print('SMOKE_TARGET',json.dumps({k:pub.get(k) for k in ('instance_id','package_id','listing_id','offer_id','channel_chat_id','channel_message_id','publish_status')},ensure_ascii=False,sort_keys=True),flush=True)

          from telegram import Bot
          from v3_core.storage.inventory_reader import InventoryReader
          from v3_core.publishing.package_store import FrozenPackageStore
          from v3_core.publishing.publication_instances import PublicationInstanceRepository
          from v3_core.publishing.delivery_state import PublicationDeliveryStateRepository
          from v3_core.publishing.delivery_coordinator import PublicationDeliveryCoordinator
          from v3_core.publishing.channel_renderer import render_channel_caption
          from v3_core.publishing.telegram_adapter import TelegramChannelAdapter, edit_existing_publication, build_channel_keyboard

          reader=InventoryReader(db); packages=FrozenPackageStore(db)
          publications=PublicationInstanceRepository(db); deliveries=PublicationDeliveryStateRepository(db)
          coordinator=PublicationDeliveryCoordinator(reader=reader,packages=packages,deliveries=deliveries,publications=publications)
          package=packages.verify_frozen(pub['package_id'])
          listing=reader.listing(package.listing_id); offer=reader.offer(package.offer_id)
          fresh=render_channel_caption(listing=listing,offer=offer,public_listing_id=str(listing.get('public_listing_id') or ''),status=str(listing.get('inventory_status') or 'pending'),adviser_note='')
          if fresh!=package.post_text:
              print('SMOKE_BLOCK stale_frozen_caption',flush=True)
              print('PACKAGE_HEAD',package.post_text[:220].replace('\n',' | '),flush=True)
              print('FRESH_HEAD',fresh[:220].replace('\n',' | '),flush=True)
              raise SystemExit(22)

          status=str(listing.get('inventory_status') or 'pending')
          keyboard=build_channel_keyboard(package.actions,inventory_status=status)
          print('SMOKE_PRECHECK',json.dumps({'public_listing_id':listing.get('public_listing_id'),'inventory_status':status,'keyboard_rows':len(keyboard.inline_keyboard),'caption_matches_live_renderer':True},ensure_ascii=False,sort_keys=True),flush=True)
          token=os.environ.get('PUBLISHER_BOT_TOKEN','').strip()
          if not token: raise SystemExit('SMOKE_FATAL missing_publisher_bot_token')

          async def main():
              bot=Bot(token=token)
              adapter=TelegramChannelAdapter(bot)
              try:
                  result=await edit_existing_publication(coordinator=coordinator,adapter=adapter,channel_chat_id=str(pub['channel_chat_id']),channel_message_id=str(pub['channel_message_id']))
                  print('SMOKE_EDIT_OK',json.dumps(result,ensure_ascii=False,sort_keys=True),flush=True)
              finally:
                  await bot.shutdown()
          asyncio.run(main())
          PY
