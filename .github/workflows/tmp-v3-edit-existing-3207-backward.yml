name: tmp-v3-edit-existing-3207-backward
on:
  push:
    branches: [master]
    paths:
      - '.github/workflows/tmp-v3-edit-existing-3207-backward.yml'
permissions:
  contents: read
jobs:
  smoke-edit-10:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      PROD_HOST: 50.114.74.120
      PROD_PORT: '22'
      PROD_SSH_USER: root
      EXPECTED_PROD_SHA: aaf7b3d8365641557d866aef798447191308d6dc
      CANDIDATE_SHA: 0b25789e53df37e6fc14f995335cb8e2e1e6cd51
      MAX_MESSAGE_ID: '3208'
      LIMIT_COUNT: '10'
      INTERVAL_SECONDS: '30'
    steps:
      - uses: actions/checkout@v4
      - name: Verify production host fingerprint
        shell: bash
        run: |
          set -Eeuo pipefail
          expected=$(tr -d '\r\n' < deploy/v3/production_host_fingerprint.txt)
          ssh-keyscan -T 15 -p "$PROD_PORT" -t ed25519 "$PROD_HOST" 2>/dev/null | grep -v '^#' > "$RUNNER_TEMP/known_hosts"
          ssh-keygen -lf "$RUNNER_TEMP/known_hosts" | grep -F "$expected"
      - name: Configure production SSH
        shell: bash
        env:
          PROD_SSH_PRIVATE_KEY: ${{ secrets.PROD_SSH_PRIVATE_KEY }}
        run: |
          set -Eeuo pipefail
          install -d -m 700 "$HOME/.ssh"
          printf '%s\n' "$PROD_SSH_PRIVATE_KEY" > "$HOME/.ssh/qiaolian_production"
          cp "$RUNNER_TEMP/known_hosts" "$HOME/.ssh/known_hosts"
          chmod 600 "$HOME/.ssh/qiaolian_production" "$HOME/.ssh/known_hosts"
      - name: Rebuild and re-edit ten durable publications
        shell: bash
        run: |
          set -Eeuo pipefail
          cat <<'PY' | ssh -p "$PROD_PORT" -i "$HOME/.ssh/qiaolian_production" -o BatchMode=yes -o IdentitiesOnly=yes "$PROD_SSH_USER@$PROD_HOST" "EXPECTED_PROD_SHA='$EXPECTED_PROD_SHA' CANDIDATE_SHA='$CANDIDATE_SHA' MAX_MESSAGE_ID='$MAX_MESSAGE_ID' LIMIT_COUNT='$LIMIT_COUNT' INTERVAL_SECONDS='$INTERVAL_SECONDS' bash -lc 'set -a; source /opt/qiaolian_v3/runtime.env; set +a; /opt/qiaolian_v3/.venv/bin/python -'"
          import asyncio, json, os, shutil, sqlite3, subprocess, sys, time
          from pathlib import Path

          deployed=Path('/opt/qiaolian_v3/.deployed_sha').read_text().strip()
          if deployed!=os.environ['EXPECTED_PROD_SHA']:
              raise SystemExit('SMOKE_FATAL deployed_sha_mismatch:'+deployed)

          root=Path('/tmp/qiaolian_unified_edit_candidate')
          if root.exists(): shutil.rmtree(root)
          subprocess.run(['git','clone','--quiet','https://github.com/Gymmmm/bot123123.git',str(root)],check=True)
          subprocess.run(['git','-C',str(root),'checkout','--quiet',os.environ['CANDIDATE_SHA']],check=True)
          sys.path.insert(0,str(root)); os.chdir(root)

          db=Path(os.environ.get('DB_PATH','/opt/qiaolian_dual_bots/data/qiaolian_dual_bot.db')).resolve()
          backup=Path('/opt/qiaolian_v3/runtime/deploy_backups/pre-smoke-reedit-10-20260913.sqlite3')
          backup.parent.mkdir(parents=True,exist_ok=True)
          shutil.copy2(db,backup)

          from telegram import Bot
          from v3_core.storage.inventory_reader import InventoryReader
          from v3_core.publishing.package_store import FrozenPackageStore
          from v3_core.publishing.package_service import PackageBuildService
          from v3_core.publishing.publication_instances import PublicationInstanceRepository
          from v3_core.publishing.delivery_state import PublicationDeliveryStateRepository
          from v3_core.publishing.delivery_coordinator import PublicationDeliveryCoordinator
          from v3_core.publishing.telegram_adapter import TelegramChannelAdapter

          conn=sqlite3.connect(str(db),timeout=30); conn.row_factory=sqlite3.Row
          conn.execute('PRAGMA busy_timeout=30000')
          chat=str(os.environ['CHANNEL_ID'])
          rows=conn.execute("""
              SELECT * FROM publication_instances
              WHERE platform='telegram' AND channel_chat_id=?
                AND publish_status='published'
                AND CAST(channel_message_id AS INTEGER)<=?
              ORDER BY CAST(channel_message_id AS INTEGER) DESC
              LIMIT ?
          """,(chat,int(os.environ['MAX_MESSAGE_ID']),int(os.environ['LIMIT_COUNT']))).fetchall()
          if len(rows)!=int(os.environ['LIMIT_COUNT']):
              raise SystemExit(f'SMOKE_FATAL expected_10_publications_got_{len(rows)}')

          reader=InventoryReader(db); packages=FrozenPackageStore(db)
          publications=PublicationInstanceRepository(db); deliveries=PublicationDeliveryStateRepository(db)
          coordinator=PublicationDeliveryCoordinator(reader=reader,packages=packages,deliveries=deliveries,publications=publications)
          builder=PackageBuildService(reader=reader,store=packages,user_bot_username=os.environ['USER_BOT_USERNAME'])
          token=os.environ['PUBLISHER_BOT_TOKEN']
          interval=float(os.environ['INTERVAL_SECONDS'])

          def restore_old(package_id,status):
              with sqlite3.connect(str(db),timeout=30) as c:
                  c.execute("UPDATE publication_packages_v3 SET status=?,updated_at=CURRENT_TIMESTAMP WHERE package_id=? AND status='rebuild_hold'",(status,package_id))
                  c.commit()

          def build_replacement(pub):
              old=packages.verify_frozen(pub['package_id'])
              old_status=old.status
              if old_status not in {'approved','published'}:
                  raise RuntimeError('old_package_not_frozen:'+old_status)
              with sqlite3.connect(str(db),timeout=30) as c:
                  c.execute('BEGIN IMMEDIATE')
                  cur=c.execute("UPDATE publication_packages_v3 SET status='rebuild_hold',updated_at=CURRENT_TIMESTAMP WHERE package_id=? AND status=?",(old.package_id,old_status))
                  if cur.rowcount!=1: raise RuntimeError('failed_to_hold_old_package')
                  c.commit()
              try:
                  new=builder.build(
                      listing_id=old.listing_id,
                      offer_id=old.offer_id,
                      cover_style=old.cover_style,
                      cover_path=old.cover_path,
                      gallery=list(old.gallery),
                      source_identity=old.source_identity,
                  )
              finally:
                  restore_old(old.package_id,old_status)
              return old,new

          def finalize(pub,old,new,caption):
              with sqlite3.connect(str(db),timeout=30) as c:
                  c.execute('BEGIN IMMEDIATE')
                  c.execute("UPDATE publication_packages_v3 SET status='superseded',updated_at=CURRENT_TIMESTAMP WHERE package_id=?",(old.package_id,))
                  c.execute("UPDATE publication_packages_v3 SET status='published',published_at=COALESCE(published_at,CURRENT_TIMESTAMP),updated_at=CURRENT_TIMESTAMP WHERE package_id=? AND status='package_ready'",(new.package_id,))
                  c.execute("UPDATE publication_instances SET package_id=?,listing_id=?,offer_id=?,post_text=?,updated_at=CURRENT_TIMESTAMP WHERE instance_id=?",(new.package_id,new.listing_id,new.offer_id,caption,pub['instance_id']))
                  c.commit()

          async def main():
              bot=Bot(token=token); adapter=TelegramChannelAdapter(bot)
              ok=0; failed=0; last=0.0
              print('SMOKE10_BEGIN', [r['channel_message_id'] for r in rows], flush=True)
              try:
                  for row in rows:
                      pub=dict(row)
                      if last:
                          wait=max(0.0,interval-(time.monotonic()-last))
                          if wait: await asyncio.sleep(wait)
                      try:
                          old,new=build_replacement(pub)
                          command=coordinator._command_for_package(
                              package_id=new.package_id,
                              channel_chat_id=pub['channel_chat_id'],
                              attempt_id='edit:'+pub['instance_id'],
                          )
                          result=await adapter.edit(command,message_id=pub['channel_message_id'])
                          finalize(pub,old,new,str(result.get('caption') or command.caption))
                          ok+=1; last=time.monotonic()
                          print('SMOKE10_OK',pub['channel_message_id'],new.package_id,result.get('edit_mode'),command.inventory_status,flush=True)
                      except Exception as exc:
                          failed+=1; last=time.monotonic()
                          print('SMOKE10_FAIL',pub['channel_message_id'],type(exc).__name__,str(exc)[:220],flush=True)
                  print(f'SMOKE10_RESULT selected={len(rows)} ok={ok} failed={failed} backup={backup}',flush=True)
              finally:
                  await bot.shutdown()
              if failed: raise SystemExit(2)
          asyncio.run(main())
          PY
