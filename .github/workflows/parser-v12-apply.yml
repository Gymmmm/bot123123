name: launch-closeout-apply

on:
  push:
    branches:
      - codex/qiaolian-ui-cleanup-20260829
    paths:
      - tools/apply_parser_v12_patch.py
      - .github/workflows/parser-v12-apply.yml

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Apply final launch closeout patch
        run: python tools/apply_parser_v12_patch.py
      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt pytest pytest-asyncio
      - name: Launch syntax check
        run: |
          python -m compileall -q qiaolian_dual v2/qiaolian_publisher_v2 publication_package.py tests/test_launch_readiness_contract.py
          git diff --check
      - name: Launch regression suite
        env:
          USER_BOT_TOKEN: '123456:TESTTOKEN'
          PUBLISHER_BOT_TOKEN: '123456:TESTTOKEN'
          PYTHONPATH: '${{ github.workspace }}'
        run: |
          python -m pytest -q \
            tests/test_launch_readiness_contract.py \
            tests/test_cover_consolidation.py \
            tests/test_prelaunch_product_contract.py \
            tests/test_parser_v12_regressions.py \
            tests/test_user_start_payload.py \
            tests/test_appointment_simplified.py \
            tests/test_customer_path_regression.py \
            tests/test_callback_route_repair.py \
            tests/test_user_ui_cleanup.py
      - name: Commit verified launch code
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add publication_package.py tests/test_cover_consolidation.py tests/test_prelaunch_product_contract.py tests/test_launch_readiness_contract.py
          git commit -m "fix: close out launch cover and route contracts"
          git push origin HEAD:codex/qiaolian-ui-cleanup-20260829
