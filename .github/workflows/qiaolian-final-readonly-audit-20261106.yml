name: qiaolian-final-readonly-audit-v3
on:
  push:
    branches: [ops/final-readonly-audit-20261106]
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - env:
          PROD_SSH_PRIVATE_KEY: ${{ secrets.PROD_SSH_PRIVATE_KEY }}
        run: |
          set -Eeuo pipefail
          install -d -m 700 "$HOME/.ssh"
          printf '%s\n' "$PROD_SSH_PRIVATE_KEY" > "$HOME/.ssh/key"
          chmod 600 "$HOME/.ssh/key"
          ssh-keyscan -T 10 -t ed25519 50.114.74.120 2>/dev/null | grep -v '^#' > "$HOME/.ssh/known_hosts"
          ssh-keygen -lf "$HOME/.ssh/known_hosts" | grep -F 'SHA256:fuufBlFaqRpQhlkio0vuLsuv8w8x3zUb3VFQsnUny/o'
          ssh -i "$HOME/.ssh/key" -o BatchMode=yes -o IdentitiesOnly=yes root@50.114.74.120 'bash -s' <<'REMOTE'
          set -Eeuo pipefail
          echo RELEASE=$(readlink -f /opt/qiaolian_v3/current)
          python3 - <<'PY'
          import sqlite3, subprocess
          db=sqlite3.connect('file:/opt/qiaolian_v3/data/qiaolian_dual_bot.db?mode=ro',uri=True)
          db.row_factory=sqlite3.Row
          tables=[r[0] for r in db.execute("SELECT name FROM sqlite_master WHERE type='table'")]
          print('TABLES',','.join(sorted(tables)))
          def stat(sql):
              try: return [tuple(r) for r in db.execute(sql).fetchall()]
              except Exception as e: return [('QUERY_FAILED',str(e))]
          print('QUEUE',stat("select state, reason_code, count(*) from publisher_auto_items_v3 group by state,reason_code"))
          print('REVIEWS',stat("select review_status,count(*) from review_items group by review_status"))
          print('LISTING_STATUS',stat("select inventory_status,count(*) from listings_v3 group by inventory_status"))
          print('LISTING_FIELDS',stat("select count(*) total, sum(case when monthly_rent is null then 1 else 0 end) no_rent, sum(case when bedrooms is null then 1 else 0 end) no_rooms, sum(case when area is null or area='' then 1 else 0 end) no_area, sum(case when description is null or description='' then 1 else 0 end) no_desc from listings_v3"))
          print('DELIVERY',stat("select state,count(*) from publication_delivery_attempts_v3 group by state"))
          print('APPOINTMENTS',stat("select status,count(*) from appointments group by status"))
          print('SERVICE_REQUESTS',stat("select category,status,count(*) from housing_service_requests group by category,status"))
          for svc in ['publisher','user','canonical','collector']:
              lines=subprocess.run(['journalctl','-u','qiaolian-v3@'+svc+'.service','--since','-48 hours','--no-pager'],capture_output=True,text=True).stdout.splitlines()
              matches=[l[-500:] for l in lines if any(w in l for w in ['Error during callback','NetworkError','PermissionError','OperationalError','DatabaseError','CRITICAL','Traceback','v3-profile'])]
              print('LOG',svc,'LINES',len(lines),'MATCHES',len(matches))
              for l in matches[-10:]: print('LOG_DETAIL',svc,l)
          print('SCHEDULER',stat("select state, count(*) from publisher_auto_items_v3 where state in ('pending','exception') group by state"))
          print('BROADCAST_TABLES',[t for t in tables if 'broadcast' in t or 'marketing' in t])
          OUT=subprocess.run(['systemctl','is-active','qiaolian-v3@publisher','qiaolian-v3@user','qiaolian-v3@canonical','qiaolian-v3@collector'],text=True,capture_output=True)
          print('SERVICES',OUT.stdout.replace('\n',','),'ERR',OUT.stderr)
          PY
          REMOTE
