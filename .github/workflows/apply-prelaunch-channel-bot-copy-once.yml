                  '搬家不是租约的终点，而是生活真正开始的节点。我们能做的，是让这一小段过渡，稍微从容一些。'
              )''')

          replace_func('qiaolian_dual/callback_rental.py', 'about_text', '''def about_text() -> str:
              return (
                  '🏠 <b>关于侨联</b>\\n\\n'
                  '这些年，我们始终专注于柬埔寨本地房产与居住服务。\\n\\n'
                  '在长期服务客户的过程中，我们越来越清楚，一次租房真正需要解决的，不只是找到房源，更包括信息确认、签约衔接、入住交接，以及住下以后仍然有人可以联系。\\n\\n'
                  '我们相信，真正有价值的服务，不止于完成一次交易，更在于建立长久而持续的信任。\\n\\n'
                  '从第一次认识，到长期选择，侨联希望以稳定的服务与责任，成为您在柬埔寨值得长期信赖的生活伙伴。\\n\\n'
                  '<b>侨联地产｜您在金边的自己人</b>'
              )''')

          replace_func('autopilot_publish_bot.py', 'build_channel_menu_keyboard', '''def build_channel_menu_keyboard() -> InlineKeyboardMarkup:
              """频道置顶索引：频道负责浏览，Bot 负责筛选与承接。"""
              if DEEPLINK_BOT_USERNAME:
                  base = f"https://t.me/{DEEPLINK_BOT_USERNAME}?start="
                  return InlineKeyboardMarkup([
                      [InlineKeyboardButton('按区域找房', url=base + 'find_area'), InlineKeyboardButton('按预算找房', url=base + 'find_budget')],
                      [InlineKeyboardButton('按户型找房', url=base + 'find_layout'), InlineKeyboardButton('最新房源', url=base + 'latest')],
                      [InlineKeyboardButton('联系侨联', url=base + 'advisor')],
                  ])
              return InlineKeyboardMarkup([])''')

          replace_func('autopilot_publish_bot.py', 'default_pin_html', '''def default_pin_html() -> str:
              custom = _get_setting(KEY_PIN_TEXT, "").strip()
              if custom:
                  return custom
              return (
                  '<b>侨联地产｜金边租房频道</b>\\n'
                  '<b>您在金边的自己人</b>\\n\\n'
                  '这里持续更新金边真实在租房源。\\n\\n'
                  '<b>怎么看：</b>直接往下浏览，每套主帖先看区域、户型和租金；需要更多照片，点「更多实拍」。\\n'
                  '<b>怎么找：</b>用下方索引按区域、预算或户型进入 Bot 筛选。\\n'
                  '<b>怎么问：</b>看中具体房源，点「房源详情」进入 Bot，房源信息会自动带上。\\n'
                  '<b>怎么约：</b>点房源下方「预约看房」，直接选择日期和实地 / 视频方式。\\n\\n'
                  '<b>频道负责看房源，Bot 负责找房、咨询和预约。</b>\\n\\n'
