name: apply-prelaunch-channel-bot-copy-once

on:
  push:
    branches:
      - codex/qiaolian-ui-cleanup-20260829
    paths:
      - .github/workflows/apply-prelaunch-channel-bot-copy-once.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/qiaolian-ui-cleanup-20260829
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Apply locked copy and navigation
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          def replace_func(path: str, name: str, new_src: str):
              p = Path(path)
              s = p.read_text(encoding='utf-8')
              pattern = rf"(?ms)^def {re.escape(name)}\([^\n]*\).*?(?=^def |\Z)"
              m = re.search(pattern, s)
              if not m:
                  raise SystemExit(f'function not found: {path}:{name}')
              s2 = s[:m.start()] + new_src.rstrip() + "\n\n" + s[m.end():]
              p.write_text(s2, encoding='utf-8')

          replace_func('qiaolian_dual/texts.py', 'welcome_text', '''def welcome_text() -> str:
              return (
                  '🏠 <b>侨联地产｜您在金边的自己人</b>\\n\\n'
                  '找房、约看房、入住服务，都可以从这里开始。\\n\\n'
                  '如果您已经在频道看到具体房源，直接点房源下方按钮进入，房源信息会自动带上。\\n\\n'
                  '也可以直接告诉我：<b>区域 + 预算 + 户型</b>。\\n\\n'
                  '请选择您现在需要的服务：'
              )''')

          replace_func('qiaolian_dual/texts.py', 'about_text', '''def about_text() -> str:
              return (
                  '🏠 <b>关于侨联</b>\\n\\n'
                  '这些年，我们始终专注于柬埔寨本地房产与居住服务。\\n\\n'
                  '在长期服务客户的过程中，我们越来越清楚，一次租房真正需要解决的，不只是找到房源，更包括信息确认、签约衔接、入住交接，以及住下以后仍然有人可以联系。\\n\\n'
                  '我们相信，真正有价值的服务，不止于完成一次交易，更在于建立长久而持续的信任。\\n\\n'
                  '从第一次认识，到长期选择，侨联希望以稳定的服务与责任，成为您在柬埔寨值得长期信赖的生活伙伴。\\n\\n'
                  '<b>侨联地产｜您在金边的自己人</b>'
              )''')

          replace_func('qiaolian_dual/texts.py', 'service_hub_text', '''def service_hub_text() -> str:
              return (
                  '🛠 <b>入住服务</b>\\n\\n'
                  '签约不是结束。入住后遇到设备、物业或生活服务问题，都可以从这里联系侨联。\\n\\n'
                  '能协助处理的，我们协助处理；需要专业服务的，我们帮助对接。'
              )''')

          replace_func('qiaolian_dual/keyboards_common.py', 'main_keyboard', '''def main_keyboard() -> InlineKeyboardMarkup:
              rows = [
