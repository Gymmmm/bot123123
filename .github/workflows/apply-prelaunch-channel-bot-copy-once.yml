                  [InlineKeyboardButton('💡 费用说明', callback_data='hub:rental:fees'), InlineKeyboardButton('📥 下载完整资料', callback_data='hub:rental:handover:pdf')],
                  [InlineKeyboardButton('⬅️ 返回', callback_data='hub:rental')],
              ])''')

          replace_func('qiaolian_dual/callback_rental.py', 'details_text', '''def details_text() -> str:
              return (
                  '📄 <b>入住交接留档</b>\\n\\n'
                  '通过侨联成交的房源，入住交接时建议记录：\\n\\n'
                  '• 房屋整体状态\\n'
                  '• 家具家电使用情况\\n'
                  '• 空调、冰箱、洗衣机等设备照片\\n'
                  '• 电表、水表读数\\n'
                  '• 墙面、地面、门锁等易产生争议的位置\\n'
                  '• 押金、电费、水费、物业费等费用规则\\n\\n'
                  '这些记录在退租时，是核对情况的重要依据。'
              )''')

          replace_func('qiaolian_dual/callback_rental.py', 'details_keyboard', '''def details_keyboard() -> InlineKeyboardMarkup:
              return InlineKeyboardMarkup([
                  [InlineKeyboardButton('📸 查看留档示例', callback_data='hub:rental:handover:preview')],
                  [InlineKeyboardButton('💬 联系我们', callback_data='hub:advisor')],
                  [InlineKeyboardButton('⬅️ 返回', callback_data='hub:rental:handover')],
              ])''')

          replace_func('qiaolian_dual/callback_rental.py', 'deposit_text', '''def deposit_text() -> str:
              return (
                  '🔒 <b>押金保障</b>\\n\\n'
                  '入住前，侨联协助完成房屋现状留档，包含设施状态、已有瑕疵、水电表读数等信息。\\n\\n'
                  '退租时，侨联可作为第三方协助核对房屋状态、费用明细及扣费依据。如出现明显争议，优先协助沟通协调。\\n\\n'
                  '押金保障不是退租那天才开始，而是从入住第一天就把细节留清楚。'
              )''')

          replace_func('qiaolian_dual/callback_rental.py', 'deposit_keyboard', '''def deposit_keyboard() -> InlineKeyboardMarkup:
              return InlineKeyboardMarkup([
                  [InlineKeyboardButton('📄 入住交接留档', callback_data='hub:rental:handover:details')],
                  [InlineKeyboardButton('💬 联系我们', callback_data='hub:advisor')],
                  [InlineKeyboardButton('⬅️ 返回', callback_data='hub:rental:handover')],
              ])''')

          replace_func('qiaolian_dual/callback_rental.py', 'fees_text', '''def fees_text() -> str:
              return (
                  '💡 <b>费用说明</b>\\n\\n'
                  '在金边租房，费用相关的问题往往集中在以下细节：\\n\\n'
                  '• 电费、水费计算方式\\n'
                  '• 物业费由谁承担\\n'
                  '• 网络是否需要自行安装\\n'
                  '• 停车费是否另计\\n'
                  '• 垃圾费、清洁费\\n'
                  '• 是否允许做饭\\n'
                  '• 提前退租的处理方式\\n\\n'
                  '侨联会尽量提前确认并说明这些内容。'
              )''')

          replace_func('qiaolian_dual/callback_rental.py', 'fees_keyboard', '''def fees_keyboard() -> InlineKeyboardMarkup:
              return InlineKeyboardMarkup([
                  [InlineKeyboardButton('🔍 去找房', callback_data='home_smart_search')],
                  [InlineKeyboardButton('💬 联系我们', callback_data='hub:advisor')],
                  [InlineKeyboardButton('⬅️ 返回', callback_data='hub:rental:handover')],
              ])''')

          replace_func('qiaolian_dual/callback_rental.py', 'moving_text', '''def moving_text() -> str:
              return (
                  '🚚 <b>搬家协助</b>\\n\\n'
                  '通过侨联成交的客户，可获得基础搬家协助：\\n\\n'
                  '• 协调搬家时间\\n'
