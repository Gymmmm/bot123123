          PY

          python -m compileall -q qiaolian_dual autopilot_publish_bot.py
          git config user.name qiaolian-actions
          git config user.email actions@users.noreply.github.com
          git add qiaolian_dual/texts.py qiaolian_dual/keyboards_common.py qiaolian_dual/keyboards_search.py qiaolian_dual/callback_rental.py autopilot_publish_bot.py
          if git diff --cached --quiet; then
            echo 'No changes.'
