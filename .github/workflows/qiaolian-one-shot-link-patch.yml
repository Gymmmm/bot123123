name: qiaolian-one-shot-link-patch

on:
  push:
    branches:
      - codex/qiaolian-ui-cleanup-20260829
    paths:
      - .github/workflows/qiaolian-one-shot-link-patch.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/qiaolian-ui-cleanup-20260829
          fetch-depth: 2
          persist-credentials: true

      - name: Apply exact publisher deep-link patch
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('meihua_publisher.py')
          source = path.read_text(encoding='utf-8')

          old = '''    base_url = f"https://t.me/{BOT_USERNAME.lstrip('@')}?start="\n    return InlineKeyboardMarkup([\n        [\n            InlineKeyboardButton("📋 租赁详情", url=f"{base_url}property_{listing_id}_details"),\n            InlineKeyboardButton("📸 更多实拍", url=f"{base_url}property_{listing_id}_photos"),\n        ],\n        [InlineKeyboardButton("📅 预约看房", url=f"{base_url}property_{listing_id}_book")],\n    ])'''
          new = '''    base_url = f"https://t.me/{BOT_USERNAME.lstrip('@')}?start="\n    public_listing_id = display_listing_id(listing_id)\n    return InlineKeyboardMarkup([\n        [\n            InlineKeyboardButton("📋 租赁详情", url=f"{base_url}property_{public_listing_id}_details"),\n            InlineKeyboardButton("📸 更多实拍", url=f"{base_url}property_{public_listing_id}_photos"),\n        ],\n        [InlineKeyboardButton("📅 预约看房", url=f"{base_url}property_{public_listing_id}_book")],\n    ])'''
          assert source.count(old) == 1, f'build_keyboard replacement count={source.count(old)}'
          source = source.replace(old, new, 1)

          old_nested = '''    def _button_layout_keyboard(message_id: int, token: str) -> InlineKeyboardMarkup:\n        user = BOT_USERNAME.lstrip("@")\n        base = f"https://t.me/{user}?start=property_{listing_id}_"\n        return InlineKeyboardMarkup([\n            [\n                InlineKeyboardButton("📋 租赁详情", url=base + "details"),\n                InlineKeyboardButton("📸 更多实拍", url=base + "photos"),\n            ],\n            [InlineKeyboardButton("📅 预约看房", url=base + "book")],\n        ])'''
          new_nested = '''    def _button_layout_keyboard(message_id: int, token: str) -> InlineKeyboardMarkup:\n        _ = message_id\n        return build_keyboard(\n            listing_id,\n            area=area,\n            post_token=token,\n            caption_variant=caption_variant,\n        )'''
          assert source.count(old_nested) == 1, f'_button_layout_keyboard replacement count={source.count(old_nested)}'
          source = source.replace(old_nested, new_nested, 1)
          assert 'property_{listing_id}_details' not in source
          assert 'base = f"https://t.me/{user}?start=property_{listing_id}_"' not in source
          path.write_text(source, encoding='utf-8')

          test_path = Path('tests/test_publish_ops_v1.py')
          test_path.write_text('''import unittest\nfrom unittest.mock import patch\n\nimport meihua_publisher\nfrom meihua_publisher import build_keyboard\n\n\nclass PublishOpsV1Tests(unittest.TestCase):\n    def test_listing_keyboard_uses_public_qc_channel_actions(self):\n        with patch.object(meihua_publisher, "BOT_USERNAME", "@TestDeepLinkBot"):\n            keyboard = build_keyboard(\n                "l_1024",\n                area="BKK1",\n                post_token="tk7f3a",\n                caption_variant="b",\n            )\n\n        rows = keyboard.inline_keyboard\n        self.assertEqual(\n            [[button.text for button in row] for row in rows],\n            [["📋 租赁详情", "📸 更多实拍"], ["📅 预约看房"]],\n        )\n        urls = [button.url for row in rows for button in row]\n        self.assertTrue(any("start=property_QC1024_details" in url for url in urls))\n        self.assertTrue(any("start=property_QC1024_photos" in url for url in urls))\n        self.assertTrue(any("start=property_QC1024_book" in url for url in urls))\n        self.assertTrue(all("l_1024" not in url for url in urls))\n\n\nif __name__ == "__main__":\n    unittest.main()\n''', encoding='utf-8')
          PY

      - name: Syntax check
        run: |
          python -m py_compile meihua_publisher.py tests/test_publish_ops_v1.py
          git diff --check

      - name: Commit exact patch
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add meihua_publisher.py tests/test_publish_ops_v1.py
          git diff --cached --exit-code && exit 1 || true
          git commit -m "fix(channel): canonicalize publisher QC deep links"
          git push origin HEAD:codex/qiaolian-ui-cleanup-20260829
