name: tmp-copy-sweep-check

on:
  push:
    branches:
      - codex/publisher-operator-flow-20260911
  workflow_dispatch:

jobs:
  v3-copy-sweep:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt pytest pytest-asyncio
      - name: Compile V3
        run: |
          python -m compileall -q v3_core tests/v3_core run_v3_publisher_bot.py run_v3_user_bot.py
      - name: Run V3 regression
        env:
          PYTHONPATH: '${{ github.workspace }}'
        run: python -m pytest -q tests/v3_core
