name: v3-server-smoke
on:
  push:
    branches: [v3/server-test]
    paths: [.github/workflows/v3-server-smoke.yml]
permissions:
  contents: read
jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Configure SSH
        env:
          KEY: '${{ secrets.PROD_SSH_PRIVATE_KEY }}'
        run: |
          install -d -m 700 ~/.ssh
          printf '%s\n' "$KEY" > ~/.ssh/key
          chmod 600 ~/.ssh/key
          ssh-keyscan -H 50.114.74.120 >> ~/.ssh/known_hosts
      - name: Start collector user and publisher together
        run: |
          ssh -i ~/.ssh/key root@50.114.74.120 'bash -s' <<'REMOTE'
          set -e
          SRC=/opt/qiaolian_dual_bots
          APP=/opt/qiaolian_v3_test
          git -C "$APP" fetch origin v3/server-test
          git -C "$APP" checkout -f origin/v3/server-test
          cp "$SRC/.env" "$APP/.env"
          [ -f "$SRC/sources.json" ] && cp "$SRC/sources.json" "$APP/sources.json" || true
          mkdir -p "$APP/telethon_sessions" "$APP/data" "$APP/logs"
          cp -a "$SRC/telethon_sessions/." "$APP/telethon_sessions/" 2>/dev/null || true
          if [ ! -x "$APP/.venv/bin/python" ]; then cp -a "$SRC/.venv" "$APP/.venv"; fi
          DB="$APP/data/v3_smoke.db"
          cd "$APP"
          if [ ! -f "$DB" ]; then DB_PATH="$DB" QL_DB_PATH="$DB" PYTHONPATH="$APP" "$APP/.venv/bin/python" scripts/bootstrap_db.py; fi
          pkill -f '/opt/qiaolian_v3_test/.*collector_bot.py' || true
          pkill -f '/opt/qiaolian_v3_test/.*run_user_bot.py' || true
          pkill -f '/opt/qiaolian_v3_test/.*run_publisher_bot_v2.py' || true
          nohup env DB_PATH="$DB" QL_DB_PATH="$DB" PYTHONPATH="$APP" "$APP/.venv/bin/python" "$APP/collector_bot.py" > "$APP/logs/collector.log" 2>&1 &
          nohup env DB_PATH="$DB" QL_DB_PATH="$DB" PYTHONPATH="$APP" "$APP/.venv/bin/python" "$APP/run_user_bot.py" > "$APP/logs/user.log" 2>&1 &
          nohup env DB_PATH="$DB" QL_DB_PATH="$DB" PYTHONPATH="$APP" "$APP/.venv/bin/python" "$APP/v2/run_publisher_bot_v2.py" > "$APP/logs/publisher.log" 2>&1 &
          sleep 8
          echo '=== PROCESS STATUS ==='
          pgrep -af 'qiaolian_v3_test.*(collector_bot|run_user_bot|run_publisher_bot_v2)' || true
          echo '=== USER LOG ==='; tail -30 "$APP/logs/user.log" || true
          echo '=== PUBLISHER LOG ==='; tail -30 "$APP/logs/publisher.log" || true
          echo '=== COLLECTOR LOG ==='; tail -30 "$APP/logs/collector.log" || true
          REMOTE
