name: v3-server-smoke
on:
  push:
    branches: [v3/server-test]
    paths: [.github/workflows/v3-server-smoke.yml]
permissions:
  contents: read
jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Verify publication media approval contract
        run: |
          python -m pytest -q tests/test_package_approval_media_count.py
      - name: Configure SSH
        env:
          KEY: '${{ secrets.PROD_SSH_PRIVATE_KEY }}'
        run: |
          install -d -m 700 ~/.ssh
          printf '%s\n' "$KEY" > ~/.ssh/key
          chmod 600 ~/.ssh/key
          ssh-keyscan -H 50.114.74.120 >> ~/.ssh/known_hosts
      - name: Prepare persistent V3 database and update A checkout
        run: |
          ssh -i ~/.ssh/key root@50.114.74.120 'bash -s' <<'REMOTE'
          set -e
          APP=/opt/qiaolian_v3_test
          DB="$APP/data/qiaolian.db"
          git -C "$APP" fetch origin v3/server-test
          git -C "$APP" checkout -f origin/v3/server-test
          mkdir -p "$APP/data" "$APP/backups"
          if [ -f "$DB" ]; then
            cp -a "$DB" "$APP/backups/qiaolian-$(date +%Y%m%d-%H%M%S).db"
          fi
          cd "$APP"
          DB_PATH="$DB" QL_DB_PATH="$DB" PYTHONPATH="$APP" "$APP/.venv/bin/python" scripts/bootstrap_db.py
          DB_PATH="$DB" PYTHONPATH="$APP" "$APP/.venv/bin/python" -m pytest -q tests/test_package_approval_media_count.py
          "$APP/.venv/bin/python" - <<'PY'
          from v2.qiaolian_publisher_v2.release_contract_patch import _effective_package_media_count
          import json
          row={
              'main_images_json': json.dumps(['cover.jpg']),
              'discussion_images_json': json.dumps([f'p{i}.jpg' for i in range(1,9)]),
              'source_identity_json': json.dumps({'media_count': 8}),
          }
          n=_effective_package_media_count(row)
          print('APPROVAL_EFFECTIVE_MEDIA_COUNT', n)
          assert n == 8
          PY
          echo "A_CHECKOUT_SHA=$(git rev-parse HEAD)"
          REMOTE
