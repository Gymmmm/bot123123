name: v3-server-smoke
on:
  push:
    branches: [v3/server-test]
    paths: [.github/workflows/v3-server-smoke.yml]
permissions:
  contents: read
jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Configure SSH
        env:
          KEY: '${{ secrets.PROD_SSH_PRIVATE_KEY }}'
        run: |
          install -d -m 700 ~/.ssh
          printf '%s\n' "$KEY" > ~/.ssh/key
          chmod 600 ~/.ssh/key
          ssh-keyscan -H 50.114.74.120 >> ~/.ssh/known_hosts
      - name: Bootstrap and collect
        run: |
          ssh -i ~/.ssh/key root@50.114.74.120 'bash -s' <<'REMOTE'
          set -e
          SRC=/opt/qiaolian_dual_bots
          APP=/opt/qiaolian_v3_test
          git -C "$APP" fetch origin v3/server-test
          git -C "$APP" checkout -f origin/v3/server-test
          cp "$SRC/.env" "$APP/.env"
          [ -f "$SRC/sources.json" ] && cp "$SRC/sources.json" "$APP/sources.json" || true
          mkdir -p "$APP/telethon_sessions" "$APP/data"
          cp -a "$SRC/telethon_sessions/." "$APP/telethon_sessions/" 2>/dev/null || true
          rm -rf "$APP/.venv"
          cp -a "$SRC/.venv" "$APP/.venv"
          DB="$APP/data/v3_smoke.db"
          rm -f "$DB"
          cd "$APP"
          DB_PATH="$DB" QL_DB_PATH="$DB" PYTHONPATH="$APP" "$APP/.venv/bin/python" scripts/bootstrap_db.py
          DB_PATH="$DB" QL_DB_PATH="$DB" PYTHONPATH="$APP" timeout 180 "$APP/.venv/bin/python" collector_bot.py || test $? -eq 124
          DB_PATH="$DB" "$APP/.venv/bin/python" - <<'PY'
          import sqlite3
          p='/opt/qiaolian_v3_test/data/v3_smoke.db'
          c=sqlite3.connect(p)
          n=c.execute('select count(*) from source_posts').fetchone()[0]
          print('COLLECTED_SOURCE_POSTS',n)
          for r in c.execute('select id, source_message_id, substr(raw_text,1,120) from source_posts order by id desc limit 10'):
              print(r)
          if n < 10:
              raise SystemExit('need at least 10 collected source posts')
          PY
          REMOTE
