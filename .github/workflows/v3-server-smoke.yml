name: v3-server-smoke
on:
  push:
    branches: [v3/server-test]
    paths: [.github/workflows/v3-server-smoke.yml]
permissions:
  contents: read
jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Configure SSH
        env:
          KEY: '${{ secrets.PROD_SSH_PRIVATE_KEY }}'
        run: |
          install -d -m 700 ~/.ssh
          printf '%s\n' "$KEY" > ~/.ssh/key
          chmod 600 ~/.ssh/key
          ssh-keyscan -H 50.114.74.120 >> ~/.ssh/known_hosts
      - name: Prepare persistent V3 database
        run: |
          ssh -i ~/.ssh/key root@50.114.74.120 'bash -s' <<'REMOTE'
          set -e
          APP=/opt/qiaolian_v3_test
          DB="$APP/data/qiaolian.db"
          mkdir -p "$APP/data" "$APP/backups"
          cd "$APP"
          if [ -f "$DB" ]; then
            cp -a "$DB" "$APP/backups/qiaolian-$(date +%Y%m%d-%H%M%S).db"
          fi
          DB_PATH="$DB" QL_DB_PATH="$DB" PYTHONPATH="$APP" "$APP/.venv/bin/python" scripts/bootstrap_db.py
          DB_PATH="$DB" "$APP/.venv/bin/python" - <<'PY'
          import sqlite3
          p='/opt/qiaolian_v3_test/data/qiaolian.db'
          c=sqlite3.connect(p)
          print('FINAL_DB', p)
          print('TABLES', c.execute("select count(*) from sqlite_master where type='table'").fetchone()[0])
          print('SOURCE_POSTS', c.execute('select count(*) from source_posts').fetchone()[0])
          PY
          REMOTE
