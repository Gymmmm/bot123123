name: qiaolian-v3-production-deploy

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: '选择 DEPLOY 才会部署 V3 生产服务器'
        required: true
        default: CANCEL
        type: choice
        options: [CANCEL, DEPLOY]
      deploy_sha:
        description: '输入已通过门禁的完整 40 位生产 commit SHA'
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: qiaolian-v3-production
  cancel-in-progress: false

env:
  APPROVED_DEPLOY_SHA: 8c7b06f7a6146071baba45f8d1aec7a590665768
  EXPECTED_PARENT_SHA: bc2cab7e68a4c582cf28f6ef28d4d44f2f850268
  EXPECTED_PRODUCTION_BASE_SHA: 44fe587fec95b8c79ca5314558627d4f8e55d16f
  EXPECTED_TREE_SHA: 92d0d35c5322b9bb8dd3c1aa282187fadb7da399
  PROD_HOST: 50.114.74.120
  PROD_PORT: '22'
  PROD_SSH_USER: root
  PROD_SSH_KNOWN_HOSTS: '50.114.74.120 ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIMvdBaAbAt9/4NCEC4RmiAukQ5KK5S6OF4YEml2iLw+6'
  PROD_SSH_HOST_FINGERPRINT: 'SHA256:fuufBlFaqRpQhlkio0vuLsuv8w8x3zUb3VFQsnUny/o'

jobs:
  verify-and-deploy:
    if: github.event_name == 'workflow_dispatch' && inputs.confirm == 'DEPLOY'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Validate requested immutable SHA
        env:
          REQUESTED_SHA: '${{ inputs.deploy_sha }}'
        run: |
          set -Eeuo pipefail
          [[ "$REQUESTED_SHA" =~ ^[0-9a-f]{40}$ ]] || { echo 'DEPLOY_BLOCKED deploy_sha_must_be_full_40_hex_commit'; exit 1; }
          test "$REQUESTED_SHA" = "$APPROVED_DEPLOY_SHA" || { echo 'DEPLOY_BLOCKED sha_not_approved'; exit 1; }
          echo "DEPLOY_SHA=$REQUESTED_SHA" >> "$GITHUB_ENV"

      - name: Checkout approved immutable SHA
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.deploy_sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Verify commit ancestry and tree
        run: |
          set -Eeuo pipefail
          CANDIDATE_SHA=$(git rev-parse HEAD)
          CANDIDATE_TREE=$(git rev-parse 'HEAD^{tree}')
          CANDIDATE_PARENT=$(git rev-parse HEAD^)
          CANDIDATE_GRANDPARENT=$(git rev-parse HEAD^^)
          test "$CANDIDATE_SHA" = "$DEPLOY_SHA"
          test "$CANDIDATE_SHA" = "$APPROVED_DEPLOY_SHA"
          test "$CANDIDATE_PARENT" = "$EXPECTED_PARENT_SHA"
          test "$CANDIDATE_GRANDPARENT" = "$EXPECTED_PRODUCTION_BASE_SHA"
          test "$CANDIDATE_TREE" = "$EXPECTED_TREE_SHA"
          test "$(git rev-list --count \"$EXPECTED_PRODUCTION_BASE_SHA..$CANDIDATE_SHA\")" = 2
          git merge-base --is-ancestor "$EXPECTED_PRODUCTION_BASE_SHA" "$CANDIDATE_SHA"
          echo "CANDIDATE_SHA=$CANDIDATE_SHA" >> "$GITHUB_ENV"
          echo "CANDIDATE_TREE=$CANDIDATE_TREE" >> "$GITHUB_ENV"
