name: qiaolian-v3-production-deploy

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: '选择 DEPLOY 才会部署 V3 生产服务器'
        required: true
        default: CANCEL
        type: choice
        options: [CANCEL, DEPLOY]

permissions:
  contents: read

concurrency:
  group: qiaolian-v3-production
  cancel-in-progress: false

env:
  DEPLOY_BRANCH: codex/v3-core-extraction-20260908
  PROD_HOST: 50.114.74.120
  PROD_PORT: '22'
  PROD_SSH_USER: root
  PROD_SSH_KNOWN_HOSTS: '50.114.74.120 ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAILuFtkSn5SJKY7mZ52Lc/QydPRTvHFpsj87M/HcIkb/L'
  PROD_SSH_HOST_FINGERPRINT: 'SHA256:sgqLYOUAZ482H3y5jREQ6q2BVvNFPXYiOg4ruyFVnsA'

jobs:
  verify-and-deploy:
    if: github.event_name == 'workflow_dispatch' && inputs.confirm == 'DEPLOY'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout approved V3 branch
        uses: actions/checkout@v4
        with:
          ref: ${{ env.DEPLOY_BRANCH }}
          fetch-depth: 0

      - name: Verify branch and capture immutable SHA
        run: |
          set -Eeuo pipefail
          test "$GITHUB_REF_NAME" = "$DEPLOY_BRANCH"
          CANDIDATE_SHA=$(git rev-parse HEAD)
          echo "CANDIDATE_SHA=$CANDIDATE_SHA" >> "$GITHUB_ENV"

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Run complete V3 regression gate
        env:
          PYTHONPATH: '${{ github.workspace }}'
        run: |
          set -Eeuo pipefail
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt pytest pytest-asyncio
          python -m compileall -q v3_core tests/v3_core run_v3_collector.py run_v3_canonical_worker.py run_v3_publisher_bot.py run_v3_user_bot.py run_v3_preflight.py
          python -m pytest -q tests/v3_core

      - name: Build immutable release bundle
        env:
          RELEASE_BUNDLE: '${{ runner.temp }}/qiaolian-v3-release.bundle'
        run: |
          set -Eeuo pipefail
          git update-ref refs/heads/actions-production "$CANDIDATE_SHA"
          git bundle create "$RELEASE_BUNDLE" refs/heads/actions-production
          git bundle verify "$RELEASE_BUNDLE"

      - name: Verify production SSH host key
        run: |
          set -Eeuo pipefail
          ssh-keyscan -T 10 -p "$PROD_PORT" -t ed25519 "$PROD_HOST" 2>/dev/null | grep -v '^#' > "$RUNNER_TEMP/qiaolian_observed_known_hosts"
          ssh-keygen -lf "$RUNNER_TEMP/qiaolian_observed_known_hosts" | grep -F "$PROD_SSH_HOST_FINGERPRINT"

      - name: Configure production SSH
        env:
          PROD_SSH_PRIVATE_KEY: '${{ secrets.PROD_SSH_PRIVATE_KEY }}'
        run: |
          set -Eeuo pipefail
          test -n "$PROD_SSH_PRIVATE_KEY"
          install -d -m 700 "$HOME/.ssh"
          printf '%s\n' "$PROD_SSH_PRIVATE_KEY" > "$HOME/.ssh/qiaolian_production"
          printf '%s\n' "$PROD_SSH_KNOWN_HOSTS" > "$HOME/.ssh/known_hosts"
          chmod 600 "$HOME/.ssh/qiaolian_production" "$HOME/.ssh/known_hosts"

      - name: Upload verified release bundle
        env:
          RELEASE_BUNDLE: '${{ runner.temp }}/qiaolian-v3-release.bundle'
          REMOTE_BUNDLE: '/var/tmp/qiaolian-v3-${{ github.run_id }}-${{ github.sha }}.bundle'
        run: |
          set -Eeuo pipefail
          scp -P "$PROD_PORT" -i "$HOME/.ssh/qiaolian_production" -o BatchMode=yes -o IdentitiesOnly=yes -o ConnectTimeout=20 "$RELEASE_BUNDLE" "$PROD_SSH_USER@$PROD_HOST:$REMOTE_BUNDLE"

      - name: Deploy and verify four V3 components
        env:
          REMOTE_BUNDLE: '/var/tmp/qiaolian-v3-${{ github.run_id }}-${{ github.sha }}.bundle'
        run: |
          set -Eeuo pipefail
          ssh -p "$PROD_PORT" -i "$HOME/.ssh/qiaolian_production" -o BatchMode=yes -o IdentitiesOnly=yes -o ConnectTimeout=20 "$PROD_SSH_USER@$PROD_HOST" "bash -s -- '$REMOTE_BUNDLE' '$CANDIDATE_SHA'" <<'REMOTE'
          set -Eeuo pipefail
          BUNDLE_PATH=$1
          EXPECTED_SHA=$2
          ROOT=/opt/qiaolian_v3
          OLD=/opt/qiaolian_dual_bots
          RELEASE="$ROOT/releases/$EXPECTED_SHA"
          CURRENT="$ROOT/current"
          RUNTIME="$ROOT/runtime"
          RUNTIME_ENV="$ROOT/runtime.env"
          VENV="$ROOT/.venv"
          PYTHON_BOOTSTRAP="$OLD/.venv/bin/python"
          SERVICES=(qiaolian-v3@collector.service qiaolian-v3@canonical.service qiaolian-v3@publisher.service qiaolian-v3@user.service)
          trap 'rm -f -- "$BUNDLE_PATH"' EXIT

          test -f "$BUNDLE_PATH" || { echo "DEPLOY_BLOCKED missing_release_bundle"; exit 1; }
          ENV_SOURCE="$RUNTIME_ENV"
          [ -f "$ENV_SOURCE" ] || ENV_SOURCE="$ROOT/.env"
          [ -f "$ENV_SOURCE" ] || ENV_SOURCE="$OLD/.env"
          if [ ! -f "$ENV_SOURCE" ]; then
            for legacy_service in qiaolian-user-bot.service qiaolian-publisher-bot.service qiaolian-collector.service; do
              SERVICE_ENV=$(systemctl show "$legacy_service" -p EnvironmentFiles --value 2>/dev/null | awk '{print $1}')
              if [ -n "$SERVICE_ENV" ] && [ -f "$SERVICE_ENV" ]; then
                ENV_SOURCE="$SERVICE_ENV"
                break
              fi
            done
          fi
          test -f "$ENV_SOURCE" || { echo "DEPLOY_BLOCKED missing_production_env"; exit 1; }
          test -d "$OLD/data" || { echo "DEPLOY_BLOCKED missing_production_data"; exit 1; }
          test -d "$OLD/media" || { echo "DEPLOY_BLOCKED missing_production_media"; exit 1; }
          test -d "$OLD/telethon_sessions" || { echo "DEPLOY_BLOCKED missing_telethon_sessions"; exit 1; }
          test -d "$OLD/.playwright-browsers" || { echo "DEPLOY_BLOCKED missing_playwright_browsers"; exit 1; }
          test -x "$PYTHON_BOOTSTRAP" || { echo "DEPLOY_BLOCKED missing_python_bootstrap"; exit 1; }
          PYTHON_VERSION=$($PYTHON_BOOTSTRAP -c 'import sys; print(f"{sys.version_info.major}.{sys.version_info.minor}")')
          test "$PYTHON_VERSION" = "3.12" || { echo "DEPLOY_BLOCKED python_version=$PYTHON_VERSION"; exit 1; }
          echo "DEPLOY_PREREQUISITES_OK python=$PYTHON_VERSION"

          install -d -m 0755 "$ROOT/releases"
          if [ ! -d "$RELEASE/.git" ]; then
            rm -rf -- "$RELEASE"
            git clone -q "$BUNDLE_PATH" --branch actions-production "$RELEASE"
          fi
          test "$(git -C "$RELEASE" rev-parse HEAD)" = "$EXPECTED_SHA"

          if [ ! -x "$VENV/bin/python" ]; then
            "$PYTHON_BOOTSTRAP" -m venv "$VENV"
          fi
          "$VENV/bin/python" -m pip install --disable-pip-version-check --upgrade pip
          "$VENV/bin/python" -m pip install --disable-pip-version-check -r "$RELEASE/requirements.txt"

          install -d -m 0750 -o qiaolianbot -g qiaolianbot "$RUNTIME"
          ln -sfn "$OLD/data" "$RUNTIME/data"
          ln -sfn "$OLD/media" "$RUNTIME/media"
          ln -sfn "$OLD/telethon_sessions" "$RUNTIME/telethon"
          ln -sfn "$OLD/.playwright-browsers" "$RUNTIME/playwright-browsers"
          if [ ! -f "$RUNTIME/sources.json" ]; then
            SOURCE_CONFIG="$ROOT/sources.json"
            [ -f "$SOURCE_CONFIG" ] || SOURCE_CONFIG="$OLD/sources.json"
            test -f "$SOURCE_CONFIG"
            install -m 0640 -o qiaolianbot -g qiaolianbot "$SOURCE_CONFIG" "$RUNTIME/sources.json"
          fi

          ENV_NEXT=$(mktemp "$ROOT/runtime.env.XXXXXX")
          awk -F= '
            BEGIN { split("QIAOLIAN_CODE_ROOT QIAOLIAN_VENV QIAOLIAN_RUNTIME_ROOT DATA_DIR DB_PATH SQLITE_PATH MEDIA_ROOT COLLECTOR_DOWNLOAD_DIR TELETHON_SESSION_PATH COLLECTOR_SOURCES_JSON V3_COVER_OUTPUT_DIR PLAYWRIGHT_BROWSERS_PATH V3_CANONICAL_WORKER_INTERVAL_SECONDS CHANNEL_DISCUSSION_ENABLED", keys, " "); for (i in keys) managed[keys[i]]=1 }
            /^[[:space:]]*#/ || !index($0,"=") { print; next }
            { key=$1; gsub(/^[[:space:]]+|[[:space:]]+$/, "", key); if (!managed[key]) print }
          ' "$ENV_SOURCE" > "$ENV_NEXT"
          cat >> "$ENV_NEXT" <<ENV
          QIAOLIAN_CODE_ROOT=$CURRENT
          QIAOLIAN_VENV=$VENV
          QIAOLIAN_RUNTIME_ROOT=$RUNTIME
          DATA_DIR=$RUNTIME/data
          DB_PATH=$RUNTIME/data/qiaolian_dual_bot.db
          SQLITE_PATH=$RUNTIME/data/qiaolian_dual_bot.db
          MEDIA_ROOT=$RUNTIME/media
          COLLECTOR_DOWNLOAD_DIR=$RUNTIME/media/collector_downloads
          TELETHON_SESSION_PATH=$RUNTIME/telethon/qiaolian_collector
          COLLECTOR_SOURCES_JSON=$RUNTIME/sources.json
          V3_COVER_OUTPUT_DIR=$RUNTIME/media/covers_v3
          PLAYWRIGHT_BROWSERS_PATH=$RUNTIME/playwright-browsers
          V3_CANONICAL_WORKER_INTERVAL_SECONDS=5
          CHANNEL_DISCUSSION_ENABLED=false
          ENV
          install -m 0640 -o root -g qiaolianbot "$ENV_NEXT" "$RUNTIME_ENV"
          rm -f -- "$ENV_NEXT"

          chown -R qiaolianbot:qiaolianbot "$RELEASE" "$VENV"
          ln -sfn "$RELEASE" "$ROOT/current.next"
          mv -Tf "$ROOT/current.next" "$CURRENT"
          install -m 0644 "$CURRENT/deploy/v3/qiaolian-v3@.service" /etc/systemd/system/qiaolian-v3@.service
          systemctl daemon-reload

          runuser -u qiaolianbot -- bash -lc "set -a; source '$RUNTIME_ENV'; set +a; exec '$VENV/bin/python' '$CURRENT/run_v3_preflight.py' --initialize --component all --db '$RUNTIME/data/qiaolian_dual_bot.db'"
          runuser -u qiaolianbot -- bash -lc "set -a; source '$RUNTIME_ENV'; set +a; exec '$VENV/bin/python' '$CURRENT/run_v3_preflight.py' --component all --db '$RUNTIME/data/qiaolian_dual_bot.db'"

          systemctl disable --now qiaolian-user-bot.service qiaolian-publisher-bot.service qiaolian-collector.service 2>/dev/null || true
          systemctl enable "${SERVICES[@]}"
          ACTIVATED_AT=$(date -u '+%Y-%m-%d %H:%M:%S UTC')
          systemctl restart "${SERVICES[@]}"
          sleep 10
          HEALTH_FAILED=0
          for service in "${SERVICES[@]}"; do
            ACTIVE=$(systemctl is-active "$service" 2>/dev/null || true)
            PID=$(systemctl show "$service" -p MainPID --value 2>/dev/null || echo 0)
            RESTARTS=$(systemctl show "$service" -p NRestarts --value 2>/dev/null || echo unknown)
            echo "SERVICE_HEALTH unit=$service active=$ACTIVE pid=$PID restarts=$RESTARTS"
            [ "$ACTIVE" = active ] || HEALTH_FAILED=1
            [ "${PID:-0}" -gt 0 ] 2>/dev/null || HEALTH_FAILED=1
            [ "$RESTARTS" = 0 ] || HEALTH_FAILED=1
          done
          if [ "$HEALTH_FAILED" -ne 0 ] || journalctl -u qiaolian-v3@collector.service -u qiaolian-v3@canonical.service -u qiaolian-v3@publisher.service -u qiaolian-v3@user.service --since "$ACTIVATED_AT" --no-pager | grep -Eq 'Traceback|ModuleNotFoundError|Main process exited|Failed with result'; then
            systemctl --no-pager --full status "${SERVICES[@]}" || true
            journalctl -u qiaolian-v3@collector.service -u qiaolian-v3@canonical.service -u qiaolian-v3@publisher.service -u qiaolian-v3@user.service --since "$ACTIVATED_AT" --no-pager
            exit 1
          fi
          printf '%s\n' "$EXPECTED_SHA" > "$ROOT/.deployed_sha"
          chmod 0644 "$ROOT/.deployed_sha"
          systemctl --no-pager --full status "${SERVICES[@]}"
          echo "V3_DEPLOYMENT_OK sha=$EXPECTED_SHA"
          REMOTE
