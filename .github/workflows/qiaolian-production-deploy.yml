name: qiaolian-v3-production-deploy

on:
  push:
    branches:
      - deploy-control
    paths:
      - '.github/deploy-control/request.json'
  workflow_dispatch:
    inputs:
      confirm:
        description: '选择 DEPLOY 才会部署 V3 生产服务器'
        required: true
        default: CANCEL
        type: choice
        options: [CANCEL, DEPLOY]
      deploy_sha:
        description: '输入已通过门禁的完整 40 位生产 commit SHA'
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: qiaolian-v3-production
  cancel-in-progress: false

env:
  PROD_HOST: 50.114.74.120
  PROD_PORT: '22'
  PROD_SSH_USER: root
  PROD_SSH_KNOWN_HOSTS: '50.114.74.120 ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIMvdBaAbAt9/4NCEC4RmiAukQ5KK5S6OF4YEml2iLw+6'
  PROD_SSH_HOST_FINGERPRINT: 'SHA256:fuufBlFaqRpQhlkio0vuLsuv8w8x3zUb3VFQsnUny/o'

jobs:
  verify-and-deploy:
    if: >-
      (github.event_name == 'workflow_dispatch' && inputs.confirm == 'DEPLOY') ||
      (github.event_name == 'push' && github.ref == 'refs/heads/deploy-control')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout deployment control event
        if: github.event_name == 'push'
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 2
          persist-credentials: false

      - name: Validate requested immutable SHA
        env:
          EVENT_NAME: '${{ github.event_name }}'
          MANUAL_CONFIRM: '${{ inputs.confirm }}'
          MANUAL_SHA: '${{ inputs.deploy_sha }}'
        run: |
          set -Eeuo pipefail
          if [ "$EVENT_NAME" = workflow_dispatch ]; then
            test "$MANUAL_CONFIRM" = DEPLOY || { echo 'DEPLOY_BLOCKED confirm_must_equal_DEPLOY'; exit 1; }
            REQUESTED_SHA="$MANUAL_SHA"
          elif [ "$EVENT_NAME" = push ]; then
            test "$GITHUB_REF" = refs/heads/deploy-control || { echo 'DEPLOY_BLOCKED invalid_control_branch'; exit 1; }
            mapfile -t CHANGED_FILES < <(git diff-tree --no-commit-id --name-only -r "$GITHUB_SHA")
            test "${#CHANGED_FILES[@]}" -eq 1 || { echo 'DEPLOY_BLOCKED control_commit_must_change_one_file'; exit 1; }
            test "${CHANGED_FILES[0]}" = .github/deploy-control/request.json || { echo 'DEPLOY_BLOCKED invalid_control_path'; exit 1; }
            mapfile -t REQUEST_FIELDS < <(python3 - <<'PY'
          import json
          import re
          from pathlib import Path

          data = json.loads(Path(".github/deploy-control/request.json").read_text(encoding="utf-8"))
          if set(data) != {"confirm", "deploy_sha", "request_id"}:
              raise SystemExit("DEPLOY_BLOCKED invalid_control_fields")
          confirm = data["confirm"]
          deploy_sha = data["deploy_sha"]
          request_id = data["request_id"]
          if confirm != "DEPLOY":
              raise SystemExit("DEPLOY_BLOCKED confirm_must_equal_DEPLOY")
          if not isinstance(deploy_sha, str) or re.fullmatch(r"[0-9a-f]{40}", deploy_sha) is None:
              raise SystemExit("DEPLOY_BLOCKED deploy_sha_must_be_full_40_hex_commit")
          if not isinstance(request_id, str) or re.fullmatch(r"[0-9A-Za-z._:-]{8,64}", request_id) is None:
              raise SystemExit("DEPLOY_BLOCKED invalid_request_id")
          print(confirm)
          print(deploy_sha)
          print(request_id)
          PY
            )
            test "${REQUEST_FIELDS[0]}" = DEPLOY
            REQUESTED_SHA="${REQUEST_FIELDS[1]}"
            echo "DEPLOY_CONTROL_REQUEST_ID=${REQUEST_FIELDS[2]}"
          else
            echo 'DEPLOY_BLOCKED unsupported_event'
            exit 1
          fi
          [[ "$REQUESTED_SHA" =~ ^[0-9a-f]{40}$ ]] || { echo 'DEPLOY_BLOCKED deploy_sha_must_be_full_40_hex_commit'; exit 1; }
          echo "DEPLOY_SHA=$REQUESTED_SHA" >> "$GITHUB_ENV"

      - name: Checkout requested immutable SHA
        uses: actions/checkout@v4
        with:
          ref: ${{ env.DEPLOY_SHA }}
          fetch-depth: 0
          persist-credentials: false

      - name: Verify requested immutable SHA
        run: |
          set -Eeuo pipefail
          CANDIDATE_SHA=$(git rev-parse HEAD)
          CANDIDATE_TREE=$(git rev-parse 'HEAD^{tree}')
          test "$CANDIDATE_SHA" = "$DEPLOY_SHA" || { echo "DEPLOY_BLOCKED deploy_sha_mismatch expected=$DEPLOY_SHA actual=$CANDIDATE_SHA"; exit 1; }
          echo "CANDIDATE_SHA=$CANDIDATE_SHA" >> "$GITHUB_ENV"
          echo "CANDIDATE_TREE=$CANDIDATE_TREE" >> "$GITHUB_ENV"

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Run complete V3 regression gate
        env:
          PYTHONPATH: '${{ github.workspace }}'
        run: |
          set -Eeuo pipefail
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt pytest pytest-asyncio
          python -m compileall -q v3_core tests/v3_core run_v3_collector.py run_v3_canonical_worker.py run_v3_publisher_bot.py run_v3_user_bot.py run_v3_preflight.py
          python -m pytest -q tests/v3_core
          git diff --check

      - name: Build immutable release bundle
        env:
          RELEASE_BUNDLE: '${{ runner.temp }}/qiaolian-v3-release.bundle'
        run: |
          set -Eeuo pipefail
          git update-ref refs/heads/actions-production "$CANDIDATE_SHA"
          git bundle create "$RELEASE_BUNDLE" refs/heads/actions-production
          git bundle verify "$RELEASE_BUNDLE"

      - name: Verify production SSH host key
        run: |
          set -Eeuo pipefail
          ssh-keyscan -T 10 -p "$PROD_PORT" -t ed25519 "$PROD_HOST" 2>/dev/null | grep -v '^#' > "$RUNNER_TEMP/qiaolian_observed_known_hosts"
          ssh-keygen -lf "$RUNNER_TEMP/qiaolian_observed_known_hosts" | grep -F "$PROD_SSH_HOST_FINGERPRINT"

      - name: Configure production SSH
        env:
          PROD_SSH_PRIVATE_KEY: '${{ secrets.PROD_SSH_PRIVATE_KEY }}'
        run: |
          set -Eeuo pipefail
          test -n "$PROD_SSH_PRIVATE_KEY"
          install -d -m 700 "$HOME/.ssh"
          printf '%s\n' "$PROD_SSH_PRIVATE_KEY" > "$HOME/.ssh/qiaolian_production"
          printf '%s\n' "$PROD_SSH_KNOWN_HOSTS" > "$HOME/.ssh/known_hosts"
          chmod 600 "$HOME/.ssh/qiaolian_production" "$HOME/.ssh/known_hosts"

      - name: Upload verified release bundle
        env:
          RELEASE_BUNDLE: '${{ runner.temp }}/qiaolian-v3-release.bundle'
          REMOTE_BUNDLE: '/var/tmp/qiaolian-v3-${{ github.run_id }}-${{ github.sha }}.bundle'
        run: |
          set -Eeuo pipefail
          scp -P "$PROD_PORT" -i "$HOME/.ssh/qiaolian_production" -o BatchMode=yes -o IdentitiesOnly=yes -o ConnectTimeout=20 "$RELEASE_BUNDLE" "$PROD_SSH_USER@$PROD_HOST:$REMOTE_BUNDLE"

      - name: Provision vision runtime config (key from secret, never logged)
        env:
          V3_VISION_API_KEY: '${{ secrets.V3_VISION_API_KEY }}'
          REMOTE_SCRIPT: '/var/tmp/qiaolian-provision-vision-${{ github.run_id }}.py'
        run: |
          set -Eeuo pipefail
          test -n "$V3_VISION_API_KEY" || { echo 'DEPLOY_BLOCKED missing_vision_secret'; exit 1; }
          cat > "$RUNNER_TEMP/provision_vision.py" <<'PY'
          import os, re, shutil, sys, time
          PATH = "/opt/qiaolian_v3/runtime.env"
          BACKUP_DIR = "/opt/qiaolian_backups"
          key = sys.stdin.read().strip()
          if not re.fullmatch(r"[A-Za-z0-9_-]{20,200}", key):
              raise SystemExit("VISION_CONFIG_BLOCKED invalid_key_format")
          want = {
              "V3_VISION_PROVIDER": "gemini",
              "V3_VISION_API_KEY": key,
              "V3_VISION_MODEL": "gemini-3.5-flash-lite",
              "V3_VISION_THINKING": "minimal",
              "V3_VISION_RPM": "14",
          }
          st = os.stat(PATH)
          with open(PATH, encoding="utf-8") as fh:
              original = fh.read()
          pattern = re.compile(r"^\s*(?:export\s+)?(?:" + "|".join(want) + r")\s*=")
          kept = [line for line in original.splitlines() if not pattern.match(line)]
          while kept and not kept[-1].strip():
              kept.pop()
          updated = "\n".join(kept + [""] + [f"{k}={v}" for k, v in want.items()]) + "\n"
          # 600 when the service user owns the file; a root-owned file keeps group read for the service group (never world).
          mode = 0o600 if st.st_uid != 0 else (st.st_mode & 0o640)
          backup = "-"
          changed = updated != original
          if changed:
              os.makedirs(BACKUP_DIR, exist_ok=True)
              backup = f"{BACKUP_DIR}/runtime.env.before_vision_{time.strftime('%Y%m%d_%H%M%S', time.gmtime())}"
              shutil.copy2(PATH, backup)
              os.chown(backup, 0, 0)
              os.chmod(backup, 0o600)
              tmp = PATH + ".vision.tmp"
              fd = os.open(tmp, os.O_WRONLY | os.O_CREAT | os.O_TRUNC, 0o600)
              with os.fdopen(fd, "w", encoding="utf-8") as fh:
                  fh.write(updated)
                  fh.flush()
                  os.fsync(fh.fileno())
              os.chown(tmp, st.st_uid, st.st_gid)
              os.chmod(tmp, mode)
              os.replace(tmp, PATH)
          else:
              os.chmod(PATH, mode)
          kept_count = len([l for l in kept if l.strip() and not l.lstrip().startswith("#")])
          print(f"VISION_CONFIG provider=gemini model=gemini-3.5-flash-lite thinking=minimal rpm=14 key_present=yes "
                f"changed={'yes' if changed else 'no'} other_settings_kept={kept_count} mode={oct(mode)} "
                f"owner={st.st_uid}:{st.st_gid} env_backup={backup}")
          PY
          scp -P "$PROD_PORT" -i "$HOME/.ssh/qiaolian_production" -o BatchMode=yes -o IdentitiesOnly=yes -o ConnectTimeout=20 "$RUNNER_TEMP/provision_vision.py" "$PROD_SSH_USER@$PROD_HOST:$REMOTE_SCRIPT"
          rm -f "$RUNNER_TEMP/provision_vision.py"
          printf '%s' "$V3_VISION_API_KEY" | ssh -p "$PROD_PORT" -i "$HOME/.ssh/qiaolian_production" -o BatchMode=yes -o IdentitiesOnly=yes -o ConnectTimeout=20 "$PROD_SSH_USER@$PROD_HOST" "PY=/opt/qiaolian_v3/.venv/bin/python; [ -x \"\$PY\" ] || PY=python3; \"\$PY\" '$REMOTE_SCRIPT'; rc=\$?; rm -f '$REMOTE_SCRIPT'; exit \$rc"

      - name: Deploy and verify four V3 components
        env:
          REMOTE_BUNDLE: '/var/tmp/qiaolian-v3-${{ github.run_id }}-${{ github.sha }}.bundle'
        run: |
          set -Eeuo pipefail
          ssh -p "$PROD_PORT" -i "$HOME/.ssh/qiaolian_production" -o BatchMode=yes -o IdentitiesOnly=yes -o ConnectTimeout=20 "$PROD_SSH_USER@$PROD_HOST" "bash -s -- '$REMOTE_BUNDLE' '$CANDIDATE_SHA'" <<'REMOTE'
          set -Eeuo pipefail
          BUNDLE_PATH=$1
          EXPECTED_SHA=$2
          ROOT=/opt/qiaolian_v3
          OLD=/opt/qiaolian_dual_bots
          RELEASE="$ROOT/releases/$EXPECTED_SHA"
          CURRENT="$ROOT/current"
          RUNTIME_ENV="$ROOT/runtime.env"
          VENV="$ROOT/.venv"
          DB="$OLD/data/qiaolian_dual_bot.db"
          BACKUP_DIR=/opt/qiaolian_backups
          PYTHON_BOOTSTRAP=""
          SERVICES=(qiaolian-v3@collector.service qiaolian-v3@canonical.service qiaolian-v3@publisher.service qiaolian-v3@user.service)
          SWITCHED=0
          OLD_RELEASE=""
          OLD_SHA=""
          BACKUP_PATH=""
          cleanup() { rm -f -- "$BUNDLE_PATH"; }
          rollback_release() {
            rc=$?; trap - ERR
            if [ "$SWITCHED" -eq 1 ] && [ -n "$OLD_RELEASE" ] && [ -d "$OLD_RELEASE" ]; then
              echo "ROLLBACK_START release=$OLD_RELEASE"
              ln -sfn "$OLD_RELEASE" "$ROOT/current.rollback"; mv -Tf "$ROOT/current.rollback" "$CURRENT"
              systemctl restart "${SERVICES[@]}" || true
              if [ -n "$OLD_SHA" ]; then printf '%s\n' "$OLD_SHA" > "$ROOT/.deployed_sha"; chmod 0644 "$ROOT/.deployed_sha"; fi
              echo "ROLLBACK_COMPLETE release=$OLD_RELEASE"
            fi
            cleanup; exit "$rc"
          }
          trap cleanup EXIT
          test -f "$BUNDLE_PATH" || { echo "DEPLOY_BLOCKED missing_release_bundle"; exit 1; }
          test -f "$RUNTIME_ENV" || { echo "DEPLOY_BLOCKED missing_runtime_env"; exit 1; }
          test -f "$DB" || { echo "DEPLOY_BLOCKED missing_production_db"; exit 1; }
          test -d "$OLD/media" || { echo "DEPLOY_BLOCKED missing_production_media"; exit 1; }
          test -d "$OLD/telethon_sessions" || { echo "DEPLOY_BLOCKED missing_telethon_sessions"; exit 1; }
          OLD_RELEASE=$(readlink -f "$CURRENT"); test -d "$OLD_RELEASE" || { echo "DEPLOY_BLOCKED current_release_missing"; exit 1; }
          OLD_SHA=$(basename "$OLD_RELEASE"); echo "CURRENT_PRODUCTION_SHA=$OLD_SHA"
          for service in "${SERVICES[@]}"; do test "$(systemctl is-active "$service")" = active || { echo "DEPLOY_BLOCKED service_not_active=$service"; exit 1; }; done
          for python_candidate in "$VENV/bin/python" "$OLD/.venv/bin/python" /opt/qiaolian-python-3.12/bin/python3 /usr/local/bin/python3.12 /usr/bin/python3.12; do if [ -x "$python_candidate" ]; then PYTHON_BOOTSTRAP="$python_candidate"; break; fi; done
          test -n "$PYTHON_BOOTSTRAP" || { echo "DEPLOY_BLOCKED missing_python_bootstrap"; exit 1; }
          echo '=== PRE-DEPLOY DB CHECK ==='
          "$PYTHON_BOOTSTRAP" - "$DB" <<'PY'
          import sqlite3, sys
          db=sqlite3.connect(f"file:{sys.argv[1]}?mode=ro",uri=True); db.execute("PRAGMA query_only=ON")
          print("integrity_check=",db.execute("PRAGMA integrity_check").fetchone()[0]); print("quick_check=",db.execute("PRAGMA quick_check").fetchone()[0])
          assert db.execute("PRAGMA integrity_check").fetchone()[0]=="ok"; assert db.execute("PRAGMA quick_check").fetchone()[0]=="ok"
          PY
          install -d -m 0750 -o root -g qiaolianbot "$BACKUP_DIR"
          BACKUP_PATH="$BACKUP_DIR/qiaolian_before_${EXPECTED_SHA}_$(date -u +%Y%m%d_%H%M%S).db"
          "$PYTHON_BOOTSTRAP" - "$DB" "$BACKUP_PATH" <<'PY'
          import sqlite3,sys
          src=sqlite3.connect(f"file:{sys.argv[1]}?mode=ro",uri=True); src.execute("PRAGMA query_only=ON"); dst=sqlite3.connect(sys.argv[2]); src.backup(dst); dst.close(); src.close()
          check=sqlite3.connect(f"file:{sys.argv[2]}?mode=ro",uri=True); check.execute("PRAGMA query_only=ON"); integrity=check.execute("PRAGMA integrity_check").fetchone()[0]; quick=check.execute("PRAGMA quick_check").fetchone()[0]
          print("backup_integrity_check=",integrity); print("backup_quick_check=",quick); assert integrity=="ok"; assert quick=="ok"; check.close()
          PY
          chmod 0640 "$BACKUP_PATH"; chown root:qiaolianbot "$BACKUP_PATH"; echo "DB_BACKUP path=$BACKUP_PATH bytes=$(stat -c %s "$BACKUP_PATH")"
          install -d -m 0755 "$ROOT/releases"
          if [ ! -d "$RELEASE/.git" ]; then rm -rf -- "$RELEASE"; git clone -q "$BUNDLE_PATH" --branch actions-production "$RELEASE"; fi
          test "$(git -C "$RELEASE" rev-parse HEAD)" = "$EXPECTED_SHA"
          printf '%s\n' "$EXPECTED_SHA" > "$RELEASE/.deployed_sha"; chmod 0644 "$RELEASE/.deployed_sha"; chown -R qiaolianbot:qiaolianbot "$RELEASE"
          install -d -m 0750 -o qiaolianbot -g qiaolianbot "$ROOT/runtime/playwright-browsers"
          runuser -u qiaolianbot -- env PLAYWRIGHT_BROWSERS_PATH="$ROOT/runtime/playwright-browsers" "$VENV/bin/python" -m playwright install chromium
          test -x "$ROOT/runtime/playwright-browsers/chromium_headless_shell-1187/chrome-linux/headless_shell" || { echo "DEPLOY_BLOCKED playwright_browser_missing"; exit 1; }
          runuser -u qiaolianbot -- bash -lc "set -a; source '$RUNTIME_ENV'; set +a; export QIAOLIAN_CODE_ROOT='$RELEASE'; exec '$PYTHON_BOOTSTRAP' '$RELEASE/run_v3_preflight.py' --component all --db '$DB'"
          trap rollback_release ERR
          ln -sfn "$RELEASE" "$ROOT/current.next"; mv -Tf "$ROOT/current.next" "$CURRENT"; SWITCHED=1
          systemctl restart "${SERVICES[@]}"; ACTIVATED_AT=$(date -u '+%Y-%m-%d %H:%M:%S UTC'); sleep 10
          HEALTH_FAILED=0
          for service in "${SERVICES[@]}"; do ACTIVE=$(systemctl is-active "$service" 2>/dev/null||true); PID=$(systemctl show "$service" -p MainPID --value 2>/dev/null||echo 0); RESTARTS=$(systemctl show "$service" -p NRestarts --value 2>/dev/null||echo unknown); echo "SERVICE_HEALTH unit=$service active=$ACTIVE pid=$PID restarts=$RESTARTS"; [ "$ACTIVE" = active ]||HEALTH_FAILED=1; [ "${PID:-0}" -gt 0 ] 2>/dev/null||HEALTH_FAILED=1; [ "$RESTARTS" = 0 ]||HEALTH_FAILED=1; done
          LOGS=$(journalctl -u qiaolian-v3@collector.service -u qiaolian-v3@canonical.service -u qiaolian-v3@publisher.service -u qiaolian-v3@user.service --since "$ACTIVATED_AT" --no-pager); printf '%s\n' "$LOGS"
          if [ "$HEALTH_FAILED" -ne 0 ] || printf '%s\n' "$LOGS" | grep -Eqi 'Traceback|ModuleNotFoundError|Main process exited|Failed with result|database is locked|sqlite.*error|409.*conflict|Conflict: terminated by other getUpdates request|polling error|callback.*exception|publication.*(error|failed)|appointment.*(error|failed)|lead.*(error|failed)'; then echo 'DEPLOY_HEALTH_FAILED'; false; fi
          "$PYTHON_BOOTSTRAP" - "$DB" <<'PY'
          import sqlite3,sys
          db=sqlite3.connect(f"file:{sys.argv[1]}?mode=ro",uri=True); db.execute("PRAGMA query_only=ON"); integrity=db.execute("PRAGMA integrity_check").fetchone()[0]; quick=db.execute("PRAGMA quick_check").fetchone()[0]
          print("post_integrity_check=",integrity); print("post_quick_check=",quick); assert integrity=="ok"; assert quick=="ok"
          PY
          printf '%s\n' "$EXPECTED_SHA" > "$ROOT/.deployed_sha"; chmod 0644 "$ROOT/.deployed_sha"; trap - ERR
          echo "V3_DEPLOYMENT_OK sha=$EXPECTED_SHA backup=$BACKUP_PATH"
          REMOTE

      - name: Verify vision provider is configured (no key output, no API call)
        run: |
          set -Eeuo pipefail
          ssh -p "$PROD_PORT" -i "$HOME/.ssh/qiaolian_production" -o BatchMode=yes -o IdentitiesOnly=yes -o ConnectTimeout=20 "$PROD_SSH_USER@$PROD_HOST" "bash -s" <<'REMOTE'
          set -Eeuo pipefail
          CHECK=$(mktemp /var/tmp/qiaolian-vision-check.XXXXXX.py)
          trap 'rm -f "$CHECK"' EXIT
          cat > "$CHECK" <<'PY'
          from v3_core.media.vision import vision_client_from_env
          c = vision_client_from_env()
          interval = getattr(c, "_min_interval", 0) or 0
          rpm = round(60 / interval) if interval else 0
          print(f"VISION_PROVIDER_CONFIGURED client={c.name} model={','.join(getattr(c, 'models', []))} thinking={getattr(c, 'thinking', '')} rpm={rpm} key_present={bool(getattr(c, '_api_key', ''))}")
          assert c.name == "gemini", c.name
          PY
          chmod 0644 "$CHECK"
          runuser -u qiaolianbot -- bash -lc "set -a; source /opt/qiaolian_v3/runtime.env; set +a; cd /opt/qiaolian_v3/current; exec /opt/qiaolian_v3/.venv/bin/python '$CHECK'"
          stat -c 'RUNTIME_ENV mode=%a owner=%U:%G' /opt/qiaolian_v3/runtime.env
          readlink -f /opt/qiaolian_v3/current
          REMOTE

      - name: Verify two real Publisher deliveries
        if: env.DEPLOY_SHA == 'a899d96bc623e78b4602e8dc2c897e0b11d80933'
        run: |
          set -Eeuo pipefail
          ssh -p "$PROD_PORT" -i "$HOME/.ssh/qiaolian_production" -o BatchMode=yes -o IdentitiesOnly=yes -o ConnectTimeout=20 "$PROD_SSH_USER@$PROD_HOST" "bash -s" <<'REMOTE'
          set -Eeuo pipefail
          cd /opt/qiaolian_v3/current
          set -a; source /opt/qiaolian_v3/runtime.env; set +a
          runuser -u qiaolianbot --preserve-environment -- /opt/qiaolian_v3/.venv/bin/python - <<'PY'
          import asyncio
          from telegram import Bot
          from v3_core.publishing.admin_bot import load_settings
          from v3_core.publishing.publisher_app import V3PublisherApplication
          async def main():
              settings=load_settings(); app=V3PublisherApplication(settings); bot=Bot(settings.token)
              for offer in ("OFF_3ddae62e8b7a45fb9643fc5565d6ebb9","OFF_480dd91f8efa41ba8c4fc844ba1a1fd5"):
                  result=await app.autopilot.process_one(bot=bot, force_offer_id=offer, origin="collector")
                  print(result)
                  if result.status not in {"published","already_published"}: raise SystemExit("publish_failed:"+repr(result))
          asyncio.run(main())
          PY
          REMOTE

      - name: Remove temporary SSH material
        if: always()
        run: rm -f "$HOME/.ssh/qiaolian_production"
