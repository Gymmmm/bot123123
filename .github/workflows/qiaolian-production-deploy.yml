name: qiaolian-production-deploy

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: '选择 DEPLOY 才会部署生产服务器'
        required: true
        default: CANCEL
        type: choice
        options:
          - CANCEL
          - DEPLOY

permissions:
  contents: read

concurrency:
  group: qiaolian-production
  cancel-in-progress: false

env:
  DEPLOY_BRANCH: codex/qiaolian-ui-cleanup-20260829
  PROD_HOST: 50.114.74.120
  PROD_PORT: '22'
  PROD_SSH_USER: root
  PROD_SSH_KNOWN_HOSTS: '50.114.74.120 ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAILuFtkSn5SJKY7mZ52Lc/QydPRTvHFpsj87M/HcIkb/L'
  PROD_SSH_HOST_FINGERPRINT: 'SHA256:sgqLYOUAZ482H3y5jREQ6q2BVvNFPXYiOg4ruyFVnsA'

jobs:
  verify-and-deploy:
    if: github.event_name == 'workflow_dispatch' && inputs.confirm == 'DEPLOY'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout approved deployment branch
        uses: actions/checkout@v4
        with:
          ref: ${{ env.DEPLOY_BRANCH }}
          fetch-depth: 0
      - name: Verify checked-out commit
        run: |
          set -Eeuo pipefail
          CANDIDATE_SHA=$(git rev-parse HEAD)
          echo "CANDIDATE_SHA=$CANDIDATE_SHA" >> "$GITHUB_ENV"
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install test dependencies
        run: |
          set -Eeuo pipefail
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt pytest pytest-asyncio
      - name: Full launch regression gate
        env:
          USER_BOT_TOKEN: '123456:TESTTOKEN'
          PUBLISHER_BOT_TOKEN: '123456:TESTTOKEN'
          DB_PATH: '${{ runner.temp }}/qiaolian-production-check.db'
          PYTHONPATH: '${{ github.workspace }}'
        run: |
          set -Eeuo pipefail
          python -m compileall -q qiaolian_dual v2/qiaolian_publisher_v2 meihua_publisher.py cover_generator.py autopilot_publish_bot.py publication_package.py publication_delivery.py discussion_map_store.py parser_v2_safe.py tools/run_parser_v2_safe.py photo_formatter_v1_1.py photo_ranker.py media_pipeline_v1_1.py tests
          python -c "from qiaolian_dual.user_bot import build_application; assert build_application() is not None"
          (cd v2 && env -u PYTHONPATH python -c "import run_publisher_bot_v2; print('PUBLISHER_IMPORT_OK')")
          python -m pytest -q tests/test_v1_release_contract.py tests/test_launch_readiness_contract.py tests/test_user_start_payload.py tests/test_appointment_simplified.py tests/test_appointment_mobile_copy.py tests/test_customer_path_regression.py tests/test_issue25_contract.py tests/test_channel_standard_contract.py tests/test_noto_font_contract.py tests/test_user_text_hierarchy.py tests/test_second_batch_runtime_contract.py tests/test_callback_route_repair.py tests/test_callback_route_static_guards.py tests/test_user_ui_cleanup.py tests/test_daily_broadcast_rotation.py tests/test_tg_album_45.py tests/test_cover_consolidation.py tests/test_prelaunch_product_contract.py tests/test_user_bot_runtime_guards.py tests/test_parser_v12_regressions.py tests/test_parser_v2_safe.py tests/test_media_pipeline_v11.py
      - name: Build authenticated Git bundle
        env:
          RELEASE_BUNDLE: '${{ runner.temp }}/qiaolian-release.bundle'
        run: |
          set -Eeuo pipefail
          git update-ref refs/heads/actions-production "$CANDIDATE_SHA"
          git bundle create "$RELEASE_BUNDLE" refs/heads/actions-production
          git bundle verify "$RELEASE_BUNDLE"
      - name: Verify production SSH host key
        run: |
          set -Eeuo pipefail
          ssh-keyscan -T 10 -p "$PROD_PORT" -t ed25519 "$PROD_HOST" 2>/dev/null | grep -v '^#' > "$RUNNER_TEMP/qiaolian_observed_known_hosts"
          ssh-keygen -lf "$RUNNER_TEMP/qiaolian_observed_known_hosts" | grep -F "$PROD_SSH_HOST_FINGERPRINT"
      - name: Configure production SSH
        env:
          PROD_SSH_PRIVATE_KEY: '${{ secrets.PROD_SSH_PRIVATE_KEY }}'
        run: |
          set -Eeuo pipefail
          test -n "$PROD_SSH_PRIVATE_KEY"
          install -d -m 700 "$HOME/.ssh"
          printf '%s\n' "$PROD_SSH_PRIVATE_KEY" > "$HOME/.ssh/qiaolian_production"
          printf '%s\n' "$PROD_SSH_KNOWN_HOSTS" > "$HOME/.ssh/known_hosts"
          chmod 600 "$HOME/.ssh/qiaolian_production" "$HOME/.ssh/known_hosts"
      - name: Upload verified release bundle
        env:
          RELEASE_BUNDLE: '${{ runner.temp }}/qiaolian-release.bundle'
          REMOTE_BUNDLE: '/tmp/qiaolian-${{ github.run_id }}-${{ github.sha }}.bundle'
        run: |
          set -Eeuo pipefail
          scp -P "$PROD_PORT" -i "$HOME/.ssh/qiaolian_production" -o BatchMode=yes -o IdentitiesOnly=yes -o ConnectTimeout=20 "$RELEASE_BUNDLE" "$PROD_SSH_USER@$PROD_HOST:$REMOTE_BUNDLE"
      - name: Deploy, restart, verify, and rollback on failure
        env:
          REMOTE_BUNDLE: '/tmp/qiaolian-${{ github.run_id }}-${{ github.sha }}.bundle'
        run: |
          set -Eeuo pipefail
          ssh -p "$PROD_PORT" -i "$HOME/.ssh/qiaolian_production" -o BatchMode=yes -o IdentitiesOnly=yes -o ConnectTimeout=20 "$PROD_SSH_USER@$PROD_HOST" "bash -s -- '$REMOTE_BUNDLE' '$CANDIDATE_SHA' '$DEPLOY_BRANCH'" <<'REMOTE'
          set -Eeuo pipefail
          export PATH="/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin${PATH:+:$PATH}"
          hash -r
          command -v git >/dev/null || DEBIAN_FRONTEND=noninteractive apt-get install -y git
          command -v sqlite3 >/dev/null || DEBIAN_FRONTEND=noninteractive apt-get install -y sqlite3
          BUNDLE_PATH=$1
          EXPECTED_SHA=$2
          DEPLOY_BRANCH=$3
          APP=/opt/qiaolian_dual_bots
          DB="$APP/data/qiaolian_dual_bot.db"
          SERVICES=(qiaolian-user-bot.service qiaolian-publisher-bot.service qiaolian-collector.service)
          echo "CHECK: paths"
          test -d "$APP" && test -x "$APP/.venv/bin/python" && test -f "$APP/.env" && test -f "$DB" && test -f "$BUNDLE_PATH"
          git -c safe.directory="$APP" -C "$APP" rev-parse --git-dir >/dev/null 2>&1 || git -c safe.directory="$APP" -C "$APP" init
          git -c safe.directory="$APP" -C "$APP" fetch "$BUNDLE_PATH" refs/heads/actions-production
          test "$(git -c safe.directory="$APP" -C "$APP" rev-parse FETCH_HEAD)" = "$EXPECTED_SHA"
          STAMP=$(date -u +%Y%m%d-%H%M%S)
          BACKUP="/opt/backups/qiaolian-actions-$STAMP"
          install -d -m 0700 "$BACKUP"
          cp -a "$APP/.env" "$BACKUP/.env"
          systemctl stop "${SERVICES[@]}"
          sqlite3 "$DB" ".backup '$BACKUP/qiaolian_dual_bot.db'"
          echo "CHECK: checkout $EXPECTED_SHA"
          git -c safe.directory="$APP" -C "$APP" checkout -f -B "$DEPLOY_BRANCH" "$EXPECTED_SHA"
          test "$(git -c safe.directory="$APP" -C "$APP" rev-parse HEAD)" = "$EXPECTED_SHA"
          echo "CHECK: pip"
          runuser -u qiaolianbot -- "$APP/.venv/bin/pip" install --disable-pip-version-check -r "$APP/requirements.txt"
          install -d -m 0755 "$APP/.playwright-browsers"
          chown qiaolianbot "$APP/.playwright-browsers" || true
          runuser -u qiaolianbot -- env PLAYWRIGHT_BROWSERS_PATH="$APP/.playwright-browsers" "$APP/.venv/bin/python" -m playwright install chromium
          "$APP/.venv/bin/python" -m compileall -q "$APP/qiaolian_dual" "$APP/v2/qiaolian_publisher_v2" "$APP/meihua_publisher.py" "$APP/publication_package.py"
          runuser -u qiaolianbot -- env PYTHONPATH="$APP" DB_PATH="$DB" "$APP/.venv/bin/python" -c "from qiaolian_dual.user_bot import build_application; assert build_application() is not None"
          runuser -u qiaolianbot -- env -u PYTHONPATH bash -lc "cd '$APP/v2' && '$APP/.venv/bin/python' -c 'import run_publisher_bot_v2; print(\"PUBLISHER_IMPORT_OK\")'"
          runuser -u qiaolianbot -- env PYTHONPATH="$APP" PLAYWRIGHT_BROWSERS_PATH="$APP/.playwright-browsers" "$APP/.venv/bin/python" -c "from playwright.sync_api import sync_playwright; p=sync_playwright().start(); b=p.chromium.launch(headless=True, args=['--no-sandbox']); b.close(); p.stop()"
          fc-match -f '%{family}\n' 'Noto Sans CJK SC' | grep -qi 'Noto Sans CJK'
          ACTIVATED_AT=$(date -u '+%Y-%m-%d %H:%M:%S UTC')
          systemctl start qiaolian-user-bot.service qiaolian-publisher-bot.service qiaolian-collector.service
          sleep 3
          systemctl is-active --quiet qiaolian-user-bot.service
          systemctl is-active --quiet qiaolian-publisher-bot.service
          systemctl is-active --quiet qiaolian-collector.service
          PUB_PID_1=$(systemctl show qiaolian-publisher-bot.service -p MainPID --value)
          PUB_RESTARTS_1=$(systemctl show qiaolian-publisher-bot.service -p NRestarts --value)
          test "${PUB_PID_1:-0}" -gt 0
          sleep 5
          systemctl is-active --quiet qiaolian-publisher-bot.service
          PUB_PID_2=$(systemctl show qiaolian-publisher-bot.service -p MainPID --value)
          PUB_RESTARTS_2=$(systemctl show qiaolian-publisher-bot.service -p NRestarts --value)
          test "${PUB_PID_2:-0}" -gt 0
          test "$PUB_RESTARTS_1" = "$PUB_RESTARTS_2"
          journalctl -u qiaolian-publisher-bot.service --since "$ACTIVATED_AT" --no-pager | grep -F "统一管理员 Bot 启动" >/dev/null
          if journalctl -u qiaolian-publisher-bot.service --since "$ACTIVATED_AT" --no-pager | grep -Eq 'Traceback|ModuleNotFoundError|Main process exited|Failed with result'; then
            echo "Publisher runtime failed after startup" >&2
            journalctl -u qiaolian-publisher-bot.service --since "$ACTIVATED_AT" --no-pager
            exit 1
          fi
          printf '%s\n' "$EXPECTED_SHA" > "$APP/.deployed_sha"
          systemctl --no-pager --full status "${SERVICES[@]}"
          journalctl -u qiaolian-user-bot.service -u qiaolian-publisher-bot.service -u qiaolian-collector.service --since "$ACTIVATED_AT" -n 120 --no-pager || true
          rm -f "$BUNDLE_PATH"
          echo "DEPLOYMENT_OK sha=$EXPECTED_SHA backup=$BACKUP"
          REMOTE
