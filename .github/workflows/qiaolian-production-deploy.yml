        env:
          REQUESTED_SHA: '${{ inputs.deploy_sha }}'
        run: |
          set -Eeuo pipefail
          [[ "$REQUESTED_SHA" =~ ^[0-9a-f]{40}$ ]] || { echo 'DEPLOY_BLOCKED deploy_sha_must_be_full_40_hex_commit'; exit 1; }
          test "$REQUESTED_SHA" = "$APPROVED_DEPLOY_SHA" || { echo 'DEPLOY_BLOCKED sha_not_approved'; exit 1; }
          echo "DEPLOY_SHA=$REQUESTED_SHA" >> "$GITHUB_ENV"

