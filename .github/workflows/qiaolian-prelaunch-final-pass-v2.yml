name: qiaolian-prelaunch-final-pass-v2

on:
  push:
    branches:
      - codex/qiaolian-ui-cleanup-20260829
    paths:
      - scripts/prelaunch_album_test_update.py
      - .github/workflows/qiaolian-prelaunch-final-pass-v2.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/qiaolian-ui-cleanup-20260829
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Apply final prelaunch fixes
        run: |
          python scripts/prelaunch_final_pass.py
          python scripts/prelaunch_album_test_update.py
      - name: Install dependencies
        run: python -m pip install -r requirements.txt pytest
      - name: Syntax check
        run: python -m compileall -q meihua_publisher.py publication_package.py discussion_map_store.py autopilot_publish_bot.py v2/qiaolian_publisher_v2 tests/test_prelaunch_product_contract.py tests/test_tg_album_45.py
      - name: Focused regression
        env:
          PYTHONPATH: '${{ github.workspace }}'
          USER_BOT_TOKEN: '123456:TESTTOKEN'
          PUBLISHER_BOT_TOKEN: '123456:TESTTOKEN'
          DB_PATH: '${{ runner.temp }}/prelaunch.db'
        run: python -m pytest -q tests/test_prelaunch_product_contract.py tests/test_user_ui_cleanup.py tests/test_customer_path_regression.py tests/test_daily_broadcast_rotation.py tests/test_tg_album_45.py tests/test_cover_theme_regression.py
      - name: Commit generated changes
        run: |
          git config user.name "Gymmmm"
          git config user.email "73370798+Gymmmm@users.noreply.github.com"
          git add meihua_publisher.py publication_package.py discussion_map_store.py autopilot_publish_bot.py v2/qiaolian_publisher_v2/keyboards.py v2/qiaolian_publisher_v2/formatters.py tests/test_prelaunch_product_contract.py tests/test_tg_album_45.py
          git diff --cached --quiet && exit 0
          git commit -m "final prelaunch product and publishing cleanup"
          git pull --rebase origin codex/qiaolian-ui-cleanup-20260829
          git push origin HEAD:codex/qiaolian-ui-cleanup-20260829
