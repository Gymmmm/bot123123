name: trigger-production-deploy-once

on:
  push:
    branches:
      - codex/qiaolian-ui-cleanup-20260829
    paths:
      - .github/workflows/trigger-production-deploy-once.yml

permissions:
  actions: write
  contents: read

jobs:
  trigger:
    runs-on: ubuntu-latest
    steps:
      - name: Dispatch guarded production deploy
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run qiaolian-production-deploy.yml --ref codex/qiaolian-ui-cleanup-20260829 -f confirm=DEPLOY
