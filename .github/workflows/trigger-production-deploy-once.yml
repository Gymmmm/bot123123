name: trigger-production-deploy-once

on:
  push:
    branches:
      - codex/qiaolian-ui-cleanup-20260829
    paths:
      - .github/workflows/trigger-production-deploy-once.yml

permissions:
  actions: write
  contents: read

jobs:
  trigger:
    runs-on: ubuntu-latest
    steps:
      - name: Dispatch guarded production deploy
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: Gymmmm/bot123123
        run: |
          echo 'deploy verifier with production runtime patches'
          gh workflow run qiaolian-production-deploy.yml --repo "$GH_REPO" --ref codex/qiaolian-ui-cleanup-20260829 -f confirm=DEPLOY
