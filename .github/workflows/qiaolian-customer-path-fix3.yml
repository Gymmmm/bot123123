name: qiaolian-customer-path-fix3

on:
  push:
    branches:
      - codex/qiaolian-ui-cleanup-20260829
    paths:
      - .github/workflows/qiaolian-customer-path-fix3.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/qiaolian-ui-cleanup-20260829
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Apply fixes and focused tests
        run: |
          python - <<'PY'
          from pathlib import Path

          p = Path('meihua_publisher.py')
          text = p.read_text(encoding='utf-8')
          old = '''    layout = _compact_copy(\n        normalize_room_type(_listing_value(facts, "room_type", "layout", default="")),\n        18,\n    )\n    price = _price_compact_for_post(facts)\n    summary = "｜".join(part for part in (project, layout, price) if part)\n    consult_text = f"你好，我想咨询这套房\\n（✨{summary}✨）" if summary else "你好，我想咨询这套房"\n'''
          new = '''    layout = _compact_copy(\n        _display_layout(\n            normalize_room_type(_listing_value(facts, "room_type", "layout", default="")),\n            _resolved_property_type(facts),\n        ),\n        18,\n    )\n    price = _price_compact_for_post(facts)\n    qc_code = _qc_code_from_draft({**facts, "listing_id": listing_id})\n    summary = "｜".join(part for part in (project, layout, price) if part)\n    consult_text = f"你好，我想咨询房源 {qc_code}"\n    if summary:\n        consult_text += f"\\n（{summary}）"\n'''
          if old in text:
              text = text.replace(old, new, 1)
          elif 'qc_code = _qc_code_from_draft' not in text:
              raise SystemExit('publisher CTA block not found')
          text = text.replace('>💬 咨询这套</a>', '>💬 问这套</a>', 1)
          p.write_text(text, encoding='utf-8')

          p = Path('qiaolian_dual/flows.py')
          text = p.read_text(encoding='utf-8')
          if '_display_floor, _display_layout' not in text:
              text = text.replace(
                  'from .utils_formatting import _display_layout, _display_listing_id, _fmt_price',
                  'from .utils_formatting import _display_floor, _display_layout, _display_listing_id, _fmt_price',
                  1,
              )
          text = text.replace("    floor = str(info.get('floor') or '').strip()\n", "    floor = _display_floor(info.get('floor'))\n", 1)
          p.write_text(text, encoding='utf-8')

          p = Path('qiaolian_dual/appointment_flow.py')
          text = p.read_text(encoding='utf-8')
          if 'listing_is_available' not in text.split('\n', 20)[0:20]:
              text = text.replace(
                  'from .listing import listing_context',
                  'from .listing import listing_context, listing_is_available, listing_unavailable_keyboard, listing_unavailable_text',
                  1,
              )
          if '_display_layout, _display_listing_id' not in text:
              text = text.replace(
                  'from .utils_formatting import _display_listing_id',
                  'from .utils_formatting import _display_layout, _display_listing_id',
                  1,
              )
          marker = """    if data == 'apconfirm:yes':\n        lid_submit = str(appt.get('listing_id') or '').strip()\n        if not appt.get('date') or not appt.get('time'):\n"""
          replacement = """    if data == 'apconfirm:yes':\n        lid_submit = str(appt.get('listing_id') or '').strip()\n        is_general_request = lid_submit in {'', '待推荐'} or bool((appt.get('touch_payload') or {}).get('listing_unknown'))\n        if not is_general_request:\n            is_available, availability_reason = listing_is_available(lid_submit)\n            if not is_available:\n                context.user_data.pop('appt', None)\n                await query.edit_message_text(\n                    listing_unavailable_text(availability_reason),\n                    reply_markup=listing_unavailable_keyboard(lid_submit),\n                    parse_mode=ParseMode.HTML,\n                )\n                return MAIN\n        if not appt.get('date') or not appt.get('time'):\n"""
          if marker in text:
              text = text.replace(marker, replacement, 1)
          elif 'listing_is_available(lid_submit)' not in text:
              raise SystemExit('appointment confirm marker not found')
          text = text.replace(
              "        layout = str(item.get('layout') or item.get('property_type') or '').strip()\n",
              "        layout = _display_layout(item.get('layout') or item.get('property_type'), item.get('property_type'))\n",
              1,
          )
          if text.count("is_general_request = lid_submit") > 1:
              duplicate = "        is_general_request = lid_submit in {'', '待推荐'} or bool((appt.get('touch_payload') or {}).get('listing_unknown'))\n        subject_text ="
              text = text.replace(duplicate, '        subject_text =', 1)
          p.write_text(text, encoding='utf-8')

          p = Path('qiaolian_dual/listing.py')
          text = p.read_text(encoding='utf-8').replace('点“联系顾问”逐项核对。', '点“联系中文顾问”逐项核对。')
          p.write_text(text, encoding='utf-8')

          test = Path('tests/test_customer_path_regression.py')
          lines = [
              'from pathlib import Path',
              'from urllib.parse import unquote',
              '',
              'def test_channel_cta_carries_public_listing_identity(monkeypatch):',
              '    import meihua_publisher as publisher',
              "    monkeypatch.setattr(publisher, 'BOT_USERNAME', 'QiaolianHouseBot')",
              "    monkeypatch.setattr(publisher, 'ADVISOR_TG', '@advisor')",
              "    rendered = publisher._caption_action_links('l_2', listing={'project': '永旺1', 'layout': '1房1办公2卫', 'property_type': '公寓', 'price': 1800})",
              '    decoded = unquote(rendered)',
              "    assert '📅 预约看房' in rendered",
              "    assert '💬 问这套' in rendered",
              "    assert 'QC0002' in decoded",
              "    assert '1房＋书房｜2卫' in decoded",
              "    assert '1房1办公2卫' not in decoded",
              '',
              'def test_booking_flow_rechecks_status_on_final_confirm():',
              "    source = Path('qiaolian_dual/appointment_flow.py').read_text(encoding='utf-8')",
              "    confirm = source.split(\"if data == 'apconfirm:yes':\", 1)[1]",
              "    assert 'listing_is_available(lid_submit)' in confirm",
              "    assert 'listing_unavailable_text(availability_reason)' in confirm",
              '',
              'def test_booking_display_uses_shared_formatters():',
              "    flows = Path('qiaolian_dual/flows.py').read_text(encoding='utf-8')",
              "    appointment = Path('qiaolian_dual/appointment_flow.py').read_text(encoding='utf-8')",
              '    assert "floor = _display_floor(info.get(\'floor\'))" in flows',
              '    assert "layout = _display_layout(item.get(\'layout\')" in appointment',
              '',
              'def test_listing_detail_uses_consistent_advisor_wording():',
              "    source = Path('qiaolian_dual/listing.py').read_text(encoding='utf-8')",
              "    assert '点“联系顾问”逐项核对。' not in source",
              "    assert '点“联系中文顾问”逐项核对。' in source",
              '',
          ]
          test.write_text('\n'.join(lines), encoding='utf-8')
          PY
      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt pytest
      - name: Syntax check
        run: python -m compileall -q qiaolian_dual meihua_publisher.py publication_package.py discussion_map_store.py tests/test_customer_path_regression.py
      - name: Regression tests
        env:
          PYTHONPATH: '${{ github.workspace }}'
          USER_BOT_TOKEN: '123456:TESTTOKEN'
          PUBLISHER_BOT_TOKEN: '123456:TESTTOKEN'
          DB_PATH: '${{ runner.temp }}/qiaolian-customer-path.db'
        run: python -m pytest -q tests/test_user_ui_cleanup.py tests/test_customer_path_regression.py
      - name: Commit fixes
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add meihua_publisher.py qiaolian_dual/flows.py qiaolian_dual/appointment_flow.py qiaolian_dual/listing.py tests/test_customer_path_regression.py
          git diff --cached --quiet && exit 0
          git commit -m 'harden channel-to-booking customer path [skip customer-path]'
          git push origin HEAD:codex/qiaolian-ui-cleanup-20260829
