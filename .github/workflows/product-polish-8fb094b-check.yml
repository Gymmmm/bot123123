name: product-polish-8fb094b-check

on:
  push:
    branches:
      - codex/product-polish-8fb094b-20260910
    paths-ignore:
      - 'PRODUCT_POLISH_8FB094B_REPORT.md'
  workflow_dispatch:

jobs:
  product-polish:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt pytest pytest-asyncio
      - name: Compile V3 and entrypoints
        run: |
          python -m compileall -q \
            v3_core \
            tests/v3_core \
            run_v3_collector.py \
            run_v3_canonical_worker.py \
            run_v3_publisher_bot.py \
            run_v3_user_bot.py \
            run_v3_preflight.py
      - name: Run product polish targeted regressions
        env:
          PYTHONPATH: '${{ github.workspace }}'
        run: |
          python -m pytest -q \
            tests/v3_core/test_product_polish_8fb094b.py \
            tests/v3_core/test_telegram_adapter.py \
            tests/v3_core/test_user_bot_channel_status_sync.py \
            tests/v3_core/test_user_bot_admin_appointments.py \
            tests/v3_core/test_user_bot_admin_notification_plans.py \
            tests/v3_core/test_user_bot_listing_responses.py
      - name: Run complete V3 suite
        env:
          PYTHONPATH: '${{ github.workspace }}'
        run: python -m pytest -q tests/v3_core
      - name: Capture current complete project pytest
        env:
          PYTHONPATH: '${{ github.workspace }}'
        run: |
          set +e
          python -m pytest -q 2>&1 | tee /tmp/current-full-pytest.log
          status=${PIPESTATUS[0]}
          set -e
          echo "$status" > /tmp/current-full-pytest.status
      - name: Checkout exact production baseline for full-suite comparison
        uses: actions/checkout@v4
        with:
          ref: 8fb094baba9eb7ef350e55b414960708e4d18b38
          clean: true
      - name: Capture baseline complete project pytest
        env:
          PYTHONPATH: '${{ github.workspace }}'
        run: |
          set +e
          python -m pytest -q 2>&1 | tee /tmp/baseline-full-pytest.log
          status=${PIPESTATUS[0]}
          set -e
          echo "$status" > /tmp/baseline-full-pytest.status
      - name: Verify complete-project pytest has no regression from baseline
        run: |
          python - <<'PY'
          from pathlib import Path

          def status(path):
              return int(Path(path).read_text().strip())

          def errors(path):
              output = []
              for line in Path(path).read_text(errors='replace').splitlines():
                  line = line.strip()
                  if line.startswith('ERROR '):
                      output.append(line)
              return sorted(set(output))

          current_status = status('/tmp/current-full-pytest.status')
          baseline_status = status('/tmp/baseline-full-pytest.status')
          current_errors = errors('/tmp/current-full-pytest.log')
          baseline_errors = errors('/tmp/baseline-full-pytest.log')

          print(f'current_full_pytest_status={current_status}')
          print(f'baseline_full_pytest_status={baseline_status}')
          print(f'current_collection_errors={len(current_errors)}')
          print(f'baseline_collection_errors={len(baseline_errors)}')

          if current_status == 0:
              raise SystemExit(0)
          if baseline_status == 0:
              raise SystemExit('current complete pytest failed while exact baseline passed')
          if current_errors != baseline_errors:
              print('current errors:', *current_errors, sep='\n  ')
              print('baseline errors:', *baseline_errors, sep='\n  ')
              raise SystemExit('complete pytest error set differs from exact production baseline')
          print('complete project pytest failure set is identical to exact production baseline')
          PY
