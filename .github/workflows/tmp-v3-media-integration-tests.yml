name: tmp-v3-media-integration-tests
on:
  push:
    branches: [feat/v3-media-preparation-integration]
    paths:
      - '.github/workflows/tmp-v3-media-integration-tests.yml'
      - 'v3_core/media/**'
      - 'tests/v3_core/test_media_preparation_service.py'
permissions:
  contents: read
jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install dependencies
        run: |
          set -Eeuo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y fonts-noto-cjk
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt pytest pytest-asyncio
      - name: Compile
        env:
          PYTHONPATH: ${{ github.workspace }}
        run: |
          set -Eeuo pipefail
          python -m compileall -q v3_core tests/v3_core
      - name: Focused media integration tests
        env:
          PYTHONPATH: ${{ github.workspace }}
        run: |
          set -Eeuo pipefail
          python -m pytest -q tests/v3_core/test_media_preparation_service.py tests/v3_core/test_publisher_admin_workflow.py tests/v3_core/test_v3_core_pipeline.py
      - name: Full V3 regression
        env:
          PYTHONPATH: ${{ github.workspace }}
        run: |
          set -Eeuo pipefail
          python -m pytest -q tests/v3_core
