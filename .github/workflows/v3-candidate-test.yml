name: v3-candidate-test
on:
  push:
    branches: [audit/v3-live-20260910]
    paths: [.github/workflows/v3-candidate-test.yml]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/v3-production-complete-ui-20260910
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt pytest pytest-asyncio
      - name: Verify production ancestry
        run: test "$(git merge-base HEAD 5b834f65140ad890b83dacee08e8e8e71836f2bc)" = 5b834f65140ad890b83dacee08e8e8e71836f2bc
      - name: Diff whitespace
        run: git diff --check 5b834f65140ad890b83dacee08e8e8e71836f2bc..HEAD
      - name: Compile
        run: python -m compileall -q v3_core tests/v3_core run_v3_collector.py run_v3_canonical_worker.py run_v3_publisher_bot.py run_v3_user_bot.py run_v3_preflight.py
      - name: Directed changed-flow tests
        env:
          PYTHONPATH: '${{ github.workspace }}'
        run: |
          files=(tests/v3_core/test_telegram_adapter.py tests/v3_core/test_user_bot_public_flow.py tests/v3_core/test_user_bot_transition_actions.py tests/v3_core/test_user_bot_transition_text_handler.py tests/v3_core/test_user_bot_channel_status_sync.py tests/v3_core/test_broadcast_center_complete_ui.py)
          present=()
          for f in "${files[@]}"; do test ! -f "$f" || present+=("$f"); done
          test ${#present[@]} -gt 0
          python -m pytest -q "${present[@]}"
      - name: Full V3 suite
        env:
          PYTHONPATH: '${{ github.workspace }}'
        run: python -m pytest -q tests/v3_core
      - name: Service entrypoint import smoke
        env:
          PYTHONPATH: '${{ github.workspace }}'
        run: |
          python - <<'PY'
          import v3_core
          import run_v3_collector, run_v3_canonical_worker, run_v3_publisher_bot, run_v3_user_bot, run_v3_preflight
          print('IMPORTS_OK')
          PY
