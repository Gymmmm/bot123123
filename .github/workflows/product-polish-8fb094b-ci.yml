name: product-polish-8fb094b-ci

on:
  push:
    branches:
      - codex/product-polish-8fb094b-20260909

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt pytest pytest-asyncio
      - name: Compile V3 and tests
        run: |
          python -m compileall -q v3_core tests/v3_core run_v3_collector.py run_v3_canonical_worker.py run_v3_publisher_bot.py run_v3_user_bot.py run_v3_preflight.py
      - name: Full pytest
        env:
          PYTHONPATH: '${{ github.workspace }}'
        run: python -m pytest -q
