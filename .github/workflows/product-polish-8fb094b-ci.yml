name: product-polish-8fb094b-ci

on:
  push:
    branches:
      - codex/product-polish-8fb094b-20260909

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt pytest pytest-asyncio
      - name: Verify exact production ancestry
        run: |
          test "$(git merge-base HEAD 8fb094baba9eb7ef350e55b414960708e4d18b38)" = "8fb094baba9eb7ef350e55b414960708e4d18b38"
      - name: Diff whitespace check
        run: git diff --check 8fb094baba9eb7ef350e55b414960708e4d18b38..HEAD
      - name: Compile V3 and tests
        run: |
          python -m compileall -q v3_core tests/v3_core run_v3_collector.py run_v3_canonical_worker.py run_v3_publisher_bot.py run_v3_user_bot.py run_v3_preflight.py
      - name: V3 full regression suite
        env:
          PYTHONPATH: '${{ github.workspace }}'
        run: python -m pytest -q tests/v3_core
