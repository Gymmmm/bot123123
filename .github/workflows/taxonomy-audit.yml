name: taxonomy-audit

on:
  push:
    branches:
      - refactor/production-extraction
  workflow_dispatch:

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Audit listing taxonomy symbols
        run: python qiaolian_production/tools/audit_listing_taxonomy_symbols.py
