name: taxonomy-audit

on:
  push:
    branches:
      - refactor/production-extraction
  workflow_dispatch:

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Audit listing taxonomy symbols
        run: python qiaolian_production/tools/audit_listing_taxonomy_symbols.py
      - name: Audit canonical facts symbols
        run: python qiaolian_production/tools/audit_user_symbol_module.py canonical_facts
      - name: Audit canonical fact projection symbols
        run: python qiaolian_production/tools/audit_user_symbol_module.py canonical_fact_projection
      - name: Audit canonical listing materializer symbols
        run: python qiaolian_production/tools/audit_user_symbol_module.py canonical_listing_materializer
      - name: Audit public listing id symbols
        run: python qiaolian_production/tools/audit_user_symbol_module.py public_listing_id
      - name: Audit area normalization symbols
        run: python qiaolian_production/tools/audit_user_symbol_module.py area_normalization
      - name: Audit publishability contract symbols
        run: python qiaolian_production/tools/audit_user_symbol_module.py publishability_contract
      - name: Audit status label symbols
        run: python qiaolian_production/tools/audit_user_symbol_module.py status_labels
