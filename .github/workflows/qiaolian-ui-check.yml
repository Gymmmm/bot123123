name: qiaolian-ui-check

on:
  push:
    branches:
      - codex/qiaolian-ui-cleanup-20260829
  pull_request:
    branches:
      - codex/production-sync-20260829
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt pytest pytest-asyncio
      - name: Diff whitespace check
        run: git diff --check HEAD^ HEAD
      - name: Syntax and runtime import check
        env:
          USER_BOT_TOKEN: '123456:TESTTOKEN'
          PUBLISHER_BOT_TOKEN: '123456:TESTTOKEN'
          DB_PATH: '${{ runner.temp }}/qiaolian-ui-check.db'
        run: |
          python -m compileall -q qiaolian_dual v2/qiaolian_publisher_v2 meihua_publisher.py cover_generator.py autopilot_publish_bot.py publication_package.py publication_delivery.py discussion_map_store.py parser_v2_safe.py tools/run_parser_v2_safe.py photo_formatter_v1_1.py photo_ranker.py media_pipeline_v1_1.py tests
          python -c "import qiaolian_dual.user_bot"
          python -c "from qiaolian_dual.user_bot import build_application; assert build_application() is not None"
      - name: Diagnose current-runtime non-outbound suite
        env:
          PYTHONPATH: '${{ github.workspace }}'
          USER_BOT_TOKEN: '123456:TESTTOKEN'
          PUBLISHER_BOT_TOKEN: '123456:TESTTOKEN'
          DB_PATH: '${{ runner.temp }}/qiaolian-ui-check.db'
        run: |
          # These nine files import retired modules that are no longer present in this branch.
          # They are temporarily isolated only to expose failures in the current runtime tests;
          # this diagnostic exclusion is not the final release acceptance definition.
          python -m pytest -q tests \
            --ignore=tests/test_admin_caption_workflow.py \
            --ignore=tests/test_caption_variant_queue.py \
            --ignore=tests/test_channel_entry_protocols.py \
            --ignore=tests/test_channel_mobile_listing_v2.py \
            --ignore=tests/test_media_consistency.py \
            --ignore=tests/test_non_rental_filter.py \
            --ignore=tests/test_parser_payment_contract.py \
            --ignore=tests/test_price_regressions.py \
            --ignore=tests/test_publish_fail_returns_pending.py
