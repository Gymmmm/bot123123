name: qiaolian-ui-check

on:
  push:
    branches:
      - codex/qiaolian-ui-cleanup-20260829
  pull_request:
    branches:
      - codex/production-sync-20260829
      - codex/qiaolian-ui-cleanup-20260829
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt pytest pytest-asyncio
      - name: Diff whitespace check
        run: git diff --check HEAD^ HEAD
      - name: Syntax and runtime import check
        env:
          USER_BOT_TOKEN: '123456:TESTTOKEN'
          PUBLISHER_BOT_TOKEN: '123456:TESTTOKEN'
          DB_PATH: '${{ runner.temp }}/qiaolian-ui-check.db'
        run: |
          python -m compileall -q qiaolian_dual v2/qiaolian_publisher_v2 meihua_publisher.py cover_generator.py autopilot_publish_bot.py publication_package.py publication_delivery.py discussion_map_store.py parser_v2_safe.py media_selection.py tools/run_parser_v2_safe.py photo_formatter_v1_1.py photo_ranker.py media_pipeline_v1_1.py tests
          python -c "import qiaolian_dual.user_bot"
          python -c "from qiaolian_dual.user_bot import build_application; assert build_application() is not None"
          (cd v2 && env -u PYTHONPATH python -c "import run_publisher_bot_v2; print('PUBLISHER_IMPORT_OK')")
      - name: Full non-outbound production launch gate
        env:
          PYTHONPATH: '${{ github.workspace }}'
          USER_BOT_TOKEN: '123456:TESTTOKEN'
          PUBLISHER_BOT_TOKEN: '123456:TESTTOKEN'
          DB_PATH: '${{ runner.temp }}/qiaolian-ui-check.db'
        run: |
          python -m pytest -q \
            tests/test_v1_release_contract.py \
            tests/test_v2_final_flow_contract.py \
            tests/test_launch_readiness_contract.py \
            tests/test_user_start_payload.py \
            tests/test_appointment_simplified.py \
            tests/test_appointment_mobile_copy.py \
            tests/test_customer_path_regression.py \
            tests/test_issue25_contract.py \
            tests/test_channel_standard_contract.py \
            tests/test_package_approval_media_count.py \
            tests/test_wechat_canonical_regressions.py \
            tests/test_noto_font_contract.py \
            tests/test_user_text_hierarchy.py \
            tests/test_second_batch_runtime_contract.py \
            tests/test_callback_route_repair.py \
            tests/test_callback_route_static_guards.py \
            tests/test_user_ui_cleanup.py \
            tests/test_daily_broadcast_rotation.py \
            tests/test_publisher_admin_choices.py \
            tests/test_tg_album_45.py \
            tests/test_cover_consolidation.py \
            tests/test_prelaunch_product_contract.py \
            tests/test_user_bot_runtime_guards.py \
            tests/test_parser_v12_regressions.py \
            tests/test_parser_v2_safe.py \
            tests/test_v2_safe_adapter.py \
            tests/test_media_pipeline_v11.py \
            tests/test_media_selection_contract.py \
            tests/test_channel_three_entry_contract.py
