name: tmp-taxonomy-merge-check

on:
  push:
    branches: [master]
    paths:
      - '.github/workflows/tmp-taxonomy-merge-check.yml'

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/taxonomy-miss-fill-5eae058
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt pytest pytest-asyncio
      - name: Full V3 regression
        env:
          PYTHONPATH: ${{ github.workspace }}
        run: |
          python -m compileall -q v3_core tests/v3_core run_v3_collector.py run_v3_canonical_worker.py run_v3_publisher_bot.py run_v3_user_bot.py run_v3_preflight.py
          python -m pytest -q tests/v3_core
      - name: Taxonomy targeted smoke
        env:
          PYTHONPATH: ${{ github.workspace }}
        run: |
          python - <<'PY'
          from v3_core.inventory.canonical_facts import canonicalize_source
          from v3_core.inventory.listing_taxonomy import classify_listing_taxonomy

          def c(text):
              return canonicalize_source(text)

          x = c('BKK1 2房 80㎡ 12楼 月租800')
          assert x['property_type'] == '公寓', x
          assert x['property_type_status'] == 'inferred', x
          assert 'weak_apartment_inferred' in x['candidate_flags'], x

          x = c('联排别墅 4房 200㎡ 2层 月租1500')
          assert x['property_type'] == '排屋', x
          assert 'weak_apartment_inferred' not in x['candidate_flags'], x

          x = c('办公室 2房 80㎡ 12楼 月租800')
          assert x['property_type'] == '办公室', x
          assert 'weak_apartment_inferred' not in x['candidate_flags'], x

          x = c('Urban Village 2房 80㎡ 12楼 月租800')
          assert x['property_type'] == '公寓', x
          assert 'weak_apartment_inferred' in x['candidate_flags'], x

          t = classify_listing_taxonomy('太子寰宇 2房 80㎡ 12楼 月租800')
          assert t.project_name == '太子寰宇', t
          assert t.property_type == '公寓', t

          t = classify_listing_taxonomy('金界附近 1房 月租600')
          assert '金界' in t.market_location_keys, t
          assert t.canonical_area_key is None, t

          t = classify_listing_taxonomy('富力小区 2房 月租700')
          assert t.project_name == '富力城', t
          assert t.property_type == '公寓', t

          print('TAXONOMY_TARGETED_SMOKE_OK')
          PY
