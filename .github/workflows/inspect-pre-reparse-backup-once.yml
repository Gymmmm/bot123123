name: inspect-pre-reparse-backup-once

on:
  push:
    branches:
      - codex/qiaolian-ui-cleanup-20260829
    paths:
      - .github/workflows/inspect-pre-reparse-backup-once.yml

permissions:
  contents: read

env:
  PROD_HOST: 50.114.74.120
  PROD_PORT: '22'
  PROD_SSH_USER: root
  PROD_SSH_KNOWN_HOSTS: '50.114.74.120 ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAILuFtkSn5SJKY7mZ52Lc/QydPRTvHFpsj87M/HcIkb/L'

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Configure production SSH
        env:
          PROD_SSH_PRIVATE_KEY: '${{ secrets.PROD_SSH_PRIVATE_KEY }}'
        run: |
          set -Eeuo pipefail
          install -d -m 700 "$HOME/.ssh"
          printf '%s\n' "$PROD_SSH_PRIVATE_KEY" > "$HOME/.ssh/qiaolian_production"
          printf '%s\n' "$PROD_SSH_KNOWN_HOSTS" > "$HOME/.ssh/known_hosts"
          chmod 600 "$HOME/.ssh/qiaolian_production" "$HOME/.ssh/known_hosts"
      - name: Scan pre-reparse backup read-only
        run: |
          set -Eeuo pipefail
          ssh -p "$PROD_PORT" -i "$HOME/.ssh/qiaolian_production" -o BatchMode=yes -o IdentitiesOnly=yes "$PROD_SSH_USER@$PROD_HOST" "python3 - <<'PY'
          import sqlite3, unicodedata, json
          DB='/opt/backups/qiaolian-actions-20260904-075533/qiaolian_dual_bot.db'
          DRAFT='DRF_0cdfabc0-4136-4da4-819c-a50525da19ae'
          conn=sqlite3.connect(f'file:{DB}?mode=ro', uri=True)
          conn.row_factory=sqlite3.Row
          sp=conn.execute('SELECT * FROM source_posts WHERE id=1').fetchone()
          dr=conn.execute('SELECT * FROM drafts WHERE draft_id=?',(DRAFT,)).fetchone()
          def scan(label, value):
              s=str(value or '')
              found=[]
              for i,ch in enumerate(s):
                  cat=unicodedata.category(ch)
                  cp=ord(ch)
                  if cat in {'Cf','Co'} or 0xE000 <= cp <= 0xF8FF:
                      found.append((i,f'U+{cp:04X}',cat,unicodedata.name(ch,'UNNAMED')))
              if found:
                  print(label, 'NOISE=', sorted(set((cp,cat,name) for _,cp,cat,name in found)), 'COUNT=',len(found))
          for k in sp.keys():
              if isinstance(sp[k], str): scan('source_posts.'+k, sp[k])
          for k in dr.keys():
              if isinstance(dr[k], str): scan('drafts.'+k, dr[k])
          print('OLD_PROPERTY_TYPE=', dr['property_type'] if 'property_type' in dr.keys() else None)
          try:
              f=json.loads(dr['normalized_data'] or '{}')
              print('OLD_DEAL_TYPE=', f.get('deal_type'))
              print('OLD_BLOCKERS=', (f.get('quality') or {}).get('blocking_flags'))
          except Exception as e: print('OLD_FACTS_PARSE_ERROR=', type(e).__name__)
          conn.close()
          PY"
