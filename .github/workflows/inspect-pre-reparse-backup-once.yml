name: inspect-pre-reparse-backup-once

on:
  push:
    branches:
      - codex/qiaolian-ui-cleanup-20260829
    paths:
      - .github/workflows/inspect-pre-reparse-backup-once.yml

permissions:
  contents: read

env:
  PROD_HOST: 50.114.74.120
  PROD_PORT: '22'
  PROD_SSH_USER: root
  PROD_SSH_KNOWN_HOSTS: '50.114.74.120 ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAILuFtkSn5SJKY7mZ52Lc/QydPRTvHFpsj87M/HcIkb/L'

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Configure production SSH
        env:
          PROD_SSH_PRIVATE_KEY: '${{ secrets.PROD_SSH_PRIVATE_KEY }}'
        run: |
          set -Eeuo pipefail
          install -d -m 700 "$HOME/.ssh"
          printf '%s\n' "$PROD_SSH_PRIVATE_KEY" > "$HOME/.ssh/qiaolian_production"
          printf '%s\n' "$PROD_SSH_KNOWN_HOSTS" > "$HOME/.ssh/known_hosts"
          chmod 600 "$HOME/.ssh/qiaolian_production" "$HOME/.ssh/known_hosts"
      - name: Scan database text fields read-only
        run: |
          set -Eeuo pipefail
          ssh -p "$PROD_PORT" -i "$HOME/.ssh/qiaolian_production" -o BatchMode=yes -o IdentitiesOnly=yes "$PROD_SSH_USER@$PROD_HOST" "python3 - <<'PY'
          import sqlite3, unicodedata, collections
          DBS=[
            ('pre_reparse','/opt/backups/qiaolian-actions-20260904-075533/qiaolian_dual_bot.db'),
            ('live','/opt/qiaolian_dual_bots/data/qiaolian_dual_bot.db'),
          ]
          for label,path in DBS:
              conn=sqlite3.connect(f'file:{path}?mode=ro', uri=True)
              totals=collections.Counter(); locations=collections.Counter()
              tables=[r[0] for r in conn.execute("SELECT name FROM sqlite_master WHERE type='table' AND name NOT LIKE 'sqlite_%'")]
              for table in tables:
                  cols=[r[1] for r in conn.execute(f'PRAGMA table_info("{table}")')]
                  if not cols: continue
                  try: rows=conn.execute(f'SELECT * FROM "{table}"')
                  except sqlite3.Error: continue
                  for row in rows:
                      for col,val in zip(cols,row):
                          if not isinstance(val,str): continue
                          for ch in val:
                              cp=ord(ch); cat=unicodedata.category(ch)
                              if cat in {'Cf','Co'} or 0xE000 <= cp <= 0xF8FF:
                                  key=(f'U+{cp:04X}',cat,unicodedata.name(ch,'UNNAMED'))
                                  totals[key]+=1; locations[(table,col,key)]+=1
              print(label,'UNICODE_NOISE_TOTALS=',dict(totals))
              for (table,col,key),count in locations.most_common(30):
                  print(label,'LOCATION=',table+'.'+col,key,'COUNT=',count)
              conn.close()
          PY"
