name: tmp-v3-inspect-edit-map
on:
  push:
    branches: [master]
    paths:
      - '.github/workflows/tmp-v3-inspect-edit-map.yml'
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    env:
      PROD_HOST: 50.114.74.120
      PROD_PORT: '22'
      PROD_SSH_USER: root
      EXPECTED_PROD_SHA: aaf7b3d8365641557d866aef798447191308d6dc
    steps:
      - uses: actions/checkout@v4
      - name: Verify production host fingerprint
        shell: bash
        run: |
          set -Eeuo pipefail
          expected=$(tr -d '\r\n' < deploy/v3/production_host_fingerprint.txt)
          ssh-keyscan -T 15 -p "$PROD_PORT" -t ed25519 "$PROD_HOST" 2>/dev/null | grep -v '^#' > "$RUNNER_TEMP/known_hosts"
          ssh-keygen -lf "$RUNNER_TEMP/known_hosts" | grep -F "$expected"
      - name: Configure production SSH
        shell: bash
        env:
          PROD_SSH_PRIVATE_KEY: ${{ secrets.PROD_SSH_PRIVATE_KEY }}
        run: |
          set -Eeuo pipefail
          install -d -m 700 "$HOME/.ssh"
          printf '%s\n' "$PROD_SSH_PRIVATE_KEY" > "$HOME/.ssh/qiaolian_production"
          cp "$RUNNER_TEMP/known_hosts" "$HOME/.ssh/known_hosts"
          chmod 600 "$HOME/.ssh/qiaolian_production" "$HOME/.ssh/known_hosts"
      - name: Inspect candidate ten publication identities
        shell: bash
        run: |
          set -Eeuo pipefail
          cat <<'PY' | ssh -p "$PROD_PORT" -i "$HOME/.ssh/qiaolian_production" -o BatchMode=yes -o IdentitiesOnly=yes "$PROD_SSH_USER@$PROD_HOST" "EXPECTED_PROD_SHA='$EXPECTED_PROD_SHA' python3 -"
          import json, os, sqlite3
          from pathlib import Path
          if Path('/opt/qiaolian_v3/.deployed_sha').read_text().strip()!=os.environ['EXPECTED_PROD_SHA']:
              raise SystemExit('INSPECT_FATAL deployed_sha_mismatch')
          db='/opt/qiaolian_dual_bots/data/qiaolian_dual_bot.db'
          c=sqlite3.connect(db); c.row_factory=sqlite3.Row
          ids=(3210,3209,3208,3207,3206,3203,3202,3201,3200,3199)
          for mid in ids:
              p=c.execute("SELECT * FROM publication_instances WHERE platform='telegram' AND channel_message_id=? ORDER BY updated_at DESC LIMIT 1",(str(mid),)).fetchone()
              if not p:
                  print('MISS',mid); continue
              offer=str(p['offer_id'] or '')
              listing=c.execute('SELECT * FROM listings_v3 WHERE listing_id=?',(p['listing_id'],)).fetchone()
              off=c.execute('SELECT * FROM listing_offers WHERE offer_id=?',(offer,)).fetchone()
              packs=c.execute("SELECT package_id,status,package_version,cover_style,cover_path,created_at,updated_at FROM publication_packages_v3 WHERE offer_id=? ORDER BY package_version DESC,id DESC",(offer,)).fetchall()
              print('TARGET',mid,json.dumps({'instance_id':p['instance_id'],'pub_status':p['publish_status'],'bound_package':p['package_id'],'listing_id':p['listing_id'],'public_id':listing['public_listing_id'] if listing else None,'inventory_status':listing['inventory_status'] if listing else None,'offer_status':off['offer_status'] if off else None,'publication_policy':off['publication_policy'] if off else None},ensure_ascii=False,sort_keys=True))
              print('PACKAGES',mid,json.dumps([dict(x) for x in packs],ensure_ascii=False,sort_keys=True))
          PY