name: dispatch-production-deploy-once

on:
  push:
    branches:
      - codex/qiaolian-ui-cleanup-20260829
    paths:
      - .github/workflows/dispatch-production-deploy-once.yml

permissions:
  actions: write
  contents: read

jobs:
  dispatch:
    runs-on: ubuntu-latest
    steps:
      - name: Dispatch verified production deployment
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -Eeuo pipefail
          echo 'deploy polished cover templates 2026-09-05'
          curl --fail-with-body -sS -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            https://api.github.com/repos/${{ github.repository }}/actions/workflows/qiaolian-production-deploy.yml/dispatches \
            -d '{"ref":"codex/qiaolian-ui-cleanup-20260829","inputs":{"confirm":"DEPLOY"}}'
