name: v3-user-bot-upgrade-check

on:
  workflow_dispatch:
    inputs:
      target_sha:
        description: "Exact 40-char commit SHA to validate"
        required: true
        default: "7a89121b93cf58ece9a78442cb658b192aab0be6"

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      TARGET_SHA: ${{ inputs.target_sha }}
      USERBOT_BASE_SHA: 65acb78b8fe388e81937a4efb4a37efbfcd6f938
    steps:
      - name: Validate requested SHA
        shell: bash
        run: |
          set -Eeuo pipefail
          [[ "$TARGET_SHA" =~ ^[0-9a-f]{40}$ ]] || { echo "INVALID target_sha"; exit 1; }

      - name: Checkout exact User Bot SHA
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.target_sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Confirm exact checkout
        shell: bash
        run: |
          set -Eeuo pipefail
          ACTUAL_SHA=$(git rev-parse HEAD)
          echo "requested_sha=$TARGET_SHA"
          echo "actual_sha=$ACTUAL_SHA"
          test "$ACTUAL_SHA" = "$TARGET_SHA"

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt pytest pytest-asyncio

      - name: Freeze spec
        env:
          PYTHONPATH: '${{ github.workspace }}'
        run: python -m pytest -q tests/v3_core/test_userbot_v1_freeze_spec.py

      - name: Targeted User Bot gates
        env:
          PYTHONPATH: '${{ github.workspace }}'
        run: |
          python -m pytest -q \
            tests/v3_core/test_issue25_cta_appointment_contract.py \
            tests/v3_core/test_user_bot_public_inventory.py \
            tests/v3_core/test_user_bot_listing_responses.py \
            tests/v3_core/test_user_bot_public_appointment.py \
            tests/v3_core/test_user_bot_telegram_appointment_submit.py \
            tests/v3_core/test_user_bot_consult.py \
            tests/v3_core/test_user_bot_public_search.py \
            tests/v3_core/test_user_bot_search_no_match_view.py \
            tests/v3_core/test_user_bot_callback_router.py \
            tests/v3_core/test_user_bot_home_views.py \
            tests/v3_core/test_user_bot_assurance.py \
            tests/v3_core/test_user_bot_telegram_service_handler.py \
            tests/v3_core/test_user_bot_service_flow.py \
            tests/v3_core/test_user_bot_tenant_final_contract.py \
            tests/v3_core/test_user_bot_historical_callbacks_final.py \
            tests/v3_core/test_adviser_copy_engine.py \
            tests/v3_core/test_adviser_v1_production.py

      - name: Full V3 suite
        env:
          PYTHONPATH: '${{ github.workspace }}'
        run: python -m pytest -q tests/v3_core

      - name: Compile all V3 entrypoints
        run: |
          python -m compileall -q \
            v3_core \
            tests/v3_core \
            run_v3_collector.py \
            run_v3_canonical_worker.py \
            run_v3_publisher_bot.py \
            run_v3_user_bot.py \
            run_v3_preflight.py

      - name: Critical imports
        env:
          PYTHONPATH: '${{ github.workspace }}'
        run: |
          python - <<'PY'
          import v3_core.user_bot.home_views
          import v3_core.user_bot.listing_responses
          import v3_core.user_bot.telegram_start_handler
          import v3_core.user_bot.telegram_navigation
          import v3_core.user_bot.tenant_v1
          import v3_core.user_bot.transition_views
          print('critical_imports=PASS')
          PY

      - name: Diff check from User Bot integration base
        run: git diff --check "$USERBOT_BASE_SHA...$TARGET_SHA"

      - name: Final gate summary
        run: |
          echo "USERBOT_CI_OK sha=$(git rev-parse HEAD)"
          echo "base=$USERBOT_BASE_SHA"
