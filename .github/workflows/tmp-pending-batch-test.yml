name: tmp-pending-batch-test

on:
  push:
    branches:
      - feat/v3-pending-batch-10
  workflow_dispatch:

jobs:
  v3-pending-batch:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt pytest pytest-asyncio
      - name: Compile V3
        run: |
          python -m compileall -q v3_core tests/v3_core run_v3_publisher_bot.py
      - name: Run V3 tests
        env:
          PYTHONPATH: '${{ github.workspace }}'
        run: |
          python -m pytest -q tests/v3_core
