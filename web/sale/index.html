<!DOCTYPE html>
<html lang="zh-CN" class="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#0B0C0E">
<meta name="description" content="侨联地产金边真实出售房源目录">
<title>侨联地产 · 金边置业</title>
<script src="https://cdn.tailwindcss.com"></script>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
<script>tailwind.config={darkMode:'class',theme:{extend:{colors:{obsidian:{900:'#0B0C0E',800:'#121418',700:'#1A1D24',600:'#262A35'},gold:{300:'#EBD096',400:'#DFC278',500:'#C5A059',600:'#9E7C3B'}}}}}</script>
<style>*{box-sizing:border-box}body{background:#0B0C0E}.gold{background:linear-gradient(135deg,#FFF8E7,#DFC278 52%,#9E7C3B);-webkit-background-clip:text;color:transparent}.hidebar::-webkit-scrollbar{display:none}.hidebar{scrollbar-width:none}.modal{transition:.2s}.skeleton{animation:pulse 1.5s ease-in-out infinite}@keyframes pulse{50%{opacity:.45}}</style>
</head>
<body class="bg-obsidian-900 text-slate-200 antialiased min-h-screen selection:bg-gold-500 selection:text-black">
<header class="sticky top-0 z-40 bg-obsidian-900/95 backdrop-blur-xl border-b border-obsidian-700/70 pt-[env(safe-area-inset-top)]">
  <div class="h-14 max-w-7xl mx-auto px-3 sm:px-6 flex items-center justify-between">
    <button onclick="resetAll()" class="flex items-center gap-2.5 min-w-0 text-left">
      <span class="w-8 h-8 rounded-lg bg-gradient-to-br from-gold-400 to-gold-600 p-px shrink-0"><span class="w-full h-full rounded-[7px] bg-obsidian-900 grid place-items-center font-serif font-bold text-gold-400">侨</span></span>
      <span class="min-w-0"><span class="block text-sm sm:text-base font-semibold truncate">侨联地产 <b class="text-gold-500 font-light">·</b> <span class="gold font-medium">金边置业</span></span><span class="block text-[10px] text-slate-500 truncate">金边真实出售库存 · 在线更新</span></span>
    </button>
    <a href="https://t.me/pengqingw" target="_blank" rel="noopener" class="text-xs border border-gold-500/30 text-gold-400 rounded-lg px-2.5 py-1.5 shrink-0"><i class="fa-brands fa-telegram mr-1"></i>咨询</a>
  </div>
  <div class="max-w-7xl mx-auto px-3 sm:px-6 pb-2 flex gap-2 overflow-x-auto hidebar">
    <select id="area" onchange="load(true)" class="h-9 min-w-[120px] bg-obsidian-800 border border-obsidian-600 rounded-lg px-2 text-xs outline-none focus:border-gold-500"><option value="">全部区域</option></select>
    <select id="type" onchange="load(true)" class="h-9 min-w-[110px] bg-obsidian-800 border border-obsidian-600 rounded-lg px-2 text-xs outline-none focus:border-gold-500"><option value="">全部类型</option></select>
    <select id="price" onchange="load(true)" class="h-9 min-w-[120px] bg-obsidian-800 border border-obsidian-600 rounded-lg px-2 text-xs outline-none focus:border-gold-500"><option value="">总价不限</option><option value="0-100000">$10万内</option><option value="100000-200000">$10–20万</option><option value="200000-500000">$20–50万</option><option value="500000-999999999">$50万以上</option></select>
    <button onclick="resetAll()" class="h-9 px-3 whitespace-nowrap bg-obsidian-800 border border-obsidian-600 rounded-lg text-xs text-slate-400">重置</button>
  </div>
</header>
<main class="max-w-7xl mx-auto px-3 sm:px-6 py-4 sm:py-6">
  <div class="flex items-end justify-between mb-3 sm:mb-5"><div><div class="text-[10px] uppercase tracking-[.18em] text-gold-500/70">Qiaolian Property</div><h1 class="text-xl sm:text-3xl font-medium mt-1">正式 <span class="gold">出售房源</span></h1></div><div id="count" class="text-xs text-slate-500">读取中…</div></div>
  <div id="grid" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-3 sm:gap-5"><div class="skeleton bg-obsidian-800 border border-obsidian-700 rounded-2xl overflow-hidden"><div class="h-64 bg-obsidian-700"></div><div class="p-4 space-y-3"><div class="h-5 bg-obsidian-700 rounded w-2/3"></div><div class="h-4 bg-obsidian-700 rounded w-1/2"></div></div></div></div>
  <div id="pager" class="hidden justify-center items-center gap-3 mt-6"><button id="prev" onclick="page(-1)" class="px-4 py-2 rounded-lg border border-obsidian-600 text-xs">上一页</button><span id="pageno" class="text-xs text-slate-500"></span><button id="next" onclick="page(1)" class="px-4 py-2 rounded-lg border border-obsidian-600 text-xs">下一页</button></div>
</main>
<div id="overlay" class="modal fixed inset-0 z-50 bg-black/80 backdrop-blur-sm opacity-0 pointer-events-none flex items-end sm:items-center justify-center sm:p-4" onclick="if(event.target===this)closeDetail()">
  <section id="sheet" class="modal translate-y-8 w-full sm:max-w-2xl max-h-[94vh] bg-obsidian-800 border border-obsidian-700 rounded-t-3xl sm:rounded-2xl overflow-hidden flex flex-col">
    <div class="h-12 shrink-0 px-4 flex items-center justify-between bg-obsidian-900/95 border-b border-obsidian-700"><div class="flex gap-2 items-center"><span id="dstatus" class="text-[11px] px-2 py-1 rounded border border-gold-500/30 text-gold-400">可咨询</span><span id="did" class="font-mono text-xs text-gold-300"></span></div><button onclick="closeDetail()" class="w-8 h-8 rounded-full bg-obsidian-700">×</button></div>
    <div class="overflow-y-auto hidebar"><div class="relative bg-obsidian-900"><div id="gallery" class="h-[58vw] min-h-[250px] max-h-[390px] overflow-hidden flex"></div><button id="gprev" onclick="galleryStep(-1)" class="absolute left-3 top-1/2 -translate-y-1/2 w-8 h-8 rounded-full bg-black/60">‹</button><button id="gnext" onclick="galleryStep(1)" class="absolute right-3 top-1/2 -translate-y-1/2 w-8 h-8 rounded-full bg-black/60">›</button><span id="gcount" class="absolute right-3 bottom-3 text-[10px] bg-black/70 rounded-full px-2 py-1"></span></div>
      <div class="p-4 sm:p-5"><div class="text-[10px] uppercase tracking-widest text-gold-500">出售总价 USD</div><div id="dprice" class="gold text-3xl font-extrabold mt-1"></div><h2 id="dtitle" class="text-lg font-bold mt-2"></h2><div id="fields" class="grid grid-cols-2 sm:grid-cols-3 gap-2 mt-4"></div><div id="updated" class="text-[10px] text-slate-600 mt-4 pt-3 border-t border-obsidian-700"></div></div></div>
    <div class="shrink-0 p-3 pb-[calc(.75rem+env(safe-area-inset-bottom))] bg-obsidian-900 border-t border-obsidian-700"><a id="consult" target="_blank" rel="noopener" class="h-11 rounded-xl bg-gradient-to-r from-gold-500 to-gold-600 text-black font-bold text-sm flex items-center justify-center gap-2"><i class="fa-brands fa-telegram"></i>Telegram 咨询这套房源</a></div>
  </section>
</div>
<script>
const API='/api/v3/sale/listings',AD='https://t.me/pengqingw',LIMIT=24;let offset=0,total=0,metaReady=false,current=null,gidx=0;
const $=x=>document.getElementById(x),txt=x=>x==null?'':String(x).trim(),money=x=>'$'+Number(x||0).toLocaleString('en-US'),esc=s=>txt(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function qs(){const q=new URLSearchParams({limit:LIMIT,offset});const a=$('area').value,t=$('type').value,p=$('price').value;if(a)q.set('area',a);if(t)q.set('property_type',t);if(p){const [lo,hi]=p.split('-');q.set('min_price',lo);q.set('max_price',hi)}return q}
async function seedMeta(){if(metaReady)return;try{const r=await fetch(API+'?limit=100&offset=0',{cache:'no-store'}),d=await r.json();const areas=new Set(),types=new Set();(d.items||[]).forEach(x=>{[x.project,x.location].map(txt).filter(Boolean).forEach(v=>areas.add(v));const t=txt(x.property_type);if(t&&t!=='未知')types.add(t)});[...areas].sort().forEach(v=>$('area').insertAdjacentHTML('beforeend',`<option value="${esc(v)}">${esc(v)}</option>`));[...types].sort().forEach(v=>$('type').insertAdjacentHTML('beforeend',`<option value="${esc(v)}">${esc(v)}</option>`));metaReady=true}catch(e){}}
async function load(reset=false){if(reset)offset=0;$('grid').innerHTML='<div class="col-span-full py-16 text-center text-slate-500">正在读取出售库存…</div>';try{await seedMeta();const r=await fetch(API+'?'+qs(),{cache:'no-store'});if(!r.ok)throw Error(r.status);const d=await r.json();total=Number(d.total||0);render(d.items||[]);pager();const id=new URLSearchParams(location.search).get('id');if(id&&!current)openDetail(id,false)}catch(e){$('count').textContent='读取失败';$('grid').innerHTML='<div class="col-span-full py-16 text-center text-red-300/80">出售房源暂时无法读取，请稍后刷新。</div>';console.error(e)}}
function card(x){const img=x.cover_url?`<img src="${esc(x.cover_url)}" loading="lazy" class="w-full h-full object-cover" onerror="this.remove()">`:'<div class="h-full grid place-items-center text-gold-400/30 text-sm">暂无实拍</div>';const status=txt(x.status)||'可咨询',type=txt(x.property_type)==='未知'?'':txt(x.property_type),bits=[txt(x.project),txt(x.location),txt(x.layout),type,Number(x.size_sqm||0)>0?Number(x.size_sqm).toLocaleString()+'㎡':''].filter(Boolean).join(' · ');return `<article class="bg-obsidian-800 border border-obsidian-700/80 rounded-2xl overflow-hidden hover:border-gold-500/40 transition"><button class="block w-full text-left" onclick="openDetail('${esc(x.public_id)}')"><div class="relative h-[58vw] min-h-[240px] max-h-[350px] md:h-64 bg-obsidian-900 overflow-hidden">${img}<div class="absolute inset-0 bg-gradient-to-t from-obsidian-900 via-transparent to-black/20"></div><div class="absolute top-3 left-3 right-3 flex justify-between"><span class="text-[11px] px-2 py-1 rounded bg-black/65 border border-gold-500/20 text-gold-300">${esc(x.public_id)}</span><span class="text-[11px] px-2 py-1 rounded bg-black/65 border border-gold-500/20 text-gold-300">${esc(status)}</span></div><div class="absolute bottom-3 left-3"><div class="text-[10px] text-slate-300 tracking-widest">出售总价</div><div class="gold text-2xl font-extrabold">${money(x.sale_price_usd)}</div></div></div><div class="p-4"><h3 class="font-bold text-sm sm:text-base truncate">${esc(txt(x.title)||txt(x.project)||'金边置业房源')}</h3>${bits?`<p class="text-xs text-slate-500 truncate mt-1.5">${esc(bits)}</p>`:''}</div></button><div class="px-4 pb-4 grid grid-cols-5 gap-2"><button onclick="openDetail('${esc(x.public_id)}')" class="col-span-2 h-9 rounded-lg bg-obsidian-700 text-xs">查看详情</button><a href="${AD}?text=${encodeURIComponent('你好，想咨询金边出售房源 '+x.public_id)}" target="_blank" rel="noopener" class="col-span-3 h-9 rounded-lg border border-gold-500/30 bg-gold-500/10 text-gold-400 text-xs font-semibold flex items-center justify-center gap-1.5"><i class="fa-brands fa-telegram"></i>咨询这套</a></div></article>`}
function render(items){$('count').textContent=total?`${total} 套在售`:'暂无';$('grid').innerHTML=items.length?items.map(card).join(''):'<div class="col-span-full py-16 text-center text-slate-500">当前条件下暂无出售房源</div>'}
function pager(){const max=Math.max(1,Math.ceil(total/LIMIT)),p=Math.floor(offset/LIMIT)+1;$('pager').className=(total>LIMIT?'flex':'hidden')+' justify-center items-center gap-3 mt-6';$('pageno').textContent=`${p} / ${max}`;$('prev').disabled=offset<=0;$('next').disabled=offset+LIMIT>=total}
function page(n){const next=offset+n*LIMIT;if(next>=0&&next<total){offset=next;load(false);scrollTo({top:0,behavior:'smooth'})}}
function resetAll(){$('area').value='';$('type').value='';$('price').value='';offset=0;load(false)}
async function openDetail(id,push=true){try{const r=await fetch(API+'/'+encodeURIComponent(id),{cache:'no-store'});if(!r.ok)throw Error(r.status);current=(await r.json()).item;gidx=0;$('did').textContent=current.public_id;$('dstatus').textContent=txt(current.status)||'可咨询';$('dprice').textContent=money(current.sale_price_usd);$('dtitle').textContent=txt(current.title)||txt(current.project)||'金边置业房源';$('updated').textContent=txt(current.updated_at)?'库存更新时间 · '+txt(current.updated_at):'';const type=txt(current.property_type)==='未知'?'':txt(current.property_type),f=[['项目',current.project],['位置',current.location],['类型',[type,txt(current.property_subtype)].filter(Boolean).join(' / ')],['户型',current.layout],['卧室',current.bedrooms?current.bedrooms+' 间':''],['卫浴',current.bathrooms?current.bathrooms+' 间':''],['面积',current.size_sqm?Number(current.size_sqm).toLocaleString()+'㎡':''],['楼层',txt(current.floor)?current.floor+' 楼':'']].filter(x=>txt(x[1]));$('fields').innerHTML=f.map(x=>`<div class="bg-obsidian-900 border border-obsidian-700 rounded-lg p-2.5"><div class="text-[10px] text-slate-500">${esc(x[0])}</div><div class="text-xs font-semibold mt-0.5 truncate">${esc(x[1])}</div></div>`).join('');$('consult').href=AD+'?text='+encodeURIComponent('你好，想咨询金边出售房源 '+current.public_id);paintGallery();$('overlay').classList.remove('opacity-0','pointer-events-none');$('sheet').classList.remove('translate-y-8');document.body.style.overflow='hidden';if(push){const u=new URL(location.href);u.searchParams.set('id',id);history.pushState({},'',u)}}catch(e){console.error(e)}}
function paintGallery(){let imgs=[...(current?.gallery_urls||[])].filter(Boolean);if(current?.cover_url&&!imgs.includes(current.cover_url))imgs.unshift(current.cover_url);$('gallery').innerHTML=imgs.length?imgs.map(u=>`<div class="w-full h-full shrink-0"><img src="${esc(u)}" class="w-full h-full object-cover"></div>`).join(''):'<div class="w-full h-full shrink-0 grid place-items-center text-gold-400/30">暂无实拍</div>';$('gallery').style.transform=`translateX(-${gidx*100}%)`;$('gallery').style.transition='transform .25s';$('gcount').textContent=imgs.length?`${gidx+1} / ${imgs.length}`:'0 / 0';$('gprev').style.display=imgs.length>1?'block':'none';$('gnext').style.display=imgs.length>1?'block':'none'}
function galleryStep(n){let imgs=[...(current?.gallery_urls||[])].filter(Boolean);if(current?.cover_url&&!imgs.includes(current.cover_url))imgs.unshift(current.cover_url);if(imgs.length){gidx=(gidx+n+imgs.length)%imgs.length;paintGallery()}}
function closeDetail(push=true){$('overlay').classList.add('opacity-0','pointer-events-none');$('sheet').classList.add('translate-y-8');document.body.style.overflow='';current=null;if(push){const u=new URL(location.href);u.searchParams.delete('id');history.pushState({},'',u)}}
addEventListener('popstate',()=>{const id=new URLSearchParams(location.search).get('id');id?openDetail(id,false):closeDetail(false)});addEventListener('keydown',e=>{if(e.key==='Escape')closeDetail()});load(false);
</script>
</body></html>
