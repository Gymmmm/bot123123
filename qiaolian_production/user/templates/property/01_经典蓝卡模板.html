<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=1600,initial-scale=1"><title>侨联地产房源封面 · 经典蓝卡</title><style>
*{box-sizing:border-box}html,body{margin:0;width:1600px;height:1200px;background:#0b2048;font-family:"Noto Sans CJK SC","Noto Sans SC","PingFang SC","Microsoft YaHei",sans-serif}.poster{position:relative;width:1600px;height:1200px;overflow:hidden;background:#d7d7d7;color:#fff}.bg{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;filter:saturate(.95) contrast(1.02) brightness(1.02)}.photo-overlay{position:absolute;inset:0;background:linear-gradient(180deg,rgba(13,24,51,.08) 0%,transparent 31%,transparent 69%,rgba(6,16,38,.10) 100%)}
/* 品牌区锁定：位置、尺寸与品牌文案保持不变。 */.top-brand{position:absolute;left:0;top:0;width:540px;height:190px;background:linear-gradient(135deg,rgba(10,47,122,.95),rgba(17,71,178,.78));padding:34px 34px 24px}.brand-inner{display:flex;align-items:center;gap:18px}.logo{width:96px;height:96px;flex:0 0 96px}.brand-cn{font-size:72px;font-weight:800;line-height:1;margin-bottom:8px;white-space:nowrap}.brand-en{font-size:24px;color:rgba(255,255,255,.92);letter-spacing:1.2px;font-family:Arial,"Noto Sans",sans-serif;white-space:nowrap}
.bottom-card{position:absolute;left:38px;bottom:37px;width:885px;height:305px;overflow:hidden;border-radius:38px;color:#fff;background:linear-gradient(104deg,rgba(20,57,148,.93) 0%,rgba(29,65,151,.87) 52%,rgba(35,70,145,.72) 100%);box-shadow:0 17px 38px rgba(0,0,0,.20);backdrop-filter:blur(3px)}.bottom-card:before{content:"";position:absolute;inset:0;pointer-events:none;background:radial-gradient(circle at 30% 0%,rgba(255,255,255,.09),transparent 46%)}
.project-row{position:relative;height:116px;padding:30px 42px 18px 50px;display:flex;align-items:center;gap:14px;border-bottom:1px solid rgba(255,255,255,.17);font-size:50px;line-height:1;font-weight:900;letter-spacing:.2px;white-space:nowrap;overflow:hidden}.project-row .home-icon{width:49px;height:49px;flex:0 0 49px}.project-row .dot{font-size:34px;opacity:.76;margin:0 1px}
.meta-row{position:relative;height:98px;padding:12px 45px 10px 51px;display:flex;align-items:center}.meta-left{display:flex;align-items:center;flex:1;min-width:0;font-size:36px;font-weight:700;white-space:nowrap}.meta-icon{width:35px;height:35px;margin-right:12px;flex:0 0 35px}.sep{width:1px;height:37px;margin:0 24px;background:rgba(255,255,255,.34);font-size:0}.price{margin-left:auto;display:flex;align-items:baseline;white-space:nowrap}.price-main{font-family:Arial,"Noto Sans",sans-serif;color:#f5d56b;font-size:62px;line-height:1;font-weight:900;letter-spacing:-1.2px}.price small{margin-left:4px;color:#fff;font-size:32px;font-weight:700;line-height:1}
.highlights{position:relative;height:91px;padding:14px 45px 15px 52px;border-top:1px solid rgba(255,255,255,.14);display:flex;align-items:center;overflow:hidden;font-size:27px;font-weight:650;white-space:nowrap}.highlights .item{display:flex;align-items:center;min-width:0;overflow:hidden;text-overflow:ellipsis}.highlights .item+.item:before{content:"";width:1px;height:31px;margin:0 22px;background:rgba(255,255,255,.30);flex:0 0 1px}
</style></head><body><div class="poster"><img id="bg" class="bg" src="{{BG_SRC}}" alt=""><div class="photo-overlay"></div><div class="top-brand"><div class="brand-inner"><svg class="logo" viewBox="0 0 120 120" fill="none" xmlns="http://www.w3.org/2000/svg"><path d="M14 62L60 30L106 62" stroke="white" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/><path d="M24 58V88H44V68H76V88H96V58" stroke="white" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/><path d="M16 92C33 84 49 81 60 81C71 81 87 84 104 92" stroke="white" stroke-width="8" stroke-linecap="round"/></svg><div><div class="brand-cn">侨联地产</div><div class="brand-en">QIAO LIAN PROPERTY</div></div></div></div><section class="bottom-card"><div class="project-row" data-autofit="34"><svg class="home-icon" viewBox="0 0 24 24" fill="white" xmlns="http://www.w3.org/2000/svg"><path d="M12 3L3 10V21H9V14H15V21H21V10L12 3Z"/></svg><span id="t1">{{PROJECT}}</span><span class="dot" data-field="t2">·</span><span id="t2" data-field="t2">{{LAYOUT}}</span></div><div class="meta-row"><div class="meta-left" data-autofit="27"><svg class="meta-icon" viewBox="0 0 64 64" xmlns="http://www.w3.org/2000/svg"><path fill="#fff" d="M5 31L32 8L59 31L51 39L32 22L13 39Z"/><path fill="#fff" d="M14 33H50V56H38V41H26V56H14Z"/></svg><span id="t3" data-field="t3">{{SIZE}}</span><span class="sep" data-field="t4"></span><span id="t4" data-field="t4">{{FLOOR}}</span></div><div class="price" data-autofit="42"><span class="price-main" id="price_text">{{PRICE}}</span><small id="price_suffix">{{PRICE_SUFFIX}}</small></div></div><div class="highlights" data-fields="t6,t7,t8" data-autofit="20"><div class="item" data-field="t6"><span id="t6">{{H1}}</span></div><div class="item" data-field="t7"><span id="t7">{{H2}}</span></div><div class="item" data-field="t8"><span id="t8">{{H3}}</span></div></div></section></div></body></html>
